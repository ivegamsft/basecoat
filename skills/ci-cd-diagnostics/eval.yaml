name: "ci-cd-diagnostics-routing"
description: "Routing evaluation — validates trigger activation for ci-cd-diagnostics."
skill: "skills/ci-cd-diagnostics/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Give me raw CI/CD diagnostics numbers only: PR timing, merge queue wait, and backlog deltas with command sources."
    expect_activation: true
  - id: "pos-2"
    input: "Inventory our pipeline and return one metric table with BLOCKED reasons for anything not retrievable."
    expect_activation: true
  - id: "pos-3"
    input: "Compute last-50 merged PR lifecycle stats and sprint merge bucket distribution with no recommendations."
    expect_activation: true
  - id: "neg-1"
    input: "Recommend how to optimize our merge queue policy and reduce cycle time."
    expect_activation: false
  - id: "neg-2"
    input: "Implement a new GitHub Actions pipeline for staging deployments."
    expect_activation: false
  - id: "neg-3"
    input: "Audit branch protection, required checks, environment protections, and policy-vs-live governance gaps."
    expect_activation: false
  - id: "neg-4"
    input: "Recommend CI/CD process fixes and optimization opportunities with remediation priorities."
    expect_activation: false
  - id: "neg-5"
    input: "Rank merge-flow bottlenecks and suggest corrective actions with KPI impact."
    expect_activation: false
