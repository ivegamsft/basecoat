name: "rai-privacy-review-skill-routing"
description: "Routing evaluation for Responsible AI and privacy planning and review."
skill: "skills/rai-privacy-review/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Plan privacy and Responsible AI safeguards for a customer-facing assistant that recommends account actions."
    expect_activation: true
  - id: "pos-2"
    input: "Review this telemetry export that contains customer usage identifiers and decide allow, revise, block, or defer."
    expect_activation: true
  - id: "pos-3"
    input: "Create a human-oversight and data-minimization plan for an automated work-item prioritization agent."
    expect_activation: true
  - id: "neg-1"
    input: "Fix Markdown heading spacing in a read-only internal guide."
    expect_activation: false
  - id: "neg-2"
    input: "Certify that our product is legally compliant with every privacy regulation."
    expect_activation: false
  - id: "neg-3"
    input: "Exploit this API endpoint to test for vulnerabilities."
    expect_activation: false
