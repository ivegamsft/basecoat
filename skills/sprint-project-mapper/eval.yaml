name: "sprint-project-mapper-skill-routing"
description: "Skill routing evaluation for sprint/project grouping and metric synthesis."
skill: "skills/sprint-project-mapper/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Group sprint and wave-tagged issues into project clusters and compute release metrics."
    expect_activation: true
  - id: "pos-2"
    input: "We need meaningful project buckets before release notes; debate split vs merge."
    expect_activation: true
  - id: "pos-3"
    input: "Calculate PR count, LOC, cycle time, and closure ratio for each project group."
    expect_activation: true
  - id: "pos-4"
    input: "Find merged PRs missing wave/sprint labels and block final release-note grouping until fixed."
    expect_activation: true
  - id: "neg-1"
    input: "Write unit tests for the auth service."
    expect_activation: false
  - id: "neg-2"
    input: "Create an AKS cluster and deploy a model."
    expect_activation: false
