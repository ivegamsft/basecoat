name: "release-audit-routing"
description: "Routing evaluation — validates trigger activation for the release-audit skill."
skill: "skills/release-audit/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Audit this release candidate for versioning, changelog quality, and tag correctness."
    expect_activation: true
  - id: "pos-2"
    input: "Check whether the release notes and publish steps are complete."
    expect_activation: true
  - id: "pos-3"
    input: "Review the semver bump and rollout checklist before we ship."
    expect_activation: true
  - id: "neg-1"
    input: "Cut and publish the next release."
    expect_activation: false
  - id: "neg-2"
    input: "Investigate a production outage after the release."
    expect_activation: false
