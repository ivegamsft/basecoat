name: "backlog-rebalance-engine-project-sync-routing"
description: "Routing evaluation for backlog-rebalance-engine skill — project sync and item onboarding."
skill: "skills/backlog-rebalance-engine/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Onboard the rebalanced sprint backlog items into the GitHub Project board."
    expect_activation: true
  - id: "pos-2"
    input: "Sync issues from the rebalance plan into the project view without creating duplicates."
    expect_activation: true
  - id: "pos-3"
    input: "Update project item status to match current issue open/closed state and report added, updated, and skipped counts."
    expect_activation: true
  - id: "pos-4"
    input: "Run idempotent project sync and preserve delivery labels on all items."
    expect_activation: true
  - id: "pos-5"
    input: "Add unmapped rebalanced issues to the sprint board and align their status column."
    expect_activation: true
  - id: "neg-1"
    input: "Write unit tests for the authentication service."
    expect_activation: false
  - id: "neg-2"
    input: "Conduct a sprint retrospective and identify process improvements."
    expect_activation: false
  - id: "neg-3"
    input: "Deploy the application to Azure Container Apps."
    expect_activation: false
