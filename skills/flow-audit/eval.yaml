name: "flow-audit-skill-routing"
description: "Routing evaluation — validates trigger activation for the flow-audit skill."
skill: "skills/flow-audit/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Audit merge queue delay, stale PRs, and CI waste across our repos."
    expect_activation: true
  - id: "pos-2"
    input: "Find the biggest PR-to-merge bottlenecks and rank them with evidence."
    expect_activation: true
  - id: "pos-3"
    input: "Create a baseline flow-health report before we change queue policy, including exported branch protection, required checks, environment protection, merge queue config, runner permissions, and production dispatch access."
    expect_activation: true
  - id: "neg-1"
    input: "Implement OAuth login in the backend service."
    expect_activation: false
  - id: "neg-2"
    input: "Write product launch messaging."
    expect_activation: false
