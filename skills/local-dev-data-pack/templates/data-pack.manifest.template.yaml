version: 1
scenario: integration
stores:
  - postgres
  - sqlserver
  - cosmos
reset_mode: reuse-volumes
# generated_at_utc: `generate` MUST replace this placeholder with the current
# UTC time (ISO 8601, e.g. 2026-08-14T00:00:00Z). A pack still carrying the
# literal placeholder is treated as not-yet-generated by validate.
generated_at_utc: "__REPLACE_WITH_CURRENT_UTC_ISO8601__"
supported_operations:
  - generate
  - validate
  - update
  - delete
checks:
  postgres:
    min_rows:
      todos: 3
  sqlserver:
    min_rows:
      Todos: 3
  cosmos:
    min_documents:
      todos: 3
