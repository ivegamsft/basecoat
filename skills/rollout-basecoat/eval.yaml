name: "rollout-basecoat-skill-routing"
description: "Routing evaluation — validates trigger activation for the rollout-basecoat skill."
skill: "skills/rollout-basecoat/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Refresh basecoat in this repository to the latest build."
    expect_activation: true
  - id: "pos-2"
    input: "Update basecoat using sync.ps1 and show me what changed."
    expect_activation: true
  - id: "pos-3"
    input: "Sync this consumer repo to BaseCoat v3.30.6 and verify installed version."
    expect_activation: true
  - id: "pos-4"
    input: "Upgrade basecoat to the latest release, then commit, push and open a PR."
    expect_activation: true
  - id: "pos-5"
    input: "Our sync script lives at scripts/basecoat/sync-basecoat.ps1, not the repo root — refresh basecoat and open a PR."
    expect_activation: true
  - id: "pos-6"
    input: "Configure this downstream repo to notify us about BaseCoat patch releases."
    expect_activation: true
  - id: "pos-7"
    input: "Enable guarded automatic BaseCoat upgrade pull requests without bypassing branch protection."
    expect_activation: true
  - id: "pos-8"
    input: "Our BaseCoat payload is already current, but an installed workflow is stale. Refresh the existing selection and validate it before opening a PR."
    expect_activation: true
  - id: "pos-9"
    input: "Sync BaseCoat into a staged-only consumer, but do not activate any workflows without maintainer consent."
    expect_activation: true
  - id: "neg-1"
    input: "Write a new custom agent for threat modeling."
    expect_activation: false
  - id: "neg-2"
    input: "Debug failing unit tests in my API project."
    expect_activation: false
