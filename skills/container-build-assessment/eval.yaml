name: "container-build-assessment-routing"
description: "Validates trigger activation for the container-build-assessment skill — composable assessment steps."
skill: "skills/container-build-assessment/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Assess our Docker image for optimization opportunities — analyze Dockerfile structure, dependencies, size, and security issues."
    expect_activation: true
  
  - id: "pos-2"
    input: "I want to break down container assessment into separate scripts: analyze layers, scan dependencies, estimate size, check security."
    expect_activation: true
  
  - id: "pos-3"
    input: "Run a Dockerfile assessment that produces structured JSON output at each step."
    expect_activation: true
  
  - id: "neg-1"
    input: "Build a Docker image from this Dockerfile."
    expect_activation: false
  
  - id: "neg-2"
    input: "Deploy a containerized application to Kubernetes."
    expect_activation: false
