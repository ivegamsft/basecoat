name: "skill-scripts-routing"
description: "Validates trigger activation for the skill-scripts skill — composable script-based skill execution."
skill: "skills/skill-scripts/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "I want to add executable scripts to a skill so we can run assessment scripts, then feed their output to planning scripts, instead of one big prompt."
    expect_activation: true
  
  - id: "pos-2"
    input: "Help me break down a database migration skill into assessment → plan → validate steps that can be run independently and chained together."
    expect_activation: true
  
  - id: "pos-3"
    input: "Design a schema for declaring script steps in a skill's frontmatter with input/output contracts."
    expect_activation: true
  
  - id: "pos-4"
    input: "Create an orchestrator that runs skill scripts in sequence and pipes previous outputs to next steps."
    expect_activation: true
  
  - id: "neg-1"
    input: "Build a REST API for managing skills."
    expect_activation: false
  
  - id: "neg-2"
    input: "Add a new skill instruction to the repository."
    expect_activation: false
