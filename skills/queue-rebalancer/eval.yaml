name: "queue-rebalancer-skill-routing"
description: "Skill routing evaluation for dependency-based unblock queue reshuffling with strict scope gates."
skill: "skills/queue-rebalancer/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Older PRs are blocking builds. Reorder PR and issue queues by dependency and run an unblock-first lane."
    expect_activation: true
  - id: "pos-2"
    input: "Cherry-pick blocker fixes from issues and PRs, verify tests, and return to normal queue order."
    expect_activation: true
  - id: "pos-3"
    input: "Promote only break-fix blockers to the front so downstream work can continue."
    expect_activation: true
  - id: "neg-1"
    input: "Design a brand-new feature roadmap for the next release."
    expect_activation: false
  - id: "neg-2"
    input: "Create product specs for three new platform capabilities."
    expect_activation: false
