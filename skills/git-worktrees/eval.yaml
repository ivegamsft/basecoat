name: "git-worktrees-routing"
description: "Routing evaluation — validates trigger activation for the git-worktrees skill."
skill: "skills/git-worktrees/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "I need to work on a hotfix while my feature branch has uncommitted changes. Set up an isolated workspace."
    expect_activation: true
  - id: "pos-2"
    input: "Create separate worktrees for three parallel tasks so subagents can work independently."
    expect_activation: true
  - id: "pos-3"
    input: "Clean up stale git worktrees and prune references for branches that have been merged."
    expect_activation: true
  - id: "neg-1"
    input: "Switch to the main branch and pull the latest changes."
    expect_activation: false
  - id: "neg-2"
    input: "Create a new feature branch and start implementing the login page."
    expect_activation: false
