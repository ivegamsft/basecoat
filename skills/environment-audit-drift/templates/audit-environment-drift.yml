name: Audit Environment Drift

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail if any drift detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    paths:
      - '.github/environment-map.yml'
      - '.release/manifest.json'

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      drift_status: ${{ steps.audit.outputs.drift_status }}
      findings_count: ${{ steps.audit.outputs.findings_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'

      - name: Verify local environment drift CLI source
        run: |
          if [ ! -f skills/environment-audit-drift/package.json ]; then
            echo "::error::Local environment drift CLI source is missing: skills/environment-audit-drift/package.json"
            echo "::error::Do not use npm registry fallback for @basecoat/environment-audit-drift in this workflow."
            exit 1
          fi

          if ! grep -q '"name": "@basecoat/environment-audit-drift"' skills/environment-audit-drift/package.json; then
            echo "::error::Local CLI manifest does not match @basecoat/environment-audit-drift."
            exit 1
          fi

      - name: Install local environment drift CLI dependencies
        run: npm ci --prefix skills/environment-audit-drift

      - name: Build local environment drift CLI
        run: npm run --prefix skills/environment-audit-drift build

      - name: Audit environment drift
        id: audit
        run: |
          STRICT_MODE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.strict_mode || 'false' }}"
          
          node skills/environment-audit-drift/dist/cli.js \
            --config .github/environment-map.yml \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output drift-report.json \
            $([ "$STRICT_MODE" = "true" ] && echo "--strict" || echo "")
          
          # Parse report and set outputs
          DRIFT_STATUS=$(jq -r '.severity_summary | if .critical > 0 then "critical" elif .high > 0 then "high" elif .medium > 0 then "medium" else "clean" end' drift-report.json)
          FINDINGS=$(jq '.total_drifts' drift-report.json)
          
          echo "drift_status=$DRIFT_STATUS" >> $GITHUB_OUTPUT
          echo "findings_count=$FINDINGS" >> $GITHUB_OUTPUT
          
          echo "### Environment Drift Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** \`$DRIFT_STATUS\`" >> $GITHUB_STEP_SUMMARY
          echo "**Findings:** $FINDINGS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          jq -r '.findings[] | "- [\(.severity | ascii_upcase)] \(.finding) (*\(.resource // "N/A")*)"' drift-report.json >> $GITHUB_STEP_SUMMARY || echo "No findings" >> $GITHUB_STEP_SUMMARY

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: drift-report
          path: drift-report.json
          retention-days: 30

      - name: Comment on issues (if critical)
        if: steps.audit.outputs.drift_status == 'critical'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('drift-report.json', 'utf-8'));
            
            const findings = report.findings
              .filter(f => f.severity === 'critical')
              .map(f => `- **${f.environment}**: ${f.finding}\n  Remediation: ${f.remediation}`)
              .join('\n');
            
            const body = `## Critical Environment Drift Detected
            
            ${findings}
            
            **Action Required**: Review and resolve critical drifts before proceeding with deployments.
            
            See drift report artifact for full details.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            }).catch(() => {
              // Comment silently fails if not in issue/PR context (e.g., scheduled run)
            });

      - name: Fail if critical drift in strict mode
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.strict_mode == 'true' && steps.audit.outputs.drift_status == 'critical' }}
        run: |
          echo "Critical drift detected in strict mode"
          exit 1
