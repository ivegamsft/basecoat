name: "BaseCoat - Auto-approve cloud agent workflows"

on:
  # Run the trusted default-branch copy. A pull_request workflow authored by
  # Copilot can itself be held for approval, preventing it from approving the
  # other requested runs it was created to unblock.
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    # Both names are watched because the downstream installer
    # (scripts/configure-downstream-workflows.ps1) renames the installed copy
    # of pr-auto-merge-executor.yml's workflow name to
    # "BaseCoat Template - PR Auto Merge Executor", so a canonical-name-only
    # filter would never see the installed workflow's runs.
    workflows: ["BaseCoat - PR Auto Merge Executor", "BaseCoat Template - PR Auto Merge Executor"]
    # "requested" fires when the source run is created, before it can have
    # reached a terminal status/conclusion; the run that actually needs
    # re-dispatch is status=completed/conclusion=action_required, so listen
    # for "completed" -- it is the deterministic point where action_required
    # is finalized.
    types: [completed]

permissions:
  pull-requests: read
  contents: read
  actions: write

concurrency:
  group: cloud-agent-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  auto-approve-workflows:
    # A pull_request event can be emitted by a maintainer or automation after
    # the cloud agent creates the PR. Author identity is stable; event actor
    # is not, and using it caused eligible solo-dev runs to be skipped.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.id == 198982749
    name: Auto-approve pending workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # On the pull_request path this job would otherwise resolve the PR's
          # merge ref, letting a PR modify .github/governance/policy-packs.json
          # and make this auto-approval gate trust the PR's own policy instead
          # of the trusted default-branch governance. Pin to the default
          # branch explicitly.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve governance policy pack
        id: policy-pack
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE=".github/governance/policy-packs.json"
          if [[ ! -f "${POLICY_FILE}" ]]; then
            echo "::error::Missing governance policy pack file: ${POLICY_FILE}"
            exit 1
          fi

          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi

          AUTO_APPROVE="$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.auto_approve_workflow_runs // false' "${POLICY_FILE}")"
          echo "selected_pack=${SELECTED_PACK}" >> "${GITHUB_OUTPUT}"
          echo "auto_approve=${AUTO_APPROVE}" >> "${GITHUB_OUTPUT}"

          if [[ "${AUTO_APPROVE}" != "true" ]]; then
            echo "Cloud-agent workflow auto-approval disabled by '${SELECTED_PACK}' policy pack."
          fi

      - name: Check if workflows require approval
        if: steps.policy-pack.outputs.auto_approve == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const getCurrentHeadSha = async () => {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });
              return pullRequest.head.sha;
            };
            const headSha = await getCurrentHeadSha();

            console.log(`Checking for pending workflows on PR #${prNumber} at ${headSha}`);
            
            // Paginate so an eligible current-head run is never omitted when
            // the repository has more than one page of requested runs.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              status: 'requested',
              per_page: 100
            });
            
            // Only the current PR head may be approved. Requested runs are the
            // GitHub-side source of truth for an unapproved decision, so stale
            // or already-approved runs are excluded. De-duplicate run IDs in
            // case the REST list contains the same run across pagination.
            const pendingRuns = [...new Map(
              runs
                .filter(run => run.head_sha === headSha &&
                  run.pull_requests?.some(pr => pr.number === prNumber))
                .map(run => [run.id, run])
            ).values()];
            
            if (pendingRuns.length === 0) {
              console.log(`✓ No pending workflows found for PR #${prNumber}`);
              return;
            }
            
            console.log(`Found ${pendingRuns.length} pending workflow(s) for PR #${prNumber} at ${headSha}`);
            
            // Approve each pending workflow
            for (const run of pendingRuns) {
              const currentHeadSha = await getCurrentHeadSha();
              if (currentHeadSha !== headSha) {
                console.log(`PR #${prNumber} advanced from ${headSha} to ${currentHeadSha}; stopping so its newer event can evaluate the current head.`);
                return;
              }

              try {
                await github.rest.actions.approveWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                console.log(`✓ Approved workflow run ${run.id}: ${run.name}`);
              } catch (error) {
                if (error.status === 403) {
                  console.log(`⚠ Cannot approve workflow run ${run.id} — insufficient permissions`);
                  console.log(`  This may require manual approval via GitHub UI`);
                } else {
                  throw error;
                }
              }
            }

      - name: Record policy-pack skip
        if: steps.policy-pack.outputs.auto_approve != 'true'
        env:
          SELECTED_PACK: ${{ steps.policy-pack.outputs.selected_pack }}
        run: |
          echo "Skipping auto-approval because policy pack '${SELECTED_PACK}' disables cloud-agent auto-approval." >> "$GITHUB_STEP_SUMMARY"

  auto-retrigger-merge-eligibility-review-race:
    # copilot-pull-request-reviewer[bot] has repo permission 'none', so its
    # pull_request_review events leave "BaseCoat - PR Auto Merge Executor"
    # stuck in status=completed/conclusion=action_required with zero jobs
    # (see #2838). Verified directly against the GitHub REST API that
    # `POST .../actions/runs/{run_id}/approve` does NOT support this case --
    # it 403s with "This run is not from a fork pull request or queued by
    # the Actions bot" -- so a blocked run can never be approved after the
    # fact. Instead, dispatch a fresh workflow_dispatch run of the same
    # workflow for the same PR: workflow_dispatch is triggered by this
    # (trusted, default-branch) job's own identity, so it is never subject
    # to the actor-permission gate, and pr-auto-merge-executor.yml already
    # supports a `pr_number` input for exactly this purpose.
    if: github.event_name == 'workflow_run'
    name: Re-dispatch merge-eligibility review-race run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Defense in depth: workflow_run-triggered jobs already execute the
          # default-branch version of this workflow file, but pin the
          # checkout explicitly too so this policy-pack read can never be
          # coerced into resolving a PR-modified governance file.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve governance policy pack
        id: policy-pack
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE=".github/governance/policy-packs.json"
          if [[ ! -f "${POLICY_FILE}" ]]; then
            echo "::error::Missing governance policy pack file: ${POLICY_FILE}"
            exit 1
          fi

          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi

          AUTO_APPROVE="$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.auto_approve_workflow_runs // false' "${POLICY_FILE}")"
          echo "selected_pack=${SELECTED_PACK}" >> "${GITHUB_OUTPUT}"
          echo "auto_approve=${AUTO_APPROVE}" >> "${GITHUB_OUTPUT}"

      - name: Re-dispatch eligibility check for the blocked PR if pending
        if: steps.policy-pack.outputs.auto_approve == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;
            // The immutable app ID for copilot-pull-request-reviewer[bot] (has repo
            // permission 'none', which is why its pull_request_review events leave
            // this run action_required/zero-jobs). Restricting to this exact actor
            // + event prevents re-dispatching action_required runs blocked for any
            // other reason (e.g. a genuine fork-PR approval requirement, or a run
            // triggered via pull_request_target/issue_comment/issues/manual entry
            // points), where a blind re-dispatch would be unwanted.
            const copilotReviewerActorId = 175728472;

            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.status !== 'action_required' && run.conclusion !== 'action_required') {
              console.log(`Run ${runId} status='${run.status}' conclusion='${run.conclusion}' — no re-dispatch needed.`);
              return;
            }

            if (run.event !== 'pull_request_review' || run.triggering_actor?.id !== copilotReviewerActorId) {
              console.log(`⚠ Run ${runId} is action_required but was not triggered by copilot-pull-request-reviewer's pull_request_review event (event='${run.event}', triggering_actor='${run.triggering_actor?.login}#${run.triggering_actor?.id}') — leaving it for manual/normal handling.`);
              return;
            }

            const prNumber = run.pull_requests?.[0]?.number ?? await (async () => {
              // pull_requests is not guaranteed to be populated on a workflow-run
              // REST object -- review-triggered runs are one of the cases where
              // GitHub can return an empty array. Fall back to resolving the PR
              // from the run's head commit.
              const { data: associatedPrs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha
              });
              const openPr = associatedPrs.find(pr => pr.state === 'open' && pr.head?.sha === run.head_sha);
              return openPr?.number;
            })();
            if (!prNumber) {
              console.log(`⚠ Run ${runId} is action_required but has no associated pull request (checked run.pull_requests and listPullRequestsAssociatedWithCommit for head_sha ${run.head_sha}); cannot re-dispatch.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              // The downstream installer (scripts/configure-downstream-workflows.ps1)
              // writes this executor as basecoat-pr-auto-merge-executor.yml; the
              // canonical pr-auto-merge-executor.yml filename only exists in this
              // source repo, so the installed template copy must target the
              // installed filename or the re-dispatch call will 404.
              workflow_id: 'basecoat-pr-auto-merge-executor.yml',
              ref: context.payload.repository.default_branch,
              inputs: { pr_number: String(prNumber) }
            });
            console.log(`✓ Re-dispatched merge eligibility evaluation for PR #${prNumber} (blocked run ${runId} was action_required).`);
