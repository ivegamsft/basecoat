name: "BaseCoat - Ship-it Intent Dispatch"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      intent:
        description: Intent to execute
        required: true
        type: choice
        options:
          - ship-it
          - spec-2-prod
          - onboarding-conductor
      goal:
        description: Delivery goal statement
        required: true
        type: string
      target_repo:
        description: Repository in owner/repo format (defaults to this repository)
        required: false
        type: string
      spec_ref:
        description: Optional spec or PRD reference
        required: false
        type: string
      risk_band:
        description: Risk classification
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
          - critical
      profile:
        description: Onboarding profile (used by onboarding-conductor)
        required: false
        default: team-dev
        type: choice
        options:
          - solo-dev
          - team-dev
          - regulated-team
          - pilot-luxesite
          - pilot-wawkr
          - pilot-work-tracker
      project_owner:
        description: Optional project owner for project sync
        required: false
        type: string
      project_number:
        description: Optional project number for project sync
        required: false
        type: string
      dry_run:
        description: Skip live side effects
        required: true
        default: true
        type: boolean
      source_issue_number:
        description: Approved source issue for explicit pre-approval or delivery mode
        required: false
        type: string
      approval_comment_id:
        description: Existing qualified /approve comment ID for pre-approval mode
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-intent:
    name: Resolve intent inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      intent: ${{ steps.resolve.outputs.intent }}
      goal: ${{ steps.resolve.outputs.goal }}
      target_repo: ${{ steps.resolve.outputs.target_repo }}
      spec_ref: ${{ steps.resolve.outputs.spec_ref }}
      risk_band: ${{ steps.resolve.outputs.risk_band }}
      project_owner: ${{ steps.resolve.outputs.project_owner }}
      project_number: ${{ steps.resolve.outputs.project_number }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      profile: ${{ steps.resolve.outputs.profile }}
      source_issue_number: ${{ steps.resolve.outputs.source_issue_number }}
      source_issue_url: ${{ steps.resolve.outputs.source_issue_url }}
      source_scope: ${{ steps.resolve.outputs.source_scope }}
      feature_origin: ${{ steps.resolve.outputs.feature_origin }}
      requester: ${{ steps.resolve.outputs.requester }}
      approval_source_issue_number: ${{ steps.resolve.outputs.approval_source_issue_number }}
      approval_comment_id: ${{ steps.resolve.outputs.approval_comment_id }}
      approval_receipt_base64: ${{ steps.resolve.outputs.approval_receipt_base64 }}
      raw_directive: ${{ steps.resolve.outputs.raw_directive }}
      directive_source: ${{ steps.resolve.outputs.directive_source }}
      directive_actor: ${{ steps.resolve.outputs.directive_actor }}
      directive_evidence_url: ${{ steps.resolve.outputs.directive_evidence_url }}
      directive_timestamp: ${{ steps.resolve.outputs.directive_timestamp }}
    steps:
      - name: Checkout trusted default-branch approval resolver
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve inputs from event
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const preapproval = require(
              `${process.env.GITHUB_WORKSPACE}/.github/base-coat/scripts/ship-it/preapproval-evidence.cjs`
            );
            // BEGIN SHIP-IT DIRECTIVE CONTRACT
            const deliveryIntentAliases = Object.freeze({
              "ship-it": "ship-it",
              "spec-2-prod": "spec-2-prod"
            });
            const classifyDeliveryGoal = goal => {
              const suppressesSideEffects =
                /\b(?:later|backlog|next sprint|no changes|read-only|analysis only|log it|file an issue|just document|stop|defer)\b/i
                  .test(goal);
              const immediate = /\b(?:now|immediately|urgent)\b/i.test(goal);
              if (suppressesSideEffects && immediate) return "invalid";
              if (suppressesSideEffects) return "suppressed";
              return "delivery";
            };
            const isPlaceholderSpecUrl = value => {
              try {
                const candidate = String(value || "").trim();
                const url = new URL(candidate);
                const host = url.hostname.toLowerCase();
                return !["http:", "https:"].includes(url.protocol) ||
                  !host ||
                  ["example.com", "example.org", "example.net", "localhost"].some(
                    domain => host === domain || host.endsWith(`.${domain}`)
                  ) ||
                  /\.(?:invalid|test|localhost)$/.test(host) ||
                  /\b(?:placeholder|replace[-_ ]?me|todo|tbd)\b/i.test(candidate);
              } catch {
                return true;
              }
            };
            const deliveryCommandLine = /^\s*(?:ship-it|spec-2-prod)\s*:|^\s*\/(?:ship-it|spec-2-prod)(?:[ \t]|$)/i;
            const parseDeliveryDirective = rawInput => {
              const rawDirective = String(rawInput || "");
              const trimmed = rawDirective.trim();
              if (!trimmed) return { kind: "none" };
              const lines = trimmed.split(/\r?\n/);
              const commandLines = lines
                .map((line, index) => deliveryCommandLine.test(line) ? index : -1)
                .filter(index => index >= 0);
              if (commandLines.length !== 1 || commandLines[0] !== 0) {
                return { kind: commandLines.length ? "invalid" : "none" };
              }

              const colonMatch = lines[0].match(/^(ship-it|spec-2-prod)\s*:[ \t]*(.*)$/i);
              const slashMatch = lines[0].match(/^\/(ship-it|spec-2-prod)(?:[ \t]+(.*))?$/i);
              let intent;
              let goal;
              let syntax;
              if (colonMatch) {
                intent = deliveryIntentAliases[colonMatch[1].toLowerCase()];
                goal = [colonMatch[2], ...lines.slice(1)].join("\n").trim();
                syntax = "colon-alias";
                if (!goal) return { kind: "invalid" };
              } else if (slashMatch && lines.length === 1) {
                intent = deliveryIntentAliases[slashMatch[1].toLowerCase()];
                goal = (slashMatch[2] || "").trim();
                syntax = "slash-command";
              } else {
                return { kind: "invalid" };
              }

              const goalKind = classifyDeliveryGoal(goal);
              if (goalKind !== "delivery") return { kind: goalKind };
              return { kind: "delivery", intent, goal, rawDirective, syntax };
            };
            const isCanonicalWorkflowIntent = intent =>
              intent === "ship-it" || intent === "spec-2-prod" || intent === "onboarding-conductor";
            // END SHIP-IT DIRECTIVE CONTRACT

            const eventName = context.eventName;
            const result = {
              should_run: "false",
              intent: "ship-it",
              goal: "",
              target_repo: `${context.repo.owner}/${context.repo.repo}`,
              spec_ref: "",
              risk_band: "medium",
              project_owner: "",
              project_number: "",
              dry_run: "true",
              profile: "team-dev",
              source_issue_number: "",
              source_issue_url: "",
              source_scope: "",
              feature_origin: "false",
              requester: context.actor,
              approval_source_issue_number: "",
              approval_comment_id: "",
              approval_receipt_base64: "",
              raw_directive: "",
              directive_source: "",
              directive_actor: "",
              directive_evidence_url: "",
              directive_timestamp: ""
            };

            if (eventName === "workflow_dispatch") {
              const inputs = context.payload.inputs || {};
              const requestedIntent = String(inputs.intent || "");
              if (!isCanonicalWorkflowIntent(requestedIntent)) {
                core.setFailed(`Unsupported intent '${requestedIntent}'. Use an exact canonical workflow intent.`);
                return;
              }
              const intentGoal = String(inputs.goal || "");
              if (!intentGoal.trim()) {
                core.setFailed("Workflow dispatch goal cannot be empty.");
                return;
              }
              if (
                ["ship-it", "spec-2-prod"].includes(requestedIntent) &&
                classifyDeliveryGoal(intentGoal) !== "delivery"
              ) {
                core.info("Workflow delivery goal is suppressed or contradictory; no dispatch will run.");
                core.setOutput("should_run", "false");
                return;
              }
              result.should_run = "true";
              result.intent = requestedIntent;
              result.goal = intentGoal.trim();
              result.target_repo = inputs.target_repo || result.target_repo;
              result.spec_ref = inputs.spec_ref || "";
              result.risk_band = inputs.risk_band || "medium";
              result.project_owner = inputs.project_owner || "";
              result.project_number = inputs.project_number || "";
              result.dry_run = `${inputs.dry_run === true || `${inputs.dry_run}`.toLowerCase() === "true"}`;
              result.profile = inputs.profile || "team-dev";
              result.raw_directive = `intent=${requestedIntent}`;
              result.directive_source = "workflow_dispatch";
              result.directive_actor = context.actor;
              result.directive_evidence_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              result.directive_timestamp = new Date().toISOString();
              result.source_issue_number = String(inputs.source_issue_number || "").trim();
              const sourceIssueNumber = String(inputs.source_issue_number || "");
              const approvalCommentId = String(inputs.approval_comment_id || "");
              if (approvalCommentId !== "") {
                if (!sourceIssueNumber || !approvalCommentId) {
                  core.setFailed("Pre-approval mode requires both source_issue_number and approval_comment_id.");
                  return;
                }
                if (result.project_owner || result.project_number) {
                  core.setFailed("Pre-approval does not authorize project synchronization; omit project_owner and project_number.");
                  return;
                }
                const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId
                });
                const receipt = await preapproval.resolvePreApproval({
                  api: preapproval.createOctokitApi(github),
                  sourceRepo: `${context.repo.owner}/${context.repo.repo}`,
                  targetRepo: result.target_repo,
                  sourceIssueNumber,
                  approvalCommentId,
                  intent: result.intent,
                  goal: result.goal,
                  specRef: result.spec_ref,
                  riskBand: result.risk_band,
                  profile: result.profile,
                  executionPrincipal: context.actor,
                  runId: workflowRun.id,
                  runStartedAt: workflowRun.created_at,
                  selectedPolicy: `${result.profile}/${result.risk_band}`
                });
                result.approval_source_issue_number = sourceIssueNumber;
                result.approval_comment_id = approvalCommentId;
                result.approval_receipt_base64 = preapproval.encodeReceipt(receipt);
                if (!result.source_issue_number) result.source_issue_number = sourceIssueNumber;
              }
            } else {
              const issue = context.payload.issue;
              const comment = context.payload.comment?.body || "";
              const isPullRequestComment = !!issue.pull_request;
              const deliveryDirective = parseDeliveryDirective(comment);
              const onboardingMatch = comment.trim().match(/^\/onboarding(?:[ \t]+(.+))?$/i);
              if (
                isPullRequestComment ||
                deliveryDirective.kind === "suppressed" ||
                deliveryDirective.kind === "invalid" ||
                (deliveryDirective.kind !== "delivery" && !onboardingMatch)
              ) {
                if (deliveryDirective.kind === "suppressed") {
                  core.info("Delivery directive includes a read-only, log-only, or deferred modifier; no dispatch will run.");
                } else if (deliveryDirective.kind === "invalid") {
                  core.info("Delivery directive is ambiguous or malformed; no dispatch will run.");
                }
                core.setOutput("should_run", "false");
                return;
              }

              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              const allowed = ["admin", "maintain", "write"].includes(perm.data.permission);
              if (!allowed) {
                core.setFailed(`@${context.actor} does not have write permission for intent commands (/ship-it, /onboarding, /spec-2-prod).`);
                return;
              }

              result.should_run = "true";
              result.dry_run = "false";
              result.intent = deliveryDirective.kind === "delivery"
                ? deliveryDirective.intent
                : "onboarding-conductor";
              result.goal = deliveryDirective.kind === "delivery"
                ? deliveryDirective.goal || issue.title
                : (onboardingMatch[1] || "").trim() || issue.title;
              result.source_issue_number = `${issue.number}`;
              result.source_issue_url = issue.html_url || "";
              result.raw_directive = String(comment);
              result.directive_source = deliveryDirective.kind === "delivery"
                ? `issue_comment:${deliveryDirective.syntax}`
                : "issue_comment:slash-command";
              result.directive_actor = context.actor;
              result.directive_evidence_url = context.payload.comment?.html_url || "";
              result.directive_timestamp = context.payload.comment?.created_at || "";
            }

            const deliveryRequested = ["ship-it", "spec-2-prod"].includes(result.intent);
            if (deliveryRequested) {
              const sourceIssueNumber = Number(result.source_issue_number);
              if (!Number.isInteger(sourceIssueNumber) || sourceIssueNumber <= 0) {
                core.setFailed("Delivery dispatch requires an approved source_issue_number.");
                return;
              }
              const { data: sourceIssue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sourceIssueNumber
              });
              if (sourceIssue.pull_request || sourceIssue.state !== "open") {
                core.setFailed(`Delivery source #${sourceIssueNumber} must be an open issue.`);
                return;
              }
              const labels = (sourceIssue.labels || []).map(label =>
                String(typeof label === "string" ? label : label.name || "").toLowerCase()
              );
              if (!labels.includes("approved")) {
                core.setFailed(`Delivery source #${sourceIssueNumber} must already carry the approved label.`);
                return;
              }
              const issueBody = String(sourceIssue.body || "");
              const specMatch = issueBody.match(/^\s*-\s*Spec:\s*(https?:\/\/\S+)\s*$/im);
              if (!specMatch || isPlaceholderSpecUrl(specMatch[1])) {
                core.setFailed(`Delivery source #${sourceIssueNumber} must contain a non-placeholder Spec URL.`);
                return;
              }
              const featureOrigin = issueBody.includes("<!-- basecoat-feature-origin:v1 -->");
              const sourceScope = issueBody.match(/^\s*(?:BaseCoat )?Source scope:\s*(\S.*)$/im)?.[1]?.trim() || "";
              if (featureOrigin && !sourceScope) {
                core.setFailed(`Feature-origin delivery source #${sourceIssueNumber} must record its approved Source scope.`);
                return;
              }
              const approvedSpec = specMatch[1];
              if (result.spec_ref && result.spec_ref !== approvedSpec) {
                core.setFailed("The supplied spec_ref must match the approved source issue's Spec URL.");
                return;
              }
              result.spec_ref = approvedSpec;
              result.source_issue_number = String(sourceIssueNumber);
              result.source_issue_url = sourceIssue.html_url || result.source_issue_url;
              result.source_scope = sourceScope;
              result.feature_origin = `${featureOrigin}`;
              const issueComments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sourceIssueNumber,
                per_page: 100
              });
              let qualifiedIssueApproval = false;
              for (const approvalComment of issueComments) {
                if (!/^\/approve$/i.test(String(approvalComment.body || "").trim())) continue;
                const approvalActor = String(approvalComment.user?.login || "");
                if (
                  approvalComment.user?.type === "Bot" ||
                  approvalActor.toLowerCase().endsWith("[bot]")
                ) continue;
                const { data: approvalPermission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: approvalActor
                });
                if (["admin", "maintain", "write"].includes(String(approvalPermission.permission || "").toLowerCase())) {
                  qualifiedIssueApproval = true;
                  break;
                }
              }
              if (!qualifiedIssueApproval) {
                core.setFailed(`Delivery source #${sourceIssueNumber} requires current qualified exact /approve evidence.`);
                return;
              }
            }

            for (const [key, value] of Object.entries(result)) {
              core.setOutput(key, value);
            }

  dispatch-intent:
    name: Dispatch ship-it intent
    runs-on: ubuntu-latest
    needs: resolve-intent
    if: needs.resolve-intent.outputs.should_run == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
        with:
          ref: ${{ needs.resolve-intent.outputs.approval_comment_id != '' && github.event.repository.default_branch || github.ref }}

      - name: Preflight ship-it workflow dependencies
        shell: pwsh
        env:
          # github.token is scoped to this (host) repository only and cannot
          # read private workflows or create issues in a different target
          # repository. A cross-repo /ship-it dispatch therefore requires a
          # dedicated credential with access to the target repo; fall back to
          # github.token only for same-repo dispatches (see the explicit
          # host-vs-target check below, which fails closed rather than
          # silently attempting a cross-repo call that can never succeed).
          GH_TOKEN: ${{ secrets.SHIP_IT_CROSS_REPO_TOKEN || github.token }}
          HAS_CROSS_REPO_TOKEN: ${{ secrets.SHIP_IT_CROSS_REPO_TOKEN != '' }}
          TARGET_REPO: ${{ needs.resolve-intent.outputs.target_repo }}
        run: |
          # A partial ship-it install (only this dispatch workflow present,
          # e.g. from a managed-content-only sync -- the original #2919
          # failure mode) would otherwise let dispatch-intent.ps1 create
          # issues that reference ship-it-build-guard.yml/ship-it-release-gate.yml
          # required checks that can never turn green, because those
          # workflows don't actually exist to run them.
          #
          # Query the Actions workflow API for $TARGET_REPO rather than
          # Test-Path against the checked-out ref: a checkout can contain
          # workflow files that are absent, renamed, or disabled on the
          # default branch (e.g. a manual dispatch from a feature branch,
          # or a workflow that exists but was disabled), which would let a
          # local-file check pass even though GitHub cannot actually
          # dispatch/run the sibling workflow. Requiring state == "active"
          # on the real API is correct for both same-repo and cross-repo
          # dispatches, so there is no same-repo fast path here.
          $ErrorActionPreference = 'Stop'
          $targetRepo = $env:TARGET_REPO
          $hostRepo = $env:GITHUB_REPOSITORY
          $hasCrossRepoToken = $env:HAS_CROSS_REPO_TOKEN -eq 'true'

          # github.token cannot inspect private workflows or create issues in
          # a repository other than the one running this workflow. Rather
          # than let the subsequent API/dispatch calls fail with an opaque
          # permissions error (or silently no-op against a public target
          # repo while believing it succeeded), fail closed here with an
          # actionable message when a cross-repo target has no dedicated
          # credential configured.
          if ($targetRepo -ne $hostRepo -and -not $hasCrossRepoToken) {
            Write-Host "::error::Cross-repository ship-it dispatch to $targetRepo requires the SHIP_IT_CROSS_REPO_TOKEN secret (a GitHub App or PAT with access to $targetRepo). github.token is scoped to $hostRepo only and cannot inspect workflows or create issues there. Configure SHIP_IT_CROSS_REPO_TOKEN, or dispatch with target_repo left as $hostRepo."
            exit 1
          }

          $requiredWorkflows = @(
            '.github/workflows/ship-it-intent-dispatch.yml',
            '.github/workflows/ship-it-build-guard.yml',
            '.github/workflows/ship-it-release-gate.yml'
          )

          $activeByPath = @{}
          $jsonLines = & gh api "repos/$targetRepo/actions/workflows" --paginate --jq '.workflows[] | {path: .path, state: .state} | tojson'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to query the Actions workflow API for $targetRepo. Cannot verify ship-it is fully installed."
            exit 1
          }
          foreach ($line in $jsonLines) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $entry = $line | ConvertFrom-Json
            $activeByPath[$entry.path] = $entry.state
          }

          $missing = New-Object System.Collections.Generic.List[string]
          foreach ($path in $requiredWorkflows) {
            if ($activeByPath[$path] -ne 'active') {
              [void]$missing.Add($path)
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::ship-it is only partially installed in $targetRepo. Missing or inactive required workflow(s): $($missing -join ', '). Install the full ship-it class before dispatching (pwsh scripts/configure-downstream-workflows.ps1 -InstallClass ship-it) to avoid creating issues whose required checks can never turn green."
            exit 1
          }
          Write-Host "All required ship-it workflows are active in $targetRepo."

      - name: Dispatch intent
        id: dispatch
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SHIP_IT_CROSS_REPO_TOKEN || github.token }}
          INTENT: ${{ needs.resolve-intent.outputs.intent }}
          GOAL: ${{ needs.resolve-intent.outputs.goal }}
          TARGET_REPO: ${{ needs.resolve-intent.outputs.target_repo }}
          SPEC_REF: ${{ needs.resolve-intent.outputs.spec_ref }}
          RISK_BAND: ${{ needs.resolve-intent.outputs.risk_band }}
          PROJECT_OWNER: ${{ needs.resolve-intent.outputs.project_owner }}
          PROJECT_NUMBER: ${{ needs.resolve-intent.outputs.project_number }}
          DRY_RUN: ${{ needs.resolve-intent.outputs.dry_run }}
          PROFILE: ${{ needs.resolve-intent.outputs.profile }}
          PREAPPROVAL_SOURCE_ISSUE_NUMBER: ${{ needs.resolve-intent.outputs.approval_source_issue_number }}
          APPROVAL_COMMENT_ID: ${{ needs.resolve-intent.outputs.approval_comment_id }}
          APPROVAL_RECEIPT_BASE64: ${{ needs.resolve-intent.outputs.approval_receipt_base64 }}
          REQUESTER: ${{ needs.resolve-intent.outputs.requester }}
          SOURCE_ISSUE_NUMBER: ${{ needs.resolve-intent.outputs.source_issue_number }}
          SOURCE_ISSUE_URL: ${{ needs.resolve-intent.outputs.source_issue_url }}
          SOURCE_SCOPE: ${{ needs.resolve-intent.outputs.source_scope }}
          FEATURE_ORIGIN: ${{ needs.resolve-intent.outputs.feature_origin }}
          RAW_DIRECTIVE: ${{ needs.resolve-intent.outputs.raw_directive }}
          DIRECTIVE_SOURCE: ${{ needs.resolve-intent.outputs.directive_source }}
          DIRECTIVE_ACTOR: ${{ needs.resolve-intent.outputs.directive_actor }}
          DIRECTIVE_EVIDENCE_URL: ${{ needs.resolve-intent.outputs.directive_evidence_url }}
          DIRECTIVE_TIMESTAMP: ${{ needs.resolve-intent.outputs.directive_timestamp }}
        run: |
          $dryRun = $env:DRY_RUN -eq 'true'
          $projectNumberRaw = $env:PROJECT_NUMBER
          $projectNumber = 0
          if (-not [string]::IsNullOrWhiteSpace($projectNumberRaw)) {
            $projectNumber = [int]$projectNumberRaw
          }

          $params = @{
            Intent = $env:INTENT
            Goal = $env:GOAL
            TargetRepo = $env:TARGET_REPO
            SpecRef = $env:SPEC_REF
            RiskBand = $env:RISK_BAND
            ProjectNumber = $projectNumber
            ProjectOwner = $env:PROJECT_OWNER
            Profile = $env:PROFILE
            Requester = $env:REQUESTER
            SourceIssueNumber = $env:SOURCE_ISSUE_NUMBER
            SourceIssueUrl = $env:SOURCE_ISSUE_URL
            SourceScope = $env:SOURCE_SCOPE
            FeatureOrigin = $env:FEATURE_ORIGIN -eq 'true'
            RawDirective = $env:RAW_DIRECTIVE
            DirectiveSource = $env:DIRECTIVE_SOURCE
            DirectiveActor = $env:DIRECTIVE_ACTOR
            DirectiveEvidenceUrl = $env:DIRECTIVE_EVIDENCE_URL
            DirectiveTimestamp = $env:DIRECTIVE_TIMESTAMP
            OutputPath = 'test-results\ship-it\summary.json'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PREAPPROVAL_SOURCE_ISSUE_NUMBER)) {
            $params.SourceIssueNumber = $env:PREAPPROVAL_SOURCE_ISSUE_NUMBER
            $params.ApprovalCommentId = $env:APPROVAL_COMMENT_ID
          }
          if ($dryRun) {
            $params.DryRun = $true
          }
          if ($env:TARGET_REPO -ne $env:GITHUB_REPOSITORY) {
            $params.AllowCrossRepository = $true
          }

          .\.github\base-coat\scripts\ship-it\dispatch-intent.ps1 @params

      - name: Create remediation issue when dispatch fails
        if: steps.dispatch.outcome == 'failure' && needs.resolve-intent.outputs.approval_comment_id == '' && needs.resolve-intent.outputs.dry_run != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INTENT: ${{ needs.resolve-intent.outputs.intent }}
          GOAL: ${{ needs.resolve-intent.outputs.goal }}
          TARGET_REPO: ${{ needs.resolve-intent.outputs.target_repo }}
          PROFILE: ${{ needs.resolve-intent.outputs.profile }}
        with:
          script: |
            // Read via process.env (not interpolated into this script text) so a
            // malicious goal/intent/target_repo/profile value (goal can originate
            // from free-text issue titles/comments) cannot break out of a string
            // literal and execute arbitrary JavaScript in this github-script step.
            const intent = process.env.INTENT || "";
            const goal = process.env.GOAL || "";
            const targetRepo = process.env.TARGET_REPO || "";
            const profile = process.env.PROFILE || "";
            const crypto = require("crypto");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const remediationTitle = `[Intent][${intent}] Remediation required: ${goal}`;
            const markerKey = `${intent}|${targetRepo}|${goal}|${profile}`;
            const markerHash = crypto.createHash("sha256").update(markerKey.toLowerCase()).digest("hex");
            const marker = `<!-- basecoat-intent-remediation:${markerHash} -->`;
            const intentLabel = intent;
            const remediationBody = [
              "## Remediation Trigger",
              "",
              `- Intent: \`${intent}\``,
              `- Goal: ${goal}`,
              `- Target repo: ${targetRepo}`,
              `- Profile: \`${profile}\``,
              `- Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              "",
              "## Required follow-up tasks",
              "",
              "- [ ] Investigate dispatch failure root cause",
              "- [ ] Capture actionable fix plan",
              `- [ ] Re-run ${intent} intent after fix`,
              "",
              marker
            ].join("\n");
            const labels = ["intent-control-plane", "remediation", intentLabel];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: label === "remediation" ? "b60205" : "1d76db",
                  description: label === "remediation" ? "Follow-up issue created from intent-dispatch failure." : "Tracks intent-driven dispatch runs."
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }
            }

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open label:intent-control-plane label:remediation label:${intentLabel} "${marker}"`,
              per_page: 1
            });
            const match = search.data.items[0];
            if (match) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: match.number,
                title: remediationTitle,
                body: remediationBody
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: remediationTitle,
                body: remediationBody,
                labels
              });
            }

      - name: Fail after remediation issue creation
        if: steps.dispatch.outcome == 'failure'
        run: |
          echo "Dispatch failed; no approval evidence was granted."
          exit 1

      - name: Export parent issue URL
        id: summary
        if: steps.dispatch.outcome == 'success'
        shell: pwsh
        run: |
          $summaryPath = "test-results\ship-it\summary.json"
          $summary = Get-Content -Raw -Path $summaryPath | ConvertFrom-Json
          "parent_issue_url=$($summary.parent_issue_url)" >> $env:GITHUB_OUTPUT

      - name: Upload dispatch artifacts
        if: steps.dispatch.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ship-it-dispatch
          path: test-results/ship-it
          retention-days: 7

      - name: Comment back on source issue
        if: |
          needs.resolve-intent.outputs.source_issue_number != '' &&
          steps.dispatch.outcome == 'success' &&
          (
            needs.resolve-intent.outputs.approval_comment_id == '' ||
            needs.resolve-intent.outputs.dry_run != 'true'
          )
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_ISSUE_NUMBER: ${{ needs.resolve-intent.outputs.source_issue_number }}
          PARENT_ISSUE_URL: ${{ steps.summary.outputs.parent_issue_url }}
          REQUESTER: ${{ needs.resolve-intent.outputs.requester }}
          INTENT: ${{ needs.resolve-intent.outputs.intent }}
          RAW_DIRECTIVE: ${{ needs.resolve-intent.outputs.raw_directive }}
          DIRECTIVE_ACTOR: ${{ needs.resolve-intent.outputs.directive_actor }}
          DIRECTIVE_EVIDENCE_URL: ${{ needs.resolve-intent.outputs.directive_evidence_url }}
          DIRECTIVE_TIMESTAMP: ${{ needs.resolve-intent.outputs.directive_timestamp }}
        with:
          script: |
            // Read via process.env (not interpolated into this script text) so a
            // malicious requester/intent value cannot break out of a string
            // literal and execute arbitrary JavaScript in this github-script step.
            const issueNumber = Number(process.env.SOURCE_ISSUE_NUMBER);
            const parentUrl = process.env.PARENT_ISSUE_URL || "";
            const requester = process.env.REQUESTER || "";
            const intent = process.env.INTENT || "";
            const rawDirective = process.env.RAW_DIRECTIVE || "";
            const directiveActor = process.env.DIRECTIVE_ACTOR || "";
            const evidenceUrl = process.env.DIRECTIVE_EVIDENCE_URL || "";
            const evidenceTimestamp = process.env.DIRECTIVE_TIMESTAMP || "";
            const message = [
              `@${requester} ${intent} intent accepted.`,
              "",
              `Control-plane parent issue: ${parentUrl}`,
              `Original directive: ${rawDirective}`,
              `Original actor: @${directiveActor}`,
              `Directive evidence: ${evidenceUrl}`,
              `Directive time: ${evidenceTimestamp}`,
              "",
              "Execution sprint issues were generated with governance checklists."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });
