name: "BaseCoat - Merge eligibility human-review reconcile"

on:
  # Unprivileged listener only. Do not add pull_request_review to
  # pr-auto-merge-executor.yml: Copilot reviewer-triggered runs on that
  # privileged workflow become action_required before jobs execute.
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: human-review-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch-current-head-evaluation:
    name: Dispatch current-head eligibility evaluation
    if: |
      github.event.pull_request.state == 'open' &&
      github.event.review.user.type != 'Bot' &&
      github.actor != 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted governance
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve governance policy pack
        id: policy-pack
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_FILE=".github/governance/policy-packs.json"
          if [[ ! -f "${POLICY_FILE}" ]]; then
            echo "::error::Missing governance policy pack file: ${POLICY_FILE}"
            exit 1
          fi
          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi
          echo "reconcile=$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].main.reconcile_merge_eligibility // false' "${POLICY_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Revalidate live head and dispatch executor
        if: steps.policy-pack.outputs.reconcile == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REVIEW_ACTION: ${{ github.event.action }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const prNumber = context.payload.pull_request?.number;
            const reviewAction = String(process.env.REVIEW_ACTION || '');
            if (!prNumber) {
              console.log('No pull request on the review event; no eligibility evaluation dispatched.');
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            if (pullRequest.state !== 'open') {
              console.log(`PR #${prNumber} is no longer open; no eligibility evaluation dispatched.`);
              return;
            }
            const liveHead = String(pullRequest.head.sha || '');
            const eventHead = String(context.payload.pull_request?.head?.sha || '');
            if (!liveHead) {
              throw new Error(`Unable to resolve live head SHA for PR #${prNumber}.`);
            }
            if (eventHead && eventHead !== liveHead) {
              console.log(`Review event head ${eventHead} is stale; evaluating live head ${liveHead}.`);
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'basecoat-pr-auto-merge-executor.yml',
              ref: defaultBranch,
              inputs: { pr_number: String(prNumber) }
            });
            console.log(`Dispatched merge eligibility evaluation for PR #${prNumber} after human review ${reviewAction} on ${liveHead}.`);
