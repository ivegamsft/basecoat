name: "BaseCoat - Issue to Spec Synthesis"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to synthesize. When omitted, backfills the oldest open needs-prd issue."
        required: false
        type: string
  issues:
    types: [labeled]
  workflow_run:
    workflows: ["Issue Triage Agent"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.workflow_run.id || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  synthesize-spec:
    name: Synthesize spec from approved issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Synthesis is an explicit fallback for incomplete intake, never a competing
    # path for a human-supplied spec that has been approved for implementation.
    if: |
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'synthesize-spec' &&
        !contains(github.event.issue.labels.*.name, 'approved')
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      ) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Set up Markdown validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned PR Markdown validator
        run: npm install --global markdownlint-cli@0.39.0

      - name: Synthesize spec and open PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        env:
          WRITE_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // This workflow's `permissions:` block grants the default GITHUB_TOKEN
            // contents/issues/pull-requests write on THIS repo, so it is the correct
            // write client here. PRODUCTION_REPO_TOKEN is scoped only to the public
            // mirror repo and has no access to this source repo — never use it for
            // synthesis writes. GH_AW_GITHUB_TOKEN, when configured, is an optional
            // higher-privilege override (e.g. to trigger downstream workflows).
            const writeGithub = process.env.WRITE_TOKEN ? getOctokit(process.env.WRITE_TOKEN) : github;

            async function fetchIssue(issueNumber) {
              const { data } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: Number(issueNumber),
              });
              return data;
            }

            async function findPendingIssue() {
              const candidates = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: 'needs-prd',
                per_page: 100,
              });
              return candidates
                .filter(candidate => !candidate.pull_request)
                .filter(candidate => !candidate.labels.some(label => label.name === 'approved'))
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))[0];
            }

            const dispatchIssueNumber = context.eventName === 'workflow_dispatch'
              ? String(context.payload.inputs?.issue_number || '').trim()
              : '';

            if (dispatchIssueNumber && !/^\d+$/.test(dispatchIssueNumber)) {
              core.setFailed(`workflow_dispatch input issue_number must be numeric, got: ${dispatchIssueNumber}`);
              return;
            }

            let issue;
            if (context.eventName === 'issues') {
              issue = context.payload.issue;
            } else if (dispatchIssueNumber) {
              issue = await fetchIssue(dispatchIssueNumber);
            } else {
              issue = await findPendingIssue();
            }

            if (!issue) {
              core.notice('No open needs-prd issues require synthesis.');
              return;
            }

            const issueNum = issue.number;
            const title = issue.title;
            const body = issue.body || '';
            const labels = issue.labels.map(l => l.name);
            const author = issue.user.login;

            async function clearIntakeLabels(reason) {
              for (const label of ['needs-prd', 'synthesize-spec', 'needs-info']) {
                if (!labels.includes(label)) continue;
                try {
                  await writeGithub.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNum,
                    name: label,
                  });
                } catch (err) {
                  if (err.status !== 404) {
                    core.warning(`Could not remove ${label} from #${issueNum}: ${err.message}`);
                  }
                }
              }
              core.notice(`Cleared stale intake labels for #${issueNum}: ${reason}`);
            }

            // Derive slug from issue title; fall back to 'untitled' if title is all punctuation/emoji
            const slug = (title
              .toLowerCase()
              .replace(/[^a-z0-9\s-]/g, '')
              .trim()
              .replace(/\s+/g, '-')
              .replace(/-+/g, '-')
              .slice(0, 60)) || 'untitled';

            const prdPath = `docs/prd/synthesized/issue-${issueNum}-${slug}.prd.md`;
            const specPath = `docs/spec/synthesized/issue-${issueNum}-${slug}.spec.md`;
            const branchName = `spec/issue-${issueNum}-${slug}`;

            const extractSection = (source, names) => {
              const lines = source.replace(/\r\n?/g, '\n').split('\n');
              // Classify once: headings inside fences or HTML comments are not source sections.
              const headings = [];
              const headingPattern = /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?[ \t]*$/;
              const fencePattern = /^ {0,3}(`{3,}(?=[^`]*$)|~{3,})(.*)$/;
              // Blank, heading, fence, and HTML-block lines end a paragraph and any open code span.
              const endsParagraph = line => !line.trim() || headingPattern.test(line) || fencePattern.test(line) || /^ {0,3}<!--/.test(line);
              const exactRun = run => new RegExp('(?<!`)' + run + '(?!`)', 'g');
              let fence;
              let comment = false;
              let code;
              for (let index = 0; index < lines.length; index++) {
                const line = lines[index];
                let heading = null;
                if (code && endsParagraph(line)) code = undefined;
                const marker = !comment && !code && line.match(fencePattern);
                if (marker) {
                  if (!fence) fence = marker[1];
                  else if (marker[1][0] === fence[0] && marker[1].length >= fence.length && !marker[2].trim()) fence = undefined;
                } else if (!fence) {
                  if (!comment && !code) heading = line.match(headingPattern);
                  // Empty ATX headings count; closing hashes need whitespace; closed inline comments are not visible text.
                  if (heading) heading[2] = (heading[2] ?? '').replace(/(?:^|[ \t]+)#+$/, '').replace(/<!--[\s\S]*?-->/g, '').trim();
                  // Comment delimiters count anywhere outside code spans, which may cross paragraph lines.
                  for (let at = 0; at < line.length;) {
                    const pattern = comment ? /-->/g : code ? exactRun(code) : /\\[\s\S]|<!--|`+/g;
                    pattern.lastIndex = at;
                    const found = pattern.exec(line);
                    if (!found) break;
                    at = found.index + found[0].length;
                    if (comment || code) {
                      comment = false;
                      code = undefined;
                    } else if (found[0] === '<!--') {
                      comment = true;
                    } else if (found[0][0] === '`') {
                      // Matched backslash escapes are literal; only unescaped backtick runs may open a span.
                      let rest = line.slice(at);
                      for (let next = index + 1; !heading && next < lines.length && !endsParagraph(lines[next]); next++) rest += '\n' + lines[next];
                      if (exactRun(found[0]).test(rest)) code = found[0];
                    }
                  }
                }
                headings.push(heading);
              }
              if (fence) throw new Error(`Synthesis source #${issueNum} has an unclosed fenced block.`);
              if (comment) throw new Error(`Synthesis source #${issueNum} has an unclosed HTML comment.`);
              let start;
              let depth;
              if (names === null) {
                // Full-source fallback: nest every heading beneath the generated section.
                const depths = headings.filter(Boolean).map(heading => heading[1].length);
                start = 0;
                depth = depths.length ? Math.min(...depths) - 1 : 0;
              }
              for (let index = 0; index < lines.length; index++) {
                const heading = headings[index];
                if (!heading) continue;
                if (start !== undefined && heading[1].length <= depth) {
                  return lines.slice(start, index).join('\n');
                }
                if (start !== undefined) {
                  const nestedDepth = 2 + heading[1].length - depth;
                  if (nestedDepth > 6) throw new Error(`Synthesis section hierarchy is unsupported for #${issueNum}.`);
                  lines[index] = lines[index].replace(heading[1], '#'.repeat(nestedDepth));
                }
                if (start === undefined && names.includes(heading[2].toLowerCase().replace(/\s+/g, ' '))) {
                  start = index + 1;
                  depth = heading[1].length;
                }
              }
              return start === undefined ? undefined : lines.slice(start).join('\n');
            };
            // Scan the complete source before selecting sections; never truncate a fence.
            extractSection(body, []);

            const normalizeSection = value => {
              const lines = value.trim().replace(/\r\n?/g, '\n').split('\n');
              const output = [];
              let fence;
              for (let index = 0; index < lines.length; index++) {
                const line = lines[index];
                const marker = line.match(/^ {0,3}(`{3,}(?=[^`]*$)|~{3,})(.*)$/);
                if (marker) {
                  if (!fence) {
                    fence = marker[1];
                  } else if (
                    marker[1][0] === fence[0] &&
                    marker[1].length >= fence.length &&
                    !marker[2].trim()
                  ) {
                    fence = undefined;
                  }
                }
                const heading = !fence && /^ {0,3}#{1,6}(?:\s+|$)/.test(line);
                if (heading && output.length && output.at(-1).trim()) output.push('');
                output.push(line);
                if (heading && lines[index + 1]?.trim()) output.push('');
              }
              return output.join('\n');
            };
            const problem = normalizeSection(extractSection(body, ['problem', 'problem statement']) ?? extractSection(body, ['description']) ?? extractSection(body, null));
            const scope   = normalizeSection(extractSection(body, ['scope', 'suggested scope']) ?? extractSection(body, ['design']) ?? '*Not specified.*');
            const why     = normalizeSection(extractSection(body, ['why this matters']) ?? extractSection(body, ['rca']) ?? '*Not specified.*');
            const refs    = normalizeSection(extractSection(body, ['reference', 'references']) ?? `- Refs #${issueNum}`);
            const now     = new Date().toISOString().split('T')[0];

            const prdContent = [
              '---',
              `issue: ${issueNum}`,
              `title: ${JSON.stringify(title)}`,
              'status: draft',
              `author: ${author}`,
              `created: ${now}`,
              `labels: ${JSON.stringify(labels)}`,
              '---',
              '',
              `# PRD: ${title}`,
              '',
              '## Problem Statement',
              '',
              problem,
              '',
              '## Why This Matters',
              '',
              why,
              '',
              '## Scope',
              '',
              scope,
              '',
              '## Success Criteria',
              '',
              '- [ ] The implementation addresses the stated problem.',
              '- [ ] The acceptance criteria are validated before release.',
              '',
              '## References',
              '',
              refs,
              `- Issue: <https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNum}>`,
              '',
            ].join('\n');

            const specContent = [
              '---',
              `issue: ${issueNum}`,
              `title: ${JSON.stringify(title)}`,
              `status: draft`,
              `author: ${author}`,
              `created: ${now}`,
              `labels: ${JSON.stringify(labels)}`,
              '---',
              '',
              `# Spec: ${title}`,
              '',
              '## Problem Statement',
              '',
              problem,
              '',
              '## Why This Matters',
              '',
              why,
              '',
              '## Scope',
              '',
              scope,
              '',
              '## Acceptance Criteria',
              '',
              '- [ ] Implementation matches the scope defined above.',
              '- [ ] Validation commands pass with no errors.',
              '- [ ] PR references this spec.',
              '',
              '## References',
              '',
              `- PRD: \`${prdPath}\``,
              refs,
              `- Issue: <https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNum}>`,
              '',
            ].join('\n');

            // Get default branch SHA
            const { data: ref } = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });
            const baseSha = ref.object.sha;

            const configResponse = await github.rest.repos.getContent({
              owner, repo, path: '.markdownlint.json', ref: baseSha,
            });
            if (Array.isArray(configResponse.data) || configResponse.data.type !== 'file') {
              throw new Error('Trusted Markdown configuration is unavailable at the synthesis base.');
            }
            const fs = require('node:fs/promises');
            const os = require('node:os');
            const path = require('node:path');
            const { promisify } = require('node:util');
            const execFile = promisify(require('node:child_process').execFile);
            const workspace = await fs.mkdtemp(path.join(os.tmpdir(), 'basecoat-synthesis-'));
            const validateArtifacts = async artifacts => {
              try {
                await fs.writeFile(path.join(workspace, '.markdownlint.json'),
                  Buffer.from(configResponse.data.content, 'base64'));
                for (const [filename, content] of artifacts) {
                  await fs.writeFile(path.join(workspace, filename), content);
                }
                // Inline directives from untrusted source text must not weaken the trusted configuration.
                if (artifacts.some(([, content]) => /<!--\s*markdownlint-/i.test(content))) {
                  throw new Error('Inline markdownlint directives are not allowed in synthesized artifacts.');
                }
                await execFile('markdownlint', [
                  '--config', '.markdownlint.json',
                  ...artifacts.map(([filename]) => filename),
                ], { cwd: workspace, timeout: 30000, maxBuffer: 65536 });
              } catch {
                // CLI output can contain source text; do not echo untrusted or secret-bearing content.
                throw new Error(`Markdown validation failed for synthesis source #${issueNum}; no PR published. Validate both artifacts with markdownlint-cli@0.39.0 and the configuration at ${baseSha}.`);
              } finally {
                await fs.rm(workspace, { recursive: true, force: true });
              }
            };
            await validateArtifacts([['proposal.prd.md', prdContent], ['proposal.spec.md', specContent]]);

            // Create the synthesis branch. A prior attempt can create the branch
            // and then fail before opening its PR, so recover that state below.
            let branchExists = false;
            try {
              await writeGithub.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: baseSha,
              });
            } catch (err) {
              if (err.status === 422) {
                branchExists = true;
                const existing = await github.rest.pulls.list({
                  owner,
                  repo,
                  head: `${owner}:${branchName}`,
                  state: 'all',
                });
                const existingPr = existing.data[0];
                if (existingPr) {
                  await clearIntakeLabels(`existing synthesis PR ${existingPr.html_url}`);
                  await writeGithub.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNum,
                    body: `A PRD/spec synthesis PR already exists for this issue: ${existingPr.html_url}`,
                  });
                  core.notice(`PRD/spec synthesis PR already exists: ${existingPr.html_url}`);
                  return;
                }
                core.notice(`Recovering existing synthesis branch without a PR: ${branchName}`);
              } else {
                throw err;
              }
            }

            if (!branchExists) {
              // GitHub creates parent paths when each generated artifact is written.
              await writeGithub.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: prdPath,
                message: `prd(synthesized): generate PRD for issue #${issueNum}\n\nAuto-generated by issue-to-spec-synthesis.yml\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>`,
                content: Buffer.from(prdContent).toString('base64'),
                branch: branchName,
              });

              await writeGithub.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: specPath,
                message: `spec(synthesized): generate spec for issue #${issueNum}\n\nAuto-generated by issue-to-spec-synthesis.yml\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>`,
                content: Buffer.from(specContent).toString('base64'),
                branch: branchName,
              });
            }

            const publicationRef = await github.rest.git.getRef({
              owner, repo, ref: `heads/${branchName}`,
            });
            if (branchExists) {
              for (const [artifactPath, expected] of [[prdPath, prdContent], [specPath, specContent]]) {
                const artifact = await github.rest.repos.getContent({
                  owner, repo, path: artifactPath, ref: publicationRef.data.object.sha,
                });
                if (Array.isArray(artifact.data) || artifact.data.type !== 'file' ||
                    Buffer.from(artifact.data.content, 'base64').toString('utf8') !== expected) {
                  throw new Error(`Existing synthesis artifact conflicts with generated content for #${issueNum}; preserving branch edits.`);
                }
              }
            }
            const comparison = await github.rest.repos.compareCommits({
              owner, repo, base: baseSha, head: publicationRef.data.object.sha,
            });
            const changedFiles = comparison.data.files;
            if (comparison.data.status !== 'ahead' || !Array.isArray(changedFiles) ||
                changedFiles.length !== 2 ||
                !changedFiles.some(file => file.filename === prdPath) ||
                !changedFiles.some(file => file.filename === specPath)) {
              throw new Error(`Unable to resolve a complete generated-file diff for #${issueNum}.`);
            }
            const currentMain = await github.rest.git.getRef({
              owner, repo, ref: 'heads/main',
            });
            if (currentMain.data.object.sha !== baseSha) {
              throw new Error('Main advanced during synthesis; refusing to publish a PR with stale artifacts.');
            }
            // Publish only the validated head; concurrent pushes are preserved for reconciliation.
            const headRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${branchName}` });
            if (headRef.data.object.sha !== publicationRef.data.object.sha) {
              throw new Error(`Synthesis branch changed after validation for #${issueNum}; preserving branch edits for reconciliation.`);
            }

            // Open PR
            const { data: pr } = await writeGithub.rest.pulls.create({
              owner,
              repo,
              title: `spec: synthesize spec for issue #${issueNum} — ${title}`,
              body: [
                `Auto-generated spec from approved issue #${issueNum}.`,
                '',
                `**Source issue:** #${issueNum}`,
                `**PRD path:** \`${prdPath}\``,
                `**Spec path:** \`${specPath}\``,
                '',
                'Review and edit the spec before merging. Implementation PRs should reference this spec.',
                '',
                `Refs #${issueNum}`,
              ].join('\n'),
              head: branchName,
              base: 'main',
              draft: true,
            });

            // Add sprint label if present on issue
            const sprintLabel = labels.find(l => /^(wave:|wave-|sprint:|sprint-)/.test(l));
            const prLabels = ['documentation', 'spec'];
            if (sprintLabel) prLabels.push(sprintLabel);
            // Add labels (degrade to warning if any label doesn't exist)
            try {
              await writeGithub.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: prLabels,
              });
            } catch (err) {
              core.warning(`Could not add labels ${prLabels.join(', ')} to PR #${pr.number}: ${err.message}`);
            }

            // Comment on original issue
            await writeGithub.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNum,
              body: [
                `PRD and spec synthesized from this issue. Draft PR: ${pr.html_url}`,
                '',
                `PRD: \`${prdPath}\``,
                `Spec: \`${specPath}\``,
              ].join('\n'),
            });

            await clearIntakeLabels(`opened synthesis PR ${pr.html_url}`);

            core.notice(`Spec PR opened: ${pr.html_url}`);
