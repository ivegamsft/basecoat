name: "BaseCoat - Auto-approve cloud agent workflows"

on:
  # Run the trusted default-branch copy. A pull_request workflow authored by
  # Copilot can itself be held for approval, preventing it from approving the
  # other requested runs it was created to unblock.
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    # The trusted source-repository workflow is named code-review-agent. Do not
    # listen to pull_request_review: the Copilot reviewer app has no repository
    # permission, so GitHub marks workflows it triggers action_required.
    workflows: ["code-review-agent"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  pull-requests: read
  contents: read
  actions: write

concurrency:
  group: cloud-agent-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  auto-approve-workflows:
    # A pull_request event can be emitted by a maintainer or automation after
    # the cloud agent creates the PR. Author identity is stable; event actor
    # is not, and using it caused eligible solo-dev runs to be skipped.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.id == 198982749
    name: Auto-approve pending workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # On the pull_request path this job would otherwise resolve the PR's
          # merge ref, letting a PR modify .github/governance/policy-packs.json
          # and make this auto-approval gate trust the PR's own policy instead
          # of the trusted default-branch governance. Pin to the default
          # branch explicitly.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve governance policy pack
        id: policy-pack
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE=".github/governance/policy-packs.json"
          if [[ ! -f "${POLICY_FILE}" ]]; then
            echo "::error::Missing governance policy pack file: ${POLICY_FILE}"
            exit 1
          fi

          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi

          AUTO_APPROVE="$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.auto_approve_workflow_runs // false' "${POLICY_FILE}")"
          echo "selected_pack=${SELECTED_PACK}" >> "${GITHUB_OUTPUT}"
          echo "auto_approve=${AUTO_APPROVE}" >> "${GITHUB_OUTPUT}"

          if [[ "${AUTO_APPROVE}" != "true" ]]; then
            echo "Cloud-agent workflow auto-approval disabled by '${SELECTED_PACK}' policy pack."
          fi

      - name: Check if workflows require approval
        if: steps.policy-pack.outputs.auto_approve == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const getCurrentHeadSha = async () => {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });
              return pullRequest.head.sha;
            };
            const headSha = await getCurrentHeadSha();

            console.log(`Checking for pending workflows on PR #${prNumber} at ${headSha}`);
            
            // Paginate so an eligible current-head run is never omitted when
            // the repository has more than one page of requested runs.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              status: 'requested',
              per_page: 100
            });
            
            // Only the current PR head may be approved. Requested runs are the
            // GitHub-side source of truth for an unapproved decision, so stale
            // or already-approved runs are excluded. De-duplicate run IDs in
            // case the REST list contains the same run across pagination.
            const pendingRuns = [...new Map(
              runs
                .filter(run => run.head_sha === headSha &&
                  run.pull_requests?.some(pr => pr.number === prNumber))
                .map(run => [run.id, run])
            ).values()];
            
            if (pendingRuns.length === 0) {
              console.log(`✓ No pending workflows found for PR #${prNumber}`);
              return;
            }
            
            console.log(`Found ${pendingRuns.length} pending workflow(s) for PR #${prNumber} at ${headSha}`);
            
            // Approve each pending workflow
            for (const run of pendingRuns) {
              const currentHeadSha = await getCurrentHeadSha();
              if (currentHeadSha !== headSha) {
                console.log(`PR #${prNumber} advanced from ${headSha} to ${currentHeadSha}; stopping so its newer event can evaluate the current head.`);
                return;
              }

              try {
                await github.rest.actions.approveWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                console.log(`✓ Approved workflow run ${run.id}: ${run.name}`);
              } catch (error) {
                if (error.status === 403) {
                  console.log(`⚠ Cannot approve workflow run ${run.id} — insufficient permissions`);
                  console.log(`  This may require manual approval via GitHub UI`);
                } else {
                  throw error;
                }
              }
            }

      - name: Record policy-pack skip
        if: steps.policy-pack.outputs.auto_approve != 'true'
        env:
          SELECTED_PACK: ${{ steps.policy-pack.outputs.selected_pack }}
        run: |
          echo "Skipping auto-approval because policy pack '${SELECTED_PACK}' disables cloud-agent auto-approval." >> "$GITHUB_STEP_SUMMARY"

  re-evaluate-after-automated-review:
    if: github.event_name == 'workflow_run'
    name: Re-evaluate merge eligibility after automated review
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted governance
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve governance policy pack
        id: policy-pack
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_FILE=".github/governance/policy-packs.json"
          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi
          echo "auto_approve=$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.auto_approve_workflow_runs // false' "${POLICY_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "automated_review=$(jq -c --arg p "${SELECTED_PACK}" '.profiles[$p].main.automated_review // { required: false }' "${POLICY_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Dispatch current-head eligibility evaluation
        if: steps.policy-pack.outputs.auto_approve == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          AUTOMATED_REVIEW: ${{ steps.policy-pack.outputs.automated_review }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            if (run.conclusion !== 'success') {
              console.log(`Code review run ${run.id} concluded '${run.conclusion}'; no eligibility evaluation dispatched.`);
              return;
            }
            const { data: trustedReviewWorkflow } = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: 'code-review-agent.lock.yml'
            });
            if (run.workflow_id !== trustedReviewWorkflow.id) {
              console.log(`Workflow run ${run.id} does not match trusted review workflow ${trustedReviewWorkflow.id}; no eligibility evaluation dispatched.`);
              return;
            }
            const prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              console.log(`Code review run ${run.id} has no associated pull request; no eligibility evaluation dispatched.`);
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            if (pullRequest.state !== 'open' || pullRequest.head.sha !== run.head_sha) {
              console.log(`PR #${prNumber} is no longer open at reviewed head ${run.head_sha}; no eligibility evaluation dispatched.`);
              return;
            }
            const automatedReview = JSON.parse(process.env.AUTOMATED_REVIEW);
            if (automatedReview.required) {
              if (
                !Array.isArray(automatedReview.reviewer_logins) ||
                automatedReview.reviewer_logins.length === 0 ||
                !Array.isArray(automatedReview.accepted_states) ||
                automatedReview.accepted_states.length === 0
              ) {
                core.setFailed('Required automated-review policy must define reviewer_logins and accepted_states.');
                return;
              }
              const reviewers = new Set((automatedReview.reviewer_logins || []).map(login => login.toLowerCase()));
              const states = new Set(
                (automatedReview.accepted_states || []).map(state => String(state).toUpperCase())
              );
              let reviewObserved = false;
              for (let attempt = 1; attempt <= 20; attempt += 1) {
                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: prNumber, per_page: 100
                });
                reviewObserved = reviews.some(review =>
                  reviewers.has(String(review.user?.login || '').toLowerCase()) &&
                  states.has(String(review.state || '').toUpperCase()) &&
                  review.commit_id === run.head_sha
                );
                if (reviewObserved || attempt === 20) break;
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
              if (!reviewObserved) {
                console.log(`Required automated review did not complete for PR #${prNumber} at ${run.head_sha}; no eligibility evaluation dispatched.`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'pr-auto-merge-executor.yml',
              ref: context.payload.repository.default_branch,
              inputs: { pr_number: String(prNumber) }
            });
            console.log(`Dispatched merge eligibility evaluation for PR #${prNumber} after successful automated review.`);

  reconcile-open-auto-merge-pull-requests:
    if: github.event_name == 'schedule'
    name: Reconcile open auto-merge pull requests
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted governance
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve governance policy pack
        id: policy-pack
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail
          POLICY_FILE=".github/governance/policy-packs.json"
          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi
          echo "auto_approve=$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.auto_approve_workflow_runs // false' "${POLICY_FILE}")" >> "${GITHUB_OUTPUT}"
          echo "reconcile=$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].main.reconcile_merge_eligibility // false' "${POLICY_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Dispatch current eligibility evaluations
        if: steps.policy-pack.outputs.reconcile == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: defaultBranch,
              per_page: 100
            });
            for (const pullRequest of openPullRequests) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100
              });
              const latestReview = [...reviews].sort(
                (left, right) =>
                  new Date(right.submitted_at || right.created_at || 0) -
                  new Date(left.submitted_at || left.created_at || 0)
              )[0];
              if (!latestReview) continue;

              const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pullRequest.head.sha
              });
              const eligibilityStatuses =
                (combinedStatus.statuses || []).filter(
                  status => status.context === 'BaseCoat merge eligibility'
                ) || [];
              const latestEligibility = eligibilityStatuses.sort(
                (left, right) => new Date(right.created_at) - new Date(left.created_at)
              )[0];
              if (
                latestEligibility &&
                new Date(latestReview.submitted_at || latestReview.created_at) <=
                  new Date(latestEligibility.created_at)
              ) {
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'pr-auto-merge-executor.yml',
                ref: defaultBranch,
                inputs: { pr_number: String(pullRequest.number) }
              });
              console.log(`Dispatched merge eligibility evaluation for new review evidence on PR #${pullRequest.number}.`);
            }
