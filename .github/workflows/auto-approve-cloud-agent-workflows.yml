name: "BaseCoat - Auto-approve cloud agent workflows"

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: cloud-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-approve-workflows:
    if: github.actor == 'app/copilot-swe-agent'
    name: Auto-approve pending workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Resolve governance policy pack
        id: policy-pack
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE=".github/governance/policy-packs.json"
          if [[ ! -f "${POLICY_FILE}" ]]; then
            echo "::error::Missing governance policy pack file: ${POLICY_FILE}"
            exit 1
          fi

          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi

          AUTO_APPROVE="$(jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.auto_approve_workflow_runs // false' "${POLICY_FILE}")"
          echo "selected_pack=${SELECTED_PACK}" >> "${GITHUB_OUTPUT}"
          echo "auto_approve=${AUTO_APPROVE}" >> "${GITHUB_OUTPUT}"

          if [[ "${AUTO_APPROVE}" != "true" ]]; then
            echo "Cloud-agent workflow auto-approval disabled by '${SELECTED_PACK}' policy pack."
          fi

      - name: Check if workflows require approval
        if: steps.policy-pack.outputs.auto_approve == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            console.log(`Checking for pending workflows on PR #${prNumber} from app/copilot-swe-agent`);
            
            // Get all pending workflow runs for this PR
            const { data: runsData } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              status: 'requested',
              per_page: 100
            });
            
            // Filter runs associated with this PR
            const pendingRuns = runsData.workflow_runs.filter(run => {
              return run.pull_requests && 
                     run.pull_requests.some(pr => pr.number === prNumber);
            });
            
            if (pendingRuns.length === 0) {
              console.log(`✓ No pending workflows found for PR #${prNumber}`);
              return;
            }
            
            console.log(`Found ${pendingRuns.length} pending workflow(s) for PR #${prNumber}`);
            
            // Approve each pending workflow
            for (const run of pendingRuns) {
              try {
                await github.rest.actions.approveWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                console.log(`✓ Approved workflow run ${run.id}: ${run.name}`);
              } catch (error) {
                if (error.status === 403) {
                  console.log(`⚠ Cannot approve workflow run ${run.id} — insufficient permissions`);
                  console.log(`  This may require manual approval via GitHub UI`);
                } else {
                  throw error;
                }
              }
            }

      - name: Record policy-pack skip
        if: steps.policy-pack.outputs.auto_approve != 'true'
        run: |
          echo "Skipping auto-approval because policy pack '${{ steps.policy-pack.outputs.selected_pack }}' disables cloud-agent auto-approval." >> "$GITHUB_STEP_SUMMARY"
