name: "BaseCoat - Dependency Relationship Routing"

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - labeled
      - unlabeled
  issue_comment:
    types:
      - created
      - edited
      - deleted
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - closed
      - labeled
      - unlabeled
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum open issues and PRs to evaluate in batch mode"
        required: false
        default: "150"
        type: string
      stale_days:
        description: "Days since update to classify blocked work as stale"
        required: false
        default: "7"
        type: string
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route dependency markers and update blocker state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Parse relationship markers and enforce blocked labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          MAX_ITEMS: ${{ inputs.max_items || '150' }}
          STALE_DAYS: ${{ inputs.stale_days || '7' }}
        with:
          script: |
            const ROUTING_MARKER = '<!-- dependency-routing:v1 -->';
            const REPORT_MARKER = '<!-- dependency-routing:weekly-report:v1 -->';
            const ISSUE_BLOCKED_LABEL = 'blocked';
            const PR_BLOCKED_LABEL = 'dependency-blocked';
            const relationRegex = /(?:^|\n)\s*(Blocked by|Depends on|Part of|Related to|Duplicate of)\s+(?:#(\d+)|https?:\/\/github\.com\/[^/\s]+\/[^/\s]+\/(?:issues|pull)\/(\d+))/gim;
            const blockingKinds = new Set(['blocked by', 'depends on']);

            const toInt = (value, fallback) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
            };

            const maxItems = toInt(process.env.MAX_ITEMS, 150);
            const staleDays = toInt(process.env.STALE_DAYS, 7);
            const now = new Date();

            const depStateCache = new Map();

            const parseRelationsFromText = (text, source) => {
              const relations = [];
              if (!text || typeof text !== 'string') {
                return relations;
              }
              relationRegex.lastIndex = 0;
              let match;
              while ((match = relationRegex.exec(text)) !== null) {
                const relation = String(match[1] || '').toLowerCase().trim();
                const refNumber = Number(match[2] || match[3]);
                if (!Number.isInteger(refNumber) || refNumber <= 0) {
                  continue;
                }
                relations.push({
                  relation,
                  refNumber,
                  source
                });
              }
              return relations;
            };

            const listIssueComments = async issueNumber => {
              return github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
            };

            const ensureLabel = async ({ name, color, description }) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (err) {
                if (err.status !== 404) {
                  throw err;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
              }
            };

            const setBlockedLabel = async ({ issueNumber, label, enabled }) => {
              if (enabled) {
                await ensureLabel({
                  name: label,
                  color: 'B60205',
                  description: label === ISSUE_BLOCKED_LABEL
                    ? 'Issue has unresolved dependency markers (Blocked by / Depends on).'
                    : 'PR has unresolved dependency markers (Blocked by / Depends on).'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label]
                });
                return;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (err) {
                if (err.status !== 404) {
                  throw err;
                }
              }
            };

            const upsertBotComment = async ({ issueNumber, marker, body }) => {
              const comments = await listIssueComments(issueNumber);
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
                return 'updated';
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              return 'created';
            };

            const readDependencyState = async refNumber => {
              if (depStateCache.has(refNumber)) {
                return depStateCache.get(refNumber);
              }

              const { data: refIssue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: refNumber
              });

              let kind = 'issue';
              let resolved = refIssue.state === 'closed';
              let statusText = resolved ? 'closed' : 'open';
              let isMergedPr = false;

              if (refIssue.pull_request) {
                kind = 'pull_request';
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: refNumber
                });
                isMergedPr = Boolean(pr.merged);
                resolved = isMergedPr;
                statusText = isMergedPr ? 'merged' : pr.state;
              }

              const state = {
                number: refNumber,
                url: refIssue.html_url,
                title: refIssue.title,
                kind,
                resolved,
                statusText
              };
              depStateCache.set(refNumber, state);
              return state;
            };

            const evaluateItem = async ({ issueNumber, isPr }) => {
              const labelName = isPr ? PR_BLOCKED_LABEL : ISSUE_BLOCKED_LABEL;
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              if (issue.state === 'closed') {
                await setBlockedLabel({ issueNumber, label: labelName, enabled: false });
                return {
                  issueNumber,
                  isPr,
                  blocked: false,
                  unresolved: [],
                  relations: [],
                  issueUrl: issue.html_url,
                  issueTitle: issue.title,
                  updatedAt: issue.updated_at
                };
              }

              const comments = await listIssueComments(issueNumber);
              const relations = [
                ...parseRelationsFromText(issue.body || '', 'body'),
                ...comments.flatMap(comment => parseRelationsFromText(comment.body || '', `comment:${comment.id}`))
              ];

              const relationKeys = new Set();
              const uniqueRelations = [];
              for (const relation of relations) {
                const key = `${relation.relation}:${relation.refNumber}`;
                if (relationKeys.has(key)) {
                  continue;
                }
                relationKeys.add(key);
                uniqueRelations.push(relation);
              }

              const blockingRefs = [...new Set(
                uniqueRelations
                  .filter(r => blockingKinds.has(r.relation))
                  .map(r => r.refNumber)
              )];

              const unresolved = [];
              for (const refNumber of blockingRefs) {
                const dep = await readDependencyState(refNumber);
                if (!dep.resolved) {
                  unresolved.push(dep);
                }
              }

              const blocked = unresolved.length > 0;
              await setBlockedLabel({ issueNumber, label: labelName, enabled: blocked });

              if (uniqueRelations.length > 0 || blocked) {
                const relationLines = uniqueRelations.length > 0
                  ? uniqueRelations.map(r => `- ${r.relation} #${r.refNumber}`).join('\n')
                  : '_No relationship markers found._';
                const unresolvedLines = unresolved.length > 0
                  ? unresolved.map(dep => `- [ ] #${dep.number} (${dep.kind}, ${dep.statusText}) — ${dep.title}`).join('\n')
                  : '_None_';
                const body = [
                  ROUTING_MARKER,
                  '## Dependency routing status',
                  '',
                  `Evaluated relationship markers for ${isPr ? 'PR' : 'issue'} #${issueNumber}.`,
                  '',
                  `- Blocked label: \`${labelName}\` ${blocked ? 'applied' : 'cleared'}`,
                  `- Unresolved blockers: ${unresolved.length}`,
                  '',
                  '### Parsed relationship markers',
                  relationLines,
                  '',
                  '### Unresolved `Blocked by` / `Depends on` targets',
                  unresolvedLines,
                  '',
                  '_Automated by `.github/workflows/dependency-relationship-routing.yml`._'
                ].join('\n');
                await upsertBotComment({
                  issueNumber,
                  marker: ROUTING_MARKER,
                  body
                });
              }

              return {
                issueNumber,
                isPr,
                blocked,
                unresolved,
                relations: uniqueRelations,
                issueUrl: issue.html_url,
                issueTitle: issue.title,
                updatedAt: issue.updated_at
              };
            };

            const runBatchAudit = async () => {
              const outcomes = [];
              const [issues, prs] = await Promise.all([
                github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100
                }),
                github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100
                })
              ]);

              const openIssues = issues.filter(item => !item.pull_request).slice(0, maxItems);
              const openPrs = prs.slice(0, maxItems);

              for (const item of openIssues) {
                outcomes.push(await evaluateItem({ issueNumber: item.number, isPr: false }));
              }
              for (const pr of openPrs) {
                outcomes.push(await evaluateItem({ issueNumber: pr.number, isPr: true }));
              }

              const blockedIssues = outcomes.filter(o => !o.isPr && o.blocked);
              const blockedPrs = outcomes.filter(o => o.isPr && o.blocked);
              const staleThresholdMs = staleDays * 24 * 60 * 60 * 1000;
              const staleItems = outcomes.filter(o =>
                o.blocked &&
                (now.getTime() - new Date(o.updatedAt).getTime()) >= staleThresholdMs
              );

              const blockersByTarget = new Map();
              for (const outcome of outcomes) {
                for (const dep of outcome.unresolved) {
                  const key = dep.number;
                  if (!blockersByTarget.has(key)) {
                    blockersByTarget.set(key, {
                      number: dep.number,
                      title: dep.title,
                      kind: dep.kind,
                      statusText: dep.statusText,
                      count: 0
                    });
                  }
                  blockersByTarget.get(key).count += 1;
                }
              }

              const hottestBlockers = [...blockersByTarget.values()]
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);

              const weekStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
              const day = weekStart.getUTCDay() || 7;
              weekStart.setUTCDate(weekStart.getUTCDate() - day + 1);
              const weekOf = weekStart.toISOString().slice(0, 10);
              const reportTitle = `Dependency Routing Report - Week of ${weekOf}`;

              const staleLines = staleItems.length > 0
                ? staleItems
                    .slice(0, 25)
                    .map(item => {
                      const ageDays = Math.floor((now.getTime() - new Date(item.updatedAt).getTime()) / (24 * 60 * 60 * 1000));
                      return `- #${item.issueNumber} (${item.isPr ? 'PR' : 'Issue'}, ${ageDays}d stale) — ${item.issueTitle}`;
                    })
                    .join('\n')
                : '_None_';

              const blockerLines = hottestBlockers.length > 0
                ? hottestBlockers.map(item =>
                    `- #${item.number} (${item.kind}, ${item.statusText}) blocks ${item.count} work item(s) — ${item.title}`
                  ).join('\n')
                : '_None_';

              const reportBody = [
                REPORT_MARKER,
                '# Dependency Routing Report',
                '',
                `- Week of: ${weekOf}`,
                `- Open issues scanned: ${openIssues.length}`,
                `- Open PRs scanned: ${openPrs.length}`,
                `- Blocked issues: ${blockedIssues.length}`,
                `- Blocked PRs: ${blockedPrs.length}`,
                `- Stale blocked items (>= ${staleDays}d): ${staleItems.length}`,
                '',
                '## Top unresolved blockers',
                blockerLines,
                '',
                `## Stale blocked work (>= ${staleDays} days)`,
                staleLines,
                '',
                '_Generated by `.github/workflows/dependency-relationship-routing.yml`._'
              ].join('\n');

              const existingReports = await github.paginate(github.rest.search.issuesAndPullRequests, {
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${reportTitle}"`,
                per_page: 10
              });
              const existing = existingReports.find(item => item.title === reportTitle);

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: reportBody
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: reportTitle,
                  body: reportBody,
                  labels: ['governance']
                });
              }

              return {
                openIssues: openIssues.length,
                openPrs: openPrs.length,
                blockedIssues: blockedIssues.length,
                blockedPrs: blockedPrs.length,
                staleBlocked: staleItems.length
              };
            };

            if (context.eventName === 'issues' || context.eventName === 'issue_comment') {
              const issueNumber = context.payload.issue?.number;
              if (!issueNumber) {
                core.setFailed('Issue event missing issue number.');
                return;
              }
              const isPr = Boolean(context.payload.issue?.pull_request);
              const result = await evaluateItem({ issueNumber, isPr });
              core.summary
                .addHeading('Dependency routing result')
                .addTable([
                  [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                  ['Item', `${isPr ? 'PR' : 'Issue'} #${issueNumber}`],
                  ['Blocked', String(result.blocked)],
                  ['Unresolved blockers', String(result.unresolved.length)],
                  ['Markers parsed', String(result.relations.length)]
                ])
                .write();
              return;
            }

            if (context.eventName === 'pull_request_target' || context.eventName === 'pull_request_review_comment') {
              const issueNumber = context.payload.pull_request?.number;
              if (!issueNumber) {
                core.setFailed('Pull request event missing pull request number.');
                return;
              }
              const result = await evaluateItem({ issueNumber, isPr: true });
              core.summary
                .addHeading('Dependency routing result')
                .addTable([
                  [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                  ['Item', `PR #${issueNumber}`],
                  ['Blocked', String(result.blocked)],
                  ['Unresolved blockers', String(result.unresolved.length)],
                  ['Markers parsed', String(result.relations.length)]
                ])
                .write();
              return;
            }

            const batch = await runBatchAudit();
            core.summary
              .addHeading('Dependency routing batch audit')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Open issues scanned', String(batch.openIssues)],
                ['Open PRs scanned', String(batch.openPrs)],
                ['Blocked issues', String(batch.blockedIssues)],
                ['Blocked PRs', String(batch.blockedPrs)],
                [`Stale blocked (>=${staleDays}d)`, String(batch.staleBlocked)]
              ])
              .write();
