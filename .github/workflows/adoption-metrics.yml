name: "BaseCoat - Adoption Metrics"
# [Internal-only] Memory workflow - BaseCoat operational use

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Deploy Docs"]
    types: [completed]

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_METRICS_TOKEN: ${{ secrets.COPILOT_METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          DASHBOARD_ORG: ${{ secrets.DASHBOARD_ORG || github.repository_owner }}
          DASHBOARD_REPOS: ${{ secrets.DASHBOARD_REPOS || format('["{0}"]', github.repository) }}
          OUTPUT_DIR: dashboard/metrics
          # App Insights telemetry (onboarding telemetry pack — see docs/operations/onboarding-telemetry-readiness.md)
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: python scripts/metrics/collect-metrics.py

      - name: Emit telemetry readiness check
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          COPILOT_METRICS_TOKEN: ${{ secrets.COPILOT_METRICS_TOKEN }}
          DASHBOARD_REPOS: ${{ secrets.DASHBOARD_REPOS || format('["{0}"]', github.repository) }}
        run: python scripts/metrics/emit-telemetry-readiness.py

      - name: Deploy to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash metrics output before switching branches
          mkdir -p /tmp/metrics-output
          cp -r dashboard/metrics/. /tmp/metrics-output/
          rm -rf dashboard/metrics

          # Create or switch to gh-pages branch
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null
          fi

          # Deploy metrics JSON (HTML is served by MkDocs via docs/dashboard/)
          mkdir -p dashboard/metrics
          cp -r /tmp/metrics-output/. dashboard/metrics/

          git add -A
          git diff --cached --quiet || git commit -m "chore: update adoption metrics [skip ci]"
          git push origin gh-pages

      - name: Post weekly summary
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f dashboard/metrics/SUMMARY.md ]; then
            SUMMARY=$(cat dashboard/metrics/SUMMARY.md)
            gh issue create \
              --repo ${{ github.repository }} \
              --title "Weekly Adoption Metrics — $(date +%Y-%m-%d)" \
              --body "$SUMMARY" \
              --label "metrics"
          fi

      - name: File degradation alerts
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALERTS_FILE="dashboard/metrics/alerts.json"
          if [ -f "$ALERTS_FILE" ] && [ "$(cat "$ALERTS_FILE")" != "[]" ]; then
            ALERT_COUNT=$(python3 -c "import json; print(len(json.load(open('$ALERTS_FILE'))))")
            ALERT_BODY=$(python3 -c "
          import json
          alerts = json.load(open('$ALERTS_FILE'))
          lines = ['# Degradation Alerts\n']
          for a in alerts:
              icon = '(warning)' if a['severity'] == 'warning' else '(info)'
              lines.append(f\"- {icon} **{a['type']}**: {a['message']}\")
          print('\n'.join(lines))
          ")
            gh issue create \
              --repo ${{ github.repository }} \
              --title "Metrics Degradation Alert (${ALERT_COUNT}) -- $(date +%Y-%m-%d)" \
              --body "$ALERT_BODY" \
              --label "metrics,degradation"
          fi

