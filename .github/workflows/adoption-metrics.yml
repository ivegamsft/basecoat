name: "BaseCoat - Adoption Metrics"
# [Internal-only] Memory workflow - BaseCoat operational use

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch: {}
  workflow_run:
    # Must match docs.yml's exact `name:` ("BaseCoat - Deploy Docs"), not the
    # bare "Deploy Docs" -- GitHub Actions' workflow_run.workflows[] filter is
    # an exact match against the workflow's display name, so the mismatched
    # name previously here made this trigger permanently dead (adoption
    # metrics would never fire off pages deployment completion, only on the
    # weekly cron/manual dispatch paths).
    workflows: ["BaseCoat - Deploy Docs"]
    types: [completed]

permissions:
  contents: write
  pull-requests: read
  actions: read
  pages: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Restore metrics history from gh-pages
        run: |
          set -e
          mkdir -p dashboard/metrics
          # The collector reads/appends dashboard/metrics/history.json and caps
          # it at 52 entries. Without restoring the prior gh-pages history first,
          # every run starts from an empty file and the later "Deploy to
          # gh-pages" step overwrites the branch with a 1-element history,
          # silently discarding the documented 52-week retention.
          #
          # Shell redirection creates/truncates the destination file before the
          # command on its right-hand side runs, so writing `git show ... >
          # dashboard/metrics/history.json` directly would leave an empty file
          # in place whenever gh-pages exists but has no history.json yet (e.g.
          # the very first run after a docs-only Pages deployment) -- and the
          # collector's `json.load` raises on that empty file. Write to a temp
          # file first and only move it into place once `git show` succeeds.
          if git fetch origin gh-pages 2>/dev/null; then
            if git show origin/gh-pages:dashboard/metrics/history.json > dashboard/metrics/history.json.tmp 2>/dev/null; then
              mv dashboard/metrics/history.json.tmp dashboard/metrics/history.json
            else
              rm -f dashboard/metrics/history.json.tmp
            fi
          fi

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_METRICS_TOKEN: ${{ secrets.COPILOT_METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          DASHBOARD_ORG: ${{ secrets.DASHBOARD_ORG || github.repository_owner }}
          DASHBOARD_REPOS: ${{ secrets.DASHBOARD_REPOS || format('["{0}"]', github.repository) }}
          OUTPUT_DIR: dashboard/metrics
          # App Insights telemetry (onboarding telemetry pack — see docs/operations/onboarding-telemetry-readiness.md)
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: python scripts/metrics/collect-metrics.py

      - name: Emit telemetry readiness check
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          COPILOT_METRICS_TOKEN: ${{ secrets.COPILOT_METRICS_TOKEN }}
          DASHBOARD_REPOS: ${{ secrets.DASHBOARD_REPOS || format('["{0}"]', github.repository) }}
        run: python scripts/metrics/emit-telemetry-readiness.py

      - name: Deploy to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep this run's consumer and data together across the branch switch.
          DEPLOY_INPUT="$(mktemp -d)"
          trap 'rm -rf "$DEPLOY_INPUT"' EXIT
          mkdir -p "$DEPLOY_INPUT/metrics"
          cp -r dashboard/metrics/. "$DEPLOY_INPUT/metrics/"
          if [ -f docs/dashboard/index.html ]; then
            cp docs/dashboard/index.html "$DEPLOY_INPUT/index.html"
          else
            echo "::notice::No source dashboard HTML; publishing metrics only."
          fi
          rm -rf dashboard/metrics

          # Create or switch to gh-pages branch
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null
          fi

          # Branch-backed Pages also needs the current source consumer.
          mkdir -p dashboard/metrics
          cp -r "$DEPLOY_INPUT/metrics/." dashboard/metrics/
          git add -- dashboard/metrics
          if [ -f "$DEPLOY_INPUT/index.html" ]; then
            cp "$DEPLOY_INPUT/index.html" dashboard/index.html
            git add -- dashboard/index.html
          fi

          git diff --cached --quiet || git commit -m "chore: update adoption metrics [skip ci]"
          git push origin gh-pages

      - name: Post weekly summary
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f dashboard/metrics/SUMMARY.md ]; then
            SUMMARY=$(cat dashboard/metrics/SUMMARY.md)
            gh issue create \
              --repo ${{ github.repository }} \
              --title "Weekly Adoption Metrics — $(date +%Y-%m-%d)" \
              --body "$SUMMARY" \
              --label "metrics"
          fi

      - name: File degradation alerts
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALERTS_FILE="dashboard/metrics/alerts.json"
          if [ -f "$ALERTS_FILE" ] && [ "$(cat "$ALERTS_FILE")" != "[]" ]; then
            ALERT_COUNT=$(python3 -c "import json; print(len(json.load(open('$ALERTS_FILE'))))")
            ALERT_BODY=$(python3 -c "
          import json
          alerts = json.load(open('$ALERTS_FILE'))
          lines = ['# Degradation Alerts\n']
          for a in alerts:
              icon = '(warning)' if a['severity'] == 'warning' else '(info)'
              lines.append(f\"- {icon} **{a['type']}**: {a['message']}\")
          print('\n'.join(lines))
          ")
            gh issue create \
              --repo ${{ github.repository }} \
              --title "Metrics Degradation Alert (${ALERT_COUNT}) -- $(date +%Y-%m-%d)" \
              --body "$ALERT_BODY" \
              --label "metrics,degradation"
          fi
