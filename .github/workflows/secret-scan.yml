# =============================================================================
# secret-scan.yml — Secret Scanning CI Workflow
# Part of: basecoat Enterprise Governance Framework (Issue #43)
#
# ⚠️  WARN-ONLY POLICY — Findings NEVER block a merge; scanner errors fail the job.
#
# RATIONALE:
#   Enterprise policy (branch protection, required checks) may conflict with
#   blocking CI steps that flag secrets. We therefore treat CI scanning as a
#   LOGGING and ANNOTATION layer only. The real enforcement gate is the local
#   pre-commit hook (scripts/install-hooks.sh). See docs/security/SECRET_SCANNING.md.
#
# WHAT THIS DOES:
#   - Runs gitleaks on every PR and push.
#   - On PR: annotates the PR with a summary comment (findings or all-clear).
#   - Exits 0 on a clean scan or findings; fails only when gitleaks itself errors.
#   - Uploads a SARIF report as a workflow artifact for audit trail.
#
# DOES NOT REQUIRE:
#   - GitHub Advanced Security (GHAS) / code-scanning licence.
#   - Any secrets or tokens beyond the default GITHUB_TOKEN.
# =============================================================================

name: "BaseCoat - Secret Scanning (warn only)"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # needed to post PR comments

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks — detect secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout — full history so gitleaks can diff against the base branch
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Install gitleaks (pinned version for reproducibility)
      # Update GITLEAKS_VERSION periodically.
      # -----------------------------------------------------------------------
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          FILENAME="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${FILENAME}" \
            -o "${FILENAME}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -o checksums.txt
          grep "$FILENAME" checksums.txt | sha256sum --check
          tar -xzf "${FILENAME}" -C /usr/local/bin gitleaks
          rm -f "${FILENAME}" checksums.txt
          gitleaks version

      # -----------------------------------------------------------------------
      # 3. Run gitleaks
      #    - On PRs: scan only the commits in this PR (base..HEAD)
      #    - On push to main: scan the pushed range
      #    - On workflow_dispatch: scan recent 50 commits
      #    Uses .gitleaks.toml if present, else gitleaks default rules. Exit 1
      #    with a findings report = findings (warn only); any other failure errors.
      # -----------------------------------------------------------------------
      - name: Run gitleaks scan
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          REPORT_FILE="gitleaks-report.json"; rm -f "${REPORT_FILE}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            LOG_OPTS="origin/${BASE_REF}..HEAD"
            git fetch origin "${BASE_REF}" --depth=1
          elif [[ "${EVENT_NAME}" == "push" && \
                  "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] && \
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            LOG_OPTS="${BEFORE_SHA}..${HEAD_SHA}"
          elif git rev-parse --verify --quiet "HEAD~50" >/dev/null; then
            LOG_OPTS="HEAD~50..HEAD"
          else
            LOG_OPTS="HEAD"
          fi

          echo "Scanning range: ${LOG_OPTS}"

          CONFIG_ARGS=() CONFIG_LABEL="gitleaks built-in defaults"
          if [[ -f .gitleaks.toml ]]; then CONFIG_ARGS=(--config .gitleaks.toml) CONFIG_LABEL=".gitleaks.toml"; fi
          echo "Config: ${CONFIG_LABEL}"

          set +e
          gitleaks detect \
            "${CONFIG_ARGS[@]}" \
            --source . \
            --log-opts "${LOG_OPTS}" \
            --report-format json \
            --report-path "${REPORT_FILE}" \
            --no-banner \
            --redact \
            --exit-code 1
          LEAK_EXIT=$?
          set -e

          FINDING_COUNT=0 SCAN_STATUS="error"
          if [[ $LEAK_EXIT -eq 0 ]]; then
            SCAN_STATUS="clean"
          elif [[ $LEAK_EXIT -eq 1 ]]; then
            # gitleaks also exits 1 on fatal errors, so require a findings report.
            COUNT=$(python3 -c 'import json, sys; d = json.load(open(sys.argv[1], encoding="utf-8")); print(len(d) if isinstance(d, list) else 0)' "${REPORT_FILE}" 2>/dev/null || echo 0)
            if [[ "${COUNT}" =~ ^[1-9][0-9]*$ ]]; then SCAN_STATUS="findings" FINDING_COUNT="${COUNT}"; fi
          fi

          printf 'scan_status=%s\nfinding_count=%s\nconfig=%s\n' "${SCAN_STATUS}" "${FINDING_COUNT}" "${CONFIG_LABEL}" >> "$GITHUB_OUTPUT"

          case "${SCAN_STATUS}" in
            clean)    echo "✅  No secrets detected by gitleaks." ;;
            findings) echo "⚠️  Gitleaks found ${FINDING_COUNT} potential secret(s). See report." ;;
            *) echo "::error::gitleaks exited ${LEAK_EXIT} without a usable findings report; scan results are unavailable or incomplete."; exit 1 ;;
          esac

      # -----------------------------------------------------------------------
      # 4. Parse report and build summary
      # -----------------------------------------------------------------------
      - name: Build scan summary
        if: always()
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.scan_status }}
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
          SCAN_CONFIG: ${{ steps.scan.outputs.config }}
        run: |
          {
            echo "## 🔐 Secret Scanning Report"
            echo ""
            if [[ "$SCAN_STATUS" == "clean" ]]; then
              echo "✅ **No secrets detected** — gitleaks scan passed."
            elif [[ "$SCAN_STATUS" != "findings" ]]; then
              echo "**Scan failed** — results are unavailable or incomplete; see the **Run gitleaks scan** step log."
            else
              echo "⚠️ **Potential secrets detected** — ${FINDING_COUNT} finding(s)."
              echo ""
              echo "> **This check is WARN-ONLY and does NOT block merging.**"
              echo "> Findings must be reviewed and remediated before the code is"
              echo "> considered production-safe."
              echo ""
              echo "### What to do"
              echo "1. Download the \`gitleaks-report.json\` artifact from this run."
              echo "2. Review each finding — it may be a false positive."
              echo "3. **If it is a real secret**: follow the runbook in"
              echo "   \`docs/security/SECRET_SCANNING.md\` → *I accidentally committed a secret*."
              echo "4. **If it is a false positive**: add an allowlist entry to \`.gitleaks.toml\`"
              echo "   and push an update."
            fi
            echo ""
            echo "---"
            echo "_Scan powered by [gitleaks](https://github.com/gitleaks/gitleaks)."
            echo "Config: \`${SCAN_CONFIG:-unknown}\`. Workflow: \`secret-scan.yml\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 5. Annotate the PR with a comment (PR events only)
      # -----------------------------------------------------------------------
      - name: Post PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.scan_status }}
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
          SCAN_CONFIG: ${{ steps.scan.outputs.config }}
        with:
          script: |
            const status = process.env.SCAN_STATUS;
            const count = process.env.FINDING_COUNT;
            const config = process.env.SCAN_CONFIG || 'unknown';

            let body;
            if (status === 'clean') {
              body = [
                '## 🔐 Secret Scanning — All Clear',
                '',
                '✅ **No secrets detected** by gitleaks on this PR.',
                '',
                `_Findings are warn-only and do not block merging; scanner errors fail the check. Config: \`${config}\`._`,
              ].join('\n');
            } else if (status !== 'findings') {
              body = ['## Secret Scanning — Scan Failed', '', '**Gitleaks did not complete**; results are unavailable or incomplete. See the **Run gitleaks scan** step log.', '', `_Config: \`${config}\`._`].join('\n');
            } else {
              body = [
                '## ⚠️ Secret Scanning — Findings Detected',
                '',
                `Gitleaks found **${count} potential secret(s)** in this PR.`,
                '',
                '> **This check is WARN-ONLY and does NOT block merging.**',
                '> Review findings before merging to production.',
                '',
                '### Next steps',
                '1. Download `gitleaks-report.json` from the [workflow artifacts](' +
                  `${context.payload.pull_request.html_url}/checks).`,
                '2. If **real secret**: see `docs/security/SECRET_SCANNING.md` → runbook.',
                '3. If **false positive**: add an allowlist entry to `.gitleaks.toml`.',
                '',
                '---',
                `_Config: \`${config}\` · Workflow: \`secret-scan.yml\`_`,
              ].join('\n');
            }

            // Find existing bot comment to update rather than spam
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Secret Scanning')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # -----------------------------------------------------------------------
      # 6. Upload SARIF / JSON report as artifact (always, for audit trail)
      # -----------------------------------------------------------------------
      - name: Upload scan report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 90
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # 7. Findings never block merges (scanner errors fail the scan step)
      # -----------------------------------------------------------------------
      - name: Acknowledge findings (warn only — never block)
        if: always()
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.scan_status }}
          FINDING_COUNT: ${{ steps.scan.outputs.finding_count }}
        run: |
          if [[ "$SCAN_STATUS" == "findings" ]]; then
            echo "::warning::Gitleaks detected ${FINDING_COUNT} potential secret(s)."
            echo "::warning::This check is WARN-ONLY. See PR comment and workflow summary for details."
          fi
          # Unconditionally exit 0 — enterprise policy proof
          exit 0

