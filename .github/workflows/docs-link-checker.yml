name: "BaseCoat - Docs Link Checker"

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      fail_on_broken:
        description: "Fail the workflow when broken links are found"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Nightly external docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      broken_count: ${{ steps.scan.outputs.broken_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Scan docs for broken external links
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          url_pattern = re.compile(r'https?://[^\s<>()"''`]+')
          archive_root = Path('docs/archive')
          docs_files = sorted(
              md for md in Path('docs').rglob('*.md')
              if archive_root not in md.parents
          )

          discovered = {}
          for md in docs_files:
              text = md.read_text(encoding='utf-8', errors='ignore')
              # Skip URLs inside fenced code blocks (example commands, config snippets, etc.)
              text = re.sub(r'```.*?```', '', text, flags=re.DOTALL)
              for raw_url in url_pattern.findall(text):
                  url = raw_url.rstrip('.,);]')
                  if 'localhost' in url or '127.0.0.1' in url:
                      continue
                  # Skip self-references to this private repo (always 404 to unauthenticated checker)
                  if 'github.com/ivegamsft/basecoat' in url:
                      continue
                  # Skip placeholder/non-existent API domains
                  if 'api.basecoat.dev' in url:
                      continue
                  discovered.setdefault(url, set()).add(str(md))

          def check(url: str):
              req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': 'basecoat-link-checker'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return int(getattr(resp, 'status', 200)), ''
              except urllib.error.HTTPError as err:
                  return int(getattr(err, 'code', 0) or 0), str(err)
              except Exception as err:
                  try:
                      req = urllib.request.Request(url, method='GET', headers={'User-Agent': 'basecoat-link-checker'})
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          return int(getattr(resp, 'status', 200)), ''
                  except Exception as inner:
                      return 0, str(inner)

          rows = []
          for url, sources in sorted(discovered.items()):
              status, error = check(url)
              rows.append({
                  'url': url,
                  'status': status,
                  'ok': 200 <= status < 400,
                  'error': error,
                  'sources': sorted(sources),
              })

          broken = [row for row in rows if not row['ok']]
          report = [
              '# Docs Link Checker Report',
              '',
              f'- Generated: {datetime.now(timezone.utc).isoformat()}',
              f'- External links checked: {len(rows)}',
              f'- Broken links: {len(broken)}',
              '',
              '| URL | Status | Source file(s) |',
              '|---|---:|---|',
          ]
          for row in broken[:500]:
              sources = '<br/>'.join(row['sources'])
              status = row['status'] if row['status'] else 'ERR'
              report.append(f"| {row['url']} | {status} | {sources} |")
          if not broken:
              report.append('| *(none)* | 200 | docs/** |')

          Path('docs-link-check-report.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          Path('docs-link-check-report.json').write_text(json.dumps({
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'checked': len(rows),
              'broken': len(broken),
              'results': rows,
          }, indent=2), encoding='utf-8')
          print(f"broken_count={len(broken)}")
          PY
          BROKEN="$(python - <<'PY'
          import json
          with open('docs-link-check-report.json', 'r', encoding='utf-8') as fh:
              data = json.load(fh)
          print(data.get('broken', 0))
          PY
          )"
          echo "broken_count=$BROKEN" >> "$GITHUB_OUTPUT"
          cat docs-link-check-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs link check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-link-check-report
          path: |
            docs-link-check-report.md
            docs-link-check-report.json
          retention-days: 14

      - name: Open or update broken-link issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BROKEN_COUNT: ${{ steps.scan.outputs.broken_count || '0' }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Docs link checker report';
            const brokenCount = Number(process.env.BROKEN_COUNT || '0');
            const body = fs.readFileSync('docs-link-check-report.md', 'utf8') + '\n\n---\nGenerated by `.github/workflows/docs-link-checker.yml`.';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);

            if (brokenCount > 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['documentation', 'automated-report']
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'No broken external docs links were detected in the latest run. Closing this tracking issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

      - name: Fail when broken links found (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.fail_on_broken == true && steps.scan.outputs.broken_count != '0'
        shell: bash
        run: |
          echo "::error::Broken docs links detected: ${{ steps.scan.outputs.broken_count }}"
          exit 1
