name: "BaseCoat - Approve Issue for Copilot Agent"

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: cloud-agent-execution
  cancel-in-progress: false

env:
  MAX_CONCURRENT_AGENTS: 4

jobs:
  route-pr-approve:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted approval contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Route /approve comment on PR to linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const approval = require(`${process.env.GITHUB_WORKSPACE}/.github/base-coat/scripts/approval-contract.cjs`);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.issue.number;
            const directive = await approval.qualifiedDirective({
              github, owner, repo, commentId: context.payload.comment.id, issueNumber: prNumber
            });
            if (!directive) {
              core.setFailed('Approval requires a current qualified exact /approve directive.');
              return;
            }
            const marker = `<!-- issue-approve-forward:v1 pr:${prNumber} comment:${context.payload.comment.id} -->`;
            const originalActor = directive.user.login;
            const prComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existingMarkerComment = prComments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker)
            );
            if (existingMarkerComment) {
              core.info(`Skipping duplicate processing for marker ${marker}.`);
              return;
            }
            const publishPrStatus = async lines => {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [marker, ...lines].join('\n')
              });
            };

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const text = `${pr.title || ''}\n${pr.body || ''}`;
            const issueRefs = approval.closingIssueNumbers(text);

            if (issueRefs.size === 0) {
              await publishPrStatus([
                'WARNING: `/approve` was posted on this pull request.',
                '',
                'Issue approval automation runs on **issues**, not pull requests.',
                'Add a closing keyword in this PR body (for example `Closes #123`) and comment `/approve` on that issue.',
              ]);
              return;
            }

            const approveIssue = async issueNumber => {
              const { issue, missing } = await approval.validateIssue({ github, owner, repo, issueNumber });

              if (missing.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['needs-triage', 'needs-info']
                  });
                } catch (e) {
                  core.warning(`Could not add waiting labels: ${e.message}`);
                }

                const checklist = missing.map(m => `- [ ] ${m}`).join('\n');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: [
                    'BLOCKED: Approval requires complete metadata.',
                    '',
                    'This issue cannot be approved until the following required metadata is complete:',
                    '',
                    checklist,
                    '',
                    'Once the missing information is added, comment `/approve` again to retry.',
                  ].join('\n')
                });
                return { issueNumber, approved: false };
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: approval.forwardReceipt(prNumber, directive, issueNumber)
              });

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: 'triage'
                });
              } catch (e) {
                // Label might not exist
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['approved', 'copilot-agent']
              });

              let copilotActor;
              let assigned = false;
              try {
                const { repository } = await github.graphql(
                  `
                  query($owner: String!, $repo: String!) {
                    repository(owner: $owner, name: $repo) {
                      suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                        nodes {
                          login
                          ... on Bot { id }
                        }
                      }
                    }
                  }
                  `,
                  {
                    owner,
                    repo,
                  }
                );

                copilotActor = repository?.suggestedActors?.nodes?.find(actor =>
                  actor?.login === 'copilot-swe-agent'
                );
              } catch (e) {
                core.warning(`Could not query Copilot suggestedActors: ${e.message}`);
              }

              if (copilotActor) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                    owner,
                    repo,
                    issue_number: issue.number,
                    assignees: ['copilot-swe-agent[bot]'],
                    agent_assignment: {
                      target_repo: `${owner}/${repo}`,
                      base_branch: 'main',
                      custom_instructions: "Fix the issue using the repository's existing conventions.",
                      custom_agent: '',
                      model: '',
                    },
                  });
                  const { data: updated } = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: issue.number
                  });
                  assigned = updated.assignees.some(a => a.login === 'copilot-swe-agent[bot]' || a.login === 'copilot-swe-agent');
                } catch (e) {
                  core.warning(`Could not assign to Copilot cloud agent: ${e.message}`);
                }
              }

              const body = assigned
                ? [
                    'Approved. Issue assigned to the Copilot coding agent.',
                    '',
                    'Copilot will analyze this issue and open a draft PR with the implementation.',
                    'Review the PR when ready and merge after CI passes.',
                  ].join('\n')
                : [
                    'Approved. Labels `approved` + `copilot-agent` applied.',
                    '',
                    'Copilot assignment is not available in this repository right now.',
                    'Enable the Copilot cloud agent in organization settings and assign the issue to @Copilot when available.',
                  ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });

              return { issueNumber, approved: true, assigned };
            };

            const approvals = [];
            for (const issueNumber of issueRefs) {
              approvals.push(await approveIssue(issueNumber));
            }

            const approvedIssues = approvals.filter(result => result.approved).map(result => `#${result.issueNumber}`);
            for (const issueNumber of issueRefs) {
              if (!approvedIssues.includes(`#${issueNumber}`)) continue;
            }

            await publishPrStatus([
              `Processed /approve from @${originalActor} for linked issue(s): ${Array.from(issueRefs).map(n => `#${n}`).join(', ')}.`,
              'Approval logic ran directly against the issue(s).',
            ]);

  approve:
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted approval contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify commenter has write access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: check-access
        with:
          script: |
            const approval = require(`${process.env.GITHUB_WORKSPACE}/.github/base-coat/scripts/approval-contract.cjs`);
            const directive = await approval.qualifiedDirective({
              github, ...context.repo, commentId: context.payload.comment.id,
              issueNumber: context.payload.issue.number
            });
            const allowed = Boolean(directive);
            if (!allowed) {
              core.setFailed('Approval requires a current qualified exact /approve directive.');
            }
            return allowed;

      - name: Validate metadata contract
        if: steps.check-access.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: validate-metadata
        with:
          script: |
            const approval = require(`${process.env.GITHUB_WORKSPACE}/.github/base-coat/scripts/approval-contract.cjs`);
            const { issue, missing } = await approval.validateIssue({
              github, ...context.repo, issueNumber: context.payload.issue.number
            });

            if (missing.length > 0) {
              // Add a human-waiting label to surface for cleanup
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['needs-triage', 'needs-info']
                });
              } catch (e) {
                core.warning(`Could not add waiting labels: ${e.message}`);
              }

              const checklist = missing.map(m => `- [ ] ${m}`).join('\n');
              const body = [
                'BLOCKED: Approval requires complete metadata.',
                '',
                'This issue cannot be approved until the following required metadata is complete:',
                '',
                checklist,
                '',
                'Once the missing information is added, comment `/approve` again to retry.',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });

              core.setFailed(`Metadata contract not satisfied: ${missing.length} requirement(s) missing.`);
              return false;
            }

            return true;

      - name: Assign to Copilot and update labels
        if: steps.check-access.outputs.result == 'true' && steps.validate-metadata.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;

            // Remove triage label, add approved
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'triage'
              });
            } catch (e) {
              // Label might not exist
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['approved', 'copilot-agent']
            });

            // Pre-flight: check whether Copilot cloud agent is available for this repo.
            // suggestedActors returns copilot-swe-agent when the agent can be assigned.
            let copilotActor;
            let assigned = false;
            let preflightErrorMessage = null;
            let assignmentErrorMessage = null;
            try {
              const { repository } = await github.graphql(
                `
                query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                      nodes {
                        login
                        ... on Bot { id }
                      }
                    }
                  }
                }
                `,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );

              copilotActor = repository?.suggestedActors?.nodes?.find(actor =>
                actor?.login === 'copilot-swe-agent'
              );
            } catch (e) {
              preflightErrorMessage = e.message;
              core.warning(`Could not query Copilot suggestedActors: ${e.message}`);
            }

            // Assign to Copilot cloud agent when the actor is available.
            if (copilotActor) {
              try {
                await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: ['copilot-swe-agent[bot]'],
                  agent_assignment: {
                    target_repo: `${context.repo.owner}/${context.repo.repo}`,
                    base_branch: 'main',
                    custom_instructions: `Implement the approved specification in issue #${issue.number} using the repository's existing conventions. Open a ready-for-review implementation PR (not a draft) with \`Closes #${issue.number}\` in its body. Required CI and the merge executor own merge eligibility; do not request a human review for XS through XL changes.`,
                    custom_agent: '',
                    model: '',
                  },
                });
                const { data: updated } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number
                });
                assigned = updated.assignees.some(a => a.login === 'copilot-swe-agent[bot]' || a.login === 'copilot-swe-agent');
                if (!assigned) {
                  assignmentErrorMessage = 'GitHub did not persist the Copilot assignee after the assignment request.';
                }
              } catch (e) {
                assignmentErrorMessage = e.message;
                core.warning(`Could not assign to Copilot cloud agent: ${e.message}`);
              }
            }

            // Org-level settings URL for enabling Copilot cloud agent (Business/Enterprise default: off)
            const orgSettingsUrl = `https://github.com/organizations/${context.repo.owner}/settings/copilot`;
            const enableDocsUrl = 'https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/add-copilot-cloud-agent';

            // Acknowledge with honest status
            const body = assigned
              ? [
                  'Approved. Issue assigned to the Copilot coding agent.',
                  '',
                  'Copilot will implement the supplied specification and open a ready implementation PR.',
                  'Required CI and the merge executor will progress an eligible XS-XL PR without a review handoff.',
                ].join('\n')
              : preflightErrorMessage
              ? [
                  'Approved. Labels `approved` + `copilot-agent` applied.',
                  '',
                  `WARNING: Agent pre-flight failed. ${preflightErrorMessage}`,
                  '',
                  'Retry the workflow after confirming GitHub is healthy and the workflow token still has the required access.',
                ].join('\n')
              : assignmentErrorMessage
              ? [
                  'Approved. Labels `approved` + `copilot-agent` applied.',
                  '',
                  `WARNING: Agent assignment failed after pre-flight succeeded. ${assignmentErrorMessage}`,
                  '',
                  'Retry the workflow after confirming GitHub is healthy, or assign this issue to **@Copilot** manually once the service is available.',
                ].join('\n')
              : [
                  'Approved. Labels `approved` + `copilot-agent` applied.',
                  '',
                  'WARNING: Agent assignment failed. `@Copilot` is not a valid assignee for this repository.',
                  '',
                  'The **Copilot cloud agent** (Copilot Business/Enterprise) is disabled by default and must',
                  `be enabled by an org admin at [Organization Settings > Copilot](${orgSettingsUrl}).`,
                  `See the [enablement guide](${enableDocsUrl}) for step-by-step instructions.`,
                  '',
                  'Once enabled, assign this issue to **@Copilot** in the sidebar to trigger the agent,',
                  'or implement the changes manually following the triage plan above.',
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });

            if (preflightErrorMessage) {
              core.setFailed(`Copilot suggestedActors pre-flight failed: ${preflightErrorMessage}`);
            }

            if (assignmentErrorMessage) {
              core.setFailed(`Copilot cloud agent assignment failed: ${assignmentErrorMessage}`);
            }

  reevaluate-linked-prs:
    name: Reevaluate PRs linked to approved issues
    needs:
      - route-pr-approve
      - approve
    if: |
      always() &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted approval contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Dispatch merge eligibility after approval labels settle
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const approval = require(`${process.env.GITHUB_WORKSPACE}/.github/base-coat/scripts/approval-contract.cjs`);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const directive = await approval.qualifiedDirective({
              github, owner, repo, commentId: context.payload.comment.id,
              issueNumber: context.payload.issue.number
            });
            if (!directive) return;
            const issueNumbers = new Set();
            const collectClosingIssues = text => {
              for (const issueNumber of approval.closingIssueNumbers(text)) issueNumbers.add(issueNumber);
            };

            if (context.payload.issue?.pull_request) {
              const { data: sourcePr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.payload.issue.number
              });
              collectClosingIssues(`${sourcePr.title || ''}\n${sourcePr.body || ''}`);
            } else if (context.payload.issue?.number) {
              issueNumbers.add(Number(context.payload.issue.number));
            }

            const approvedIssueNumbers = new Set();
            for (const issueNumber of issueNumbers) {
              const contract = await approval.validateIssue({ github, owner, repo, issueNumber });
              const evidence = await approval.findApproval({
                github, owner, repo, issueNumber, comments: contract.comments
              });
              if (!contract.missing.length && evidence) {
                approvedIssueNumbers.add(issueNumber);
              }
            }
            if (approvedIssueNumbers.size === 0) {
              core.info('No finalized approved issue evidence requires PR reevaluation.');
              return;
            }

            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100
            });
            const executorWorkflow = workflows.find(workflow =>
              String(workflow.path || '').endsWith('pr-auto-merge-executor.yml')
            );
            if (!executorWorkflow) {
              core.info(
                'PR auto-merge executor is not installed; skipping optional linked PR reevaluation.'
              );
              return;
            }

            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const routedPrNumbers = new Set();
            for (const pullRequest of openPullRequests) {
              const text = `${pullRequest.title || ''}\n${pullRequest.body || ''}`;
              const closingIssues = approval.closingIssueNumbers(text);
              const closesApprovedIssue = Array.from(approvedIssueNumbers).some(
                issueNumber => closingIssues.has(issueNumber)
              );
              if (!closesApprovedIssue || routedPrNumbers.has(pullRequest.number)) continue;
              routedPrNumbers.add(pullRequest.number);
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: pullRequest.head.sha,
                state: 'pending',
                context: 'BaseCoat merge eligibility',
                description: 'Linked issue approval was finalized.',
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
              });
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: executorWorkflow.id,
                ref: context.payload.repository?.default_branch || 'main',
                inputs: { pr_number: String(pullRequest.number) }
              });
            }
