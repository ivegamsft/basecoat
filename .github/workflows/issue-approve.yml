name: "BaseCoat - Approve Issue for Copilot Agent"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: cloud-agent-execution
  cancel-in-progress: false

env:
  MAX_CONCURRENT_AGENTS: 4

jobs:
  approve:
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: check-access
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login
            });
            const allowed = ['admin', 'write'].includes(perm.permission);
            if (!allowed) {
              core.setFailed(`User ${context.payload.comment.user.login} does not have write access`);
            }
            return allowed;

      - name: Validate metadata contract
        if: steps.check-access.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        id: validate-metadata
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            const TYPE_LABELS = ['bug', 'enhancement', 'documentation', 'chore', 'security', 'question'];
            const PRIORITY_LABELS = ['priority:critical', 'priority:high', 'priority:medium', 'priority:low'];
            const BLOCKING_LABELS = ['duplicate', 'invalid', 'wontfix'];
            const DEPENDENCY_REGEX = /(?:^|\n)\s*(Blocked by|Depends on)\s+(?:#(\d+)|https?:\/\/github\.com\/[^/\s]+\/[^/\s]+\/(?:issues|pull)\/(\d+))/gim;

            const missing = [];

            const hasType = TYPE_LABELS.some(l => labels.includes(l));
            if (!hasType) missing.push('**Type label** — add one of: `bug`, `enhancement`, `documentation`, `chore`, `security`, `question`');

            const hasPriority = PRIORITY_LABELS.some(l => labels.includes(l));
            if (!hasPriority) missing.push('**Priority label** — add one of: `priority:critical`, `priority:high`, `priority:medium`, `priority:low`');

            const hasBlocker = BLOCKING_LABELS.some(l => labels.includes(l));
            if (hasBlocker) {
              const blocker = BLOCKING_LABELS.find(l => labels.includes(l));
              missing.push(`**Blocking label present** — remove \`${blocker}\` before approving, or close the issue instead`);
            }

            const dependencyRefs = new Set();
            const collectRefs = text => {
              if (!text || typeof text !== 'string') {
                return;
              }
              DEPENDENCY_REGEX.lastIndex = 0;
              let match;
              while ((match = DEPENDENCY_REGEX.exec(text)) !== null) {
                const ref = Number(match[2] || match[3]);
                if (Number.isInteger(ref) && ref > 0) {
                  dependencyRefs.add(ref);
                }
              }
            };

            collectRefs(issue.body || '');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            for (const comment of comments) {
              collectRefs(comment.body || '');
            }

            const unresolvedDependencies = [];
            for (const ref of dependencyRefs) {
              const { data: linked } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ref
              });
              let resolved = linked.state === 'closed';
              let status = linked.state;
              if (linked.pull_request) {
                const { data: linkedPr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: ref
                });
                resolved = Boolean(linkedPr.merged);
                status = linkedPr.merged ? 'merged' : linkedPr.state;
              }
              if (!resolved) {
                unresolvedDependencies.push(`#${ref} (${status})`);
              }
            }

            if (unresolvedDependencies.length > 0) {
              missing.push(`**Unresolved dependencies** — resolve ${unresolvedDependencies.join(', ')} before approving`);
            }

            if (missing.length > 0) {
              // Add needs-triage to surface for cleanup
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['needs-triage']
                });
              } catch (e) {
                core.warning(`Could not add needs-triage label: ${e.message}`);
              }

              const checklist = missing.map(m => `- [ ] ${m}`).join('\n');
              const body = [
                '⛔ **Approval blocked — incomplete metadata**',
                '',
                'This issue cannot be approved until the following required metadata is complete:',
                '',
                checklist,
                '',
                'Once all required labels are present, comment `/approve` again to retry.',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });

              core.setFailed(`Metadata contract not satisfied: ${missing.length} requirement(s) missing.`);
              return false;
            }

            return true;

      - name: Assign to Copilot and update labels
        if: steps.check-access.outputs.result == 'true' && steps.validate-metadata.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;

            // Remove triage label, add approved
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'triage'
              });
            } catch (e) {
              // Label might not exist
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['approved', 'copilot-agent']
            });

            // Assign to Copilot coding agent (requires Copilot coding agent enabled for repo)
            let assigned = false;
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: ['Copilot']
              });
              // Verify assignment actually stuck
              const { data: updated } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              assigned = updated.assignees.some(a => a.login.toLowerCase() === 'copilot');
            } catch (e) {
              core.warning(`Could not assign to Copilot: ${e.message}`);
            }

            // Acknowledge with honest status
            const body = assigned
              ? [
                  '✅ **Approved** — Issue assigned to the Copilot coding agent.',
                  '',
                  'Copilot will analyze this issue and open a draft PR with the implementation.',
                  'Review the PR when ready and merge after CI passes.',
                ].join('\n')
              : [
                  '✅ **Approved** — Labels `approved` + `copilot-agent` applied.',
                  '',
                  '⚠️ **Agent assignment failed.** The Copilot coding agent could not be automatically',
                  'assigned (it may not be enabled for this repository).',
                  '',
                  'To trigger the agent manually, assign this issue to **@Copilot** in the sidebar,',
                  'or implement the changes manually following the triage plan above.',
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
