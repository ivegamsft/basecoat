name: "BaseCoat - Deploy Docs"

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/generate-token-context-inventory.py'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/generate-token-context-inventory.py'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.x'

      - name: Install MkDocs and dependencies
        run: |
          pip install \
            mkdocs-material \
            mkdocs-awesome-pages-plugin

      - name: Generate token context inventory
        run: python scripts/generate-token-context-inventory.py

      - name: Validate docs
        run: |
          python -m mkdocs build

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.x'

      - name: Install MkDocs and dependencies
        run: |
          pip install \
            mkdocs-material \
            mkdocs-awesome-pages-plugin

      - name: Generate token context inventory
        run: python scripts/generate-token-context-inventory.py

      - name: Configure site URLs for this repository
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          SITE_URL="https://${OWNER}.github.io/${REPO}/"
          REPO_URL="https://github.com/${{ github.repository }}"
          # Substitute any source-repo URLs with this fork's URLs
          sed -i "s|https://ibuyspy-shared.github.io/basecoat/|${SITE_URL}|gI" mkdocs.yml
          sed -i "s|https://github.com/IBuySpy-Shared/basecoat|${REPO_URL}|gI" mkdocs.yml
          sed -i "s|IBuySpy-Shared/basecoat|${{ github.repository }}|g" mkdocs.yml

      - name: Build docs
        run: mkdocs build

      - name: Update repository homepage URL
        run: |
          gh api --method PATCH "repos/${{ github.repository }}" \
            --field "homepage=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
