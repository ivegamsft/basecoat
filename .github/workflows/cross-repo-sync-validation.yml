name: "BaseCoat - Cross-Repo Sync Validation"

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      organization:
        description: "Organization to scan for BaseCoat consumers"
        type: string
        default: IBuySpy-Shared
      max_minor_drift:
        description: "Open issue when drift is >= this minor-version value"
        type: number
        default: 2
      repo_limit:
        description: "Maximum repositories to scan"
        type: number
        default: 100

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate consumer repo sync drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      high_drift_count: ${{ steps.scan.outputs.high_drift_count }}
    steps:
      - name: Scan consumer repositories for version drift
        id: scan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ORGANIZATION: ${{ inputs.organization || 'IBuySpy-Shared' }}
          MAX_MINOR_DRIFT: ${{ inputs.max_minor_drift || 2 }}
          REPO_LIMIT: ${{ inputs.repo_limit || 100 }}
        with:
          script: |
            const fs = require('fs');
            const org = process.env.ORGANIZATION || 'IBuySpy-Shared';
            const threshold = Number(process.env.MAX_MINOR_DRIFT || '2');
            const repoLimit = Number(process.env.REPO_LIMIT || '100');

            const latest = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const latestVersion = String(latest.data.tag_name || 'v0.0.0').replace(/^v/, '');

            const parse = version => version.split('.').map(n => Number.parseInt(n, 10) || 0);
            const drift = (current, latestV) => {
              const [cMaj, cMin] = parse(current);
              const [lMaj, lMin] = parse(latestV);
              if (lMaj > cMaj) return (lMaj - cMaj) * 100 + lMin;
              if (lMaj === cMaj) return Math.max(0, lMin - cMin);
              return 0;
            };

            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org,
              per_page: 100,
              type: 'all'
            });

            const candidates = repos
              .filter(repo => !repo.archived && repo.name !== context.repo.repo)
              .slice(0, repoLimit);
            const report = [];

            for (const repo of candidates) {
              try {
                const file = await github.rest.repos.getContent({
                  owner: org,
                  repo: repo.name,
                  path: '.github/base-coat/version.json'
                });
                if (Array.isArray(file.data) || !file.data.content) {
                  continue;
                }
                const decoded = Buffer.from(file.data.content, 'base64').toString('utf8');
                const json = JSON.parse(decoded);
                const currentVersion = String(json.version || '0.0.0');
                const minorDrift = drift(currentVersion, latestVersion);
                report.push({
                  repo: repo.name,
                  visibility: repo.visibility,
                  currentVersion,
                  latestVersion,
                  minorDrift
                });
              } catch (error) {
                if (error.status !== 404) {
                  core.warning(`Failed to inspect ${repo.name}: ${error.message}`);
                }
              }
            }

            report.sort((a, b) => b.minorDrift - a.minorDrift || a.repo.localeCompare(b.repo));
            const highDrift = report.filter(row => row.minorDrift >= threshold);
            const markdown = [
              '# Cross-Repo Sync Validation Report',
              '',
              `- Organization: ${org}`,
              `- Latest BaseCoat version: v${latestVersion}`,
              `- Drift threshold: ${threshold}`,
              `- Repositories scanned: ${candidates.length}`,
              `- Repositories with synced BaseCoat assets: ${report.length}`,
              `- Repositories above threshold: ${highDrift.length}`,
              '',
              '| Repository | Current | Latest | Minor Drift | Visibility |',
              '|---|---:|---:|---:|---|',
              ...report.map(row => `| \`${row.repo}\` | v${row.currentVersion} | v${row.latestVersion} | ${row.minorDrift} | ${row.visibility} |`)
            ].join('\n');

            fs.writeFileSync('cross-repo-sync-validation-report.md', markdown);
            fs.writeFileSync('cross-repo-sync-validation-report.json', JSON.stringify({
              generatedAt: new Date().toISOString(),
              organization: org,
              latestVersion,
              threshold,
              repositories: report
            }, null, 2));

            core.setOutput('high_drift_count', String(highDrift.length));
            core.summary.addRaw(markdown).write();

      - name: Upload cross-repo validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-repo-sync-validation-report
          path: |
            cross-repo-sync-validation-report.md
            cross-repo-sync-validation-report.json
          retention-days: 14

      - name: Open or update drift issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          HIGH_DRIFT_COUNT: ${{ steps.scan.outputs.high_drift_count || '0' }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Cross-repo BaseCoat sync drift report';
            const highDrift = Number(process.env.HIGH_DRIFT_COUNT || '0');
            const report = fs.readFileSync('cross-repo-sync-validation-report.md', 'utf8');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issue = existing.find(item => item.title === title);
            const body = `${report}\n\n---\nGenerated by \`.github/workflows/cross-repo-sync-validation.yml\`.`;

            if (highDrift > 0) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['maintenance', 'automated-report']
                });
              }
              return;
            }

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All scanned consumer repositories are within the configured drift threshold. Closing this tracking issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
