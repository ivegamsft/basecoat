name: BaseCoat - Governance Metadata Drift Enforcement

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/reference/governance-contract.md"
      - "docs/reference/label-taxonomy.md"
      - "docs/reference/governance.md"
      - "docs/operations/label-cleanup-plan.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/issue-triage.md"
      - "skills/issue-triage/**"
      - ".github/workflows/issue-approve.yml"
      - ".github/workflows/issue-metadata-hygiene.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enforce governance metadata invariants
        shell: pwsh
        run: |
          ./scripts/governance-metadata-drift.ps1 -Mode enforce -SummaryPath governance-metadata-drift-report.md

      - name: Upload governance drift report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-metadata-drift-report
          path: governance-metadata-drift-report.md
          if-no-files-found: error
          retention-days: 14
