name: BaseCoat - Governance Enforcement

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/reference/governance-contract.md"
      - "docs/reference/label-taxonomy.md"
      - "docs/reference/governance.md"
      - "docs/operations/label-cleanup-plan.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/issue-triage.md"
      - "skills/issue-triage/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate canonical governance references
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'priority:critical' docs/reference/governance-contract.md
          grep -q '^## Labels$' docs/reference/governance-contract.md
          grep -q '^## Versioning$' docs/reference/governance-contract.md
          grep -q 'P0-critical' docs/reference/governance-contract.md
          grep -q 'priority:critical' docs/reference/label-taxonomy.md
          grep -qi 'preserve delivery labels' docs/operations/label-cleanup-plan.md
          grep -q 'docs/reference/governance-contract.md' .github/ISSUE_TEMPLATE/issue.md
          grep -q 'docs/reference/governance-contract.md' .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'priority:critical' .github/workflows/issue-triage.md
          grep -q 'priority:critical' skills/issue-triage/references/quality-checklist.md

          echo "Governance enforcement passed."
