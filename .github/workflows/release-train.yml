name: "BaseCoat - Release Train Orchestration"

on:
  workflow_dispatch:
    inputs:
      wave_label:
        description: "Wave or sprint label to collect (e.g. wave:2026-W30 or sprint:2026-W30). Leave blank to collect all merged PRs."
        required: false
        type: string
        default: ""
      since_tag:
        description: "Collect PRs merged after this tag (leave blank to use the latest release tag)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run — report only, do not create release or issue"
        required: false
        type: boolean
        default: false

  schedule:
    # Every Monday at 06:00 UTC — weekly release-train summary
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate-release-train:
    name: Orchestrate release train
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Collect merged PRs and build release summary
        id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const waveLabel   = context.payload.inputs?.wave_label  ?? '';
            const sinceTagIn  = context.payload.inputs?.since_tag   ?? '';
            // Default to dry-run on scheduled trigger to avoid creating duplicate issues weekly
            const dryRun      = context.eventName !== 'workflow_dispatch' ||
                                 context.payload.inputs?.dry_run === 'true' ||
                                 context.payload.inputs?.dry_run === true;

            // Resolve baseline tag — use getLatestRelease to exclude drafts and pre-releases
            let baseTag = sinceTagIn;
            if (!baseTag) {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              }).catch(() => null);
              baseTag = latest?.data?.tag_name ?? null;
            }

            const baseSince = baseTag
              ? (await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${baseTag}`,
                }).then(r => r.data.object.url)
                  .then(url => github.request(url))
                  .then(r => r.data.tagger?.date ?? r.data.committer?.date ?? null)
                  .catch(() => null))
              : null;

            core.info(`Collecting PRs since tag: ${baseTag ?? '(beginning)'}, date: ${baseSince ?? 'any'}`);

            // When there is no baseline tag or date, limit to last 90 days to avoid paginating all history
            const fallbackSince = baseSince ?? new Date(Date.now() - 90 * 24 * 60 * 60 * 1000).toISOString();

            // Fetch all merged PRs via paginate to avoid missing PRs due to hard page cap
            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
            }, (response, done) => {
              // Stop paginating once we pass the time window
              const oldest = response.data[response.data.length - 1];
              if (oldest && oldest.updated_at <= fallbackSince) done();
              return response.data.filter(pr => {
                if (!pr.merged_at) return false;
                if (pr.merged_at <= fallbackSince) return false;
                return true;
              });
            });

            // Filter by wave label if specified
            const filtered = waveLabel
              ? allPRs.filter(pr => pr.labels.some(l => l.name === waveLabel))
              : allPRs;

            if (filtered.length === 0) {
              core.warning(`No merged PRs found${waveLabel ? ` with label '${waveLabel}'` : ''} since ${baseTag ?? 'beginning'}.`);
              core.setOutput('pr_count', '0');
              core.setOutput('summary', 'No PRs collected.');
              return;
            }

            // Categorize by conventional-commit prefix in PR title
            const categories = {
              feat: [],
              fix: [],
              perf: [],
              docs: [],
              chore: [],
              refactor: [],
              other: [],
            };

            for (const pr of filtered) {
              const title = pr.title.trim();
              const match = title.match(/^(feat|fix|perf|docs|chore|refactor|test|ci|build|style)(?:\([^)]*\))?!?:/);
              const cat = match ? match[1] : 'other';
              const key = categories[cat] ? cat : 'other';
              categories[key].push({
                number: pr.number,
                title,
                url: pr.html_url,
                mergedAt: pr.merged_at,
                author: pr.user?.login ?? 'unknown',
                labels: pr.labels.map(l => l.name),
              });
            }

            // Build changelog sections
            const lines = [];
            const catTitles = {
              feat: 'Features',
              fix: 'Bug Fixes',
              perf: 'Performance',
              docs: 'Documentation',
              chore: 'Chores / Maintenance',
              refactor: 'Refactors',
              other: 'Other Changes',
            };
            for (const [cat, items] of Object.entries(categories)) {
              if (!items.length) continue;
              lines.push(`### ${catTitles[cat]}`);
              for (const pr of items) {
                lines.push(`- ${pr.title} ([#${pr.number}](${pr.url}))`);
              }
              lines.push('');
            }

            const now = new Date().toISOString().split('T')[0];
            const waveStr = waveLabel || 'unreleased';
            const summary = [
              `## Release Train — ${waveStr} (${now})`,
              '',
              `**Base tag:** ${baseTag ?? '(beginning)'}`,
              `**PRs collected:** ${filtered.length}`,
              `**Dry run:** ${dryRun}`,
              '',
              ...lines,
            ].join('\n');

            core.setOutput('pr_count', String(filtered.length));
            core.setOutput('summary', summary);
            core.setOutput('wave', waveStr);
            core.setOutput('dry_run', String(dryRun));
            core.setOutput('base_tag', baseTag ?? '');

      - name: Create release candidate issue
        if: steps.collect.outputs.pr_count != '0' && steps.collect.outputs.dry_run != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          RELEASE_SUMMARY: ${{ steps.collect.outputs.summary }}
          RELEASE_WAVE: ${{ steps.collect.outputs.wave }}
        with:
          script: |
            const summary = process.env.RELEASE_SUMMARY;
            const wave    = process.env.RELEASE_WAVE;
            const now     = new Date().toISOString().split('T')[0];

            const body = [
              summary,
              '',
              '---',
              '',
              '## Gate Checklist',
              '',
              '- [ ] All included PRs pass CI',
              '- [ ] No open blocking issues',
              '- [ ] `docs/index.md` version and counts are current',
              '- [ ] `version.json` is ready for tag bump',
              '',
              '## Next Steps',
              '',
              '1. Review the PR list above and remove any PRs not ready for release.',
              '2. Check all gate items.',
              '3. Create a release tag (`vX.Y.Z`) to trigger the release workflow.',
            ].join('\n');

            // Create issue — labels are best-effort; missing labels should not abort the run
            let issue;
            try {
              const res = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Release train: ${wave} (${now})`,
                body,
              });
              issue = res.data;
            } catch (err) {
              core.error(`Failed to create release-candidate issue: ${err.message}`);
              throw err;
            }

            // Apply labels in a separate call so a missing label doesn't prevent issue creation
            const candidateLabels = ['release-candidate', wave].filter(Boolean);
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: candidateLabels,
              });
            } catch (labelErr) {
              core.warning(`Could not apply labels ${candidateLabels.join(', ')}: ${labelErr.message}`);
            }

            core.notice(`Release candidate issue created: ${issue.html_url}`);

      - name: Print dry-run summary
        if: steps.collect.outputs.dry_run == 'true' || steps.collect.outputs.pr_count == '0'
        env:
          RELEASE_SUMMARY: ${{ steps.collect.outputs.summary }}
        shell: bash
        run: |
          echo "=== DRY RUN / EMPTY RESULT ==="
          printf '%s\n' "$RELEASE_SUMMARY"
