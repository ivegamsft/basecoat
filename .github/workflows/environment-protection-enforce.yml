name: BaseCoat - Environment Protection Enforcement

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/environment-protection-enforce.yml"
      - ".github/workflows/governance-audit.yml"
      - ".github/workflows/extension-deploy.yml"
      - ".github/workflows/mcp-deploy.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/portal-deploy.yml"
      - ".github/environment-protection-production.json"
      - "docs/reference/environment-protection.md"
      - "docs/operations/environment-protection-enforcement.md"
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate environment policy docs
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            docs/reference/environment-protection.md \
            docs/operations/environment-protection-enforcement.md
          do
            [[ -f "$file" ]] || { echo "::error::Missing required file: $file"; exit 1; }
          done

          grep -q '^## Mandatory production protections$' docs/reference/environment-protection.md
          grep -q 'manual approvals are required' docs/reference/environment-protection.md
          grep -q 'protected environment secrets/variables' docs/reference/environment-protection.md
          grep -q '`github-pages`' docs/reference/environment-protection.md
          grep -q 'selected branch/tag policies' docs/reference/environment-protection.md
          grep -q 'environment protection gates' docs/operations/environment-protection-enforcement.md
          grep -q 'SemVer release tags' docs/operations/environment-protection-enforcement.md
          grep -q 'GitHub Pages branch restrictions configured' docs/operations/environment-protection-enforcement.md
          grep -q 'No permanent bypasses for production manual approval controls are allowed.' docs/operations/environment-protection-enforcement.md

      - name: Validate deployment workflow environment declarations
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq "environment: .*(prod|production)" .github/workflows/extension-deploy.yml
          grep -Eq "TARGET_ENV: .*'(prod|production)'" .github/workflows/extension-deploy.yml
          grep -q '^  verify-github-pages-environment:$' .github/workflows/docs.yml
          grep -q '^      name: github-pages$' .github/workflows/docs.yml
          grep -Eq "environment: .*staging.*(prod|production)" .github/workflows/mcp-deploy.yml
          grep -Eq "TARGET_ENV: .*'staging'.*'(prod|production)'" .github/workflows/mcp-deploy.yml
          grep -q '^    environment: staging$' .github/workflows/portal-deploy.yml

      - name: Validate GitHub environment protection settings
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          PROD_ENV=""
          for candidate in production prod; do
            if gh api "repos/${REPOSITORY}/environments/${candidate}" >/dev/null 2>&1; then
              PROD_ENV="$candidate"
              break
            fi
          done

          if [[ -z "$PROD_ENV" ]]; then
            echo "::warning::Neither canonical 'production' nor legacy alias 'prod' environment exists."
            echo "::warning::Settings action required: create a protected production environment."
            echo "Skipping hard-fail because this check is advisory for repository settings drift."
            exit 0
          fi

          ENV_JSON="$(gh api "repos/${REPOSITORY}/environments/${PROD_ENV}")"
          REVIEWER_COUNT="$(echo "$ENV_JSON" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // [])[]] | length')"
          PROTECTED_BRANCH_POLICY="$(echo "$ENV_JSON" | jq -r '.deployment_branch_policy.protected_branches // false')"
          CUSTOM_BRANCH_POLICY="$(echo "$ENV_JSON" | jq -r '.deployment_branch_policy.custom_branch_policies // false')"

          if [[ "$REVIEWER_COUNT" -lt 1 ]]; then
            echo "::warning::Environment '${PROD_ENV}' has no required reviewers."
            echo "::warning::Settings action required: environment must have at least one required reviewer."
            echo "- ADVISORY: '${PROD_ENV}' environment has no required reviewers." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$CUSTOM_BRANCH_POLICY" == "true" ]]; then
            PROD_POLICIES="$(gh api "repos/${REPOSITORY}/environments/${PROD_ENV}/deployment-branch-policies" --jq '.branch_policies[] | "\(.type):\(.name)"' 2>/dev/null || true)"
            if ! echo "$PROD_POLICIES" | grep -Fqx 'branch:main'; then
              echo "::warning::Environment '${PROD_ENV}' selected deployment policies do not include the 'main' branch."
              echo "::warning::Settings action required: add selected branch policy 'main'."
              echo "- ADVISORY: '${PROD_ENV}' selected deployment policies do not include 'main'." >> "$GITHUB_STEP_SUMMARY"
            fi
            if ! echo "$PROD_POLICIES" | grep -Fqx 'tag:v*'; then
              echo "::warning::Environment '${PROD_ENV}' selected deployment policies do not include SemVer release tags."
              echo "::warning::Settings action required: add selected tag policy 'v*' so tag-triggered release publishing can enter the protected environment."
              echo "- ADVISORY: '${PROD_ENV}' selected deployment policies do not include 'v*' release tags." >> "$GITHUB_STEP_SUMMARY"
            fi
            UNEXPECTED_PROD_POLICIES="$(printf '%s\n' "$PROD_POLICIES" \
              | grep -v -F -x 'branch:main' \
              | grep -v -F -x 'tag:v*' \
              | grep -v '^$' || true)"
            if [[ -n "$UNEXPECTED_PROD_POLICIES" ]]; then
              echo "::warning::Environment '${PROD_ENV}' selected deployment policies include entries outside the documented allowlist:"
              echo "$UNEXPECTED_PROD_POLICIES"
              echo "- ADVISORY: '${PROD_ENV}' selected deployment policies include entries outside 'branch:main' and 'tag:v*'." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$PROTECTED_BRANCH_POLICY" == "true" ]]; then
            echo "::warning::Environment '${PROD_ENV}' uses protected branches only; tag-triggered production publishing requires selected branch/tag policies."
            echo "::warning::Settings action required: switch to selected branch/tag policies with 'main' and tag pattern 'v*'."
            echo "- ADVISORY: '${PROD_ENV}' uses protected branches only and may block release tag publishing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Environment '${PROD_ENV}' does not enforce deployment branch/tag restrictions."
            echo "::warning::Settings action required: enable selected branch/tag policies with 'main' and tag pattern 'v*'."
            echo "- ADVISORY: '${PROD_ENV}' environment does not enforce deployment branch/tag restrictions." >> "$GITHUB_STEP_SUMMARY"
          fi

          if ! PAGES_ENV_JSON="$(gh api "repos/${REPOSITORY}/environments/github-pages" 2>/dev/null)"; then
            echo "::warning::Environment 'github-pages' does not exist yet."
            echo "::warning::Docs deployment will create it automatically on first successful deploy, but branch-policy enforcement is unavailable until then."
            echo "- ADVISORY: 'github-pages' environment does not exist yet." >> "$GITHUB_STEP_SUMMARY"
          else
            PAGES_PROTECTED_ONLY="$(echo "$PAGES_ENV_JSON" | jq -r '.deployment_branch_policy.protected_branches // false')"
            PAGES_CUSTOM_POLICY="$(echo "$PAGES_ENV_JSON" | jq -r '.deployment_branch_policy.custom_branch_policies // false')"

            if [[ "$PAGES_PROTECTED_ONLY" == "true" ]]; then
              ENCODED_DEFAULT_BRANCH="$(jq -rn --arg value "$DEFAULT_BRANCH" '$value|@uri')"
              DEFAULT_BRANCH_PROTECTED="$(gh api "repos/${REPOSITORY}/branches/${ENCODED_DEFAULT_BRANCH}" --jq '.protected' 2>/dev/null || echo false)"
              if [[ "$DEFAULT_BRANCH_PROTECTED" != "true" ]]; then
                echo "::warning::Environment 'github-pages' allows protected branches only, but '${DEFAULT_BRANCH}' is not protected."
                echo "::warning::Settings action required: protect '${DEFAULT_BRANCH}' or switch github-pages to selected branches including '${DEFAULT_BRANCH}'."
                echo "- ADVISORY: '${DEFAULT_BRANCH}' is not protected while github-pages requires protected branches." >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "github-pages environment allows protected-branch deployments."
            elif [[ "$PAGES_CUSTOM_POLICY" == "true" ]]; then
              PAGES_BRANCHES="$(gh api "repos/${REPOSITORY}/environments/github-pages/deployment-branch-policies" --jq '.branch_policies[].name' 2>/dev/null || true)"
              if ! echo "$PAGES_BRANCHES" | grep -Fqx "$DEFAULT_BRANCH"; then
                echo "::warning::Environment 'github-pages' uses selected branches, but '${DEFAULT_BRANCH}' is not included."
                echo "::warning::Settings action required: add '${DEFAULT_BRANCH}' to the github-pages environment deployment branches, or switch to protected branches only."
                echo "- ADVISORY: 'github-pages' selected branches do not include '${DEFAULT_BRANCH}'." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::warning::Environment 'github-pages' does not enforce deployment branch restrictions."
              echo "::warning::Settings action required: enable protected branches or select '${DEFAULT_BRANCH}' explicitly."
              echo "- ADVISORY: 'github-pages' environment does not enforce deployment branch restrictions." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "Environment protection settings check completed for ${PROD_ENV} and github-pages (advisory mode)."
          echo "Advisory check complete for '${PROD_ENV}' and 'github-pages' — any warnings above require manual settings remediation." >> "$GITHUB_STEP_SUMMARY"

      - name: Note PR-scope environment settings check
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Skipping production environment reviewer/branch-policy API enforcement on pull_request runs." >> "$GITHUB_STEP_SUMMARY"
          echo "This check is enforced on scheduled and manual runs where administrative visibility is available." >> "$GITHUB_STEP_SUMMARY"
