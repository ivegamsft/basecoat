name: "BaseCoat - Automation Stuck-State Watchdog"

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      issue_to_pr_sla_hours:
        description: "SLA hours for approved issue -> execution progress"
        required: false
        default: "24"
        type: string
      ready_to_merge_sla_hours:
        description: "SLA hours for merge-ready PR -> merged"
        required: false
        default: "12"
        type: string
      merge_to_release_sla_hours:
        description: "SLA hours for merged PR -> release-chain evidence"
        required: false
        default: "2"
        type: string
      lookback_days:
        description: "How far back to scan merged PRs for release-chain evidence"
        required: false
        default: "7"
        type: string
      max_items:
        description: "Max issues/PRs to inspect per stage"
        required: false
        default: "200"
        type: string

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchdog:
    name: Detect and escalate stuck delivery states
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect SLA breaches and open escalation issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ISSUE_TO_PR_SLA_HOURS: ${{ inputs.issue_to_pr_sla_hours || '24' }}
          READY_TO_MERGE_SLA_HOURS: ${{ inputs.ready_to_merge_sla_hours || '12' }}
          MERGE_TO_RELEASE_SLA_HOURS: ${{ inputs.merge_to_release_sla_hours || '2' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          MAX_ITEMS: ${{ inputs.max_items || '200' }}
          SLA_CONFIG_PATH: .github/governance/automation-stage-slas.json
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- automation-watchdog:v1 -->';
            const releaseChainMarker = 'post-merge-release-chain:v1';
            const remediationLabels = ['remediation', 'escalated', 'automation'];
            const now = new Date();
            const isSecondaryRateLimit = err =>
              (err?.status === 403 || err?.status === 429) && /secondary rate limit/i.test(String(err?.message || ''));
            const toInt = (value, fallback) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
            };
            const hoursSince = value => Math.floor((now.getTime() - new Date(value).getTime()) / (60 * 60 * 1000));
            const normalizeLabels = labels =>
              (labels || [])
                .map(label => (typeof label === 'string' ? label : label?.name || ''))
                .map(name => String(name).toLowerCase())
                .filter(Boolean);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const retryAfterMs = error => {
              const header = error?.response?.headers?.['retry-after'] || error?.response?.headers?.['Retry-After'];
              const parsed = Number(header);
              return Number.isFinite(parsed) && parsed > 0 ? Math.min(Math.ceil(parsed * 1000), 60000) : null;
            };
            const withSecondaryRateLimitRetry = async (operation, description) => {
              const maxAttempts = 3;
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  if (!isSecondaryRateLimit(error) || attempt === maxAttempts) {
                    throw error;
                  }

                  const delayMs = retryAfterMs(error) ?? Math.min(2000 * attempt, 10000);
                  core.warning(
                    `${description} hit a secondary rate limit; retrying in ${Math.ceil(delayMs / 1000)}s ` +
                    `(attempt ${attempt + 1}/${maxAttempts})`
                  );
                  await sleep(delayMs);
                }
              }
            };

            const configPath = process.env.SLA_CONFIG_PATH || '.github/governance/automation-stage-slas.json';
            const config = fs.existsSync(configPath)
              ? JSON.parse(fs.readFileSync(configPath, 'utf8'))
              : {};
            const stageThresholds = {
              issue_to_pr_hours: toInt(config?.thresholds?.issue_to_pr_hours, toInt(process.env.ISSUE_TO_PR_SLA_HOURS, 24)),
              ready_to_merge_hours: toInt(config?.thresholds?.ready_to_merge_hours, toInt(process.env.READY_TO_MERGE_SLA_HOURS, 12)),
              merge_to_release_hours: toInt(config?.thresholds?.merge_to_release_hours, toInt(process.env.MERGE_TO_RELEASE_SLA_HOURS, 2))
            };
            const lookbackDays = toInt(config?.scan?.lookback_days, toInt(process.env.LOOKBACK_DAYS, 7));
            const maxItems = toInt(config?.scan?.max_items, toInt(process.env.MAX_ITEMS, 200));
            const suppressionLabels = new Set(
              (config?.suppression_labels || ['watchdog:ignore', 'sla:exempt']).map(value => String(value).toLowerCase())
            );

            const shouldSuppress = labels => {
              const normalized = normalizeLabels(labels);
              return normalized.some(name => suppressionLabels.has(name));
            };

            const findings = [];

            const approvedIssues = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:approved label:copilot-agent sort:updated-asc`,
              per_page: 100
            });

            for (const issue of approvedIssues.slice(0, maxItems)) {
              if (shouldSuppress(issue.labels)) continue;
              const staleHours = hoursSince(issue.updated_at);
              if (staleHours <= stageThresholds.issue_to_pr_hours) continue;
              findings.push({
                stage: 'issue_to_pr',
                stageLabel: 'Issue approved -> execution progress',
                entityType: 'issue',
                entityNumber: issue.number,
                owner: issue.assignee?.login || issue.user?.login || 'unassigned',
                staleHours,
                nextAction: 'Route to execution owner, confirm assignment, or move to blocked queue with reason.',
                evidenceUrl: issue.html_url
              });
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of openPrs.slice(0, maxItems)) {
              if (pr.draft) continue;
              if (shouldSuppress(pr.labels)) continue;
              const mergeableState = String(pr.mergeable_state || '').toLowerCase();
              if (!['clean', 'has_hooks', 'unstable'].includes(mergeableState)) continue;

              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha
              });
              if (String(combined.state || '').toLowerCase() !== 'success') continue;

              const staleHours = hoursSince(pr.updated_at);
              if (staleHours <= stageThresholds.ready_to_merge_hours) continue;
              findings.push({
                stage: 'ready_to_merge',
                stageLabel: 'PR merge-ready -> merged',
                entityType: 'pr',
                entityNumber: pr.number,
                owner: pr.assignee?.login || pr.user?.login || 'unassigned',
                staleHours,
                nextAction: 'Merge now or leave a deterministic blocker comment with required gate/check name.',
                evidenceUrl: pr.html_url
              });
            }

            const lookbackStart = new Date(now.getTime() - (lookbackDays * 24 * 60 * 60 * 1000));
            const mergedPrs = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr is:closed merged:>=${lookbackStart.toISOString().slice(0, 10)} sort:updated-desc`,
              per_page: 100
            });

            for (const merged of mergedPrs.slice(0, maxItems)) {
              if (shouldSuppress(merged.labels)) continue;
              const mergedAt = merged.closed_at || merged.updated_at;
              const staleHours = hoursSince(mergedAt);
              if (staleHours <= stageThresholds.merge_to_release_hours) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: merged.number,
                per_page: 100
              });
              const hasReleaseEvidence = comments.some(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                comment.body.includes(releaseChainMarker)
              );
              if (hasReleaseEvidence) continue;

              findings.push({
                stage: 'merge_to_release',
                stageLabel: 'Merged PR -> release-chain evidence',
                entityType: 'pr',
                entityNumber: merged.number,
                owner: merged.user?.login || 'unassigned',
                staleHours,
                nextAction: 'Replay post-merge release chain and verify ship-it-release-gate dispatch completion.',
                evidenceUrl: merged.html_url
              });
            }

            let openRemediationIssues = [];
            let snapshotLoadFailed = false;
            try {
              openRemediationIssues = await withSecondaryRateLimitRetry(() =>
                github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: remediationLabels.join(','),
                  per_page: 100
                }),
                'load remediation snapshot'
              );
            } catch (error) {
              snapshotLoadFailed = true;
              core.warning(
                `Unable to load remediation snapshot after retries; escalating findings will be skipped for this run: ` +
                String(error?.message || error)
              );
            }

            const upsertEscalation = async finding => {
              const fingerprint = `${finding.stage}:${finding.entityType}:${finding.entityNumber}`;
              const fingerprintMarker = `<!-- automation-watchdog:fingerprint:${fingerprint} -->`;
              const issueBody = [
                marker,
                fingerprintMarker,
                `## Automation watchdog escalation`,
                '',
                `- **Stage**: ${finding.stageLabel} (\`${finding.stage}\`)`,
                `- **Entity**: ${finding.entityType.toUpperCase()} #${finding.entityNumber}`,
                `- **Owner**: @${finding.owner}`,
                `- **SLA breach**: ${finding.staleHours}h elapsed`,
                `- **Evidence**: ${finding.evidenceUrl}`,
                `- **Next action**: ${finding.nextAction}`
              ].join('\n');

              const existingEscalation = openRemediationIssues.find(item =>
                typeof item.body === 'string' && item.body.includes(fingerprintMarker)
              );
              if (existingEscalation) {
                await withSecondaryRateLimitRetry(() =>
                  github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existingEscalation.number,
                    body: issueBody
                  }),
                `update remediation issue #${existingEscalation.number}`);
                return { action: 'updated', url: existingEscalation.html_url };
              }

              const created = await withSecondaryRateLimitRetry(() =>
                github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `[Watchdog][${finding.stage}] ${finding.entityType.toUpperCase()} #${finding.entityNumber} exceeded SLA`,
                  body: issueBody,
                  labels: remediationLabels
                }),
              `create remediation issue for ${finding.entityType} #${finding.entityNumber}`);
              openRemediationIssues.push(created.data);
              return { action: 'created', url: created.data.html_url };
            };

            const escalations = [];
            const escalationFailures = snapshotLoadFailed ? [{
              stage: 'snapshot',
              entityType: 'issue',
              entityNumber: 0,
              message: 'Remediation snapshot could not be loaded after retries.'
            }] : [];
            if (!snapshotLoadFailed) {
              for (const finding of findings) {
                try {
                  const escalation = await upsertEscalation(finding);
                  escalations.push({ ...finding, ...escalation });
                } catch (error) {
                  escalationFailures.push({
                    stage: finding.stage,
                    entityType: finding.entityType,
                    entityNumber: finding.entityNumber,
                    message: String(error?.message || error)
                  });
                  core.warning(
                    `Failed to escalate ${finding.entityType} #${finding.entityNumber}; ` +
                    'continuing with remaining findings.'
                  );
                }
              }
            }

            const stageCounts = findings.reduce((acc, finding) => {
              acc[finding.stage] = (acc[finding.stage] || 0) + 1;
              return acc;
            }, {});

            core.summary
              .addHeading('Automation stuck-state watchdog summary')
              .addTable([
                [{ data: 'Stage', header: true }, { data: 'Breaches', header: true }],
                ['issue_to_pr', String(stageCounts.issue_to_pr || 0)],
                ['ready_to_merge', String(stageCounts.ready_to_merge || 0)],
                ['merge_to_release', String(stageCounts.merge_to_release || 0)]
              ])
              .addRaw(`\nSuppression labels: ${Array.from(suppressionLabels).join(', ')}\n`)
              .addRaw(`Snapshot load: ${snapshotLoadFailed ? 'failed' : 'ok'}\n`)
              .addRaw(`\nEscalations: ${escalations.length}\n`)
              .addRaw(`Escalation failures: ${escalationFailures.length}\n`)
              .write();
