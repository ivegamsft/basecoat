name: "Workflow Runner Capability Audit"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/audit-workflow-runner-capabilities.ps1"
      - "docs/operations/workflow-runner-routing.md"
      - "docs/operations/workflow-runner-capability-audit.md"
      - ".github/workflow-runner-capability-classes.json"
      - ".github/workflow-runner-routing-contracts.json"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-capability-audit:
    name: runner-capability-audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate runner capability audit report
        id: audit
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/audit-workflow-runner-capabilities.ps1 `
            -OutputFormat markdown `
            -OutputPath docs/operations/workflow-runner-capability-audit.md `
            -FailOnContractViolation

      - name: Upload runner capability audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workflow-runner-capability-audit
          path: docs/operations/workflow-runner-capability-audit.md
          if-no-files-found: error
          retention-days: 14

      - name: Open tracking issue on contract violations
        if: ${{ steps.audit.outcome == 'failure' && github.event_name == 'schedule' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `ci: runner routing contract violations detected (${today})`;
            const body = [
              '## Runner routing contract violations detected',
              '',
              `The daily runner capability audit found contract violations on ${today}.`,
              '',
              `**Audit run**: ${runUrl}`,
              '',
              'Download the `workflow-runner-capability-audit` artifact from the run above for the full report.',
              '',
              '### Next steps',
              '',
              '1. Review the violations in the audit report.',
              '2. Update `.github/workflow-runner-routing-contracts.json` if runner assignments changed intentionally.',
              '3. Fix any unintended drift in workflow `runs-on` expressions.',
              '',
              '> This issue was opened automatically by the daily runner capability audit workflow.',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci,github-actions',
              per_page: 10,
            });

            const duplicate = existing.find(i => i.title.startsWith('ci: runner routing contract violations detected'));
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Violations still present on ${today}. See audit run: ${runUrl}`,
              });
              core.info(`Updated existing tracking issue #${duplicate.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci', 'github-actions', 'priority:high'],
              });
              core.info(`Opened tracking issue #${issue.number}: ${issue.html_url}`);
            }

      - name: Fail job when contract violations detected
        if: ${{ steps.audit.outcome == 'failure' }}
        run: exit 1
