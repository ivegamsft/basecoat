name: "BaseCoat - A/B Experiment"

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment folder name under tests/experiments/
        required: false
        default: code-review-improvement
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run experiment
        shell: pwsh
        run: |
          $experiment = "${{ github.event_name == 'workflow_dispatch' && inputs.experiment || 'code-review-improvement' }}"
          pwsh scripts/run-experiment.ps1 -Experiment $experiment -OutputDir test-results

      - name: Upload report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ab-experiment-report
          path: test-results/*-ab-report.*

      - name: Add markdown report to job summary
        shell: pwsh
        run: |
          $report = Get-ChildItem test-results\*-ab-report.md | Select-Object -First 1
          if ($null -ne $report) {
            Get-Content $report.FullName -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

