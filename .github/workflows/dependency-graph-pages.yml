name: "BaseCoat - Dependency Graph to Pages"

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    if: github.event_name != 'pull_request'
    name: Generate dependency graph and publish via docs PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      should_open_pr: ${{ steps.prepare.outputs.should_open_pr }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Generate dependency graph report
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path docs/reports | Out-Null
          $graph = (pwsh scripts/graph-dependencies.ps1 -ShowOrphans) -join "`n"
          $timestamp = Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ'
          $content = @(
            '# Dependency Graph',
            '',
            "- Generated: $timestamp",
            '- Source workflow: .github/workflows/dependency-graph-pages.yml',
            '',
            $graph
          ) -join "`n"
          Set-Content -Path docs/reports/dependency-graph.md -Value $content -Encoding UTF8

          if (-not (git diff --quiet -- docs/reports/dependency-graph.md)) {
            $branch = 'automation/dependency-graph'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -B $branch
            git add docs/reports/dependency-graph.md
            git commit -m 'docs(graph): refresh dependency graph report'
            $remoteSha = (git ls-remote --heads origin $branch | ForEach-Object { ($_ -split '\s+')[0] } | Select-Object -First 1)
            if ($remoteSha) {
              git fetch --no-tags origin $branch
              git push origin "HEAD:refs/heads/$branch" --force-with-lease="refs/heads/${branch}:$remoteSha"
            } else {
              git push origin "HEAD:refs/heads/$branch" --force-with-lease="refs/heads/${branch}:"
            }
            if ($branch -notmatch '^[A-Za-z0-9._/-]+$') {
              throw "Generated branch name '$branch' is not safe for GITHUB_OUTPUT assignment."
            }

            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_open_pr=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "branch_name=$branch"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_open_pr=false"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "branch_name="
          }

          Get-Content docs/reports/dependency-graph.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload dependency graph artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-graph-report
          path: docs/reports/dependency-graph.md
          retention-days: 14

      - name: Open pull request for docs publication
        if: steps.prepare.outputs.should_open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          SOURCE_ISSUE: "3528"
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.prepare.outputs.branch_name }}"
          title="docs(graph): refresh dependency graph report"
          git fetch --no-tags origin main
          read -r expected_files expected_lines < <(git diff --numstat origin/main...HEAD | awk '
            BEGIN { files=0; lines=0 }
            { files++; if ($1 ~ /^[0-9]+$/) lines += $1; if ($2 ~ /^[0-9]+$/) lines += $2 }
            END { print files, lines }
          ')
          body_file=.automation-pr-body.md
          sed 's/^          //' > "$body_file" <<EOF
          # Summary

          Automated refresh of \`docs/reports/dependency-graph.md\`. This report is published to Pages via the docs deployment workflow after merge.

          Linked issue / spec: #${SOURCE_ISSUE}

          ## Validation

          | Proof / verification command or artifact | Result | Requirement covered |
          |---|---|---|
          | \`.github/workflows/dependency-graph-pages.yml\` generated \`docs/reports/dependency-graph.md\` | pending CI | Dependency graph report refreshed |

          ## Intake Contract

          ### Design

          | Order of work | Files that change | Planned change / acceptance |
          |---|---|---|
          | 1 | \`docs/reports/dependency-graph.md\` | Refresh the generated dependency graph report. |

          Change scope: individual
          Source issues: #${SOURCE_ISSUE}
          Independently deliverable units: 1
          Unit inventory: dependency graph report refresh
          Expected files: ${expected_files}
          Expected changed lines (additions + deletions): ${expected_lines}
          Classification rationale: Single generated documentation report refresh produced by the scheduled dependency graph workflow.
          Mechanical batch exception evidence: none

          ### Derived Classification

          Use the current machine-derived labels/check output.

          ## Governance

          Governance reference: \`docs/reference/governance-contract.md\`

          ## Risk and Rollout

          - Risks / blast radius: Generated documentation-only report update.
          - Rollout plan: Merge after required checks pass.
          - Rollback plan: Revert the generated report refresh commit.

          Related: #189
          EOF
          node scripts/validate-pr-intake-preflight.cjs "$body_file" origin/main HEAD
          gh label create skip-release-label-gate --color ededed --description "Exempt automation-only PRs from release label gate" --force || true

          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number' || true)"
          if [[ -n "$existing" ]]; then
            echo "Updating existing PR #$existing for branch $branch"
            gh pr edit "$existing" --body-file "$body_file" --add-label skip-release-label-gate
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$body_file" --label skip-release-label-gate
          fi

          while read -r _ref; do
            leftover="${_ref#refs/heads/}"
            [[ -z "$leftover" || "$leftover" == "$branch" ]] && continue
            open_count="$(gh pr list --state open --head "$leftover" --json number --jq 'length')"
            if [[ "$open_count" == "0" ]]; then
              git push origin --delete "$leftover" || true
            fi
          done < <(git ls-remote --heads origin 'automation/dependency-graph-*' | awk '{print $2}')

  cleanup-automation-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && startsWith(github.head_ref, 'automation/dependency-graph')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete closed dependency-graph automation branch
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            automation/dependency-graph|automation/dependency-graph-*)
              ;;
            *)
              echo "Skipping non-matching branch $BRANCH"
              exit 0
              ;;
          esac
          open_count="$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')"
          if [[ "$open_count" != "0" ]]; then
            echo "Open PR still uses $BRANCH; leaving branch in place"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
