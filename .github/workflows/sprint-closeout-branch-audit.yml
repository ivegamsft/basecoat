name: "BaseCoat - Sprint Closeout Branch Audit"

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Mark remote branches stale after this many days"
        required: false
        default: "30"
        type: string
      apply_changes:
        description: "Delete safe stale remote branches and orphaned local branches"
        required: false
        default: false
        type: boolean
      publish_issue:
        description: "Create or update the orphaned-lane ledger issue"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Audit and optionally clean branches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $staleDays = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            [int]"${{ inputs.stale_days }}"
          } else {
            30
          }

          $applyChanges = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.apply_changes }}" -eq "true"
          } else {
            $false
          }

          $params = @{
            StaleDays     = $staleDays
            DefaultBranch = 'main'
            AssumeYes     = $true
            LedgerPath    = 'test-results/lane-closeout/orphaned-lanes.json'
          }

          if ($applyChanges) {
            $params.ApplyChanges = $true
          }

          pwsh ./scripts/cleanup-branches.ps1 @params

      - name: Publish orphaned-lane ledger issue
        if: github.event_name != 'workflow_dispatch' || inputs.publish_issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh ./scripts/publish-orphaned-lane-ledger.ps1 `
            -LedgerPath 'test-results/lane-closeout/orphaned-lanes.json'

      - name: Upload lane-closeout ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orphaned-lane-ledger
          path: test-results/lane-closeout/
          if-no-files-found: error
          retention-days: 30
