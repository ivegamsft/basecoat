name: "BaseCoat - Ship-it Release Gate"

on:
  workflow_dispatch:
    # GitHub caps workflow_dispatch at 10 inputs. The five gate statuses, five
    # artifact statuses, and the approval/rollback/goal context are consolidated
    # into `gate_status`, `artifact_status`, and `promotion_context` (parsed by the
    # evaluation step) so the full release-gate-enforcer contract stays reachable.
    inputs:
      target_repo:
        description: Repository in owner/repo format
        required: true
        default: IBuySpy-Shared/basecoat
        type: string
      target_branch:
        description: Branch tied to promotion evidence
        required: false
        type: string
      risk_band:
        description: Risk classification
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
          - critical
      promotion_stage:
        description: Promotion stage to evaluate
        required: true
        default: validate
        type: choice
        options:
          - validate
          - canary
          - staging
          - production
      execution_lane:
        description: Execution lane for lane-aware gate policy
        required: true
        default: standard
        type: choice
        options:
          - standard
          - pilot-luxesite
          - pilot-wawkr
          - pilot-work-tracker
      change_type:
        description: Change classification for artifact matrix enforcement
        required: true
        default: code
        type: choice
        options:
          - code
          - docs-only
          - config
          - release
      gate_status:
        description: >-
          Comma-separated key=value gate statuses (pass|fail|not_run). Keys:
          lint, build, type, e2e, security, smoke. Omitted keys default to not_run.
        required: false
        default: lint=pass,build=pass,type=pass,e2e=not_run,security=pass,smoke=pass
        type: string
      artifact_status:
        description: >-
          Comma-separated key=value artifact statuses (present|missing|not_applicable).
          Keys: spec, docs, tests, runbook, release_notes. Omitted keys default to present.
        required: false
        default: spec=present,docs=present,tests=present,runbook=present,release_notes=present
        type: string
      promotion_context:
        description: >-
          Comma-separated key=value approval/rollback/goal context. Keys:
          previous_stage (pass|fail|not_run), environment_protection
          (configured|missing), require_approval (true|false), approval
          (approved|not-required|missing), rollback_validation
          (validated|missing|failed), rollback_runbook_ref (URL; avoid commas),
          goal_ids (space- or pipe-separated), and optional per-artifact goal
          maps spec_goals, docs_goals, tests_goals, runbook_goals,
          release_notes_goals (pipe-separated; each defaults to goal_ids).
          Optional source_sha pins the promoted commit (defaults to GITHUB_SHA).
          Values are split on the first '='. Unknown or duplicate keys are
          rejected.
        required: false
        default: previous_stage=pass,environment_protection=configured,require_approval=false,approval=not-required,rollback_validation=missing,rollback_runbook_ref=,goal_ids=
        type: string
      dry_run:
        description: Execute workflow in dry-run mode (no enforcement failure)
        required: false
        default: false
        type: boolean

jobs:
  evaluate-ship-it-gate:
    name: Evaluate Ship-it Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Log gate inputs
        run: |
          echo "Gate Evaluation Inputs:"
          echo "  target_repo: ${{ inputs.target_repo }}"
          echo "  risk_band: ${{ inputs.risk_band }}"
          echo "  promotion_stage: ${{ inputs.promotion_stage }}"
          echo "  change_type: ${{ inputs.change_type }}"
          echo "  execution_lane: ${{ inputs.execution_lane }}"
          echo "  dry_run: ${{ inputs.dry_run }}"

      - name: Evaluate release gate contract
        shell: pwsh
        env:
          # Pass dispatch inputs via env (not ${{ }} interpolation) so free-text
          # values cannot be injected into the command line.
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RISK_BAND: ${{ inputs.risk_band }}
          PROMOTION_STAGE: ${{ inputs.promotion_stage }}
          EXECUTION_LANE: ${{ inputs.execution_lane }}
          CHANGE_TYPE: ${{ inputs.change_type }}
          GATE_STATUS: ${{ inputs.gate_status }}
          ARTIFACT_STATUS: ${{ inputs.artifact_status }}
          PROMOTION_CONTEXT: ${{ inputs.promotion_context }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ./scripts/ship-it/invoke-release-gate.ps1 `
            -TargetRepo $env:TARGET_REPO `
            -TargetBranch $env:TARGET_BRANCH `
            -RiskBand $env:RISK_BAND `
            -PromotionStage $env:PROMOTION_STAGE `
            -ExecutionLane $env:EXECUTION_LANE `
            -ChangeType $env:CHANGE_TYPE `
            -GateStatus $env:GATE_STATUS `
            -ArtifactStatus $env:ARTIFACT_STATUS `
            -PromotionContext $env:PROMOTION_CONTEXT `
            -OutputPath 'test-results/ship-it/promotion-evidence-bundle.json' `
            -DryRun:([System.Convert]::ToBoolean($env:DRY_RUN))

      - name: Publish gate summary
        if: always()
        shell: pwsh
        run: |
          $mdPath = 'test-results/ship-it/promotion-evidence-bundle.md'
          if (Test-Path $mdPath) {
            Get-Content $mdPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Warning "$mdPath not found; enforcer may have failed before writing evidence."
          }

      - name: Upload promotion evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ship-it-release-gate
          path: |
            test-results/ship-it/promotion-evidence-bundle.json
            test-results/ship-it/promotion-evidence-bundle.md
          if-no-files-found: warn
