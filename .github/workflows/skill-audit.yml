name: "BaseCoat - Skill Audit"
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run skill audit
        run: pwsh scripts/audit-skills.ps1 -FailOnError
      - name: Report metadata.category gaps
        run: |
          if grep -q "missing metadata.category" test-results/skill-audit.txt; then
            echo "::warning title=Missing metadata.category::One or more skills are missing metadata.category in SKILL.md frontmatter."
            grep "missing metadata.category" test-results/skill-audit.txt
          fi
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 7
          name: skill-audit-results
          path: test-results/skill-audit.txt
