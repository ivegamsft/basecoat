name: "BaseCoat - PR Conflict Routing"

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

# Repository-wide group (not github.ref): every run scans all PRs, so runs must never overlap.
concurrency:
  group: pr-conflict-routing
  cancel-in-progress: false

jobs:
  route-conflicts:
    name: Route conflicted PRs to an agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Label and instruct conflicted PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const marker = '<!-- pr-conflict-routing:v1';
            const label = 'needs-conflict-fix';
            const { owner, repo } = context.repo;
            // PR authors and commenters can paste the marker text; only comments written by this workflow count.
            const trustedAuthor = 'github-actions[bot]';
            const trustedMarker = (c, tag) => Boolean(c && c.user && c.user.login === trustedAuthor
              && c.user.type === 'Bot' && typeof c.body === 'string' && c.body.startsWith(tag));
            // Keep the oldest trusted marker for this head and delete any duplicates left by concurrent or interrupted runs.
            const reconcile = async (number, tag) => {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              const markers = comments.filter(c => trustedMarker(c, tag)).sort((a, b) => a.id - b.id);
              for (const extra of markers.slice(1)) {
                try {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: extra.id });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              return markers[0] || null;
            };
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            for (const item of prs) {
              if (item.draft) continue;
              const labels = item.labels.map(l => l.name);
              if (labels.includes('size:XXL') || labels.includes('no-merge')) continue;
              let pr = item;
              for (let i = 0; i < 3 && pr.mergeable === null; i++) {
                await new Promise(r => setTimeout(r, 3000));
                pr = (await github.rest.pulls.get({ owner, repo, pull_number: item.number })).data;
              }
              const dirty = pr.mergeable_state === 'dirty';
              if (!dirty) {
                if (labels.includes(label)) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                    core.info(`Conflict label already absent on PR #${pr.number}.`);
                  }
                }
                continue;
              }
              const tag = `${marker} head=${pr.head.sha} -->`;
              if (await reconcile(pr.number, tag)) continue;
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'PR has merge conflicts awaiting agent resolution' });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [label] });
              const body = [
                tag,
                '## Merge conflict: agent action required',
                '',
                `This PR conflicts with \`${pr.base.ref}\` (mergeable_state=dirty) at head \`${pr.head.sha}\`.`,
                '',
                '@copilot resolve the conflicts using `skills/merge-conflict-mediator/SKILL.md` (PR Conflict Recovery), escalating to `merge-coordinator` for ambiguous source conflicts:',
                `1. Merge or rebase \`${pr.base.ref}\` into the PR branch in an isolated worktree.`,
                '2. If `asset-manifest.json` conflicts, take the base version and regenerate it with `pwsh scripts/generate-asset-manifest.ps1`.',
                '3. Preserve the PR intent; do not drop base changes or bypass required checks.',
                '4. Push with an attributed commit so the merge executor re-evaluates the new head.',
                '',
                'The label is removed automatically once the PR is mergeable. XXL approval and no-merge holds are unaffected.'
              ].join('\n');
              const created = (await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })).data;
              // Revalidate after writing: a concurrent run may have routed the same head first.
              const winner = await reconcile(pr.number, tag);
              if (winner && created && winner.id !== created.id) {
                core.info(`PR #${pr.number} already routed for head ${pr.head.sha}; removed duplicate notification.`);
                continue;
              }
              core.info(`Routed PR #${pr.number}`);
            }
