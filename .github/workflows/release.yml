name: "BaseCoat - Release"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-token-preflight:
    name: Preflight — PRODUCTION_REPO_TOKEN readiness
    uses: ./.github/workflows/token-preflight.yml
    secrets:
      PRODUCTION_REPO_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}

  release:
    needs: production-token-preflight
    # Release creation and mirror publication use public GitHub APIs.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Assert committed version metadata matches release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          expected_version="${tag#v}"
          committed_version="$(jq -r '.version' version.json)"

          # Fail closed: the tagged commit must already carry the release version.
          # Patching version.json only inside the release artifact (see the step
          # below) leaves the tag's git tree reporting the previous version, which
          # makes the sync provenance guard reject the tag (issue #3366). The
          # version bump must land on main before the release tag is pushed.
          if [[ "$committed_version" != "$expected_version" ]]; then
            echo "::error title=Version metadata not bumped before tagging::tag=$tag expects version.json version '$expected_version' but the tagged commit has '$committed_version'."
            echo "::error::Bump version.json (and CHANGELOG.md) to $expected_version on main and merge it before tagging $tag."
            exit 1
          fi

          echo "Committed version.json matches release tag: $expected_version"

      - name: Update version metadata to match release tag
        shell: bash
        run: |
          set -euo pipefail
          
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          release_date="$(date -u +%Y-%m-%d)"
          
          jq --arg ver "$version" --arg date "$release_date" \
            '.version = $ver | .releaseDate = $date' \
            version.json > version.json.tmp && mv version.json.tmp version.json

          jq --arg ver "$version" \
            '.libraryVersion = $ver | (.assets[]? | select(.versionSource == "library").effectiveVersion) = $ver' \
            asset-manifest.json > asset-manifest.json.tmp && mv asset-manifest.json.tmp asset-manifest.json
          
          echo "Updated version.json: $version ($release_date)"
          cat version.json
          echo "Updated asset-manifest.json libraryVersion: $version"

      - name: Validate version metadata matches tag
        shell: bash
        run: |
          set -euo pipefail
          
          tag="${GITHUB_REF_NAME}"
          expected_version="${tag#v}"
          actual_version="$(jq -r '.version' version.json)"
          manifest_version="$(jq -r '.libraryVersion' asset-manifest.json)"
          
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Version mismatch: tag=$tag expects version=$expected_version, but version.json has $actual_version"
            exit 1
          fi
          if [[ "$manifest_version" != "$expected_version" ]]; then
            echo "::error::Manifest version mismatch: tag=$tag expects libraryVersion=$expected_version, but asset-manifest.json has $manifest_version"
            exit 1
          fi
          
          echo "Version metadata validated: version.json and asset-manifest.json match tag $tag"

      - name: Preflight production mirror token
        env:
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PRODUCTION_TOKEN:-}" ]]; then
            echo "::error title=Missing PRODUCTION_REPO_TOKEN::Release stopped to avoid an internal-only release when production publish cannot run."
            echo "::error::Set PRODUCTION_REPO_TOKEN with a PAT owned by ivegamsft for ivegamsft/basecoat."
            echo "::error::Run token-preflight.yml after updating the secret, then re-run this release."
            exit 1
          fi

          http_code="$(curl -sS -o repo.json -w "%{http_code}" \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ivegamsft/basecoat")"

          if [[ "${http_code}" != "200" ]]; then
            echo "::error title=Production repo access check failed::PRODUCTION_REPO_TOKEN probe returned HTTP ${http_code}."
            echo "::error::Fix the secret with an ivegamsft-owned PAT and run token-preflight.yml before tagging."
            exit 1
          fi

          push_access="$(python3 -c "import json; d=json.load(open('repo.json', encoding='utf-8')); p=d.get('permissions',{}); print('true' if (p.get('push') or p.get('admin')) else 'false')")"
          if [[ "${push_access}" != "true" ]]; then
            echo "::error title=Token lacks push access::Release stopped to prevent a partial release state."
            echo "::error::PRODUCTION_REPO_TOKEN must have push/admin access to ivegamsft/basecoat."
            echo "::error::Regenerate the PAT as ivegamsft, update the secret, run token-preflight.yml, then retry."
            exit 1
          fi

          echo "Production mirror preflight passed."

      - name: Build repository zip artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          artifact_name="${GITHUB_REPOSITORY#*/}-${tag}.zip"

          # Archive committed state, then overlay updated version metadata so the
          # zip reflects the tag version rather than the pre-tag commit.
          git archive --format=zip --output "${artifact_name}" "${GITHUB_SHA}"
          zip -u "${artifact_name}" version.json asset-manifest.json

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Extract release notes for tag version
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes_file="release-notes.md"
          scripts/generate-release-notes.sh "${tag}" "${version}" "${notes_file}"

          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Validate wave/sprint label coverage for release PRs
        id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          # The tag checkout is shallow; fetch full history and tags so the
          # exact previous..tag range and tag ancestry can be proven.
          git fetch --quiet --force --tags --unshallow origin 2>/dev/null || git fetch --quiet --force --tags origin
          prev_tag="$(git --no-pager tag --list 'v*.*.*' --sort=-v:refname | grep -Fxv "${tag}" | head -n1 || true)"

          if [[ -z "${prev_tag}" ]]; then
            echo "::warning::No previous semver tag found; skipping wave/sprint label coverage gate."
            exit 0
          fi
          echo "prev_tag=${prev_tag}" >> "${GITHUB_OUTPUT}"

          # Same classifier as the PR and merge-group release-label-gate:
          # release labels, skip-release-label-gate and dependencies count as
          # covered; >10% uncovered fails, exactly 10% warns.
          node scripts/merge-group-release-labels.cjs release-coverage "${prev_tag}" "${tag}" release-label-coverage.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.coverage.outputs.prev_tag }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ -n "${PREV_TAG}" ]]; then
            # Refresh tags, then revalidate tag targets, scope and labels at the publication boundary.
            git fetch --quiet --force --tags origin
            node scripts/merge-group-release-labels.cjs release-coverage "${PREV_TAG}" "${tag}" release-label-coverage-recheck.json
            if [[ "$(git rev-parse "${tag}^{commit}")" != "${GITHUB_SHA}" ]] || ! jq -e --slurpfile before release-label-coverage.json \
              '[.previousSha, .tagSha, .results] == [$before[0] | .previousSha, .tagSha, .results]' release-label-coverage-recheck.json >/dev/null; then
              echo "::error::Release tag target, scope or PR labels changed after the coverage gate; re-run the release to re-evaluate."
              exit 1
            fi
          fi
          artifact="${{ steps.package.outputs.artifact_name }}"
          notes="${{ steps.notes.outputs.notes_file }}"
           
          # Validate sync scripts exist in repo root
          if [[ ! -f sync.ps1 ]] || [[ ! -f sync.sh ]]; then
            echo "::error::Sync scripts not found in repository root"
            exit 1
          fi
           
          echo "Uploading release assets: ${artifact} and sync scripts"
          ls -lh sync.ps1 sync.sh

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${artifact}" sync.ps1 sync.sh --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" --notes-file "${notes}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" "${artifact}" sync.ps1 sync.sh \
              --title "${tag}" \
              --notes-file "${notes}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
           
          # Verify sync scripts are in release
          echo "Verifying release assets..."
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -E '(sync\.ps1|sync\.sh)' || {
            echo "::error::Sync scripts not found in release assets"
            exit 1
          }

      - name: Upload release label coverage inventory
        if: always() && steps.coverage.outputs.prev_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-label-coverage
          path: release-label-coverage*.json

      # Events created with GITHUB_TOKEN do not start another workflow. Dispatch
      # changelog publication explicitly after the release has been updated.
      - name: Dispatch release changelog publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-changelog-generation.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "tag=${GITHUB_REF_NAME}"
