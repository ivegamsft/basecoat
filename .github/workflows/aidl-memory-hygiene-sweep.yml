name: "BaseCoat - AIDL Memory Hygiene Sweep"

on:
  schedule:
    # Run weekly on Tuesday at 07:30 AM UTC (offset from other AIDL audits).
    - cron: '30 7 * * 2'
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Repository-relative path to the memory-store export JSON'
        required: false
        default: ''
        type: string
      review_after_days:
        description: 'Days after which a hold candidate is considered stale'
        required: false
        default: '30'
        type: string
  push:
    paths:
      - 'scripts/aidl-memory-store-sample.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      flagged_count: ${{ steps.sweep.outputs.flagged_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Check out enterprise memory store
        # When configured, fetch the enterprise memory-store repository so scheduled runs inspect
        # the live queue. AIDL_MEMORY_STORE_EXPORT should then point inside this checkout
        # (for example memory-store/<file>.json).
        if: vars.AIDL_MEMORY_STORE_REPO != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
        with:
          repository: ${{ vars.AIDL_MEMORY_STORE_REPO }}
          token: ${{ secrets.MEMORY_REPO_TOKEN || github.token }}
          path: memory-store
          fetch-depth: 1

      - name: Resolve parameters
        id: params
        # Dispatch- and variable-derived values enter through env (never interpolated into the
        # script body) and are validated as repository-relative paths before use downstream.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_INPUT_PATH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.input_path || '' }}
          DISPATCH_REVIEW_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.review_after_days || '' }}
          VAR_MEMORY_STORE: ${{ vars.AIDL_MEMORY_STORE_EXPORT }}
        run: |
          set -euo pipefail
          DEFAULT_SAMPLE="scripts/aidl-memory-store-sample.json"

          # Data-source precedence: dispatch input, then the repository variable (the enterprise
          # memory-store export). Scheduled runs require the real export so weekly automation
          # inspects the live queue; the clean sample is reserved for push/dispatch validation.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_INPUT_PATH:-}" ]; then
            INPUT_PATH="$DISPATCH_INPUT_PATH"
          elif [ -n "${VAR_MEMORY_STORE:-}" ]; then
            INPUT_PATH="$VAR_MEMORY_STORE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            echo "ERROR: scheduled runs require a real memory-store export. Set the AIDL_MEMORY_STORE_EXPORT repository variable to the enterprise store path."
            exit 1
          else
            INPUT_PATH="$DEFAULT_SAMPLE"
          fi

          REVIEW_DAYS="30"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_REVIEW_DAYS:-}" ]; then
            REVIEW_DAYS="$DISPATCH_REVIEW_DAYS"
          fi
          case "$REVIEW_DAYS" in
            ''|*[!0-9]*) echo "ERROR: review_after_days must be a positive integer: $REVIEW_DAYS"; exit 1 ;;
          esac

          case "$INPUT_PATH" in
            /*) echo "ERROR: input_path must be repository-relative: $INPUT_PATH"; exit 1 ;;
          esac
          case "$INPUT_PATH" in
            *..*) echo "ERROR: input_path must not contain '..': $INPUT_PATH"; exit 1 ;;
          esac
          case "$INPUT_PATH" in
            *$'\n'*) echo "ERROR: input_path must not contain newlines."; exit 1 ;;
          esac

          {
            echo "input_path=$INPUT_PATH"
            echo "review_after_days=$REVIEW_DAYS"
          } >> "$GITHUB_OUTPUT"

      - name: Validate memory-store export
        env:
          INPUT_PATH: ${{ steps.params.outputs.input_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$INPUT_PATH" ]; then
            echo "ERROR: memory-store export not found at $INPUT_PATH"
            exit 1
          fi
          python3 -c 'import json,sys; json.load(open(sys.argv[1])); print("Memory-store export is valid JSON.")' "$INPUT_PATH"

      - name: Run memory hygiene sweep
        id: sweep
        shell: pwsh
        env:
          INPUT_PATH: ${{ steps.params.outputs.input_path }}
          REVIEW_DAYS: ${{ steps.params.outputs.review_after_days }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\aidl-memory-hygiene-sweep.ps1 -InputPath $env:INPUT_PATH -OutputDir 'artifacts/aidl-memory-hygiene-sweep' -ReviewAfterDays ([int]$env:REVIEW_DAYS)

          $report = Get-Content 'artifacts/aidl-memory-hygiene-sweep/memory-hygiene-report.json' -Raw | ConvertFrom-Json
          echo "flagged_count=$($report.flagged_count)" >> $env:GITHUB_OUTPUT

          $s = $report.summary
          "### AIDL Memory Hygiene Sweep" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "**Entries scanned:** $($report.input_count)" >> $env:GITHUB_STEP_SUMMARY
          "**Flagged:** $($report.flagged_count)" >> $env:GITHUB_STEP_SUMMARY
          "**URL citations pending online verification:** $($report.url_citations_pending_online_check)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Action | Count |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---:|" >> $env:GITHUB_STEP_SUMMARY
          "| reject-stale | $($s.reject_stale) |" >> $env:GITHUB_STEP_SUMMARY
          "| dead-citation | $($s.dead_citation) |" >> $env:GITHUB_STEP_SUMMARY
          "| needs-replacement-or-rationale | $($s.needs_replacement_or_rationale) |" >> $env:GITHUB_STEP_SUMMARY
          "| deprecate-with-replacement | $($s.deprecate_with_replacement) |" >> $env:GITHUB_STEP_SUMMARY
          "| remove-with-rationale | $($s.remove_with_rationale) |" >> $env:GITHUB_STEP_SUMMARY
          "| consolidate-duplicate | $($s.consolidate_duplicate) |" >> $env:GITHUB_STEP_SUMMARY
          "| invalid-entry | $($s.invalid_entry) |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: aidl-memory-hygiene-sweep
          path: artifacts/aidl-memory-hygiene-sweep
          retention-days: 90

      - name: Open issue on flagged cleanup items
        if: steps.sweep.outputs.flagged_count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const jsonPath = 'artifacts/aidl-memory-hygiene-sweep/memory-hygiene-report.json';
            if (!fs.existsSync(jsonPath)) return;
            const report = JSON.parse(fs.readFileSync(jsonPath, 'utf-8'));
            if (!report.flagged || report.flagged.length === 0) return;

            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${attempt}`;
            const rows = report.flagged
              .map(f => `| \`${f.id}\` | ${f.status} | ${f.primary_action} | ${(f.reasons || []).join('; ').replace(/\|/g, '\\|')} |`)
              .join('\n');
            const body = [
              '## AIDL Memory Hygiene: cleanup items flagged',
              '',
              `**Entries scanned:** ${report.input_count}`,
              `**Flagged:** ${report.flagged_count}`,
              `**Run (immutable attempt):** ${runUrl}`,
              '',
              '| Entry | Status | Primary action | Reasons |',
              '|---|---|---|---|',
              rows,
              '',
              '_Review each flagged entry: reject stale holds, deprecate dead-citation/superseded entries with a replacement link (or a recorded no-replacement rationale), and consolidate duplicates._',
            ].join('\n');

            const title = 'AIDL memory hygiene cleanup items flagged';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'governance',
              state: 'open',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['governance'],
              });
            }
