name: "BaseCoat - Release Changelog Generation"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to generate changelog for (e.g., v3.30.7)"
        type: string
        required: true
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name != 'pull_request'
    name: Generate changelog section from release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      should_open_pr: ${{ steps.prepare.outputs.should_open_pr }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Generate changelog entry
        id: prepare
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p reports

          tag="${RELEASE_TAG:-$TAG_INPUT}"
          if [[ -z "$tag" ]]; then
            echo "::error::No release tag provided."
            exit 1
          fi

          version="${tag#v}"
          date_utc="$(date -u +%Y-%m-%d)"
          notes_file="reports/release-${version}.md"
          latest_notes_file="reports/release-notes/latest.md"
          scripts/generate-release-notes.sh "$tag" "$version" "$notes_file"
          mkdir -p "$(dirname "$latest_notes_file")"
          # The generated notes begin with an "## <version>" heading. Prepend a
          # single top-level title so the published surface stays MD041-compliant
          # (first line must be an H1) and matches the committed convention.
          {
            printf '# Latest Release Notes\n\n'
            cat "$notes_file"
          } > "$latest_notes_file"
          python - "$latest_notes_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

          if grep -Eq "^## v?${version}\b" CHANGELOG.md; then
            echo "Changelog already contains ${version}; publishing refreshed latest notes only."
          else
            NOTES_FILE="$notes_file" VERSION="$version" DATE_UTC="$date_utc" python - <<'PY'
          from pathlib import Path
          import os
          import re

          changelog = Path("CHANGELOG.md")
          notes = Path(os.environ["NOTES_FILE"]).read_text(encoding="utf-8").strip()
          version = os.environ["VERSION"]
          date_utc = os.environ["DATE_UTC"]

          # The generator emits a body that already starts with its own
          # "## <version>" heading. Strip that leading heading so the section
          # carries exactly one "## <version> - <date>" heading (no adjacent
          # duplicate H2).
          notes = re.sub(r"^##\s+.*(?:\r?\n)+", "", notes, count=1)

          section = f"\n## {version} - {date_utc}\n\n{notes}\n"
          content = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased"
          if marker in content:
            head, tail = content.split(marker, 1)
            # `tail` still begins with the previous Unreleased body. Drop it and
            # keep only history from the next release heading so the stale body
            # does not leak in after the new release section.
            next_heading = re.search(r"(?m)^##\s", tail)
            history = tail[next_heading.start():] if next_heading else ""
            updated = f"{head}{marker}\n\n- No unreleased changes.\n{section}\n{history}"
          else:
            updated = f"{content.rstrip()}\n{section}"
          changelog.write_text(updated, encoding="utf-8")
          PY
          fi

          if git diff --quiet -- CHANGELOG.md "$latest_notes_file"; then
            echo "Release documentation is already current for ${version}; skipping PR creation."
            echo "should_open_pr=false" >> "$GITHUB_OUTPUT"
            echo "branch_name=" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            cat "$notes_file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch_name="automation/changelog-${version}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch_name"
          git add CHANGELOG.md "$latest_notes_file"
          git commit -m "docs(release): publish release notes for ${version}"
          git push origin "$branch_name"

          echo "should_open_pr=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat "$notes_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated release notes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-changelog-notes
          path: reports/release-*.md
          retention-days: 14
          if-no-files-found: warn

      - name: Open or update changelog pull request
        if: steps.prepare.outputs.should_open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          SOURCE_ISSUE: "3541"
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.prepare.outputs.branch_name }}"
          version="${{ steps.prepare.outputs.version }}"
          title="docs(changelog): add release notes for ${version}"
          git fetch --no-tags origin main
          read -r expected_files expected_lines < <(git diff --numstat origin/main...HEAD | awk '
            BEGIN { files=0; lines=0 }
            { files++; if ($1 ~ /^[0-9]+$/) lines += $1; if ($2 ~ /^[0-9]+$/) lines += $2 }
            END { print files, lines }
          ')
          body_file=.automation-pr-body.md
          sed 's/^          //' > "$body_file" <<EOF
          # Summary

          Automated changelog generation for release \`${version}\`.

          Linked issue / spec: #${SOURCE_ISSUE}

          ## Validation

          | Proof / verification command or artifact | Result | Requirement covered |
          |---|---|---|
          | \`.github/workflows/release-changelog-generation.yml\` generated \`CHANGELOG.md\` and \`reports/release-notes/latest.md\` | pending CI | Release changelog and latest release notes refreshed |

          ## Intake Contract

          ### Design

          | Order of work | Files that change | Planned change / acceptance |
          |---|---|---|
          | 1 | \`CHANGELOG.md\`, \`reports/release-notes/latest.md\` | Publish the generated changelog section and latest release notes for the release. |

          Change scope: individual
          Source issues: #${SOURCE_ISSUE}
          Independently deliverable units: 1
          Unit inventory: release changelog and latest notes refresh
          Expected files: ${expected_files}
          Expected changed lines (additions + deletions): ${expected_lines}
          Classification rationale: Single generated release documentation refresh produced by the release changelog workflow.
          Mechanical batch exception evidence: none

          ### Derived Classification

          Use the current machine-derived labels/check output.

          ## Governance

          Governance reference: \`docs/reference/governance-contract.md\`

          ## Risk and Rollout

          - Risks / blast radius: Generated release documentation update only.
          - Rollout plan: Merge after required checks pass.
          - Rollback plan: Revert the generated release documentation refresh commit.
          EOF
          node scripts/validate-pr-intake-preflight.cjs "$body_file" origin/main HEAD
          gh label create skip-release-label-gate --color ededed --description "Exempt automation-only PRs from release label gate" --force || true

          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number' || true)"
          if [[ -n "$existing" ]]; then
            echo "Updating existing changelog PR #$existing for branch $branch"
            gh pr edit "$existing" --title "$title" --body-file "$body_file" --add-label skip-release-label-gate
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$body_file" --label skip-release-label-gate
          fi

  cleanup-automation-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && startsWith(github.head_ref, 'automation/changelog-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete closed changelog automation branch
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          open_count="$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')"
          if [[ "$open_count" != "0" ]]; then
            echo "Open PR still uses $BRANCH; leaving branch in place"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
