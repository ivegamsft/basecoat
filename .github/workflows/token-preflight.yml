name: "BaseCoat - Production Token Preflight"

# Validates PRODUCTION_REPO_TOKEN readiness before a release tag is pushed.
# Run on demand via workflow_dispatch to confirm the token is safe before tagging.
# Called via workflow_call by publish-to-production.yml as a blocking preflight gate.
on:
  workflow_dispatch: {}
  workflow_call:
    secrets:
      PRODUCTION_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  validate-token-configured:
    name: Validate token is configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PRODUCTION_REPO_TOKEN secret is set
        env:
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PRODUCTION_TOKEN:-}" ]]; then
            echo "::error title=Missing PRODUCTION_REPO_TOKEN::Secret PRODUCTION_REPO_TOKEN is not configured in IBuySpy-Shared/basecoat."
            echo "::error::Remediation:"
            echo "::error::  1. Sign in to GitHub as ivegamsft"
            echo "::error::  2. Settings > Developer settings > Fine-grained personal access tokens > Generate new token"
            echo "::error::  3. Resource owner: ivegamsft  |  Repository: ivegamsft/basecoat"
            echo "::error::  4. Permissions: Contents R/W + Administration R/W + Workflows R/W"
            echo "::error::  5. gh secret set PRODUCTION_REPO_TOKEN --repo IBuySpy-Shared/basecoat"
            echo "::error::Reference: https://github.com/IBuySpy-Shared/basecoat/issues/575"
            exit 1
          fi

          echo "PRODUCTION_REPO_TOKEN is configured."

  verify-push-access:
    name: Verify token has push access to ivegamsft/basecoat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-token-configured
    steps:
      - name: Probe GitHub API for push permissions
        env:
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -s -o repo.json -w "%{http_code}" \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ivegamsft/basecoat")

          case "${HTTP_CODE}" in
            401)
              echo "::error title=Token authentication failed::PRODUCTION_REPO_TOKEN returned HTTP 401 (unauthorized). The token may be expired or revoked."
              echo "::error::Remediation: regenerate the PAT as ivegamsft, then:"
              echo "::error::  gh secret set PRODUCTION_REPO_TOKEN --repo IBuySpy-Shared/basecoat"
              echo "::error::Reference: https://github.com/IBuySpy-Shared/basecoat/issues/575"
              exit 1
              ;;
            403)
              echo "::error title=Token forbidden::PRODUCTION_REPO_TOKEN returned HTTP 403. Token lacks access to ivegamsft/basecoat."
              echo "::error::Ensure the PAT resource owner is ivegamsft (not IBuySpy-Shared org)."
              echo "::error::Reference: https://github.com/IBuySpy-Shared/basecoat/issues/575"
              exit 1
              ;;
            404)
              echo "::error title=Repository not found::PRODUCTION_REPO_TOKEN returned HTTP 404 for ivegamsft/basecoat. Token cannot read this repository."
              echo "::error::Remediation: ensure the PAT resource owner is ivegamsft and repo is ivegamsft/basecoat."
              echo "::error::Reference: https://github.com/IBuySpy-Shared/basecoat/issues/575"
              exit 1
              ;;
            200)
              echo "API probe succeeded (HTTP 200)."
              ;;
            *)
              echo "::error title=Unexpected API response::GitHub API returned HTTP ${HTTP_CODE} for ivegamsft/basecoat."
              echo "::error::Check GitHub status at https://www.githubstatus.com/ and retry."
              exit 1
              ;;
          esac

          PUSH_ACCESS=$(python3 - <<'PYEOF'
          import json

          with open("repo.json", encoding="utf-8") as f:
              d = json.load(f)
          perms = d.get("permissions", {})
          print("true" if (perms.get("push") or perms.get("admin")) else "false")
          PYEOF
          ) || PUSH_ACCESS="false"

          if [[ "${PUSH_ACCESS}" != "true" ]]; then
            PUSH_VAL=$(python3 -c "import json; d=json.load(open('repo.json')); print(d.get('permissions',{}).get('push','false'))" 2>/dev/null || echo "false")
            echo "::error title=Token lacks push access::PRODUCTION_REPO_TOKEN cannot push to ivegamsft/basecoat (permissions.push=${PUSH_VAL})."
            echo "::error::The PAT must be created by the ivegamsft account owner, not by an IBuySpy-Shared org member."
            echo "::error::Steps to fix:"
            echo "::error::  1. Sign in to GitHub as ivegamsft"
            echo "::error::  2. Settings > Developer settings > Fine-grained personal access tokens"
            echo "::error::  3. Generate new token: resource owner=ivegamsft, repo=ivegamsft/basecoat"
            echo "::error::  4. Permissions: Contents R/W + Administration R/W + Workflows R/W"
            echo "::error::  5. gh secret set PRODUCTION_REPO_TOKEN --repo IBuySpy-Shared/basecoat"
            echo "::error::Reference: https://github.com/IBuySpy-Shared/basecoat/issues/575"
            exit 1
          fi

          echo "Preflight passed: PRODUCTION_REPO_TOKEN is present, API-accessible, and has push access to ivegamsft/basecoat."
          echo "It is safe to proceed with release tagging."
