name: "BaseCoat - Dependency Audit"

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      audit_level:
        description: "Minimum severity level to flag (low, moderate, high, critical)"
        type: choice
        options:
          - low
          - moderate
          - high
          - critical
        default: moderate

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      findings_count: ${{ steps.audit.outputs.findings_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Run dependency audit across lockfiles
        id: audit
        shell: bash
        env:
          AUDIT_LEVEL: ${{ inputs.audit_level || 'moderate' }}
        run: |
          set -euo pipefail
          mkdir -p reports
          report="reports/dependency-audit.md"
          json="reports/dependency-audit.json"
          echo '{"generatedAt":"","auditLevel":"","packages":[]}' > "$json"

          {
            echo "# Dependency Audit Report"
            echo ""
            echo "- Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Audit level: ${AUDIT_LEVEL}"
            echo ""
            echo "| Package | Critical | High | Moderate | Low | Info |"
            echo "|---|---:|---:|---:|---:|---:|"
          } > "$report"

          findings=0
          lockfiles=$(git ls-files '**/package-lock.json' ':!:**/node_modules/**')
          if [[ -z "$lockfiles" ]]; then
            echo "| *(none found)* | 0 | 0 | 0 | 0 | 0 |" >> "$report"
            echo "findings_count=0" >> "$GITHUB_OUTPUT"
            jq --arg generated "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --arg level "$AUDIT_LEVEL" \
              '.generatedAt=$generated | .auditLevel=$level' "$json" > "$json.tmp" && mv "$json.tmp" "$json"
            exit 0
          fi

          for lockfile in $lockfiles; do
            pkg_dir="$(dirname "$lockfile")"
            pkg_name="$pkg_dir"
            out_file="reports/$(echo "$pkg_dir" | tr '/.' '__')-audit.json"
            if [[ ! -f "$out_file" ]]; then
              npm audit --prefix "$pkg_dir" --package-lock-only --audit-level="$AUDIT_LEVEL" --json > "$out_file" 2>/dev/null || true
            fi

            critical=$(jq -r '.metadata.vulnerabilities.critical // 0' "$out_file" 2>/dev/null || echo 0)
            high=$(jq -r '.metadata.vulnerabilities.high // 0' "$out_file" 2>/dev/null || echo 0)
            moderate=$(jq -r '.metadata.vulnerabilities.moderate // 0' "$out_file" 2>/dev/null || echo 0)
            low=$(jq -r '.metadata.vulnerabilities.low // 0' "$out_file" 2>/dev/null || echo 0)
            info=$(jq -r '.metadata.vulnerabilities.info // 0' "$out_file" 2>/dev/null || echo 0)
            total=$((critical + high + moderate + low + info))

            findings=$((findings + total))
            echo "| \`$pkg_name\` | $critical | $high | $moderate | $low | $info |" >> "$report"

            jq --arg pkg "$pkg_name" --argjson critical "$critical" --argjson high "$high" --argjson moderate "$moderate" --argjson low "$low" --argjson info "$info" \
              '.packages += [{"package":$pkg,"critical":$critical,"high":$high,"moderate":$moderate,"low":$low,"info":$info}]' "$json" > "$json.tmp" && mv "$json.tmp" "$json"
          done

          jq --arg generated "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --arg level "$AUDIT_LEVEL" \
            '.generatedAt=$generated | .auditLevel=$level' "$json" > "$json.tmp" && mv "$json.tmp" "$json"

          echo "" >> "$report"
          echo "**Total findings:** $findings" >> "$report"
          echo "findings_count=$findings" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-report
          path: reports/dependency-audit.*
          retention-days: 14

      - name: Open or update dependency audit issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FINDINGS_COUNT: ${{ steps.audit.outputs.findings_count || '0' }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Dependency audit report';
            const findings = Number(process.env.FINDINGS_COUNT || '0');
            const report = fs.readFileSync('reports/dependency-audit.md', 'utf8');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const current = existing.find(issue => issue.title === title);
            const body = `${report}\n\n---\nGenerated by \`.github/workflows/dependency-audit.yml\`.`;

            if (findings > 0) {
              if (current) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: current.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['dependencies', 'automated-report']
                });
              }
              return;
            }

            if (current) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: current.number,
                body: 'No dependency vulnerabilities detected in the latest run. Closing this tracking issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: current.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
