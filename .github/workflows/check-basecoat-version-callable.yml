name: "BaseCoat - Check BaseCoat Version"

on:
  workflow_call:
    inputs:
      stage_path:
        description: Path to synced BaseCoat assets
        type: string
        default: .github/base-coat
      alert_threshold:
        description: Number of minor versions behind before alerting
        type: number
        default: 1
      source_repo:
        description: >-
          Source BaseCoat repository in owner/repo format (for example,
          YOUR-ORG/basecoat). This is the repository whose releases define the
          latest BaseCoat version. It must be passed explicitly; it is not
          derived from the calling workflow reference, because for a callable
          distributed into a consumer repository that reference resolves to the
          consumer rather than to BaseCoat.
        type: string
        required: true
    secrets:
      fetch_token:
        description: >-
          Token with read access to the source repository releases. Required
          when the source repository is private or internal; the default
          GITHUB_TOKEN cannot read releases across repositories.
        required: false
jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Read consumer version
        id: consumer
        run: |
          VERSION_FILE="${{ inputs.stage_path }}/version.json"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "No version.json found at $VERSION_FILE"
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION=$(jq -r '.version' "$VERSION_FILE")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Consumer BaseCoat version: $VERSION"

      - name: Get latest BaseCoat release
        id: latest
        env:
          SOURCE_REPO_INPUT: ${{ inputs.source_repo }}
          FETCH_TOKEN: ${{ secrets.fetch_token }}
          GH_TOKEN_DEFAULT: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_REPO="$SOURCE_REPO_INPUT"
          if [ -z "$SOURCE_REPO" ]; then
            echo "::error::The 'source_repo' input is required (owner/repo of the BaseCoat source repository whose releases define the latest version)."
            exit 1
          fi

          if [ -n "$FETCH_TOKEN" ]; then
            export GH_TOKEN="$FETCH_TOKEN"
          else
            export GH_TOKEN="$GH_TOKEN_DEFAULT"
          fi

          if ! LATEST=$(gh release list --repo "$SOURCE_REPO" --limit 1 --json tagName -q '.[0].tagName' 2>release_err.log); then
            echo "::error::Failed to read releases from $SOURCE_REPO. If the source repository is private or internal, pass a 'fetch_token' secret with release read access."
            cat release_err.log >&2 || true
            exit 1
          fi
          LATEST="${LATEST#v}"
          if [ -z "$LATEST" ]; then
            echo "::error::No releases found for $SOURCE_REPO. A published release is required for drift detection."
            exit 1
          fi
          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest BaseCoat version: $LATEST"

      - name: Compare versions
        id: compare
        run: |
          CONSUMER="${{ steps.consumer.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          THRESHOLD="${{ inputs.alert_threshold }}"

          # Extract minor version numbers
          CONSUMER_MINOR=$(echo "$CONSUMER" | cut -d. -f2)
          LATEST_MINOR=$(echo "$LATEST" | cut -d. -f2)
          CONSUMER_MAJOR=$(echo "$CONSUMER" | cut -d. -f1)
          LATEST_MAJOR=$(echo "$LATEST" | cut -d. -f1)

          DRIFT=0
          if [ "$LATEST_MAJOR" -gt "$CONSUMER_MAJOR" ]; then
            DRIFT=$(( (LATEST_MAJOR - CONSUMER_MAJOR) * 100 + LATEST_MINOR ))
          elif [ "$LATEST_MAJOR" -eq "$CONSUMER_MAJOR" ]; then
            DRIFT=$(( LATEST_MINOR - CONSUMER_MINOR ))
          fi

          echo "drift=$DRIFT" >> $GITHUB_OUTPUT
          echo "needs_alert=$([ $DRIFT -ge $THRESHOLD ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "consumer_version=$CONSUMER" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT
          echo "Version drift: $DRIFT minor versions"

      - name: Open or update drift issue
        if: steps.compare.outputs.needs_alert == 'true'
        run: |
          CONSUMER="${{ steps.compare.outputs.consumer_version }}"
          LATEST="${{ steps.compare.outputs.latest_version }}"
          DRIFT="${{ steps.compare.outputs.drift }}"
          TITLE="chore: BaseCoat upgrade available (v${CONSUMER} → v${LATEST})"

          # Check for existing open issue (idempotent)
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE" --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Existing issue #$EXISTING found, updating comment"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Re-checked on $(date -u '+%Y-%m-%d'): still $DRIFT versions behind. Latest: v${LATEST}, current: v${CONSUMER}."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "## BaseCoat Upgrade Available\n\nThis repo's BaseCoat assets are out of date.\n\n| | Version |\n|---|---|\n| **Current** | v${CONSUMER} |\n| **Latest** | v${LATEST} |\n| **Versions behind** | ${{ steps.compare.outputs.drift }} |\n\n## How to upgrade\n\n\`\`\`bash\ncurl -fsSL https://raw.githubusercontent.com/${{ steps.latest.outputs.source_repo }}/main/sync.sh | bash\n\`\`\`\n\nOr manually: download the [latest release](https://github.com/${{ steps.latest.outputs.source_repo }}/releases/latest) and run \`sync.ps1\` / \`sync.sh\`.\n\n---\n*Opened automatically by the BaseCoat version drift detector.*" \
              --label "maintenance"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
