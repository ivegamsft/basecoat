name: "BaseCoat - Extension Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "mcp/basecoat-extension/**"
      - "infra/extension/**"
      - ".github/workflows/extension-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mcp/basecoat-extension/**"
      - "infra/extension/**"
      - ".github/workflows/extension-deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: git SHA)"
        required: false
        type: string
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options: ["production", "prod", "staging", "dev"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/basecoat-extension
  EXTENSION_AZURE_LOCATION: ${{ vars.EXTENSION_AZURE_LOCATION || 'eastus' }}

jobs:
  build-push:
    name: Build and push extension image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/basecoat-extension:${{ steps.meta.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/basecoat-extension
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || '' }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: mcp/basecoat-extension
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy extension to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-push
    if: ${{ github.event_name != 'pull_request' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && ((github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'production') && 'production' || github.event.inputs.environment) || 'production' }}
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'production' && 'prod' || github.event.inputs.environment) || 'prod' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate extension resource group is configured
        run: |
          if [[ -z "${{ secrets.EXTENSION_RESOURCE_GROUP }}" ]]; then
            echo "::error::ResourceGroup name must be set via 'EXTENSION_RESOURCE_GROUP' secret."
            echo "::error::Configure this secret in repository settings before running extension deploy."
            echo "::error::For production deployment, ensure the resource group is pre-provisioned with appropriate RBAC roles for the deployment identity."
            exit 1
          fi
          echo "✓ Resource group name configured: ${{ secrets.EXTENSION_RESOURCE_GROUP }}"

      - name: Set up Node.js for policy preflight
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Build operation context resolver
        working-directory: skills/operation-context-resolver
        run: |
          npm ci --no-audit --prefer-offline
          npm run build

      - name: Resolve operation context
        id: op-context
        shell: bash
        run: |
          set -euo pipefail

          node skills/operation-context-resolver/dist/cli.js resolve \
            --repo-root "${GITHUB_WORKSPACE}" \
            --github-ref "${GITHUB_REF}" \
            --github-event-name "${GITHUB_EVENT_NAME}" \
            --workflow-environment "${TARGET_ENV}" \
            --user-intent "deploy extension image to ${TARGET_ENV}" \
            --output "${RUNNER_TEMP}/operation-context.json"

          echo "context_path=${RUNNER_TEMP}/operation-context.json" >> "$GITHUB_OUTPUT"

      - name: Enforce operation context policy
        shell: bash
        run: |
          set -euo pipefail

          CONTEXT_PATH="${{ steps.op-context.outputs.context_path }}"
          TARGET_CONTEXT_ENV="$(jq -r '.target_environment' "${CONTEXT_PATH}")"
          MODE="$(jq -r '.mode' "${CONTEXT_PATH}")"
          GITHUB_ENVIRONMENT="$(jq -r '.github_environment' "${CONTEXT_PATH}")"
          APPROVAL_REQUIRED="$(jq -r '.human_approval_required' "${CONTEXT_PATH}")"

          if jq -e '.errors and (.errors | length > 0)' "${CONTEXT_PATH}" >/dev/null; then
            echo "::error::operation-context-resolver returned errors."
            jq -r '.errors[]' "${CONTEXT_PATH}" | sed 's/^/::error::/'
            exit 1
          fi

          if ! jq -e '.allowed_actions | index("deploy_app")' "${CONTEXT_PATH}" >/dev/null; then
            echo "::error::deploy_app is not allowed for ${TARGET_CONTEXT_ENV} (${MODE})."
            exit 1
          fi

          if jq -e '.blocked_actions | index("deploy_app")' "${CONTEXT_PATH}" >/dev/null; then
            echo "::error::deploy_app is blocked for ${TARGET_CONTEXT_ENV} (${MODE})."
            exit 1
          fi

          if [[ "${TARGET_CONTEXT_ENV}" != "${TARGET_ENV}" ]]; then
            echo "::error::Resolver target environment (${TARGET_CONTEXT_ENV}) does not match workflow target (${TARGET_ENV})."
            exit 1
          fi

          if [[ "${APPROVAL_REQUIRED}" == "true" ]]; then
            echo "::error::Resolver policy requires human approval for ${TARGET_CONTEXT_ENV} (${MODE}); automated deploy is blocked."
            exit 1
          fi

          {
            echo "### Operation context preflight"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Target environment | \`${TARGET_CONTEXT_ENV}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| GitHub environment | \`${GITHUB_ENVIRONMENT}\` |"
            echo "| Human approval required | \`${APPROVAL_REQUIRED}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build environment drift auditor
        working-directory: skills/environment-audit-drift
        run: |
          npm ci --no-audit --prefer-offline
          npm run build

      - name: Environment drift preflight (gating)
        id: drift-preflight
        shell: bash
        run: |
          set -euo pipefail

          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          node skills/environment-audit-drift/dist/cli.js \
            --config .github/environment-map.yml \
            --subscription "${SUBSCRIPTION_ID}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --output "${RUNNER_TEMP}/drift-report.json"

          TARGET_CRITICAL=$(jq --arg env "${TARGET_ENV}" '[.findings[] | select(.environment == $env and .severity == "critical")] | length' "${RUNNER_TEMP}/drift-report.json")
          TARGET_HIGH=$(jq --arg env "${TARGET_ENV}" '[.findings[] | select(.environment == $env and .severity == "high")] | length' "${RUNNER_TEMP}/drift-report.json")
          TARGET_TOTAL=$(jq --arg env "${TARGET_ENV}" '[.findings[] | select(.environment == $env)] | length' "${RUNNER_TEMP}/drift-report.json")

          {
            echo "target_critical=${TARGET_CRITICAL}"
            echo "target_high=${TARGET_HIGH}"
            echo "target_total=${TARGET_TOTAL}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Environment drift preflight (gating)"
            echo ""
            echo "| Target | Critical | High | Findings |"
            echo "|---|---:|---:|---:|"
            echo "| \`${TARGET_ENV}\` | ${TARGET_CRITICAL} | ${TARGET_HIGH} | ${TARGET_TOTAL} |"
            echo ""
            echo "> Critical findings block deployment for the target environment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce target-environment drift gate
        shell: bash
        run: |
          set -euo pipefail

          TARGET_CRITICAL="${{ steps.drift-preflight.outputs.target_critical }}"
          if [[ "${TARGET_CRITICAL}" -gt 0 ]]; then
            echo "::error::Critical environment drift detected for ${TARGET_ENV} (${TARGET_CRITICAL} finding(s)); see drift-report.json artifact and step summary for details."
            exit 1
          fi

      - name: Upload drift preflight report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: extension-drift-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/drift-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Verify GHCR image pull auth
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          docker pull "${{ needs.build-push.outputs.image_ref }}"

      - name: Verify resource group exists
        run: |
          if ! az group show \
               --name "${{ secrets.EXTENSION_RESOURCE_GROUP }}" \
               --output none 2>/dev/null; then
            echo "::error::Resource group '${{ secrets.EXTENSION_RESOURCE_GROUP }}' does not exist."
            echo "::error::Pre-provision it before running this workflow — the deploy identity does not have 'Microsoft.Resources/subscriptions/resourcegroups/write'."
            exit 1
          fi
          echo "Resource group '${{ secrets.EXTENSION_RESOURCE_GROUP }}' verified."

      - name: Staging what-if validation
        if: ${{ env.TARGET_ENV == 'staging' }}
        run: |
          az deployment group what-if \
            --resource-group "${{ secrets.EXTENSION_RESOURCE_GROUP }}" \
            --template-file infra/extension/main.bicep \
            --name "extension-staging-whatif-${{ github.run_id }}-${{ github.run_attempt }}" \
            --parameters \
              imageTag="${{ needs.build-push.outputs.image_tag }}" \
              imageRepo="${{ steps.owner.outputs.lc }}/basecoat-extension" \
              environment="${{ env.TARGET_ENV }}" \
              registryUsername="${{ github.actor }}" \
              registryPassword="${{ secrets.GITHUB_TOKEN }}" \
            --result-format ResourceIdOnly \
            --no-pretty-print

      - name: Deploy / update Bicep infrastructure
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5
        id: infra
        with:
          resourceGroupName: ${{ secrets.EXTENSION_RESOURCE_GROUP }}
          template: infra/extension/main.bicep
          parameters: >
            imageTag=${{ needs.build-push.outputs.image_tag }}
            imageRepo=${{ steps.owner.outputs.lc }}/basecoat-extension
            environment=${{ env.TARGET_ENV }}
            registryUsername=${{ github.actor }}
            registryPassword=${{ secrets.GITHUB_TOKEN }}
          deploymentName: extension-${{ github.run_number }}

      - name: Verify Container App readiness
        run: |
          if [[ "${{ env.TARGET_ENV }}" == "prod" ]]; then
            APP_NAME="bcext-app"
          else
            APP_NAME="bcext-app-${{ env.TARGET_ENV }}"
          fi

          RUNNING_STATUS=$(az containerapp show \
            --resource-group "${{ secrets.EXTENSION_RESOURCE_GROUP }}" \
            --name "${APP_NAME}" \
            --query "properties.runningStatus" -o tsv)
          LATEST_READY_REVISION=$(az containerapp show \
            --resource-group "${{ secrets.EXTENSION_RESOURCE_GROUP }}" \
            --name "${APP_NAME}" \
            --query "properties.latestReadyRevisionName" -o tsv)

          echo "Container App: ${APP_NAME}"
          echo "Running status: ${RUNNING_STATUS}"
          echo "Latest ready revision: ${LATEST_READY_REVISION}"

          if [[ "${RUNNING_STATUS}" != "Running" ]]; then
            echo "::error::Container App is not running (status: ${RUNNING_STATUS})"
            exit 1
          fi

          if [[ -z "${LATEST_READY_REVISION}" || "${LATEST_READY_REVISION}" == "null" ]]; then
            echo "::error::No ready revision detected for ${APP_NAME}"
            exit 1
          fi

      - name: Smoke test — health endpoint
        run: |
          FQDN="${{ steps.infra.outputs.fqdn }}"
          URL="https://${FQDN}/health"
          echo "Smoke testing: ${URL}"

          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
            echo "  Attempt ${i}: HTTP ${STATUS}"
            if [[ "${STATUS}" == "200" ]]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Health check failed after 5 attempts (last status: ${STATUS})"
          exit 1
