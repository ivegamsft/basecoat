name: "Runner Health Observability"

on:
  pull_request:
    paths:
      - ".github/workflows/runner-health-observability.yml"
      - ".github/workflow-runner-capability-classes.json"
      - "scripts/report-runner-health.ps1"
      - "scripts/audit-workflow-runner-capabilities.ps1"
      - "docs/operations/workflow-runner-routing.md"
      - "docs/operations/runner-health-observability.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish-to-production.yml"
      - ".github/workflows/package-basecoat.yml"
      - ".github/workflows/docs-production.yml"
      - ".github/workflows/close-production-issues.yml"
      - ".github/workflows/portal-deploy.yml"
      - ".github/workflows/mcp-deploy.yml"
      - ".github/workflows/extension-deploy.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of workflow history to analyze"
        required: false
        default: "14"
      queue_warn_seconds:
        description: "Queue delay threshold in seconds"
        required: false
        default: "300"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-health:
    name: Runner health and queue observability
    runs-on: ${{ vars.RUNNER_RELEASE || vars.RUNNER_DEPLOY || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Generate markdown runner-health report
        shell: pwsh
        env:
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback_days || '14' }}
          QUEUE_WARN_SECONDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.queue_warn_seconds || '300' }}
        run: |
          ./scripts/report-runner-health.ps1 `
            -Repository "${{ github.repository }}" `
            -LookbackDays ([int]$env:LOOKBACK_DAYS) `
            -QueueWarnSeconds ([int]$env:QUEUE_WARN_SECONDS) `
            -OutputFormat markdown `
            -OutputPath "runner-health-report.md"

      - name: Generate json runner-health report
        shell: pwsh
        env:
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback_days || '14' }}
          QUEUE_WARN_SECONDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.queue_warn_seconds || '300' }}
        run: |
          ./scripts/report-runner-health.ps1 `
            -Repository "${{ github.repository }}" `
            -LookbackDays ([int]$env:LOOKBACK_DAYS) `
            -QueueWarnSeconds ([int]$env:QUEUE_WARN_SECONDS) `
            -OutputFormat json `
            -OutputPath "runner-health-report.json"

      - name: Publish runner-health summary
        shell: bash
        run: |
          set -euo pipefail
          cat runner-health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runner-health artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-health-observability
          path: |
            runner-health-report.md
            runner-health-report.json
          if-no-files-found: error
          retention-days: 14
