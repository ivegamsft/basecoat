name: "BaseCoat - PR Flow Hygiene"

on:
  pull_request_target:
    types:
      - ready_for_review
      - synchronize
      - reopened
      - review_requested
      - review_request_removed
      - assigned
      - unassigned
      - labeled
      - unlabeled
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      wip_limit:
        description: "Max ready-for-review PRs before WIP warning"
        required: false
        default: "20"
        type: string
      draft_drift_days:
        description: "Draft PR age threshold (days) for drift nudges"
        required: false
        default: "14"
        type: string
      ready_stale_days:
        description: "Ready-for-review inactivity threshold (days)"
        required: false
        default: "7"
        type: string
      max_items:
        description: "Max open PRs to evaluate"
        required: false
        default: "200"
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: PR readiness routing and weekly hygiene report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Route PR readiness events and publish weekly outcomes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WIP_LIMIT: ${{ inputs.wip_limit || '20' }}
          DRAFT_DRIFT_DAYS: ${{ inputs.draft_drift_days || '14' }}
          READY_STALE_DAYS: ${{ inputs.ready_stale_days || '7' }}
          MAX_ITEMS: ${{ inputs.max_items || '200' }}
        with:
          script: |
            const weeklyMarker = '<!-- pr-flow-hygiene:weekly:v2 -->';
            const eventMarker = '<!-- pr-flow-hygiene:event:v1 -->';
            const blockedLabel = 'pr-readiness-blocked';
            const toInt = (value, fallback) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
            };
            const daysBetween = (later, earlier) =>
              Math.floor((later.getTime() - earlier.getTime()) / (24 * 60 * 60 * 1000));
            const startOfIsoWeekUtc = date => {
              const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
              const day = d.getUTCDay() || 7;
              d.setUTCDate(d.getUTCDate() - day + 1);
              return d;
            };
            const normalizeLabels = labels =>
              labels
                .map(label => (typeof label === 'string' ? label : label?.name || ''))
                .filter(Boolean);
            const isReleaseLabel = label => {
              const normalized = String(label || '').toLowerCase();
              return /^(wave:|sprint:|wave-|sprint-).+/.test(normalized) || normalized === 'wave/sprint';
            };
            const hasReleaseLabel = labels => normalizeLabels(labels).some(isReleaseLabel);
            const isHotfixBranch = ref => /^hotfix\//i.test(String(ref || ''));

            const upsertBotComment = async ({ issueNumber, marker, body }) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
                return 'updated';
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              return 'created';
            };

            const ensureLabelExists = async ({ name, color, description }) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (err) {
                if (err.status !== 404) {
                  throw err;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
              }
            };

            const setBlockedLabel = async (prNumber, enabled) => {
              if (enabled) {
                await ensureLabelExists({
                  name: blockedLabel,
                  color: 'B60205',
                  description: 'PR readiness loop found missing reviewer/owner/release metadata or BEHIND status'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: [blockedLabel]
                });
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: blockedLabel
                });
              } catch (err) {
                if (err.status !== 404) {
                  throw err;
                }
              }
            };

            const wipLimit = toInt(process.env.WIP_LIMIT, 20);
            const draftDriftDays = toInt(process.env.DRAFT_DRIFT_DAYS, 14);
            const readyStaleDays = toInt(process.env.READY_STALE_DAYS, 7);
            const maxItems = toInt(process.env.MAX_ITEMS, 200);
            const now = new Date();

            if (context.eventName === 'pull_request_target') {
              const prNumber = context.payload.pull_request?.number;
              if (!prNumber) {
                core.setFailed('pull_request_target event does not include pull_request.number.');
                return;
              }

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              const labels = normalizeLabels(pr.labels || []);
              const assigneeCount = pr.assignees?.length || 0;
              const reviewerCount = (pr.requested_reviewers?.length || 0) + (pr.requested_teams?.length || 0);
              const ageDays = daysBetween(now, new Date(pr.created_at));
              const idleDays = daysBetween(now, new Date(pr.updated_at));
              const reasons = [];
              const hotfixFastPath = !pr.draft && isHotfixBranch(pr.head?.ref);

              if (pr.draft) {
                if (ageDays >= draftDriftDays) {
                  reasons.push(`Draft age is ${ageDays} days (threshold: ${draftDriftDays}).`);
                }
              } else {
                if (!hotfixFastPath && reviewerCount === 0) {
                  reasons.push('No requested reviewer or reviewer team is set.');
                }
                if (!hotfixFastPath && assigneeCount === 0) {
                  reasons.push('No assignee is set for ownership handoff.');
                }
                if (!hasReleaseLabel(labels)) {
                  reasons.push('Missing release/planning label (wave:* or sprint:* policy).');
                }
                if (String(pr.mergeable_state || '').toLowerCase() === 'behind') {
                  reasons.push('PR mergeable_state is BEHIND; branch needs update before review can complete.');
                }
              }

              if (reasons.length > 0) {
                const mode = pr.draft ? 'draft-drift' : 'ready-routing';
                const body = [
                  eventMarker,
                  '## PR readiness routing nudge',
                  '',
                  `This PR was evaluated by the event-driven readiness loop on \`${context.payload.action || 'update'}\` and needs lifecycle action (\`${mode}\`).`,
                  ...reasons.map(reason => `- ${reason}`),
                  '',
                  'Deterministic escalation path:',
                  `- Label \`${blockedLabel}\` is applied while readiness requirements are incomplete.`,
                  '- Resolve the blockers listed above, then re-trigger by updating metadata or pushing a commit.',
                  '',
                  'Suggested next actions:',
                  '- Request reviewers (or a reviewer team).',
                  '- Confirm an assignee/owner.',
                  '- Add a release/planning label (wave:* or sprint:*).',
                  '- If BEHIND, update branch from base before final review.',
                  '',
                  '_Automated by BaseCoat PR readiness event loop._'
                ].join('\n');

                await setBlockedLabel(prNumber, true);
                const commentAction = await upsertBotComment({
                  issueNumber: prNumber,
                  marker: eventMarker,
                  body
                });

                core.summary
                  .addHeading('PR readiness event routing result')
                  .addTable([
                    [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                    ['PR', `#${prNumber}`],
                    ['Mode', mode],
                    ['Hotfix fast path', hotfixFastPath ? 'Yes' : 'No'],
                    ['Reasons', String(reasons.length)],
                    ['Comment', commentAction],
                    ['Blocked label', blockedLabel]
                  ])
                  .write();
                return;
              }

              await setBlockedLabel(prNumber, false);
              core.summary
                .addHeading('PR readiness event routing result')
                .addRaw(`PR #${prNumber} passed readiness checks for ${context.payload.action || 'update'}.\n`)
                .write();
              return;
            }

            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
              sort: 'updated',
              direction: 'asc'
            });

            const scanned = pullRequests.slice(0, maxItems);
            const draftDrift = [];
            const readyStale = [];
            const readyNoOwner = [];
            const readyNoReviewer = [];

            let openCount = 0;
            let draftCount = 0;
            let readyCount = 0;

            for (const pr of scanned) {
              openCount += 1;
              const createdAt = new Date(pr.created_at);
              const updatedAt = new Date(pr.updated_at);
              const ageDays = daysBetween(now, createdAt);
              const idleDays = daysBetween(now, updatedAt);
              const assigneeCount = pr.assignees?.length || 0;
              const reviewerCount = (pr.requested_reviewers?.length || 0) + (pr.requested_teams?.length || 0);
              const hotfixFastPath = isHotfixBranch(pr.head?.ref);
              const detail = {
                number: pr.number,
                title: pr.title,
                htmlUrl: pr.html_url,
                ageDays,
                idleDays,
                assigneeCount,
                reviewerCount,
                draft: Boolean(pr.draft),
                hotfixFastPath
              };

              if (detail.draft) {
                draftCount += 1;
                if (ageDays >= draftDriftDays) {
                  draftDrift.push(detail);
                }
                continue;
              }

              readyCount += 1;
              if (idleDays >= readyStaleDays) {
                readyStale.push(detail);
              }
              if (!hotfixFastPath && assigneeCount === 0) {
                readyNoOwner.push(detail);
              }
              if (!hotfixFastPath && reviewerCount === 0) {
                readyNoReviewer.push(detail);
              }
            }

            const actionMap = new Map();
            const addReason = (pr, reason) => {
              if (!actionMap.has(pr.number)) {
                actionMap.set(pr.number, { ...pr, reasons: [] });
              }
              actionMap.get(pr.number).reasons.push(reason);
            };

            for (const pr of draftDrift) {
              addReason(pr, `Draft age is ${pr.ageDays} days (threshold: ${draftDriftDays}).`);
            }
            for (const pr of readyStale) {
              addReason(pr, `No activity for ${pr.idleDays} days while ready for review (threshold: ${readyStaleDays}).`);
            }
            for (const pr of readyNoOwner) {
              addReason(pr, 'No assignee is set for ownership handoff.');
            }
            for (const pr of readyNoReviewer) {
              addReason(pr, 'No requested reviewer/team found.');
            }

            const actionCandidates = Array.from(actionMap.values())
              .sort((a, b) => b.idleDays - a.idleDays || b.ageDays - a.ageDays)
              .slice(0, 15);
            const remainingWipCount = actionMap.size;

            let nudgeCommentsUpserted = 0;
            for (const pr of actionCandidates) {
              const body = [
                weeklyMarker,
                '## PR lifecycle hygiene nudge',
                '',
                'This PR was flagged during the weekly full PR lifecycle sweep. Please address the following to avoid backlog drift:',
                ...pr.reasons.map(reason => `- ${reason}`),
                '',
                'Suggested next actions:',
                '- Confirm or assign an owner.',
                '- Request reviewers (or a reviewer team).',
                '- If this work is paused, close or convert to draft with a status note.',
                '',
                '_Automated by BaseCoat PR lifecycle hygiene workflow._'
              ].join('\n');

              await upsertBotComment({
                issueNumber: pr.number,
                marker: weeklyMarker,
                body
              });
              nudgeCommentsUpserted += 1;
            }

            const topRows = rows => rows
              .sort((a, b) => b.idleDays - a.idleDays || b.ageDays - a.ageDays)
              .slice(0, 10);

            const formatRows = rows => {
              if (rows.length === 0) {
                return '_None_';
              }
              return rows.map(pr => `- #${pr.number} (${pr.ageDays}d old, ${pr.idleDays}d idle) — ${pr.title}`).join('\n');
            };

            const weekStart = startOfIsoWeekUtc(now);
            const weekOf = weekStart.toISOString().slice(0, 10);
            const wipStatus = readyCount > wipLimit ? 'BREACH' : 'Within limit';
            const title = `PR Lifecycle Hygiene Report - Week of ${weekOf}`;

            const reportBody = [
              '# PR Lifecycle Hygiene Report',
              '',
              `- Week of: ${weekOf}`,
              `- Open PRs scanned: ${openCount}`,
              `- Draft PRs: ${draftCount}`,
              `- Ready-for-review PRs: ${readyCount}`,
              '',
              '## Guardrail status',
              '',
              '| Guardrail | Status | Value |',
              '|---|---|---|',
              `| Ready-for-review WIP limit | ${wipStatus} | ${readyCount}/${wipLimit} |`,
              `| Draft drift threshold | ${draftDrift.length > 0 ? 'Action needed' : 'Healthy'} | ${draftDrift.length} PR(s) >= ${draftDriftDays}d |`,
              `| Ready PR inactivity threshold | ${readyStale.length > 0 ? 'Action needed' : 'Healthy'} | ${readyStale.length} PR(s) >= ${readyStaleDays}d idle |`,
              `| Ownership coverage | ${readyNoOwner.length > 0 ? 'Action needed' : 'Healthy'} | ${readyNoOwner.length} ready PR(s) without assignee |`,
              `| Reviewer coverage | ${readyNoReviewer.length > 0 ? 'Action needed' : 'Healthy'} | ${readyNoReviewer.length} ready PR(s) without requested reviewer/team |`,
              `| Remaining WIP follow-up queue | ${remainingWipCount > 0 ? 'Action needed' : 'Healthy'} | ${remainingWipCount} PR(s) need explicit lifecycle action |`,
              '',
              '## Fixed-cadence triage outcomes',
              '',
              '- Event-driven readiness checks run on pull_request_target transitions; this weekly report is summary/audit only.',
              `- Nudge comments upserted this run: ${nudgeCommentsUpserted}`,
              `- Candidate PRs triaged this run: ${actionCandidates.length}`,
              `- Remaining WIP items needing explicit owner, reviewer, merge, or cleanup follow-up: ${remainingWipCount}`,
              '',
              '## Top draft-drift PRs',
              '',
              formatRows(topRows(draftDrift)),
              '',
              '## Top ready-but-stale PRs',
              '',
              formatRows(topRows(readyStale)),
              '',
              '## Top ready PRs without owner',
              '',
              formatRows(topRows(readyNoOwner)),
              '',
              '## Top ready PRs without reviewer',
              '',
              formatRows(topRows(readyNoReviewer)),
              '',
              '_Generated by `.github/workflows/pr-flow-hygiene.yml` for the full PR lifecycle._'
            ].join('\n');

            const existingReports = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
              per_page: 10
            });
            const existing = existingReports.find(issue => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: reportBody
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: reportBody
              });
            }

            core.summary
              .addHeading('PR lifecycle hygiene results')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Open PRs scanned', String(openCount)],
                ['Draft PRs', String(draftCount)],
                ['Ready PRs', String(readyCount)],
                ['Draft drift', `${draftDrift.length} (>=${draftDriftDays}d)`],
                ['Ready stale', `${readyStale.length} (>=${readyStaleDays}d idle)`],
                ['Ready without assignee', String(readyNoOwner.length)],
                ['Ready without reviewer', String(readyNoReviewer.length)],
                ['Remaining WIP queue', String(remainingWipCount)],
                ['Nudge comments upserted', String(nudgeCommentsUpserted)],
                ['WIP limit', `${readyCount}/${wipLimit}`]
              ])
              .write();
