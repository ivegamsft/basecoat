name: "BaseCoat - Issue Metadata Hygiene Audit"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit approved issues for metadata contract compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit approved and copilot-agent issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const TYPE_LABELS = new Set(['bug', 'enhancement', 'documentation', 'chore', 'security', 'question']);
            const PRIORITY_LABELS = new Set(['priority:critical', 'priority:high', 'priority:medium', 'priority:low']);
            const AGENT_ACTIONABLE_TYPES = new Set(['bug', 'enhancement', 'chore', 'documentation']);
            const BLOCKING_LABELS = new Set(['duplicate', 'invalid', 'wontfix']);
            const BLOCKING_AGENT_LABELS = new Set(['blocked', 'needs-info']);

            function checkContract(labels) {
              const labelSet = new Set(labels);
              const violations = [];

              const hasType = [...TYPE_LABELS].some(l => labelSet.has(l));
              if (!hasType) violations.push('missing type label');

              const hasPriority = [...PRIORITY_LABELS].some(l => labelSet.has(l));
              if (!hasPriority) violations.push('missing priority label');

              const hasBlocker = [...BLOCKING_LABELS].some(l => labelSet.has(l));
              if (hasBlocker) {
                const blocker = [...BLOCKING_LABELS].find(l => labelSet.has(l));
                violations.push(`blocking label present: \`${blocker}\``);
              }

              return violations;
            }

            function checkAgentContract(labels) {
              const labelSet = new Set(labels);
              const violations = checkContract(labels);

              const typLabel = [...TYPE_LABELS].find(l => labelSet.has(l));
              if (typLabel && !AGENT_ACTIONABLE_TYPES.has(typLabel)) {
                violations.push(`type \`${typLabel}\` is not agent-actionable (questions are not implementation tasks)`);
              }

              const hasAgentBlocker = [...BLOCKING_AGENT_LABELS].some(l => labelSet.has(l));
              if (hasAgentBlocker) {
                const blocker = [...BLOCKING_AGENT_LABELS].find(l => labelSet.has(l));
                violations.push(`agent-blocking label present: \`${blocker}\``);
              }

              return violations;
            }

            // Fetch issues with approved or copilot-agent label
            const allIssues = [];
            for await (const response of github.paginate.iterator(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'approved',
                per_page: 100,
              }
            )) {
              allIssues.push(...response.data.filter(i => !i.pull_request));
            }

            // De-duplicate by number
            const issueMap = new Map();
            for (const issue of allIssues) issueMap.set(issue.number, issue);

            // Also fetch copilot-agent issues (not already in map)
            for await (const response of github.paginate.iterator(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'copilot-agent',
                per_page: 100,
              }
            )) {
              for (const issue of response.data) {
                if (!issue.pull_request) issueMap.set(issue.number, issue);
              }
            }

            const violations = [];

            for (const issue of issueMap.values()) {
              const labels = issue.labels.map(l => l.name);
              const hasApproved = labels.includes('approved');
              const hasCopilotAgent = labels.includes('copilot-agent');

              let issueViolations = [];

              if (hasCopilotAgent) {
                issueViolations = checkAgentContract(labels);
              } else if (hasApproved) {
                issueViolations = checkContract(labels);
              }

              if (issueViolations.length > 0) {
                violations.push({ issue, labels, violations: issueViolations });
              }
            }

            // Build summary
            core.summary.addHeading('Issue Metadata Hygiene Audit', 2);
            core.summary.addRaw(`\nAudited **${issueMap.size}** open issue(s) with \`approved\` or \`copilot-agent\` labels.\n\n`);

            if (violations.length === 0) {
              core.summary.addRaw('✅ All approved/copilot-agent issues satisfy the metadata contract.\n');
            } else {
              core.summary.addRaw(`⚠️ **${violations.length}** issue(s) violate the metadata contract and require cleanup:\n\n`);

              const tableRows = violations.map(v => [
                `[#${v.issue.number}](${v.issue.html_url})`,
                v.issue.title.slice(0, 60),
                v.labels.join(', '),
                v.violations.join('; ')
              ]);

              core.summary.addTable([
                [
                  { data: 'Issue', header: true },
                  { data: 'Title', header: true },
                  { data: 'Current Labels', header: true },
                  { data: 'Violations', header: true },
                ],
                ...tableRows
              ]);

              core.summary.addRaw('\n**Remediation:** Apply the required labels or remove the `approved`/`copilot-agent` label and re-triage.\n');
            }

            await core.summary.write();

            if (violations.length > 0) {
              core.setFailed(`${violations.length} issue(s) violate the metadata contract. See job summary for details.`);
            }
