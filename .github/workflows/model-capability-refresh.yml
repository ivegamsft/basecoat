name: "BaseCoat - Refresh Model Capability Catalog"

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: model-capability-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request'
    name: Refresh GitHub-supported model capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Refresh and validate catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh scripts/sync-model-capabilities.ps1 -Refresh
          pwsh tests/model-capability-tests.ps1

      - name: Commit model catalog drift
        id: drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'docs/reference/model-capabilities.json',
            'docs/reference/model-capabilities.md',
            'docs/reference/model-assignment-audit.md'
          )

          if (git diff --quiet -- $paths) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'changed=false'
            exit 0
          }

          $branch = 'automation/model-capability-refresh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B $branch
          git add -- $paths
          git commit -m 'docs(models): refresh capability catalog'
          git push --force-with-lease origin $branch

          Add-Content -Path $env:GITHUB_OUTPUT -Value 'changed=true'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "branch=$branch"

      - name: Open or update review pull request
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          BRANCH: ${{ steps.drift.outputs.branch }}
          SOURCE_ISSUE: "3531"
        shell: bash
        run: |
          set -euo pipefail
          title="docs(models): refresh capability catalog"
          git fetch --no-tags origin main
          read -r expected_files expected_lines < <(git diff --numstat origin/main...HEAD | awk '
            BEGIN { files=0; lines=0 }
            { files++; if ($1 ~ /^[0-9]+$/) lines += $1; if ($2 ~ /^[0-9]+$/) lines += $2 }
            END { print files, lines }
          ')
          body_file=.automation-pr-body.md
          body_template="$(cat <<'PR_BODY'
          # Summary

          Automated refresh of the public GitHub Copilot model baseline, capability comparison, and BaseCoat assignment audit from canonical GitHub Docs sources. Effective organization and user entitlement still requires authenticated runtime verification.

          Linked issue / spec: #__SOURCE_ISSUE__

          ## Validation

          | Proof / verification command or artifact | Result | Requirement covered |
          |---|---|---|
          | `pwsh scripts/sync-model-capabilities.ps1 -Refresh && pwsh tests/model-capability-tests.ps1` | pending CI | Model capability catalog refreshed and validated |

          ## Intake Contract

          ### Design

          | Order of work | Files that change | Planned change / acceptance |
          |---|---|---|
          | 1 | `docs/reference/model-capabilities.json`, `docs/reference/model-capabilities.md`, `docs/reference/model-assignment-audit.md` | Refresh generated model capability catalog, comparison documentation, and assignment audit. |

          Change scope: individual
          Source issues: #__SOURCE_ISSUE__
          Independently deliverable units: 1
          Unit inventory: model capability catalog refresh
          Expected files: __EXPECTED_FILES__
          Expected changed lines (additions + deletions): __EXPECTED_LINES__
          Classification rationale: Single generated model capability refresh produced by the scheduled model capability workflow.
          Mechanical batch exception evidence: none

          ### Derived Classification

          Use the current machine-derived labels/check output.

          ## Governance

          Governance reference: `docs/reference/governance-contract.md`

          ## Risk and Rollout

          - Risks / blast radius: Generated model capability reference documentation and catalog refresh.
          - Rollout plan: Merge after required checks pass.
          - Rollback plan: Revert the generated catalog refresh commit.
          PR_BODY
          )"
          body_template="${body_template//__SOURCE_ISSUE__/$SOURCE_ISSUE}"
          body_template="${body_template//__EXPECTED_FILES__/$expected_files}"
          body_template="${body_template//__EXPECTED_LINES__/$expected_lines}"
          printf '%s\n' "$body_template" | sed 's/^          //' > "$body_file"
          gh label create skip-release-label-gate --color ededed --description "Exempt automation-only PRs from release label gate" --force || true

          existing="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            echo "Updating existing model capability PR #$existing"
            gh pr edit "$existing" --title "$title" --body-file "$body_file" --add-label skip-release-label-gate
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body_file" --label skip-release-label-gate
          fi

  cleanup-automation-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.head_ref == 'automation/model-capability-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete closed model capability automation branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/model-capability-refresh
        run: |
          set -euo pipefail
          open_count="$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')"
          if [[ "$open_count" != "0" ]]; then
            echo "Open PR still uses $BRANCH; leaving branch in place"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
