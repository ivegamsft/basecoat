name: "BaseCoat - PR Intake Metadata"

# Author-time check for the PR body Design fields that merge eligibility enforces later.
# The PR body is untrusted: it is passed only through env and parsed by Node, never
# interpolated into shell. Read-only token, no secrets, no PR writes.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-intake-metadata:
    name: PR intake metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout evaluator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check-pr-intake-metadata.cjs
            .github/base-coat/scripts/pr-decomposition-evaluator.cjs
          sparse-checkout-cone-mode: false

      - name: Validate PR decomposition metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
        run: node scripts/check-pr-intake-metadata.cjs
