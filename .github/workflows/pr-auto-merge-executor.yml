name: "BaseCoat - PR Auto Merge Executor"

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - edited
  pull_request_review:
    types:
      - dismissed
  issue_comment:
    types:
      - created
      - edited
      - deleted
  issues:
    types:
      - labeled
      - unlabeled
      - edited
  workflow_run:
    workflows:
      - "BaseCoat - CI"
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate and auto-merge"
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  deployments: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && format('workflow-run-{0}', github.event.workflow_run.id) || github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id) || format('pr-{0}', github.event.pull_request.number || inputs.pr_number || github.ref) }}
  # Cancel only when the PR head changes. Label/edit storms must not abort a
  # live eligibility poll and leave BaseCoat merge eligibility unpublished.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) }}

jobs:
  route-ci-completion:
    name: Route successful CI completion
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reevaluate pull requests after required checks complete
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = String(context.payload.workflow_run?.head_sha || '');
            const workflowId = String(process.env.WORKFLOW_REF || '')
              .match(/\.github\/workflows\/([^@]+)@/)?.[1];
            if (!headSha || !workflowId) {
              throw new Error('Unable to resolve the completed CI head SHA or auto-merge workflow filename.');
            }

            const associatedPullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner,
                repo,
                commit_sha: headSha,
                per_page: 100
              }
            );
            const targetPullRequests = associatedPullRequests.filter(pullRequest =>
              pullRequest.state === 'open' &&
              pullRequest.base?.ref === 'main' &&
              pullRequest.head?.sha === headSha
            );
            for (const pullRequest of targetPullRequests) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: context.payload.repository?.default_branch || 'main',
                inputs: { pr_number: String(pullRequest.number) }
              });
              core.info(`Queued post-CI merge eligibility reevaluation for PR #${pullRequest.number}.`);
            }
            if (targetPullRequests.length === 0) {
              core.info(`No open main-targeting pull request is associated with CI head ${headSha}.`);
            }

  route-pr-acknowledgement:
    name: Route PR acknowledgement changes
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '/acknowledge-critical') ||
        contains(github.event.changes.body.from, '/acknowledge-critical')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reevaluate PR after acknowledgement mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(context.payload.issue?.number || 0);
            const action = String(context.payload.action || '');
            const parseAcknowledgement = body => {
              const match = String(body || '').trim().match(
                /^\/acknowledge-critical\s+([0-9a-f]{40})$/i
              );
              return match ? match[1].toLowerCase() : '';
            };
            const currentSha = parseAcknowledgement(context.payload.comment?.body);
            const previousSha = parseAcknowledgement(context.payload.changes?.body?.from);
            const acknowledgementAdded =
              action !== 'deleted' && Boolean(currentSha) && !previousSha;
            const acknowledgementReplaced =
              action === 'edited' &&
              Boolean(previousSha) &&
              Boolean(currentSha) &&
              previousSha !== currentSha;
            const acknowledgementRevoked =
              (action === 'deleted' && Boolean(currentSha)) ||
              (action === 'edited' && Boolean(previousSha) && !currentSha) ||
              acknowledgementReplaced;
            if (!prNumber || (!acknowledgementAdded && !acknowledgementRevoked)) {
              core.info('PR comment did not add or revoke an exact acknowledgement.');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            if (acknowledgementAdded) {
              const commentUser = context.payload.comment?.user;
              const commentLogin = String(commentUser?.login || '');
              if (commentUser?.type === 'Bot' || commentLogin.toLowerCase().endsWith('[bot]')) {
                core.info(`Ignoring acknowledgement addition from bot @${commentLogin || 'unknown'}.`);
                return;
              }
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: commentLogin
              });
              const permissionLevels = [permission.permission, permission.role_name]
                .map(level => String(level || '').toLowerCase());
              if (!permissionLevels.some(level => ['admin', 'maintain', 'write'].includes(level))) {
                core.info(`Ignoring acknowledgement addition from unqualified user @${commentLogin}.`);
                return;
              }
              if (currentSha !== String(pullRequest.head.sha || '').toLowerCase()) {
                core.info(`Ignoring acknowledgement for stale SHA ${currentSha}.`);
                return;
              }
            }

            const workflowId = String(process.env.WORKFLOW_REF || '')
              .match(/\.github\/workflows\/([^@]+)@/)?.[1];
            if (!workflowId) {
              throw new Error(`Unable to resolve workflow filename from '${process.env.WORKFLOW_REF || ''}'.`);
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pullRequest.head.sha,
              state: 'pending',
              context: 'BaseCoat merge eligibility',
              description: 'Solo-dev maintainer acknowledgement evidence changed.',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: context.payload.repository?.default_branch || 'main',
              inputs: { pr_number: String(prNumber) }
            });

  route-linked-issue-evidence:
    name: Route linked issue acknowledgement changes
    if: |
      !github.event.issue.pull_request &&
      (
        (
          github.event_name == 'issue_comment' &&
          (
            contains(github.event.comment.body, '/approve') ||
            contains(github.event.changes.body.from, '/approve')
          )
        ) ||
        (
          github.event_name == 'issues' &&
          (
            github.event.label.name == 'approved' ||
            (github.event.action == 'edited' && github.event.changes.body)
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout trusted default-branch approval resolver
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Reevaluate PRs linked to changed issue evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const preapproval = require(
              `${process.env.GITHUB_WORKSPACE}/.github/base-coat/scripts/ship-it/preapproval-evidence.cjs`
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(context.payload.issue?.number || 0);
            const currentBody = String(context.payload.comment?.body || '').trim();
            const previousBody = String(context.payload.changes?.body?.from || '').trim();
            const action = String(context.payload.action || '');
            const exactIssueApproval = preapproval.isExactIssueApproval;
            const approvalAdded =
              context.eventName === 'issue_comment' &&
              action !== 'deleted' &&
              exactIssueApproval(currentBody) &&
              !exactIssueApproval(previousBody);
            const approvalRevoked =
              context.eventName === 'issue_comment' &&
              (
                (action === 'deleted' && exactIssueApproval(currentBody)) ||
                (
                  action === 'edited' &&
                  exactIssueApproval(previousBody) &&
                  (
                    !exactIssueApproval(currentBody) ||
                    currentBody !== previousBody
                  )
                )
              );
            const issueBodyChanged =
              context.eventName === 'issues' &&
              action === 'edited' &&
              Object.prototype.hasOwnProperty.call(context.payload.changes || {}, 'body');
            const commentEvidenceChanged = approvalAdded || approvalRevoked;
            const approvedLabelChanged =
              context.eventName === 'issues' &&
              ["labeled", "unlabeled"].includes(action) &&
              String(context.payload.label?.name || '').toLowerCase() === 'approved';
            if (!issueNumber || (!commentEvidenceChanged && !approvedLabelChanged && !issueBodyChanged)) {
              core.info('Issue event did not change linked acknowledgement evidence.');
              return;
            }
            if (approvalAdded) {
              const commentUser = context.payload.comment?.user;
              const commentLogin = String(commentUser?.login || '');
              if (preapproval.isBotActor(commentUser)) {
                core.info(`Ignoring linked issue approval addition from bot @${commentLogin || 'unknown'}.`);
                return;
              }
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: commentLogin
              });
              if (!preapproval.hasQualifiedPermission(permission)) {
                core.info(`Ignoring linked issue approval addition from unqualified user @${commentLogin}.`);
                return;
              }
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });
              const labels = (issue.labels || []).map(label =>
                String(typeof label === 'string' ? label : label.name || '').toLowerCase()
              );
              if (!labels.includes('approved')) {
                core.info(
                  `Issue #${issueNumber} is not labeled approved yet; issue-approve will route after finalizing the label.`
                );
                return;
              }
            }

            const workflowId = String(process.env.WORKFLOW_REF || '')
              .match(/\.github\/workflows\/([^@]+)@/)?.[1];
            if (!workflowId) {
              throw new Error(`Unable to resolve workflow filename from '${process.env.WORKFLOW_REF || ''}'.`);
            }
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const closingIssuePattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gim;
            const linksIssue = pullRequest => {
              const text = `${pullRequest.title || ''}\n${pullRequest.body || ''}`;
              closingIssuePattern.lastIndex = 0;
              let match;
              while ((match = closingIssuePattern.exec(text)) !== null) {
                if (Number(match[1]) === issueNumber) return true;
              }
              return false;
            };
            const linksThroughReceipt = async pullRequest => {
              const text = `${pullRequest.title || ''}\n${pullRequest.body || ''}`;
              closingIssuePattern.lastIndex = 0;
              let match;
              while ((match = closingIssuePattern.exec(text)) !== null) {
                const linkedIssueNumber = Number(match[1]);
                let linkedIssue;
                try {
                  ({ data: linkedIssue } = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: linkedIssueNumber
                  }));
                } catch (error) {
                  core.warning(`Unable to inspect linked issue #${linkedIssueNumber}; reevaluating the PR fail-closed: ${error.message}`);
                  return true;
                }
                let receipt;
                try {
                  receipt = preapproval.extractReceipt(linkedIssue.body);
                } catch (error) {
                  core.info(`Ignoring invalid pre-approval receipt on issue #${linkedIssueNumber}: ${error.message}`);
                  const escapedRepository = `${owner}/${repo}`.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                  const sourceLink = new RegExp(
                    `^- Source issue: https://github\\.com/${escapedRepository}/issues/${issueNumber}$`,
                    'im'
                  );
                  if (sourceLink.test(String(linkedIssue.body || ''))) return true;
                  continue;
                }
                if (
                  receipt &&
                  String(receipt.source_repo || '').toLowerCase() === `${owner}/${repo}`.toLowerCase() &&
                  Number(receipt.source_issue_number) === issueNumber
                ) {
                  return true;
                }
              }
              return false;
            };
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const linkedPullRequests = [];
            for (const pullRequest of openPullRequests) {
              if (linksIssue(pullRequest) || await linksThroughReceipt(pullRequest)) {
                linkedPullRequests.push(pullRequest);
              }
            }
            for (const pullRequest of linkedPullRequests) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: pullRequest.head.sha,
                state: 'pending',
                context: 'BaseCoat merge eligibility',
                description: `Linked issue #${issueNumber} acknowledgement evidence changed.`,
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
              });
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: defaultBranch,
                inputs: { pr_number: String(pullRequest.number) }
              });
              core.info(`Queued reevaluation for PR #${pullRequest.number} linked to issue #${issueNumber}.`);
            }
            if (linkedPullRequests.length === 0) {
              core.info(`No open pull requests close issue #${issueNumber}.`);
            }

  evaluate:
    name: Evaluate merge eligibility
    if: |
      github.event_name != 'issues' &&
      github.event_name != 'issue_comment' &&
      github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      pr_number: ${{ steps.policy.outputs.pr_number }}
      head_sha: ${{ steps.policy.outputs.head_sha }}
      base_sha: ${{ steps.policy.outputs.base_sha }}
      snapshot_digest: ${{ steps.policy.outputs.snapshot_digest }}
      changed_files: ${{ steps.policy.outputs.changed_files }}
      additions: ${{ steps.policy.outputs.additions }}
      deletions: ${{ steps.policy.outputs.deletions }}
      decomposition_digest: ${{ steps.policy.outputs.decomposition_digest }}
      exception_review_id: ${{ steps.policy.outputs.exception_review_id }}
      review_digest: ${{ steps.policy.outputs.review_digest }}
      required_approvals: ${{ steps.policy.outputs.required_approvals }}
      human_review_required: ${{ steps.policy.outputs.human_review_required }}
      qualified_approvers: ${{ steps.policy.outputs.qualified_approvers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Evaluate policy and merge readiness
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number || '' }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const preapproval = require(
              `${process.env.GITHUB_WORKSPACE}/.github/base-coat/scripts/ship-it/preapproval-evidence.cjs`
            );
            const marker = '<!-- pr-auto-merge-executor:v1 -->';
            const eligibilityStatusContext = 'BaseCoat merge eligibility';
            const deliveryHoldLabel = 'delivery-hold';
            const githubActionsIntegrationId = 15368;
            const { createHash } = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const { evaluateDecomposition, reviewSnapshotDigest, sha256 } = require(
              require('node:path').join(process.env.GITHUB_WORKSPACE, '.github/base-coat/scripts/pr-decomposition-evaluator.cjs')
            );

            const resolvePrNumber = () => {
              if (context.payload.pull_request?.number) return Number(context.payload.pull_request.number);
              if (context.payload.pull_request_review?.pull_request?.number) {
                return Number(context.payload.pull_request_review.pull_request.number);
              }
              if (context.payload.issue?.pull_request && context.payload.issue?.number) {
                return Number(context.payload.issue.number);
              }
              const fromInput = Number(process.env.PR_NUMBER_INPUT || 0);
              return Number.isInteger(fromInput) && fromInput > 0 ? fromInput : 0;
            };

            // BEGIN SOLO-DEV ACKNOWLEDGEMENT CONTRACT
            const criticalAcknowledgementCommand = '/acknowledge-critical';
            const isBotActor = preapproval.isBotActor;
            const hasQualifiedPermission = preapproval.hasQualifiedPermission;
            const parseCriticalAcknowledgement = body => {
              const match = String(body || '').trim().match(
                /^\/acknowledge-critical\s+([0-9a-f]{40})$/i
              );
              return match ? match[1].toLowerCase() : '';
            };
            const isExactIssueApproval = preapproval.isExactIssueApproval;
            const collectLinkedIssueNumbers = text => {
              const issueNumbers = new Set();
              const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gim;
              let match;
              while ((match = pattern.exec(String(text || ''))) !== null) {
                const issueNumber = Number(match[1]);
                if (Number.isInteger(issueNumber) && issueNumber > 0) {
                  issueNumbers.add(issueNumber);
                }
              }
              return Array.from(issueNumbers);
            };
            const evaluateMaintainerAcknowledgement = async ({
              headSha,
              headObservedAt,
              prComments,
              linkedIssues,
              resolvePermission
            }) => {
              const rejected = [];
              const commentsNewestFirst = [...(prComments || [])].sort(
                (left, right) => new Date(right.created_at || 0) - new Date(left.created_at || 0)
              );
              for (const comment of commentsNewestFirst) {
                const acknowledgedSha = parseCriticalAcknowledgement(comment.body);
                if (!acknowledgedSha) continue;
                const login = comment.user?.login;
                if (isBotActor(comment.user)) {
                  rejected.push(`bot:${login || 'unknown'}`);
                  continue;
                }
                if (acknowledgedSha !== String(headSha || '').toLowerCase()) {
                  rejected.push(`stale-sha:${login || 'unknown'}`);
                  continue;
                }
                const commentTime = new Date(comment.created_at || 0).getTime();
                const latestPushTime = new Date(headObservedAt || 0).getTime();
                if (
                  !Number.isFinite(commentTime) ||
                  !Number.isFinite(latestPushTime) ||
                  commentTime <= latestPushTime
                ) {
                  rejected.push(`stale-time:${login || 'unknown'}`);
                  continue;
                }
                if (!hasQualifiedPermission(await resolvePermission(login))) {
                  rejected.push(`permission:${login || 'unknown'}`);
                  continue;
                }
                return {
                  satisfied: true,
                  source: 'pr-comment',
                  actor: login,
                  reference: acknowledgedSha,
                  rejected
                };
              }

              for (const issue of linkedIssues || []) {
                if (issue.state !== 'open' || !issue.approved) continue;
                for (const comment of issue.comments || []) {
                  if (!isExactIssueApproval(comment.body)) continue;
                  const login = comment.user?.login;
                  if (isBotActor(comment.user)) {
                    rejected.push(`bot:${login || 'unknown'}`);
                    continue;
                  }
                  if (!hasQualifiedPermission(await resolvePermission(login))) {
                    rejected.push(`permission:${login || 'unknown'}`);
                    continue;
                  }
                  return {
                    satisfied: true,
                    source: 'linked-approved-issue',
                    actor: login,
                    reference: `#${issue.number}`,
                    rejected
                  };
                }
              }

              return {
                satisfied: false,
                source: 'none',
                actor: '',
                reference: '',
                rejected
              };
            };
            // END SOLO-DEV ACKNOWLEDGEMENT CONTRACT

            // BEGIN FEATURE-ORIGIN DELIVERY CONTRACT
            const featureOriginIssueMarker = '<!-- basecoat-feature-origin:v1 -->';
            const isPlaceholderSpecUrl = value => {
              try {
                const candidate = String(value || '').trim();
                const url = new URL(candidate);
                const host = url.hostname.toLowerCase();
                return !['http:', 'https:'].includes(url.protocol) ||
                  !host ||
                  ['example.com', 'example.org', 'example.net', 'localhost'].some(
                    domain => host === domain || host.endsWith(`.${domain}`)
                  ) ||
                  /\.(?:invalid|test|localhost)$/.test(host) ||
                  /\b(?:placeholder|replace[-_ ]?me|todo|tbd)\b/i.test(candidate);
              } catch {
                return true;
              }
            };
            const parseFeatureHandoffMarkers = body => {
              const text = String(body || '');
              return {
                mentions: [...text.matchAll(/<!--\s*basecoat-feature-handoff:v1\b/gi)],
                markers: [...text.matchAll(
                  /<!--\s*basecoat-feature-handoff:v1\s+source-issue:#(\d+)\s*-->/gi
                )]
              };
            };
            const collectFeatureOriginLinkedIssueNumbers = (title, body) => {
              const issueNumbers = new Set(
                collectLinkedIssueNumbers(`${title || ''}\n${body || ''}`)
              );
              for (const marker of parseFeatureHandoffMarkers(body).markers) {
                const issueNumber = Number(marker[1]);
                if (Number.isInteger(issueNumber) && issueNumber > 0) {
                  issueNumbers.add(issueNumber);
                }
              }
              return Array.from(issueNumbers);
            };
            const parseFeatureDeliveryDirective = body => {
              const rawDirective = String(body || '');
              const lines = rawDirective.trim().split(/\r?\n/);
              const commandLine = /^\s*(?:ship-it|spec-2-prod)\s*:|^\s*\/(?:ship-it|spec-2-prod)(?:[ \t]|$)/i;
              const commandLines = lines
                .map((line, index) => commandLine.test(line) ? index : -1)
                .filter(index => index >= 0);
              if (!lines[0] || commandLines.length === 0) return { kind: 'none' };
              if (commandLines.length !== 1 || commandLines[0] !== 0) return { kind: 'invalid' };
              const colon = lines[0].match(/^(ship-it|spec-2-prod)\s*:[ \t]*(.*)$/i);
              const slash = lines[0].match(/^\/(ship-it|spec-2-prod)(?:[ \t]+(.*))?$/i);
              if (!colon && (!slash || lines.length !== 1)) return { kind: 'invalid' };
              const intent = (colon?.[1] || slash?.[1] || '').toLowerCase();
              const goal = colon
                ? [colon[2], ...lines.slice(1)].join('\n').trim()
                : String(slash?.[2] || '').trim();
              if (colon && !goal) return { kind: 'invalid' };
              const suppressesSideEffects =
                /\b(?:later|backlog|next sprint|no changes|read-only|analysis only|log it|file an issue|just document|stop|defer)\b/i
                  .test(goal);
              const immediate = /\b(?:now|immediately|urgent)\b/i.test(goal);
              if (suppressesSideEffects && immediate) return { kind: 'invalid' };
              if (suppressesSideEffects) return { kind: 'suppressed' };
              return { kind: 'delivery', intent, goal, rawDirective };
            };
            const evaluateFeatureOriginDelivery = async ({
              pullRequestBody,
              linkedIssues,
              resolvePermission
            }) => {
              const prBody = String(pullRequestBody || '');
              const { mentions: handoffMentions, markers: handoffs } =
                parseFeatureHandoffMarkers(prBody);
              const featureIssues = (linkedIssues || []).filter(issue =>
                String(issue.body || '').includes(featureOriginIssueMarker)
              );
              if (featureIssues.length === 0 && handoffMentions.length === 0) {
                return { isFeatureOrigin: false, satisfied: true, blockers: [], evidence: null };
              }

              const blockers = [];
              if (featureIssues.length !== 1) {
                blockers.push('Feature-origin handoff requires exactly one linked, verified feature source issue.');
              }
              if (handoffMentions.length !== 1 || handoffs.length !== 1) {
                blockers.push('Feature-origin PR must contain exactly one valid source-issue handoff marker.');
              }
              const featureIssue = featureIssues.length === 1 ? featureIssues[0] : null;
              const handoffIssueNumber = handoffs.length === 1 ? Number(handoffs[0][1]) : 0;
              if (
                featureIssue &&
                handoffIssueNumber !== Number(featureIssue.number)
              ) {
                blockers.push('Feature-origin handoff marker must identify the linked feature source issue.');
              }

              let evidence = null;
              if (featureIssue) {
                const body = String(featureIssue.body || '');
                const scope = body.match(/^\s*(?:BaseCoat )?Source scope:\s*(\S.*)$/im)?.[1]?.trim() || '';
                const spec = body.match(/^\s*-\s*Spec:\s*(https?:\/\/\S+)\s*$/im)?.[1] || '';
                const labels = (featureIssue.labels || []).map(label =>
                  String(typeof label === 'string' ? label : label.name || '').toLowerCase()
                );
                if (featureIssue.state !== 'open') blockers.push('Feature source issue is not open.');
                if (!scope) blockers.push('Feature source issue is missing its recorded source scope.');
                if (!spec || isPlaceholderSpecUrl(spec)) blockers.push('Feature source issue is missing a non-placeholder Spec URL.');
                if (!labels.includes('approved')) blockers.push('Feature source issue is missing its independent approved label.');
                const sourceAuthor = featureIssue.user?.login || '';

                let qualifiedApproval = null;
                for (const comment of featureIssue.comments || []) {
                  if (!isExactIssueApproval(comment.body) || isBotActor(comment.user)) continue;
                  const login = comment.user?.login || '';
                  if (hasQualifiedPermission(await resolvePermission(login))) {
                    qualifiedApproval = { actor: login, url: comment.html_url || '', at: comment.created_at || '' };
                    break;
                  }
                }
                if (!qualifiedApproval) blockers.push('Feature source issue lacks current qualified exact /approve evidence.');

                const directives = [];
                const rejectedDirectives = [];
                for (const comment of featureIssue.comments || []) {
                  const directive = parseFeatureDeliveryDirective(comment.body);
                  if (directive.kind === 'none' || isBotActor(comment.user)) continue;
                  const login = comment.user?.login || '';
                  if (!hasQualifiedPermission(await resolvePermission(login))) continue;
                  if (directive.kind !== 'delivery') {
                    rejectedDirectives.push(directive.kind);
                    continue;
                  }
                  directives.push({
                    ...directive,
                    goal: directive.goal || featureIssue.title || '',
                    actor: login,
                    url: comment.html_url || '',
                    at: comment.created_at || ''
                  });
                }
                const canonicalIntents = new Set(directives.map(directive => directive.intent));
                const directiveScopes = new Set(directives.map(
                  directive => `${directive.intent}\n${directive.goal}`
                ));
                if (canonicalIntents.size > 1 || directiveScopes.size > 1) {
                  blockers.push('Feature source issue contains conflicting authoritative delivery directives.');
                }
                if (rejectedDirectives.length > 0) {
                  blockers.push('Feature source issue contains a malformed, suppressed, or contradictory delivery directive.');
                }
                directives.sort((left, right) => new Date(right.at || 0) - new Date(left.at || 0));
                const deliveryDirective = directives[0] || null;
                if (!deliveryDirective) blockers.push('Feature source issue lacks qualified explicit delivery consent.');
                evidence = {
                  source_issue_number: featureIssue.number,
                  source_issue_url: featureIssue.html_url || '',
                  source_author: sourceAuthor,
                  source_scope: scope,
                  spec_ref: spec,
                  approved_by: qualifiedApproval?.actor || '',
                  approval_url: qualifiedApproval?.url || '',
                  delivery_intent: deliveryDirective?.intent || '',
                  delivery_goal: deliveryDirective?.goal || featureIssue.title || '',
                  delivery_actor: deliveryDirective?.actor || '',
                  delivery_url: deliveryDirective?.url || '',
                  delivery_timestamp: deliveryDirective?.at || ''
                };
              }
              return {
                isFeatureOrigin: true,
                satisfied: blockers.length === 0,
                blockers,
                evidence
              };
            };
            // END FEATURE-ORIGIN DELIVERY CONTRACT

            const prNumber = resolvePrNumber();
            if (!prNumber) {
              core.setFailed('Unable to resolve pull request number from event payload or workflow_dispatch input.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const headSha = pr.head.sha;
            const baseSha = String(pr.base?.sha || '');
            const metadataDigest = pullRequest => sha256(JSON.stringify({
              title: String(pullRequest.title || ''),
              body: String(pullRequest.body || '')
            }));
            const labelDigest = pullRequest => sha256(JSON.stringify(
              (pullRequest.labels || []).map(label => String(label.name || '').toLowerCase()).sort()
            ));
            const initialSnapshot = {
              headSha: String(pr.head?.sha || ''),
              baseSha,
              baseRef: String(pr.base?.ref || ''),
              state: String(pr.state || ''),
              draft: Boolean(pr.draft),
              metadataDigest: metadataDigest(pr),
              labelDigest: labelDigest(pr),
              changedFiles: pr.changed_files,
              additions: pr.additions,
              deletions: pr.deletions
            };
            const publishEligibilityStatus = async (state, description) => {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: headSha,
                state,
                context: eligibilityStatusContext,
                description,
                target_url: workflowUrl
              });
            };
            await publishEligibilityStatus('pending', 'Evaluating BaseCoat merge policy.');

            const readJsonFromDefaultBranch = async path => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: defaultBranch
              });
              if (Array.isArray(data) || typeof data.content !== 'string') {
                throw new Error(`Expected file content for ${path} on ${defaultBranch}.`);
              }
              return JSON.parse(Buffer.from(data.content, data.encoding || 'base64').toString('utf8'));
            };
            const readJsonFromDefaultBranchOptional = async path => {
              try {
                return await readJsonFromDefaultBranch(path);
              } catch (error) {
                if (Number(error?.status) === 404) {
                  core.info(`BaseCoat governance policy ${path} is not yet present on ${defaultBranch}.`);
                  return null;
                }
                throw error;
              }
            };
            const readTextFromPullRequestHead = async path => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: headSha
              });
              if (Array.isArray(data) || typeof data.content !== 'string') {
                throw new Error(`Expected file content for ${path} at pull request head.`);
              }
              return Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
            };
            const readJsonFromPullRequestHeadOptional = async path => {
              try {
                return JSON.parse(await readTextFromPullRequestHead(path));
              } catch (error) {
                if (Number(error?.status) === 404) return null;
                throw error;
              }
            };
            const normalizeProductionDigestPolicy = input => {
              const normalized = JSON.parse(JSON.stringify(input || {}));
              const bindings = normalized.production_environment?.workflow_bindings || {};
              for (const binding of Object.values(bindings)) {
                if (binding && typeof binding === 'object') {
                  delete binding.expected_workflow_sha256;
                }
              }
              return normalized;
            };
            const readWorkflowJobEnvironments = (workflowText, jobId) => {
              let inJobs = false;
              let currentJob = '';
              const environments = [];
              for (const line of String(workflowText || '').replace(/\r\n/g, '\n').split('\n')) {
                if (!inJobs) {
                  if (/^jobs:\s*(?:#.*)?$/.test(line)) inJobs = true;
                  continue;
                }
                if (/^\S/.test(line) && !/^\s*#/.test(line)) break;
                const jobMatch = line.match(/^  ([A-Za-z0-9_-]+):\s*(?:#.*)?$/);
                if (jobMatch) {
                  currentJob = jobMatch[1];
                  continue;
                }
                if (currentJob === jobId) {
                  const environmentMatch = line.match(/^    environment:\s*(.*?)\s*$/);
                  if (environmentMatch) environments.push(environmentMatch[1]);
                }
              }
              return environments;
            };

            try {
              const trustedPolicy = await readJsonFromDefaultBranchOptional('.github/governance/policy-packs.json');
              const humanBoundaries = await readJsonFromDefaultBranchOptional('.github/governance/human-approval-boundaries.json');
              if (!trustedPolicy || !humanBoundaries) {
                await publishEligibilityStatus(
                  'success',
                  `BaseCoat governance policy is not yet installed on ${defaultBranch}; skipping merge evaluation.`
                );
                return;
              }
              const pullRequestPolicy = await readJsonFromPullRequestHeadOptional(
                '.github/governance/policy-packs.json'
              );
              if (
                pullRequestPolicy &&
                JSON.stringify(normalizeProductionDigestPolicy(pullRequestPolicy)) !==
                  JSON.stringify(normalizeProductionDigestPolicy(trustedPolicy))
              ) {
                throw new Error(
                  'Pull request governance policy may update production workflow digests only; all other policy fields must remain trusted.'
                );
              }
              const policy = pullRequestPolicy
                ? {
                    ...trustedPolicy,
                    production_environment: {
                      ...trustedPolicy.production_environment,
                      workflow_bindings: pullRequestPolicy.production_environment?.workflow_bindings
                    }
                  }
                : trustedPolicy;
              const requestedPack = String(process.env.POLICY_PACK || '').trim();
              const selectedPack = requestedPack || policy.default_profile;
              if (!policy.profiles?.[selectedPack]) {
                throw new Error(`Unknown policy pack '${selectedPack}'. Valid profiles: ${Object.keys(policy.profiles || {}).join(', ')}`);
              }
              const selectedBoundaryProfile = (humanBoundaries.profiles?.[selectedPack])
                ? selectedPack
                : humanBoundaries.default_profile;
              if (!humanBoundaries.profiles?.[selectedBoundaryProfile]) {
                throw new Error(`Unable to resolve human-approval profile for '${selectedPack}'.`);
              }

              const profile = policy.profiles[selectedPack];
              const boundaryProfile = humanBoundaries.profiles[selectedBoundaryProfile];
              const alwaysHumanRequired = new Set(humanBoundaries.always_human_required || []);
              const requiredChecks = profile.main?.required_checks || [];
              const mergeQueuePosture = profile.main?.merge_queue_posture || 'deferred';
              if (!['required', 'deferred'].includes(mergeQueuePosture)) {
                throw new Error(`Invalid merge_queue_posture '${mergeQueuePosture}' for profile '${selectedPack}'.`);
              }

            const blockers = [];
            const labelNames = (pr.labels || []).map(label => String(label.name || '').toLowerCase());
            const deliveryHoldActive = labelNames.includes(deliveryHoldLabel);
            if (deliveryHoldActive) {
              blockers.push(
                `delivery_hold: ${deliveryHoldLabel} label is active; delivery is intentionally held until the label is removed.`
              );
            }

            if (pr.draft) blockers.push('PR is draft.');
            if (pr.state !== 'open') blockers.push(`PR state is '${pr.state}', expected 'open'.`);
            if (pr.base?.ref !== 'main') {
              blockers.push(`PR base branch is '${pr.base?.ref}', expected 'main'.`);
            }
            if (String(pr.mergeable_state || '').toLowerCase() === 'dirty') {
              blockers.push('PR has merge conflicts (mergeable_state=dirty).');
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });
            const changed = files
              .flatMap(file => [file.filename, file.previous_filename])
              .filter(Boolean);
            const productionReleasePaths = policy.production_release_paths || [];
            const productionReleasePathSet = new Set(productionReleasePaths);
            const productionWorkflowPathsToVerify = new Set();
            const productionPathRoutingErrors = [];
            for (const file of files) {
              const currentPathGoverned = productionReleasePathSet.has(file.filename);
              const previousPathGoverned = productionReleasePathSet.has(file.previous_filename);
              if (currentPathGoverned && file.status !== 'removed') {
                productionWorkflowPathsToVerify.add(file.filename);
              }
              if (
                file.status === 'renamed' &&
                previousPathGoverned &&
                !currentPathGoverned
              ) {
                productionPathRoutingErrors.push(
                  `governed production workflow renamed outside inventory: ${file.previous_filename} -> ${file.filename}`
                );
              }
            }
            const touchesProductionReleasePath =
              productionWorkflowPathsToVerify.size > 0 ||
              productionPathRoutingErrors.length > 0 ||
              files.some(file =>
                file.status === 'removed' && productionReleasePathSet.has(file.filename)
              );

            const classifyRiskTier = () => {
              const routes = policy.risk_tier_routing || {};
              const isMatch = prefixes => changed.some(file => prefixes.some(prefix => file.startsWith(prefix)));
              if (isMatch(routes.critical || [])) return 'critical';
              if (isMatch(routes.high || [])) return 'high';
              if (isMatch(routes.medium || [])) return 'medium';
              return 'low';
            };
            const riskTier = classifyRiskTier();
            const sizeLabel = labelNames
              .map(label => label.match(/^size:(xs|s|m|l|xl|xxl)$/i)?.[1]?.toUpperCase() || '')
              .find(Boolean) || '';
            if (!sizeLabel) {
              blockers.push('PR is missing a canonical size label.');
            }
            const humanApprovalSizes = new Set(
              (profile.main?.human_approval_required_sizes || []).map(size =>
                String(size || '').toUpperCase()
              )
            );
            const requiresHumanApprovalBySize = humanApprovalSizes.has(sizeLabel);
            const requiredApprovals = Math.max(
              Number(profile.main?.required_approvals_by_risk_tier?.[riskTier] || 0),
              requiresHumanApprovalBySize
                ? Number(profile.main?.minimum_qualified_approvals_for_human_size || 1)
                : 0
            );
            const acknowledgementRequiredByPolicy = Boolean(
              profile.main?.required_maintainer_acknowledgement_by_risk_tier?.[riskTier]
            );
            const acknowledgementRequiredByBoundary = Boolean(
              boundaryProfile.maintainer_acknowledgement_required_by_risk?.[riskTier]
            );
            if (acknowledgementRequiredByPolicy !== acknowledgementRequiredByBoundary) {
              throw new Error(
                `Maintainer acknowledgement contract mismatch for '${selectedPack}/${riskTier}'.`
              );
            }
            const acknowledgementBoundaryAllowlist = new Set(
              boundaryProfile.maintainer_acknowledgement_satisfies_boundaries || []
            );
            const policyExceptionBoundaryActive =
              alwaysHumanRequired.has('policy_exception_override') &&
              labelNames.includes('policy-exception');
            const securityIncidentBoundaryActive =
              alwaysHumanRequired.has('security_incident_override') &&
              (labelNames.includes('security-incident') || labelNames.includes('incident'));
            const acknowledgementReasons = [];
            if (acknowledgementRequiredByPolicy) acknowledgementReasons.push(`risk:${riskTier}`);
            if (
              policyExceptionBoundaryActive &&
              acknowledgementBoundaryAllowlist.has('policy_exception_override')
            ) {
              acknowledgementReasons.push('policy_exception_override');
            }
            if (
              securityIncidentBoundaryActive &&
              acknowledgementBoundaryAllowlist.has('security_incident_override')
            ) {
              acknowledgementReasons.push('security_incident_override');
            }
            const requiresMaintainerAcknowledgement = acknowledgementReasons.length > 0;
            const requiresHumanReviewByRisk = Boolean(
              boundaryProfile.pr_approval_required_by_risk?.[riskTier]
            );
            const requiresHumanReviewByBoundary =
              requiresHumanReviewByRisk || requiresHumanApprovalBySize;
            if (
              requiresHumanReviewByRisk &&
              requiredApprovals < Number(profile.main?.required_approvals_by_risk_tier?.[riskTier] || 0)
            ) {
              throw new Error(`PR approval contract mismatch for '${selectedPack}/${riskTier}'.`);
            }

            const prComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            const headMarkerPrefix = '<!-- pr-auto-merge-head:v1 ';
            const headMarkerRegex =
              /<!-- pr-auto-merge-head:v1 sha:([0-9a-f]{40}) observed:([^ ]+) -->/i;
            let headMarkerComment = prComments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(headMarkerPrefix)
            );
            const parsedHeadMarker = headMarkerComment?.body?.match(headMarkerRegex);
            let headObservation = parsedHeadMarker
              ? { sha: parsedHeadMarker[1].toLowerCase(), observedAt: parsedHeadMarker[2] }
              : null;
            const recordsHeadUpdate =
              context.eventName === 'pull_request_target' &&
              ['opened', 'reopened', 'synchronize'].includes(context.payload.action);
            if (
              recordsHeadUpdate ||
              !headObservation ||
              headObservation.sha !== headSha.toLowerCase()
            ) {
              const observedAt = recordsHeadUpdate
                ? (context.payload.pull_request?.updated_at || new Date().toISOString())
                : new Date().toISOString();
              const headMarkerBody =
                `${headMarkerPrefix}sha:${headSha.toLowerCase()} observed:${observedAt} -->`;
              if (headMarkerComment) {
                const { data: updatedHeadMarker } = await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: headMarkerComment.id,
                  body: headMarkerBody
                });
                headMarkerComment = updatedHeadMarker;
              } else {
                const { data: createdHeadMarker } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: headMarkerBody
                });
                headMarkerComment = createdHeadMarker;
              }
              headObservation = { sha: headSha.toLowerCase(), observedAt };
            }
            const permissionCache = new Map();
            const resolvePermission = async login => {
              if (!login) return null;
              if (permissionCache.has(login)) return permissionCache.get(login);
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: login
                });
                permissionCache.set(login, data);
                return data;
              } catch (error) {
                core.warning(`Unable to verify repository permission for @${login}.`);
                permissionCache.set(login, null);
                return null;
              }
            };

            const linkedIssues = [];
            for (const issueNumber of collectFeatureOriginLinkedIssueNumbers(pr.title, pr.body)) {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });
              if (issue.pull_request) continue;
              const issueLabels = (issue.labels || []).map(label =>
                String(typeof label === 'string' ? label : label.name || '').toLowerCase()
              );
              const issueComments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              });
              linkedIssues.push({
                ...issue,
                number: issueNumber,
                approved: issueLabels.includes('approved'),
                labels: issueLabels,
                comments: issueComments
              });
            }
            const featureOriginDelivery = await evaluateFeatureOriginDelivery({
              pullRequestBody: pr.body,
              linkedIssues,
              resolvePermission
            });
            if (featureOriginDelivery.isFeatureOrigin && !featureOriginDelivery.satisfied) {
              blockers.push(...featureOriginDelivery.blockers);
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });
            const currentReviewDigest = reviewSnapshotDigest(reviews);
            initialSnapshot.reviewDigest = currentReviewDigest;
            const automatedReviewPolicy = profile.main?.automated_review || {
              required: false,
              reviewer_logins: [],
              accepted_states: []
            };
            const automatedReviewerLogins = new Set(
              (automatedReviewPolicy.reviewer_logins || []).map(login =>
                String(login || '').toLowerCase()
              )
            );
            const acceptedAutomatedReviewStates = new Set(
              (automatedReviewPolicy.accepted_states || []).map(state =>
                String(state || '').toUpperCase()
              )
            );
            if (
              automatedReviewPolicy.required === true &&
              (automatedReviewerLogins.size === 0 || acceptedAutomatedReviewStates.size === 0)
            ) {
              throw new Error(`Automated review policy is incomplete for profile '${selectedPack}'.`);
            }
            const currentHeadAutomatedReviews = reviews.filter(review =>
              automatedReviewerLogins.has(String(review.user?.login || '').toLowerCase()) &&
              review.commit_id === headSha &&
              acceptedAutomatedReviewStates.has(String(review.state || '').toUpperCase())
            );
            const automatedReviewSatisfied =
              automatedReviewPolicy.required !== true ||
              currentHeadAutomatedReviews.length > 0;
            if (!automatedReviewSatisfied) {
              blockers.push(
                `Automated review required for current head ${headSha}; request ` +
                `${Array.from(automatedReviewerLogins).join(' or ')}.`
              );
            }
            const latestReviewByUser = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login || login === pr.user?.login || isBotActor(review.user)) continue;
              const previous = latestReviewByUser.get(login);
              const currentTime = new Date(review.submitted_at || review.created_at || 0).getTime();
              const previousTime = previous ? new Date(previous.submitted_at || previous.created_at || 0).getTime() : -1;
              if (!previous || currentTime >= previousTime) {
                latestReviewByUser.set(login, review);
              }
            }
            const approvalCandidates = Array.from(latestReviewByUser.values())
              .filter(review => review.state === 'APPROVED' && review.commit_id === headSha)
              .map(review => review.user.login);
            const unresolvedChangeRequestCandidates = Array.from(latestReviewByUser.values())
              .filter(review => review.state === 'CHANGES_REQUESTED' && review.commit_id === headSha)
              .map(review => review.user.login);
            const qualifiedChangeRequesters = await Promise.all(
              unresolvedChangeRequestCandidates.map(async login => {
                const reviewerPermission = await resolvePermission(login);
                if (hasQualifiedPermission(reviewerPermission)) return login;
                core.info(`Ignoring changes-requested review from @${login}; reviewer does not have write, maintain, or admin permission.`);
                return null;
              })
            );
            const unresolvedChangeRequesters = Array.from(new Set(qualifiedChangeRequesters.filter(Boolean))).sort();
            if (unresolvedChangeRequesters.length > 0) {
              blockers.push(
                `Unresolved changes-requested review on current head by ${unresolvedChangeRequesters.map(login => `@${login}`).join(', ')}.`
              );
            }
            const qualifiedApprovers = await Promise.all(
              approvalCandidates.map(async login => {
                const reviewerPermission = await resolvePermission(login);
                if (hasQualifiedPermission(reviewerPermission)) return login;
                core.info(`Ignoring approval from @${login}; reviewer does not have write, maintain, or admin permission.`);
                return null;
              })
            );
            const approvedReviewers = new Set(qualifiedApprovers.filter(Boolean));
            if (approvedReviewers.size < requiredApprovals) {
              blockers.push(
                `Insufficient approvals for risk tier '${riskTier}' (${approvedReviewers.size}/${requiredApprovals}).`
              );
            }
            if (requiresHumanReviewByRisk && approvedReviewers.size === 0) {
              blockers.push(
                `Human review boundary requires at least one approval for risk tier '${riskTier}'.`
              );
            }

            const decomposition = await evaluateDecomposition({
              body: pr.body,
              changedFiles: pr.changed_files,
              additions: pr.additions,
              deletions: pr.deletions,
              files,
              headSha,
              baseSha,
              reviews,
              authorLogin: pr.user?.login,
              resolvePermission
            });
            if (decomposition.decision !== 'pass') {
              blockers.push(decomposition.reason);
            }

            let maintainerAcknowledgement = {
              satisfied: !requiresMaintainerAcknowledgement,
              source: 'not-required',
              actor: '',
              reference: '',
              rejected: []
            };
            if (requiresMaintainerAcknowledgement) {
              const linkedIssues = [];
              const linkedIssueNumbers = new Set();
              for (const issueNumber of collectFeatureOriginLinkedIssueNumbers(pr.title, pr.body)) {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber
                });
                if (issue.pull_request || issue.state !== 'open') continue;
                const issueLabels = (issue.labels || []).map(label =>
                  String(typeof label === 'string' ? label : label.name || '').toLowerCase()
                );
                const issueComments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100
                });
                linkedIssues.push({
                  number: issueNumber,
                  approved: issueLabels.includes('approved'),
                  comments: issueComments
                });
                linkedIssueNumbers.add(issueNumber);

                let receipt;
                try {
                  receipt = preapproval.extractReceipt(issue.body);
                } catch (error) {
                  core.warning(`Ignoring invalid source-approval receipt on linked issue #${issueNumber}: ${error.message}`);
                  continue;
                }
                if (!receipt) continue;
                if (
                  String(receipt.source_repo || '').toLowerCase() !== `${owner}/${repo}`.toLowerCase() ||
                  String(receipt.target_repo || '').toLowerCase() !== `${owner}/${repo}`.toLowerCase()
                ) {
                  core.info(`Ignoring cross-repository source-approval receipt on linked issue #${issueNumber}.`);
                  continue;
                }
                if (!preapproval.matchesReceiptScope(issue.body, receipt)) {
                  core.warning(`Ignoring source-approval receipt whose scope differs from linked issue #${issueNumber}.`);
                  continue;
                }
                const expectedRunHash = preapproval.expectedIntentRunHash(receipt);
                const childMarker = new RegExp(
                  `<!-- basecoat-intent-child:${expectedRunHash}:[a-z0-9-]+ -->`
                );
                if (!childMarker.test(String(issue.body || ''))) {
                  core.info(`Ignoring source-approval receipt not attached to a matching generated child issue #${issueNumber}.`);
                  continue;
                }

                let liveReceipt;
                try {
                  liveReceipt = await preapproval.validateLiveReceipt({
                    api: preapproval.createOctokitApi(github),
                    receipt,
                    currentExecutionPrincipal: receipt.execution_principal
                  });
                } catch (error) {
                  core.warning(`Live source approval for linked issue #${issueNumber} is no longer valid: ${error.message}`);
                  continue;
                }
                if (!linkedIssueNumbers.has(Number(liveReceipt.source_issue_number))) {
                  linkedIssues.push({
                    number: Number(liveReceipt.source_issue_number),
                    approved: true,
                    comments: [{
                      body: '/approve',
                      user: { login: liveReceipt.approver_login, type: 'User' }
                    }]
                  });
                  linkedIssueNumbers.add(Number(liveReceipt.source_issue_number));
                }
              }
              maintainerAcknowledgement = await evaluateMaintainerAcknowledgement({
                headSha,
                headObservedAt: headObservation?.observedAt,
                prComments,
                linkedIssues,
                resolvePermission
              });
              if (!maintainerAcknowledgement.satisfied) {
                blockers.push(
                  `Maintainer acknowledgement required (${acknowledgementReasons.join(', ')}). Comment ` +
                  `\`${criticalAcknowledgementCommand} ${headSha}\` after the latest push, ` +
                  'or link an issue labeled approved with an exact `/approve` comment from a qualified maintainer.'
                );
              }
            }

            let productionEnvironmentBoundary = 'not-applicable';
            if (touchesProductionReleasePath) {
              const policyEnvironment = policy.production_environment || {};
              const environmentContract = humanBoundaries.production_environment_contract || {};
              const environmentErrors = [];
              const productionApprovalRequired =
                Boolean(boundaryProfile.production_release_approval_required) ||
                requiresHumanApprovalBySize;
              if (
                productionApprovalRequired &&
                !alwaysHumanRequired.has('production_environment_approval')
              ) {
                environmentErrors.push('production_environment_approval is not an always-human boundary');
              }
              if (policyEnvironment.approval_boundary !== 'production_environment_approval') {
                environmentErrors.push('policy does not route production releases to production_environment_approval');
              }
              if (
                !policyEnvironment.name ||
                policyEnvironment.name !== environmentContract.environment
              ) {
                environmentErrors.push('policy and human-boundary production environment names do not match');
              }
              if (environmentContract.enforcement !== 'github_environment') {
                environmentErrors.push('production approval enforcement is not github_environment');
              }
              if (
                productionApprovalRequired &&
                Number(environmentContract.minimum_required_reviewers || 0) < 1
              ) {
                environmentErrors.push('production environment requires fewer than one reviewer');
              }
              if (environmentContract.deployment_branch_policy !== 'protected_or_selected') {
                environmentErrors.push('production environment branch policy is not protected_or_selected');
              }
              if (
                environmentContract.deployment_workflow_binding_verification !==
                'pr_head_digest_and_environment_against_trusted_policy'
              ) {
                environmentErrors.push(
                  'production deployment workflow binding is not verified against trusted policy'
                );
              }
              if (environmentContract.pr_approval_is_equivalent !== false) {
                environmentErrors.push('production environment approval is incorrectly modeled as PR approval');
              }
              if (
                selectedPack === 'solo-dev' &&
                environmentContract.solo_dev_prevent_self_review !== false
              ) {
                environmentErrors.push('solo-dev production contract must allow the sole maintainer to approve deployment');
              }
              const workflowBindings = policyEnvironment.workflow_bindings || {};
              for (const releasePath of productionReleasePaths) {
                const binding = workflowBindings[releasePath];
                if (
                  !binding ||
                  !String(binding.job || '').trim() ||
                  !String(binding.expected_job_environment || '').trim() ||
                  !/^[0-9a-f]{64}$/i.test(String(binding.expected_workflow_sha256 || '').trim())
                ) {
                  environmentErrors.push(
                    `production workflow binding policy is incomplete for ${releasePath}`
                  );
                }
              }
              environmentErrors.push(...productionPathRoutingErrors);
              for (const workflowPath of productionWorkflowPathsToVerify) {
                const binding = workflowBindings[workflowPath];
                if (!binding) continue;
                const expectedEnvironment = String(binding.expected_job_environment || '').trim();
                const expectedWorkflowSha256 = String(binding.expected_workflow_sha256 || '')
                  .trim()
                  .toLowerCase();
                if (!expectedEnvironment.includes(String(policyEnvironment.name || ''))) {
                  environmentErrors.push(
                    `trusted production workflow binding for ${workflowPath} does not reference ${policyEnvironment.name}`
                  );
                  continue;
                }
                try {
                  const workflowText = await readTextFromPullRequestHead(workflowPath);
                  const observedWorkflowSha256 = createHash('sha256')
                    .update(workflowText, 'utf8')
                    .digest('hex');
                  if (observedWorkflowSha256 !== expectedWorkflowSha256) {
                    environmentErrors.push(
                      `${workflowPath} does not match its trusted full-workflow digest`
                    );
                    continue;
                  }
                  const observedEnvironments = readWorkflowJobEnvironments(
                    workflowText,
                    String(binding.job || '').trim()
                  );
                  if (
                    observedEnvironments.length !== 1 ||
                    observedEnvironments[0] !== expectedEnvironment
                  ) {
                    environmentErrors.push(
                      `${workflowPath} job '${binding.job}' does not retain its trusted production environment binding`
                    );
                  }
                } catch (error) {
                  environmentErrors.push(
                    `unable to verify production workflow binding for ${workflowPath}`
                  );
                  core.warning(error instanceof Error ? error.message : String(error));
                }
              }
              if (environmentErrors.length === 0) {
                try {
                  const { data: liveEnvironment } = await github.rest.repos.getEnvironment({
                    owner,
                    repo,
                    environment_name: policyEnvironment.name
                  });
                  const reviewerRule = (liveEnvironment.protection_rules || []).find(
                    rule => rule.type === 'required_reviewers'
                  );
                  const liveReviewerCount = (reviewerRule?.reviewers || []).length;
                  if (liveReviewerCount < Number(environmentContract.minimum_required_reviewers)) {
                    environmentErrors.push(
                      `live '${policyEnvironment.name}' environment has ${liveReviewerCount} required reviewer(s)`
                    );
                  }
                  if (
                    productionApprovalRequired &&
                    selectedPack === 'solo-dev' &&
                    reviewerRule?.prevent_self_review !== false
                  ) {
                    environmentErrors.push(
                      `live '${policyEnvironment.name}' environment prevents solo-maintainer self-review`
                    );
                  }
                  const liveBranchPolicy = liveEnvironment.deployment_branch_policy || {};
                  let liveBranchPolicyValid = liveBranchPolicy.protected_branches === true;
                  if (
                    !liveBranchPolicyValid &&
                    liveBranchPolicy.custom_branch_policies === true
                  ) {
                    const { data: liveBranchPolicies } =
                      await github.rest.repos.listDeploymentBranchPolicies({
                        owner,
                        repo,
                        environment_name: policyEnvironment.name,
                        per_page: 100
                      });
                    liveBranchPolicyValid = (liveBranchPolicies.branch_policies || []).some(
                      branchPolicy => branchPolicy.name === 'main'
                    );
                  }
                  if (!liveBranchPolicyValid) {
                    environmentErrors.push(
                      `live '${policyEnvironment.name}' environment does not allow protected branches or select main`
                    );
                  }
                } catch (error) {
                  environmentErrors.push(
                    `unable to verify live '${policyEnvironment.name}' environment protection`
                  );
                  core.warning(error instanceof Error ? error.message : String(error));
                }
              }
              if (environmentErrors.length > 0) {
                blockers.push(
                  `production_environment_approval contract invalid: ${environmentErrors.join('; ')}.`
                );
              } else {
                productionEnvironmentBoundary = `verified-live:${policyEnvironment.name}`;
              }
            }
            if (policyExceptionBoundaryActive && approvedReviewers.size === 0 && !(
              acknowledgementBoundaryAllowlist.has('policy_exception_override') &&
              maintainerAcknowledgement.satisfied
            )) {
              blockers.push('policy_exception_override: policy-exception changes require explicit human approval.');
            }
            if (securityIncidentBoundaryActive && approvedReviewers.size === 0 && !(
              acknowledgementBoundaryAllowlist.has('security_incident_override') &&
              maintainerAcknowledgement.satisfied
            )) {
              blockers.push('security_incident_override: incident/security-incident changes require explicit human approval.');
            }

            const readRequiredCheckState = async () => {
              const statusByContext = new Map();
              const checkByName = new Map();
              const listCheckRunsForRef = async ref => {
                const checkRuns = [];
                for (let page = 1; ; page += 1) {
                  const { data } = await github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref,
                    per_page: 100,
                    page
                  });
                  const pageRuns = data.check_runs || [];
                  checkRuns.push(...pageRuns);
                  if (pageRuns.length < 100) break;
                }
                return checkRuns;
              };
              const checkRefs = Array.from(new Set([headSha, pr.merge_commit_sha].filter(Boolean)));
              for (const ref of checkRefs) {
                const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref
                });
                for (const status of combined.statuses || []) {
                  if (!status?.context || status.creator?.login !== 'github-actions[bot]') continue;
                  statusByContext.set(status.context, String(status.state || '').toLowerCase());
                }

                const checkRuns = await listCheckRunsForRef(ref);
                core.info(`Found ${checkRuns.length} check runs for ${ref}.`);
                for (const check of checkRuns || []) {
                  const trustedActionsCheck = check.app?.id === githubActionsIntegrationId ||
                    check.app?.slug === 'github-actions';
                  if (!check?.name || !trustedActionsCheck) continue;
                  // Multiple check runs can share the same name after a rerun
                  // (e.g. an earlier cancelled run alongside a later success).
                  // Keep only the most recently started run per name so a stale
                  // cancelled/failed run can never clobber a newer passing one.
                  const existing = checkByName.get(check.name);
                  const startedAt = Date.parse(check.started_at || '') || 0;
                  if (existing && existing.startedAt > startedAt) continue;
                  checkByName.set(check.name, {
                    status: String(check.status || '').toLowerCase(),
                    conclusion: String(check.conclusion || '').toLowerCase(),
                    startedAt
                  });
                }
              }

              const unsatisfiedChecks = [];
              let hasPendingChecks = false;
              for (const checkName of requiredChecks) {
                const statusState = statusByContext.get(checkName);
                const checkState = checkByName.get(checkName);
                const statusSucceeded = statusState === 'success';
                const checkSucceeded = checkState?.conclusion === 'success';
                if (!statusSucceeded && !checkSucceeded) {
                  const noCheckSignal = !statusState && !checkState;
                  const statusPending = statusState === 'pending';
                  const checkPending = Boolean(checkState && checkState.status !== 'completed');
                  hasPendingChecks ||= noCheckSignal || statusPending || checkPending;
                  unsatisfiedChecks.push(
                    `${checkName} (status=${statusState || 'pending'}, check=${checkState?.conclusion || checkState?.status || 'pending'})`
                  );
                }
              }
              return { unsatisfiedChecks, hasPendingChecks };
            };

            const maxCheckPollAttempts = 60;
            const checkPollIntervalMs = 15000;
            let requiredCheckState;
            for (let attempt = 1; attempt <= maxCheckPollAttempts; attempt += 1) {
              requiredCheckState = await readRequiredCheckState();
              if (requiredCheckState.unsatisfiedChecks.length === 0 || !requiredCheckState.hasPendingChecks) {
                break;
              }
              if (attempt < maxCheckPollAttempts) {
                core.info(
                  `Waiting for required checks (${attempt}/${maxCheckPollAttempts}): ${requiredCheckState.unsatisfiedChecks.join('; ')}`
                );
                await new Promise(resolve => setTimeout(resolve, checkPollIntervalMs));
              }
            }
            const unsatisfiedChecks = requiredCheckState?.unsatisfiedChecks || requiredChecks;
            if (unsatisfiedChecks.length > 0) {
              blockers.push(`Required checks not satisfied: ${unsatisfiedChecks.join('; ')}`);
            }
            if (mergeQueuePosture === 'required') {
              blockers.push("merge_queue_posture required: auto-merge executor defers to repository merge queue policy.");
            }

            const { data: finalPr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const finalReviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });
            const finalSnapshot = {
              headSha: String(finalPr.head?.sha || ''),
              baseSha: String(finalPr.base?.sha || ''),
              baseRef: String(finalPr.base?.ref || ''),
              state: String(finalPr.state || ''),
              draft: Boolean(finalPr.draft),
              metadataDigest: metadataDigest(finalPr),
              labelDigest: labelDigest(finalPr),
              changedFiles: finalPr.changed_files,
              additions: finalPr.additions,
              deletions: finalPr.deletions,
              reviewDigest: reviewSnapshotDigest(finalReviews)
            };
            if (JSON.stringify(initialSnapshot) !== JSON.stringify(finalSnapshot)) {
              const workflowId = String(process.env.WORKFLOW_REF || '')
                .match(/\.github\/workflows\/([^@]+)@/)?.[1];
              if (!workflowId || !finalSnapshot.headSha) {
                throw new Error('Unable to queue re-evaluation after PR metadata changed during eligibility evaluation.');
              }
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: finalSnapshot.headSha,
                state: 'pending',
                context: eligibilityStatusContext,
                description: 'PR metadata changed during evaluation; re-evaluating the current snapshot.',
                target_url: workflowUrl
              });
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: defaultBranch,
                inputs: { pr_number: String(prNumber) }
              });
              core.setOutput('eligible', 'false');
              core.setOutput('pr_number', String(prNumber));
              core.setFailed('PR metadata changed during evaluation; queued a fresh evaluation and withheld eligibility.');
              return;
            }

            const eligible = blockers.length === 0;
            const pendingCheckBlocker =
              Boolean(requiredCheckState?.hasPendingChecks) &&
              unsatisfiedChecks.length > 0 &&
              blockers.some(reason => String(reason).startsWith('Required checks not satisfied:'));
            const waitingForRequiredChecks =
              Boolean(requiredCheckState?.hasPendingChecks) &&
              unsatisfiedChecks.length > 0 &&
              blockers.every(reason =>
                String(reason).startsWith('Required checks not satisfied:') ||
                (decomposition.reviewPending && reason === decomposition.reason)
              );
            const waitingForAutomatedReview =
              !automatedReviewSatisfied && blockers.length === 1;
            const waitingForMechanicalExceptionReview =
              decomposition.reviewPending &&
              blockers.every(reason =>
                reason === decomposition.reason ||
                (pendingCheckBlocker && String(reason).startsWith('Required checks not satisfied:'))
              );
            const waitingForExternalProgress =
              waitingForAutomatedReview ||
              waitingForRequiredChecks ||
              waitingForMechanicalExceptionReview;
            const acknowledgementSummary = requiresMaintainerAcknowledgement
              ? (
                  maintainerAcknowledgement.satisfied
                    ? `${maintainerAcknowledgement.source} by @${maintainerAcknowledgement.actor} (${maintainerAcknowledgement.reference})`
                    : 'required-missing'
                )
              : 'not-required';
            const automatedReviewSummary = automatedReviewPolicy.required === true
              ? (
                  automatedReviewSatisfied
                    ? `satisfied:${currentHeadAutomatedReviews[0].user.login}`
                    : 'required-missing-current-head'
                )
              : 'not-required';
            const featureOriginDeliverySummary = featureOriginDelivery.isFeatureOrigin
              ? (
                  featureOriginDelivery.satisfied
                    ? `validated:#${featureOriginDelivery.evidence.source_issue_number} by @${featureOriginDelivery.evidence.delivery_actor}`
                    : 'required-missing-or-invalid'
                )
              : 'not-applicable';
            const summaryLines = eligible
              ? [
                  `${marker}`,
                  '## PR auto-merge executor status',
                  '',
                  `- Status: **eligible**`,
                  `- Policy pack: \`${selectedPack}\``,
                  `- Risk tier: \`${riskTier}\``,
                  `- Required approvals: \`${requiredApprovals}\``,
                  `- Automated review: \`${automatedReviewSummary}\``,
                  `- Human review boundary: \`${requiresHumanReviewByBoundary ? 'required' : 'not-required'}\``,
                  `- Decomposition: \`${decomposition.scope} (${decomposition.counts.changedFiles} files, ${decomposition.counts.changedLines} changed lines)\``,
                  `- Mechanical exception evidence: \`${decomposition.evidenceDigest || 'not-proposed'}\``,
                  `- Mechanical exception review ID: \`${decomposition.reviewId || 'not-required'}\``,
                  `- PR snapshot: \`head ${headSha}; base ${baseSha}\``,
                  `- Review snapshot digest: \`${currentReviewDigest}\``,
                  `- Maintainer acknowledgement: \`${acknowledgementSummary}\``,
                  `- Feature-origin delivery provenance: \`${featureOriginDeliverySummary}\``,
                  `- Production environment boundary: \`${productionEnvironmentBoundary}\``,
                  `- Merge queue posture: \`${mergeQueuePosture}\``,
                  `- Delivery hold: \`${deliveryHoldActive ? `active:${deliveryHoldLabel}` : 'clear'}\``,
                  '',
                  `Run: ${workflowUrl}`
                ]
              : [
                  `${marker}`,
                  '## PR auto-merge executor status',
                  '',
                  `- Status: **${waitingForExternalProgress ? 'waiting' : 'blocked'}**`,
                  `- Policy pack: \`${selectedPack}\``,
                  `- Risk tier: \`${riskTier}\``,
                  `- Required approvals: \`${requiredApprovals}\``,
                  `- Automated review: \`${automatedReviewSummary}\``,
                  `- Human review boundary: \`${requiresHumanReviewByBoundary ? 'required' : 'not-required'}\``,
                  `- Decomposition: \`${decomposition.scope} (${decomposition.counts.changedFiles} files, ${decomposition.counts.changedLines} changed lines)\``,
                  `- Mechanical exception evidence: \`${decomposition.evidenceDigest || 'not-proposed'}\``,
                  `- Mechanical exception review ID: \`${decomposition.reviewId || 'pending'}\``,
                  `- PR snapshot: \`head ${headSha}; base ${baseSha}\``,
                  `- Review snapshot digest: \`${currentReviewDigest}\``,
                  `- Maintainer acknowledgement: \`${acknowledgementSummary}\``,
                  `- Feature-origin delivery provenance: \`${featureOriginDeliverySummary}\``,
                  `- Production environment boundary: \`${productionEnvironmentBoundary}\``,
                  `- Merge queue posture: \`${mergeQueuePosture}\``,
                  `- Delivery hold: \`${deliveryHoldActive ? `active:${deliveryHoldLabel}` : 'clear'}\``,
                  '',
                  ...blockers.map(reason => `- ${reason}`),
                  '',
                  `Run: ${workflowUrl}`
                ];
            const body = summaryLines.join('\n');

            const existing = prComments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              typeof c.body === 'string' &&
              c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

            core.setOutput('eligible', eligible ? 'true' : 'false');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', headSha);
            core.setOutput('base_sha', baseSha);
            core.setOutput('snapshot_digest', sha256(JSON.stringify({
              ...initialSnapshot,
              metadataDigest: initialSnapshot.metadataDigest,
              labelDigest: initialSnapshot.labelDigest
            })));
            core.setOutput('changed_files', String(pr.changed_files));
            core.setOutput('additions', String(pr.additions));
            core.setOutput('deletions', String(pr.deletions));
            core.setOutput('decomposition_digest', decomposition.evidenceDigest);
            core.setOutput('exception_review_id', String(decomposition.reviewId || 0));
            core.setOutput('review_digest', currentReviewDigest);
            core.setOutput('required_approvals', String(requiredApprovals));
            core.setOutput('human_review_required', String(requiresHumanReviewByBoundary));
            core.setOutput('qualified_approvers', JSON.stringify(Array.from(approvedReviewers).sort()));
            core.setOutput('merge_queue_posture', mergeQueuePosture);
            const shouldFailEligibility = !eligible && !waitingForExternalProgress;
            await publishEligibilityStatus(
              eligible ? 'success' : waitingForExternalProgress ? 'pending' : 'failure',
              eligible
                ? `Eligible under ${selectedPack}/${riskTier}.`
                : deliveryHoldActive
                  ? `Delivery hold label active: ${deliveryHoldLabel}.`
                  : waitingForRequiredChecks
                    ? 'Waiting for required status checks to complete.'
                  : waitingForAutomatedReview
                    ? 'Waiting for the required automated review on the current head.'
                    : waitingForMechanicalExceptionReview
                      ? 'Waiting for qualified human review of the mechanical batch exception.'
                    : `Blocked by ${blockers.length} BaseCoat policy condition(s).`
            );
            if (shouldFailEligibility) {
              core.setFailed(`Merge eligibility gate blocked: ${blockers.join(' | ')}`);
            }
            } catch (error) {
              await publishEligibilityStatus('failure', 'BaseCoat merge policy evaluation failed.');
              core.setFailed(error instanceof Error ? error.message : String(error));
            }

  pre-merge-snapshot:
    name: Revalidate merge snapshot
    needs: evaluate
    if: needs.evaluate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted evaluator from the default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Re-fetch and compare eligibility snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.evaluate.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.evaluate.outputs.base_sha }}
          EXPECTED_SNAPSHOT_DIGEST: ${{ needs.evaluate.outputs.snapshot_digest }}
          EXPECTED_CHANGED_FILES: ${{ needs.evaluate.outputs.changed_files }}
          EXPECTED_ADDITIONS: ${{ needs.evaluate.outputs.additions }}
          EXPECTED_DELETIONS: ${{ needs.evaluate.outputs.deletions }}
          EXPECTED_DECOMPOSITION_DIGEST: ${{ needs.evaluate.outputs.decomposition_digest }}
          EXPECTED_EXCEPTION_REVIEW_ID: ${{ needs.evaluate.outputs.exception_review_id }}
          EXPECTED_REVIEW_DIGEST: ${{ needs.evaluate.outputs.review_digest }}
          EXPECTED_REQUIRED_APPROVALS: ${{ needs.evaluate.outputs.required_approvals }}
          EXPECTED_HUMAN_REVIEW_REQUIRED: ${{ needs.evaluate.outputs.human_review_required }}
          EXPECTED_QUALIFIED_APPROVERS: ${{ needs.evaluate.outputs.qualified_approvers }}
        with:
          script: |
            const { evaluateDecomposition, reviewSnapshotDigest, sha256 } = require(
              require('node:path').join(process.env.GITHUB_WORKSPACE, '.github/base-coat/scripts/pr-decomposition-evaluator.cjs')
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(process.env.PR_NUMBER || 0);
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const workflowId = String(process.env.WORKFLOW_REF || '')
              .match(/\.github\/workflows\/([^@]+)@/)?.[1] || 'pr-auto-merge-executor.yml';
            const deliveryHoldLabel = 'delivery-hold';
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });
            const currentReviewDigest = reviewSnapshotDigest(reviews);
            const labels = (pr.labels || []).map(label => String(label.name || '').toLowerCase()).sort();
            if (labels.includes(deliveryHoldLabel)) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: String(pr.head?.sha || ''),
                state: 'failure',
                context: 'BaseCoat merge eligibility',
                description: `Delivery hold label active: ${deliveryHoldLabel}.`,
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
              });
              await core.summary
                .addHeading('Delivery hold active')
                .addRaw(`PR #${prNumber} has the ${deliveryHoldLabel} label; auto-merge remains disabled.`)
                .write();
              core.setFailed(`Delivery hold active: ${deliveryHoldLabel} label is present on PR #${prNumber}.`);
              return;
            }
            const snapshot = {
              headSha: String(pr.head?.sha || ''),
              baseSha: String(pr.base?.sha || ''),
              baseRef: String(pr.base?.ref || ''),
              state: String(pr.state || ''),
              draft: Boolean(pr.draft),
              metadataDigest: sha256(JSON.stringify({
                title: String(pr.title || ''),
                body: String(pr.body || '')
              })),
              labelDigest: sha256(JSON.stringify(labels)),
              changedFiles: pr.changed_files,
              additions: pr.additions,
              deletions: pr.deletions,
              reviewDigest: currentReviewDigest
            };
            const snapshotDigest = sha256(JSON.stringify(snapshot));
            const { data: repository } = await github.rest.repos.get({
              owner,
              repo
            });
            const decomposition = await evaluateDecomposition({
              body: pr.body,
              changedFiles: pr.changed_files,
              additions: pr.additions,
              deletions: pr.deletions,
              files,
              headSha: snapshot.headSha,
              baseSha: snapshot.baseSha,
              reviews,
              authorLogin: pr.user?.login,
              resolvePermission: async login => {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: login
                });
                return data;
              }
            });
            const expectedApprovers = JSON.parse(process.env.EXPECTED_QUALIFIED_APPROVERS || '[]');
            if (!Array.isArray(expectedApprovers) || !expectedApprovers.every(login => typeof login === 'string')) {
              throw new Error('Expected qualified reviewer snapshot is malformed.');
            }
            let qualifiedApproverCount = 0;
            let reviewerPermissionCheckFailed = false;
            for (const login of expectedApprovers) {
              try {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: login
                });
                const levels = [permission.permission, permission.role_name]
                  .map(level => String(level || '').toLowerCase());
                if (levels.some(level => ['admin', 'maintain', 'write'].includes(level))) {
                  qualifiedApproverCount += 1;
                }
              } catch {
                reviewerPermissionCheckFailed = true;
                core.warning(`Unable to revalidate repository permission for @${login}.`);
              }
            }
            const requiredApprovals = Number(process.env.EXPECTED_REQUIRED_APPROVALS || 0);
            const humanReviewRequired = process.env.EXPECTED_HUMAN_REVIEW_REQUIRED === 'true';
            const approvalsStillSatisfied =
              !reviewerPermissionCheckFailed &&
              Number.isSafeInteger(requiredApprovals) &&
              qualifiedApproverCount >= requiredApprovals &&
              (!humanReviewRequired || qualifiedApproverCount > 0);
            const unchanged =
              snapshot.headSha === process.env.EXPECTED_HEAD_SHA &&
              snapshot.baseSha === process.env.EXPECTED_BASE_SHA &&
              snapshotDigest === process.env.EXPECTED_SNAPSHOT_DIGEST &&
              currentReviewDigest === process.env.EXPECTED_REVIEW_DIGEST &&
              String(snapshot.changedFiles) === process.env.EXPECTED_CHANGED_FILES &&
              String(snapshot.additions) === process.env.EXPECTED_ADDITIONS &&
              String(snapshot.deletions) === process.env.EXPECTED_DELETIONS &&
              decomposition.decision === 'pass' &&
              decomposition.evidenceDigest === process.env.EXPECTED_DECOMPOSITION_DIGEST &&
              String(decomposition.reviewId || 0) === process.env.EXPECTED_EXCEPTION_REVIEW_ID &&
              approvalsStillSatisfied;
            if (!unchanged) {
              if (snapshot.headSha) {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: snapshot.headSha,
                  state: 'pending',
                  context: 'BaseCoat merge eligibility',
                  description: 'PR snapshot or exception review changed before auto-merge; re-evaluating.',
                  target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
                });
              }
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: repository.default_branch || defaultBranch,
                inputs: { pr_number: String(prNumber) }
              });
              core.setFailed(`PR snapshot changed or decomposition no longer passes: ${decomposition.reason}`);
              return;
            }
            core.info(`Revalidated PR #${prNumber} at head ${snapshot.headSha} and base ${snapshot.baseSha}.`);

  merge:
    name: Enable auto-merge
    needs: [evaluate, pre-merge-snapshot]
    if: needs.evaluate.outputs.eligible == 'true' && needs.pre-merge-snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge for eligible pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.evaluate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          hold_label="delivery-hold"
          if gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json labels --jq '.labels[].name | ascii_downcase' | grep -Fx "${hold_label}" >/dev/null; then
            gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --disable-auto >/dev/null 2>&1 || true
            gh api --method POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=failure \
              -f context='BaseCoat merge eligibility' \
              -f description="Delivery hold label active: ${hold_label}." \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
            echo "Delivery hold '${hold_label}' is active; auto-merge disabled and not re-enabled." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --auto --squash --delete-branch
          echo "Auto-merge enabled for PR #${PR_NUMBER}."
          merge_state=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json mergeStateStatus --jq '.mergeStateStatus')
          if [[ "${merge_state}" == "BEHIND" ]]; then
            gh api --method PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch" >/dev/null
            echo "Updated PR #${PR_NUMBER} from the protected base branch; CI will re-evaluate the new head."
          fi
