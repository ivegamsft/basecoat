name: "BaseCoat - PR Auto Merge Executor"

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - dismissed
  check_suite:
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate and auto-merge"
        required: true
        type: string

permissions:
  checks: read
  contents: write
  pull-requests: write
  issues: write
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate merge eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      pr_number: ${{ steps.policy.outputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Evaluate policy and merge readiness
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const marker = '<!-- pr-auto-merge-executor:v1 -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const defaultBranch = context.payload.repository?.default_branch || 'main';

            const resolvePrNumber = () => {
              if (context.payload.pull_request?.number) return Number(context.payload.pull_request.number);
              if (context.payload.pull_request_review?.pull_request?.number) {
                return Number(context.payload.pull_request_review.pull_request.number);
              }
              if (Array.isArray(context.payload.check_suite?.pull_requests) && context.payload.check_suite.pull_requests.length > 0) {
                const fromCheckSuite = context.payload.check_suite.pull_requests.find(pr => pr?.base?.ref === 'main')
                  || context.payload.check_suite.pull_requests[0];
                if (fromCheckSuite?.number) {
                  return Number(fromCheckSuite.number);
                }
              }
              const fromInput = Number(process.env.PR_NUMBER_INPUT || 0);
              return Number.isInteger(fromInput) && fromInput > 0 ? fromInput : 0;
            };

            const prNumber = resolvePrNumber();
            if (!prNumber) {
              core.setFailed('Unable to resolve pull request number from event payload or workflow_dispatch input.');
              return;
            }

            const readJsonFromDefaultBranch = async path => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: defaultBranch
              });
              if (Array.isArray(data) || typeof data.content !== 'string') {
                throw new Error(`Expected file content for ${path} on ${defaultBranch}.`);
              }
              return JSON.parse(Buffer.from(data.content, data.encoding || 'base64').toString('utf8'));
            };

            const policy = await readJsonFromDefaultBranch('.github/governance/policy-packs.json');
            const humanBoundaries = await readJsonFromDefaultBranch('.github/governance/human-approval-boundaries.json');
            const requestedPack = String(process.env.POLICY_PACK || '').trim();
            const selectedPack = requestedPack || policy.default_profile;
            if (!policy.profiles?.[selectedPack]) {
              core.setFailed(`Unknown policy pack '${selectedPack}'. Valid profiles: ${Object.keys(policy.profiles || {}).join(', ')}`);
              return;
            }
            const selectedBoundaryProfile = (humanBoundaries.profiles?.[selectedPack])
              ? selectedPack
              : humanBoundaries.default_profile;
            if (!humanBoundaries.profiles?.[selectedBoundaryProfile]) {
              core.setFailed(`Unable to resolve human-approval profile for '${selectedPack}'.`);
              return;
            }

            const profile = policy.profiles[selectedPack];
            const boundaryProfile = humanBoundaries.profiles[selectedBoundaryProfile];
            const alwaysHumanRequired = new Set(humanBoundaries.always_human_required || []);
            const requiredChecks = profile.main?.required_checks || [];
            const mergeQueuePosture = profile.main?.merge_queue_posture || 'deferred';
            if (!['required', 'deferred'].includes(mergeQueuePosture)) {
              core.setFailed(`Invalid merge_queue_posture '${mergeQueuePosture}' for profile '${selectedPack}'.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const blockers = [];
            const labelNames = (pr.labels || []).map(label => String(label.name || '').toLowerCase());

            if (pr.draft) blockers.push('PR is draft.');
            if (pr.state !== 'open') blockers.push(`PR state is '${pr.state}', expected 'open'.`);
            if (pr.base?.ref !== 'main') {
              blockers.push(`PR base branch is '${pr.base?.ref}', expected 'main'.`);
            }
            if (String(pr.mergeable_state || '').toLowerCase() === 'dirty') {
              blockers.push('PR has merge conflicts (mergeable_state=dirty).');
            }
            if (String(pr.mergeable_state || '').toLowerCase() === 'blocked') {
              blockers.push('PR is blocked by repository merge constraints.');
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });
            const changed = files.map(f => f.filename);

            const classifyRiskTier = () => {
              const routes = policy.risk_tier_routing || {};
              const isMatch = prefixes => changed.some(file => prefixes.some(prefix => file.startsWith(prefix)));
              if (isMatch(routes.critical || [])) return 'critical';
              if (isMatch(routes.high || [])) return 'high';
              if (isMatch(routes.medium || [])) return 'medium';
              return 'low';
            };
            const riskTier = classifyRiskTier();
            const requiredApprovals = Number(profile.main?.required_approvals_by_risk_tier?.[riskTier] || 0);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });
            const latestReviewByUser = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login || login === pr.user?.login) continue;
              const previous = latestReviewByUser.get(login);
              const currentTime = new Date(review.submitted_at || review.created_at || 0).getTime();
              const previousTime = previous ? new Date(previous.submitted_at || previous.created_at || 0).getTime() : -1;
              if (!previous || currentTime >= previousTime) {
                latestReviewByUser.set(login, review);
              }
            }
            const approvedReviewers = new Set(
              Array.from(latestReviewByUser.values())
                .filter(review => review.state === 'APPROVED')
                .map(review => review.user.login)
            );
            if (approvedReviewers.size < requiredApprovals) {
              blockers.push(
                `Insufficient approvals for risk tier '${riskTier}' (${approvedReviewers.size}/${requiredApprovals}).`
              );
            }
            const requiresHumanReviewByBoundary = Boolean(
              boundaryProfile.pr_approval_required_by_risk?.[riskTier]
            );
            if (requiresHumanReviewByBoundary && approvedReviewers.size === 0) {
              blockers.push(
                `Human review boundary requires at least one approval for risk tier '${riskTier}'.`
              );
            }
            if (
              alwaysHumanRequired.has('production_environment_approval') &&
              boundaryProfile.production_release_approval_required === true &&
              riskTier === 'critical' &&
              approvedReviewers.size === 0
            ) {
              blockers.push('production_environment_approval: critical-tier release path requires explicit human approval.');
            }
            if (
              alwaysHumanRequired.has('policy_exception_override') &&
              labelNames.includes('policy-exception') &&
              approvedReviewers.size === 0
            ) {
              blockers.push('policy_exception_override: policy-exception changes require explicit human approval.');
            }
            if (
              alwaysHumanRequired.has('security_incident_override') &&
              (labelNames.includes('security-incident') || labelNames.includes('incident')) &&
              approvedReviewers.size === 0
            ) {
              blockers.push('security_incident_override: incident/security-incident changes require explicit human approval.');
            }

            const headSha = pr.head.sha;
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: headSha
            });
            const statusByContext = new Map();
            for (const status of combined.statuses || []) {
              if (!status?.context) continue;
              statusByContext.set(status.context, String(status.state || '').toLowerCase());
            }

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: headSha,
              per_page: 100
            }, response => response.data.check_runs || []);
            const checkByName = new Map();
            for (const check of checkRuns || []) {
              if (!check?.name) continue;
              const conclusion = String(check.conclusion || '').toLowerCase();
              if (conclusion) checkByName.set(check.name, conclusion);
            }

            const unsatisfiedChecks = [];
            for (const checkName of requiredChecks) {
              const statusState = statusByContext.get(checkName);
              const checkState = checkByName.get(checkName);
              const statusSucceeded = statusState === 'success';
              const checkSucceeded = checkState === 'success';
              if (!statusSucceeded && !checkSucceeded) {
                unsatisfiedChecks.push(
                  `${checkName} (status=${statusState || 'pending'}, check=${checkState || 'pending'})`
                );
              }
            }
            if (unsatisfiedChecks.length > 0) {
              blockers.push(`Required checks not satisfied: ${unsatisfiedChecks.join('; ')}`);
            }
            if (mergeQueuePosture === 'required') {
              blockers.push("merge_queue_posture required: auto-merge executor defers to repository merge queue policy.");
            }

            const eligible = blockers.length === 0;
            const summaryLines = eligible
              ? [
                  `${marker}`,
                  '## PR auto-merge executor status',
                  '',
                  `- Status: **eligible**`,
                  `- Policy pack: \`${selectedPack}\``,
                  `- Risk tier: \`${riskTier}\``,
                  `- Required approvals: \`${requiredApprovals}\``,
                  `- Human review boundary: \`${requiresHumanReviewByBoundary ? 'required' : 'not-required'}\``,
                  `- Merge queue posture: \`${mergeQueuePosture}\``,
                  '',
                  `Run: ${workflowUrl}`
                ]
              : [
                  `${marker}`,
                  '## PR auto-merge executor status',
                  '',
                  `- Status: **blocked**`,
                  `- Policy pack: \`${selectedPack}\``,
                  `- Risk tier: \`${riskTier}\``,
                  `- Required approvals: \`${requiredApprovals}\``,
                  `- Human review boundary: \`${requiresHumanReviewByBoundary ? 'required' : 'not-required'}\``,
                  '',
                  ...blockers.map(reason => `- ${reason}`),
                  '',
                  `Run: ${workflowUrl}`
                ];
            const body = summaryLines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              typeof c.body === 'string' &&
              c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

            core.setOutput('eligible', eligible ? 'true' : 'false');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('merge_queue_posture', mergeQueuePosture);

  merge:
    name: Enable auto-merge
    needs: evaluate
    if: needs.evaluate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge for eligible pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --auto --squash --delete-branch
          echo "Auto-merge enabled for PR #${PR_NUMBER}."
