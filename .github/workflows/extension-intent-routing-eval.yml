name: "BaseCoat - Extension Intent Routing Eval"

on:
  pull_request:
    paths:
      - "mcp/basecoat-extension/**"
      - "scripts/eval-extension-intent-routing.ps1"
      - "tests/extension-intent-routing-eval-tests.ps1"
      - "tests/evals/extension-intent-routing/**"
      - "docs/agents/EXTENSION_INTENT_ROUTING_EVAL.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  extension-intent-routing-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run extension intent routing eval tests
        shell: pwsh
        run: |
          pwsh tests/extension-intent-routing-eval-tests.ps1

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-intent-routing-eval-results
          path: test-results/extension-intent-routing/*
          if-no-files-found: warn
          retention-days: 7

