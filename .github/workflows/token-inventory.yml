name: Token Context Inventory

on:
  push:
    branches:
      - main
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'instructions/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Generate token context inventory
        run: python scripts/generate-token-context-inventory.py

      - name: Commit and push updates
        run: |
          if git diff --quiet -- docs/reference/TOKEN_CONTEXT_INVENTORY.md; then
            echo "No inventory changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reference/TOKEN_CONTEXT_INVENTORY.md
          git commit -m "chore(docs): auto-update token context inventory [skip ci]"
          git push origin HEAD:main
