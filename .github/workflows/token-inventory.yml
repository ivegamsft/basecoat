name: Token Context Inventory

on:
  push:
    branches:
      - main
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'instructions/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Generate token context inventory
        run: python scripts/generate-token-context-inventory.py

      - name: Detect inventory changes
        id: changes
        run: |
          if git diff --quiet -- docs/reference/TOKEN_CONTEXT_INVENTORY.md; then
            echo "No inventory changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit inventory update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/token-inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add docs/reference/TOKEN_CONTEXT_INVENTORY.md
          git commit -m "chore(docs): auto-update token context inventory [skip ci]"
          REMOTE_SHA="$(git ls-remote --heads origin "${BRANCH}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            git fetch --no-tags origin "${BRANCH}"
            LEASE_ARG="--force-with-lease=refs/heads/${BRANCH}:${REMOTE_SHA}"
          else
            LEASE_ARG="--force-with-lease=refs/heads/${BRANCH}:"
          fi
          git push origin "HEAD:refs/heads/${BRANCH}" ${LEASE_ARG}

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/token-inventory
        run: |
          PR_TITLE="chore(docs): auto-update token context inventory"
          PR_BODY="$(cat <<'EOF'
          Automated token context inventory refresh.

          - Generated by `.github/workflows/token-inventory.yml`
          - Opens a branch/PR instead of pushing to protected `main`

          Related to #1049
          EOF
          )"

          # Enterprise policies can block GitHub Actions from creating or editing PRs.
          # Keep inventory regeneration successful and provide manual next-step guidance
          # when policy restrictions are detected, but fail normally for other errors.
          run_pr_command() {
            local action="$1"
            shift
            local output=""
            if output="$("$@" 2>&1)"; then
              echo "${output}"
              return 0
            fi

            echo "${output}"
            if echo "${output}" | grep -Eqi 'createPullRequest|not permitted|is not allowed|Resource not accessible by integration'; then
              {
                echo "## Token inventory PR automation blocked by policy"
                echo
                echo "GitHub Actions updated branch \`${BRANCH}\`, but enterprise policy blocked automated PR create/edit."
                echo
                echo "- Branch: \`${BRANCH}\`"
                echo "- Attempted action: \`${action}\`"
                echo
                echo "Manual follow-up:"
                echo "1. Open a PR from \`${BRANCH}\` to \`main\`."
                echo "2. Use title: \`${PR_TITLE}\`."
                echo "3. Use the standard token inventory PR body from this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "WARNING: Enterprise policy blocked PR ${action}; continuing with manual PR instructions."
              return 0
            fi

            return 1
          }

          EXISTING_PR="$(gh pr list --base main --head "${BRANCH}" --state open --json number --jq '.[0].number')"
          if [ -n "${EXISTING_PR}" ]; then
            echo "Updating existing PR #${EXISTING_PR}"
            run_pr_command "edit" gh pr edit "${EXISTING_PR}" --title "${PR_TITLE}" --body "${PR_BODY}"
          else
            echo "Creating a new PR from ${BRANCH} to main"
            run_pr_command "create" gh pr create --base main --head "${BRANCH}" --title "${PR_TITLE}" --body "${PR_BODY}"
          fi
