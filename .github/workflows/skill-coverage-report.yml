name: "BaseCoat - Skill Coverage Report"

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Report skills missing eval.yaml coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      missing_count: ${{ steps.coverage.outputs.missing_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build skill coverage report
        id: coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $skillDirs = Get-ChildItem -Path skills -Directory | Sort-Object Name
          $missing = @()

          foreach ($dir in $skillDirs) {
            $evalPath = Join-Path $dir.FullName 'eval.yaml'
            if (-not (Test-Path $evalPath)) {
              $missing += $dir.Name
            }
          }

          $report = @(
            '# Skill Coverage Report',
            '',
            "- Generated: $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')",
            "- Skills scanned: $($skillDirs.Count)",
            "- Missing eval.yaml: $($missing.Count)",
            '',
            '| Skill | Coverage |',
            '|---|---|'
          )

          if ($missing.Count -eq 0) {
            $report += '| *(none)* | complete |'
          } else {
            foreach ($skill in $missing) {
              $report += "| \`$skill\` | missing eval.yaml |"
            }
          }

          $reportPath = 'skill-coverage-report.md'
          $report | Set-Content -Path $reportPath -Encoding UTF8

          Add-Content -Path $env:GITHUB_OUTPUT -Value "missing_count=$($missing.Count)"
          Get-Content $reportPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload skill coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skill-coverage-report
          path: skill-coverage-report.md
          retention-days: 14

      - name: Open or update skill coverage issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          MISSING_COUNT: ${{ steps.coverage.outputs.missing_count || '0' }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Skill coverage report (missing eval.yaml)';
            const missing = Number(process.env.MISSING_COUNT || '0');
            const report = fs.readFileSync('skill-coverage-report.md', 'utf8');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === title);
            const body = `${report}\n\n---\nGenerated by \`.github/workflows/skill-coverage-report.yml\`.`;

            if (missing > 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['quality', 'automated-report']
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'All skills now include eval.yaml coverage. Closing this tracking issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
