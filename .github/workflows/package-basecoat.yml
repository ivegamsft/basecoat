name: "BaseCoat - Package Base Coat"
run-name: Package Base Coat ${{ inputs.target_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Immutable merged commit SHA to validate and package"
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: basecoat-package-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_tree: ${{ steps.target.outputs.tree }}
    steps:
      - name: Validate immutable target input
        id: requested
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Package target must be a lowercase, full 40-character commit SHA; received '$TARGET_SHA'."
            exit 1
          fi
          echo "sha=${TARGET_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Check out immutable package target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.requested.outputs.sha }}
          fetch-depth: 1

      - name: Record package target tree
        id: target
        env:
          TARGET_SHA: ${{ steps.requested.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Requested package target $TARGET_SHA resolved to $actual_sha."
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

  find-merge-group-validation:
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ci_run_id: ${{ steps.lookup.outputs.ci_run_id }}
      ci_head_sha: ${{ steps.lookup.outputs.ci_head_sha }}
      ci_tree: ${{ steps.lookup.outputs.ci_tree }}
      validation_run_id: ${{ steps.lookup.outputs.basecoat_run_id }}
      validation_head_sha: ${{ steps.lookup.outputs.basecoat_head_sha }}
      validated_tree: ${{ steps.lookup.outputs.basecoat_tree }}
    steps:
      - name: Require successful merge-group validation for package tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_TREE: ${{ needs.resolve-target.outputs.target_tree }}
        shell: bash
        run: |
          set -euo pipefail

          find_validation_marker() {
            local workflow_file="$1"
            local artifact_name="$2"
            local output_prefix="$3"
            local workflow_id
            workflow_id="$(gh api "repos/$REPOSITORY/actions/workflows/$workflow_file" --jq .id)"

            for attempt in {1..12}; do
              local page=1
              while true; do
                local artifacts candidates artifact_count
                artifacts="$(gh api "repos/$REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100&page=$page")"
                candidates="$(jq -r '.artifacts[] | select(.expired == false and .workflow_run.id != null and .workflow_run.head_sha != null) | [.workflow_run.id, .workflow_run.head_sha] | @tsv' <<<"$artifacts")"

                while IFS=$'\t' read -r run_id head_sha; do
                  [[ -n "$run_id" && -n "$head_sha" ]] || continue

                  run="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
                  if [[ "$(jq -r '.event // ""' <<<"$run")" != "merge_group" ]]; then
                    continue
                  fi
                  if [[ "$(jq -r '.workflow_id // ""' <<<"$run")" != "$workflow_id" ]]; then
                    continue
                  fi
                  if [[ "$(jq -r '.status // ""' <<<"$run")" != "completed" ]]; then
                    echo "Validation run $run_id is still in progress; retrying evidence lookup."
                    continue
                  fi
                  if [[ "$(jq -r '.conclusion // ""' <<<"$run")" != "success" ]]; then
                    continue
                  fi

                  if ! run_tree="$(gh api "repos/$REPOSITORY/git/commits/$head_sha" --jq .tree.sha)"; then
                    echo "::warning::Could not resolve the tree for validation run $run_id head $head_sha."
                    continue
                  fi
                  if [[ "$run_tree" != "$TARGET_TREE" ]]; then
                    echo "::warning::Ignoring run $run_id because its server-reported head tree does not match the package tree."
                    continue
                  fi

                  marker_dir="$(mktemp -d)"
                  if ! gh run download "$run_id" --repo "$REPOSITORY" --name "$artifact_name" --dir "$marker_dir"; then
                    rm -rf "$marker_dir"
                    echo "::warning::Could not download marker from run $run_id; retrying evidence lookup."
                    continue
                  fi

                  marker_file="$marker_dir/validated-tree.txt"
                  if [[ ! -f "$marker_file" ]]; then
                    rm -rf "$marker_dir"
                    echo "::warning::Ignoring run $run_id because its validation marker is missing."
                    continue
                  fi
                  marker_tree="$(tr -d '\r\n' < "$marker_file")"
                  rm -rf "$marker_dir"
                  if [[ "$marker_tree" != "$TARGET_TREE" ]] ||
                    [[ "$marker_tree" != "$run_tree" ]]; then
                    echo "::warning::Ignoring run $run_id because its marker does not match the target and server-reported head tree."
                    continue
                  fi

                  printf '%s_run_id=%s\n%s_head_sha=%s\n%s_tree=%s\n' \
                    "$output_prefix" "$run_id" \
                    "$output_prefix" "$head_sha" \
                    "$output_prefix" "$marker_tree" >> "$GITHUB_OUTPUT"
                  echo "Reusing successful $workflow_file merge_group validation run $run_id for tree $TARGET_TREE."
                  return 0
                done <<< "$candidates"

                artifact_count="$(jq '.artifacts | length' <<<"$artifacts")"
                if [[ "$artifact_count" -lt 100 ]]; then
                  break
                fi
                page=$((page + 1))
              done

              if [[ "$attempt" -lt 12 ]]; then
                sleep 10
              fi
            done

            echo "::error::No successful $workflow_file merge_group validation marker found for tree $TARGET_TREE after bounded retries."
            return 1
          }

          find_validation_marker \
            "ci.yml" \
            "ci-merge-group-validation-$TARGET_TREE" \
            "ci"
          find_validation_marker \
            "validate-basecoat.yml" \
            "merge-group-validation-$TARGET_TREE" \
            "basecoat"

  package:
    needs: [resolve-target, find-merge-group-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Assert package target matches validated source
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
          TARGET_TREE: ${{ needs.resolve-target.outputs.target_tree }}
          CI_VALIDATED_TREE: ${{ needs.find-merge-group-validation.outputs.ci_tree }}
          CI_RUN_ID: ${{ needs.find-merge-group-validation.outputs.ci_run_id }}
          CI_HEAD_SHA: ${{ needs.find-merge-group-validation.outputs.ci_head_sha }}
          VALIDATED_TREE: ${{ needs.find-merge-group-validation.outputs.validated_tree }}
          VALIDATION_RUN_ID: ${{ needs.find-merge-group-validation.outputs.validation_run_id }}
          VALIDATION_HEAD_SHA: ${{ needs.find-merge-group-validation.outputs.validation_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Package checkout SHA $actual_sha does not match requested $TARGET_SHA."
            exit 1
          fi
          if [[ "$actual_tree" != "$TARGET_TREE" ]] ||
            [[ "$actual_tree" != "$VALIDATED_TREE" ]] ||
            [[ "$actual_tree" != "$CI_VALIDATED_TREE" ]]; then
            echo "::error::Package tree $actual_tree does not match requested $TARGET_TREE, CI-validated $CI_VALIDATED_TREE, and BaseCoat-validated $VALIDATED_TREE."
            exit 1
          fi
          echo "Packaging $actual_sha ($actual_tree) using successful CI run $CI_RUN_ID at $CI_HEAD_SHA and Validate BaseCoat run $VALIDATION_RUN_ID at $VALIDATION_HEAD_SHA."

      - name: Scan immutable package target commit message
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        shell: bash
        run: bash scripts/scan-commit-messages.sh "$TARGET_SHA"

      - name: Assert committed version metadata matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          expected_version="${tag#v}"
          committed_version="$(jq -r '.version' version.json)"

          # Fail closed: every tag publisher must confirm the tagged commit
          # already carries the release version before building or uploading a
          # release, so a mismatched tag can never be published (issue #3366).
          if [[ "$committed_version" != "$expected_version" ]]; then
            echo "::error title=Version metadata not bumped before tagging::tag=$tag expects version.json version '$expected_version' but the tagged commit has '$committed_version'."
            echo "::error::Bump version.json (and CHANGELOG.md) to $expected_version on main and merge it before tagging $tag."
            exit 1
          fi

          echo "Committed version.json matches release tag: $expected_version"

      - name: Package release artifacts
        run: bash scripts/package-basecoat.sh

      - name: Create GHCP ZIP
        run: |
          rm -rf dist/ghcp-stage
          mkdir -p dist/ghcp-stage
          cp -R agents skills prompts dist/ghcp-stage/
          # Reuse the filtered instruction set from the main package stage.
          cp -R dist/stage/base-coat/instructions dist/ghcp-stage/
          cp basecoat-metadata.json dist/ghcp-stage/
          if [[ -f CATALOG.md ]]; then
            cp CATALOG.md dist/ghcp-stage/
          else
            echo "::warning::CATALOG.md not found; continuing without it in GHCP ZIP"
          fi
          find dist/ghcp-stage/skills -type f -name 'eval.yaml' -delete
          find dist/ghcp-stage/agents -type f -name '*.agent.eval.yaml' -delete
          # Copilot CLI parses every markdown file under agents/ as a custom agent (#3766):
          # ship detail references beside agents/ and rewrite the links between them.
          if [[ -d dist/ghcp-stage/agents/references ]]; then
            mv dist/ghcp-stage/agents/references dist/ghcp-stage/agent-references
            find dist/ghcp-stage/agents -maxdepth 1 -name '*.agent.md' -exec sed -i 's#\](references/#](../agent-references/#g' {} +
            find dist/ghcp-stage/agent-references -name '*.md' -exec sed -i -E 's#\]\(\.\./([A-Za-z0-9._-]+\.agent\.md)#](../agents/\1#g' {} +
            # Ship the BaseCoat docs that references link to and point the links at them.
            grep -rhoE '\]\(\.\./\.\./docs/[^)#]+' dist/ghcp-stage/agent-references | sed 's#^](\.\./\.\./##' | sort -u | while read -r doc; do
              mkdir -p "dist/ghcp-stage/$(dirname "$doc")" && cp "$doc" "dist/ghcp-stage/$doc"
            done
            find dist/ghcp-stage/agent-references -name '*.md' -exec sed -i 's#\](\.\./\.\./docs/#](../docs/#g' {} +
          fi
          (cd dist/ghcp-stage && zip -r ../basecoat-ghcp.zip .)

      - name: Verify no eval metadata in install artifacts
        run: |
          set -euo pipefail
          echo "Checking staged install payloads for eval metadata..."
          found=0
          # Check main stage
          if find dist/stage -type f \( -name 'eval.yaml' -o -name '*.agent.eval.yaml' \) 2>/dev/null | grep -q .; then
            echo "::error::eval metadata found in dist/stage — packaging must exclude eval files"
            find dist/stage -type f \( -name 'eval.yaml' -o -name '*.agent.eval.yaml' \)
            found=1
          fi
          # Check GHCP stage
          if find dist/ghcp-stage -type f \( -name 'eval.yaml' -o -name '*.agent.eval.yaml' \) 2>/dev/null | grep -q .; then
            echo "::error::eval metadata found in dist/ghcp-stage — packaging must exclude eval files"
            find dist/ghcp-stage -type f \( -name 'eval.yaml' -o -name '*.agent.eval.yaml' \)
            found=1
          fi
          if [[ $found -eq 0 ]]; then
            echo "✅ No eval metadata found in install artifacts"
          fi
          exit $found

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 7
          name: base-coat-release
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    # GitHub release publication uses public GitHub APIs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Enforce release label policy gate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fail closed before publishing: same policy as release.yml (#3843).
          git fetch --quiet --force --tags origin
          bash scripts/release-label-gate.sh package-basecoat.yml "$GITHUB_REF_NAME" release-label-coverage.json

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: base-coat-release
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload only files (not the stage directory left by the packaging script)
          mapfile -t files < <(find dist -maxdepth 1 -type f)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No release artifacts found in dist/"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Base Coat $GITHUB_REF_NAME" --generate-notes --repo "${{ github.repository }}"
          fi
