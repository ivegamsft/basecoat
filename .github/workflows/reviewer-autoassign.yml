name: "BaseCoat - Auto-Assign Reviewers by Path"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate for reviewer assignment"
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assign:
    name: Request reviewers from path ownership history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select and request reviewers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || Number(process.env.PR_NUMBER_INPUT || '0');
            if (!prNumber) {
              core.setFailed('Unable to resolve pull request number.');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const prAuthor = pr.data.user?.login || '';

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            if (changedFiles.length === 0) {
              core.info('No changed files found; skipping reviewer assignment.');
              return;
            }

            const score = new Map();
            const touchedPaths = [...new Set(changedFiles.map(file => file.filename.split('/').slice(0, 2).join('/') || file.filename))];
            for (const path of touchedPaths.slice(0, 20)) {
              const commits = await github.paginate(github.rest.repos.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                per_page: 30
              });
              for (const commit of commits) {
                const login = commit.author?.login;
                if (!login) continue;
                if (login === prAuthor) continue;
                if (login.endsWith('[bot]')) continue;
                score.set(login, (score.get(login) || 0) + 1);
              }
            }

            const candidates = [...score.entries()]
              .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
              .map(([login]) => login)
              .slice(0, 2);

            if (candidates.length === 0) {
              core.info('No eligible reviewers discovered from path history.');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              reviewers: candidates
            });

            core.summary
              .addHeading('Auto-assigned reviewers')
              .addRaw(`PR #${prNumber} reviewers requested: ${candidates.map(name => `@${name}`).join(', ')}\n`)
              .write();
