name: Agent Merge

on:
  pull_request:
    paths:
      - "agents/**/*.agent.md"
      - "agents/**/*.agent.eval.yaml"
      - "skills/**/SKILL.md"
      - "skills/**/eval.yaml"
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: "Commit SHA to generate rollback patch for"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate duplicate agent names and tool conflicts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          agent_files = sorted(root.glob("agents/*.agent.md"))
          by_name = {}
          failures = []
          for path in agent_files:
              text = path.read_text(encoding="utf-8")
              match = re.search(r"^---\n(.*?)\n---\n", text, flags=re.S)
              if not match:
                  failures.append(f"{path}: missing YAML frontmatter")
                  continue
              frontmatter = match.group(1)
              name_match = re.search(r"^name:\s*(.+)$", frontmatter, flags=re.M)
              if not name_match:
                  failures.append(f"{path}: missing name in frontmatter")
                  continue
              name = name_match.group(1).strip().strip('"').strip("'")
              skills_match = re.search(r"^allowed_skills:\n((?:^[ \t]+-.*(?:\n|$))+)", frontmatter, flags=re.M)
              skills_block = skills_match.group(1) if skills_match else ""
              skills = tuple(sorted(set(re.findall(r"^\s*-\s*([A-Za-z0-9_.:-]+)\s*$", skills_block, flags=re.M))))
              by_name.setdefault(name, []).append((str(path), skills))

          for name, entries in by_name.items():
              if len(entries) <= 1:
                  continue
              skill_sets = {skills for _, skills in entries}
              paths = ", ".join(path for path, _ in entries)
              failures.append(f"duplicate agent name '{name}' in: {paths}")
              if len(skill_sets) > 1:
                  failures.append(f"conflicting allowed_skills for duplicated agent '{name}'")

          if failures:
              print("Agent merge guardrail failures:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("Agent guardrails passed: no duplicates or conflicting allowed_skills detected.")
          PY

      - name: Validate eval companions
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(".")
          missing = []

          for agent in root.glob("agents/*.agent.md"):
              eval_file = agent.with_name(agent.name.replace(".agent.md", ".agent.eval.yaml"))
              if not eval_file.exists():
                  missing.append(f"{agent} -> missing {eval_file.name}")

          for skill in root.glob("skills/*/SKILL.md"):
              eval_file = skill.with_name("eval.yaml")
              if not eval_file.exists():
                  missing.append(f"{skill} -> missing eval.yaml")

          if missing:
              print("Missing eval companions:")
              for item in missing:
                  print(f"- {item}")
              sys.exit(1)

          print("Eval companion validation passed.")
          PY

      - name: Generate frontmatter changelog
        id: changelog
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "${BASE_SHA}" ]; then
            {
              echo "# Agent Merge Changelog"
              echo
              echo "No pull request base SHA available. Changelog generation is skipped for workflow_dispatch runs."
            } > agent-merge-changelog.md
            echo "summary=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          BASE_SHA = os.environ["BASE_SHA"]
          RANGE = f"{BASE_SHA}...HEAD"

          TOOL_KEYS = {"tools", "allowed-tools", "allowed_tools", "allowed_skills"}
          TRACKED_KEYS = {
              "name", "description", "visibility", "model", "pinned_model",
              "compatibility", "capabilities",
          } | TOOL_KEYS

          FM_RE = re.compile(r"^---\r?\n(.*?)\r?\n---\r?\n", re.S)
          KEY_RE = re.compile(r"^(\s*[A-Za-z_-]+):\s*(.*)")

          def parse_fm(text):
              m = FM_RE.match(text)
              if not m:
                  return {}
              block = m.group(1)
              result = {}
              current_key = None
              for line in block.splitlines():
                  km = KEY_RE.match(line)
                  if km:
                      current_key = km.group(1).strip()
                      result[current_key] = km.group(2).strip()
                  elif current_key and line.startswith((" ", "\t")):
                      result[current_key] = (result.get(current_key, "") + "\n" + line.rstrip()).strip()
              return result

          def git(*args):
              return subprocess.check_output(["git"] + list(args), text=True)

          changed_files = git("diff", "--name-only", RANGE, "--", "agents", "skills").splitlines()
          agent_skill_files = [f for f in changed_files if f.endswith(".agent.md") or f.endswith("SKILL.md")]

          file_diffs = []
          for path in sorted(agent_skill_files):
              try:
                  new_text = git("show", f"HEAD:{path}")
              except subprocess.CalledProcessError:
                  new_text = ""
              try:
                  old_text = git("show", f"{BASE_SHA}:{path}")
              except subprocess.CalledProcessError:
                  old_text = ""

              old_fm = parse_fm(old_text)
              new_fm = parse_fm(new_text)

              all_keys = (set(old_fm) | set(new_fm)) & TRACKED_KEYS
              if not all_keys:
                  continue

              changes = {"added": {}, "removed": {}, "changed": {}}
              for k in sorted(all_keys):
                  old_val = old_fm.get(k)
                  new_val = new_fm.get(k)
                  if old_val is None and new_val is not None:
                      changes["added"][k] = new_val
                  elif old_val is not None and new_val is None:
                      changes["removed"][k] = old_val
                  elif old_val != new_val:
                      changes["changed"][k] = {"from": old_val, "to": new_val}

              if any(changes.values()):
                  file_diffs.append({"file": path, **changes})

          lines = ["# Agent Merge Changelog", "", f"Diff range: `{RANGE}`", ""]

          if not file_diffs:
              lines += ["No tracked frontmatter fields changed in agent or skill assets.", ""]
          else:
              lines += ["## Frontmatter field changes", ""]
              for entry in file_diffs:
                  lines.append(f"### `{entry['file']}`")
                  lines.append("")
                  for k, v in entry.get("added", {}).items():
                      lines.append(f"- **Added** `{k}`: `{v}`")
                  for k, v in entry.get("removed", {}).items():
                      lines.append(f"- **Removed** `{k}`: ~~`{v}`~~")
                  for k, v in entry.get("changed", {}).items():
                      lines.append(f"- **Changed** `{k}`: `{v['from']}` → `{v['to']}`")
                  lines.append("")

          changelog = "\n".join(lines)
          with open("agent-merge-changelog.md", "w") as f:
              f.write(changelog)

          # Build compact summary for PR comment
          if not file_diffs:
              summary = "No tracked frontmatter fields changed."
          else:
              parts = []
              for entry in file_diffs:
                  counts = []
                  if entry["added"]:
                      counts.append(f"+{len(entry['added'])} added")
                  if entry["removed"]:
                      counts.append(f"-{len(entry['removed'])} removed")
                  if entry["changed"]:
                      counts.append(f"~{len(entry['changed'])} changed")
                  parts.append(f"`{entry['file']}`: {', '.join(counts)}")
              summary = "; ".join(parts)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"summary={summary}\n")

          print(changelog)
          PY

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-merge-changelog
          path: agent-merge-changelog.md

      - name: Post changelog PR comment
        if: ${{ github.event_name == 'pull_request' && steps.changelog.outputs.summary != '' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const summary = `${{ steps.changelog.outputs.summary }}`;
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              '## 📋 Agent Merge Frontmatter Changelog',
              '',
              summary,
              '',
              `Full structured changelog: [artifact](${runUrl})`,
            ].join('\n');

            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const bot = existing.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Agent Merge Frontmatter Changelog')
            );

            if (bot) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: bot.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  rollback-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_ref != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate rollback patch
        shell: bash
        env:
          ROLLBACK_REF: ${{ github.event.inputs.rollback_ref }}
        run: |
          git revert --no-commit "${ROLLBACK_REF}"
          git diff --cached > agent-merge-rollback.patch
          git reset --hard

      - name: Upload rollback patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-merge-rollback-patch
          path: agent-merge-rollback.patch
