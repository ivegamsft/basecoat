name: Agent Merge

on:
  pull_request:
    paths:
      - "agents/**/*.agent.md"
      - "agents/**/*.agent.eval.yaml"
      - "skills/**/SKILL.md"
      - "skills/**/eval.yaml"
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: "Commit SHA to generate rollback patch for"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Agent merge guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Validate duplicate agent names and tool conflicts
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import re
          import sys

          FRONTMATTER_PATTERN = re.compile(r"^---\r?\n(.*?)\r?\n---\r?\n", re.S)

          def parse_inline_array(value: str):
              text = value.strip()
              if not text.startswith("["):
                  return []
              try:
                  parsed = ast.literal_eval(text)
              except (SyntaxError, ValueError):
                  return []
              if not isinstance(parsed, (list, tuple)):
                  return []
              normalized = []
              for item in parsed:
                  if isinstance(item, str):
                      candidate = item.strip()
                      if candidate:
                          normalized.append(candidate)
              return normalized

          def parse_yaml_list(frontmatter: str, key: str):
              items = []
              key_match = re.search(rf"(?m)^{re.escape(key)}:\s*(.*)$", frontmatter)
              if not key_match:
                  return tuple()

              inline_value = key_match.group(1).strip()
              if inline_value:
                  items.extend(parse_inline_array(inline_value))

              block_match = re.search(
                  rf"(?ms)^{re.escape(key)}:\s*\r?\n((?:^[ \t]+-.*(?:\r?\n|$))+)",
                  frontmatter,
              )
              if block_match:
                  for line in block_match.group(1).splitlines():
                      bullet_match = re.match(r"^\s*-\s*(.+?)\s*$", line)
                      if not bullet_match:
                          continue
                      candidate = bullet_match.group(1).strip().strip("'").strip('"')
                      if candidate:
                          items.append(candidate)

              return tuple(sorted(set(items)))

          root = pathlib.Path(".")
          agent_files = sorted(root.glob("agents/*.agent.md"))
          by_name = {}
          failures = []

          for path in agent_files:
              text = path.read_text(encoding="utf-8")
              match = FRONTMATTER_PATTERN.search(text)
              if not match:
                  failures.append(f"{path}: missing YAML frontmatter")
                  continue

              frontmatter = match.group(1)
              name_match = re.search(r"(?m)^name:\s*(.+)$", frontmatter)
              if not name_match:
                  failures.append(f"{path}: missing name in frontmatter")
                  continue

              raw_name = name_match.group(1).strip().strip('"').strip("'")
              normalized_name = raw_name.casefold()
              allowed_skills = parse_yaml_list(frontmatter, "allowed_skills")
              tools = set()
              for key in ("tools", "allowed-tools", "allowed_tools"):
                  tools.update(parse_yaml_list(frontmatter, key))
              normalized_tools = tuple(sorted(tools))

              by_name.setdefault(normalized_name, []).append(
                  {
                      "display_name": raw_name,
                      "path": str(path),
                      "skills": allowed_skills,
                      "tools": normalized_tools,
                  }
              )

          for normalized_name, entries in by_name.items():
              if len(entries) <= 1:
                  continue

              display_name = entries[0]["display_name"]
              paths = ", ".join(entry["path"] for entry in entries)
              failures.append(f"duplicate agent name '{display_name}' in: {paths}")

              skill_sets = {entry["skills"] for entry in entries}
              if len(skill_sets) > 1:
                  details = "; ".join(
                      f"{entry['path']} -> allowed_skills={list(entry['skills'])}" for entry in entries
                  )
                  failures.append(
                      f"conflicting allowed_skills for duplicated agent '{display_name}': {details}"
                  )

              tool_sets = {entry["tools"] for entry in entries}
              if len(tool_sets) > 1:
                  details = "; ".join(
                      f"{entry['path']} -> tools={list(entry['tools'])}" for entry in entries
                  )
                  failures.append(
                      f"conflicting tool permissions for duplicated agent '{display_name}': {details}"
                  )

          if failures:
              print("Agent merge guardrail failures:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print(
              "Agent guardrails passed: no duplicate names or conflicting "
              "allowed_skills/tool permissions detected."
          )
          PY

      - name: Validate eval companions
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(".")
          missing = []

          for agent in root.glob("agents/*.agent.md"):
              eval_file = agent.with_name(agent.name.replace(".agent.md", ".agent.eval.yaml"))
              if not eval_file.exists():
                  missing.append(f"{agent} -> missing {eval_file.name}")

          for skill in root.glob("skills/*/SKILL.md"):
              eval_file = skill.with_name("eval.yaml")
              if not eval_file.exists():
                  missing.append(f"{skill} -> missing eval.yaml")

          if missing:
              print("Missing eval companions:")
              for item in missing:
                  print(f"- {item}")
              sys.exit(1)

          print("Eval companion validation passed.")
          PY

      - name: Generate frontmatter changelog
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            {
              echo "# Agent Merge Changelog"
              echo
              echo "No pull request base SHA available. Changelog generation is skipped for workflow_dispatch runs."
            } > agent-merge-changelog.md
            {
              echo "# Agent Merge Changelog Summary"
              echo
              echo "- Structured frontmatter diff skipped (workflow_dispatch without PR base SHA)."
            } > agent-merge-changelog-summary.md
            echo "[]" > agent-merge-changelog.json
            exit 0
          fi

          RANGE="${BASE_SHA}...HEAD"
          export RANGE
          python - <<'PY'
          import ast
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import PurePosixPath

          range_expr = os.environ["RANGE"]
          changed_files_raw = subprocess.check_output(
              ["git", "diff", "--name-only", range_expr, "--", "agents", "skills"],
              text=True,
          )
          changed_files = [
              path.strip()
              for path in changed_files_raw.splitlines()
              if path.strip()
              and (
                  re.fullmatch(r"agents/.+\.agent\.md", path.strip()) is not None
                  or re.fullmatch(r"skills/[^/]+/SKILL\.md", path.strip()) is not None
              )
          ]

          frontmatter_pattern = re.compile(r"^---\n(.*?)\n---\n", re.S)
          key_pattern = re.compile(r"^([A-Za-z0-9_-]+):\s*(.*)$")

          def git_show(ref: str, path: str) -> str:
              proc = subprocess.run(
                  ["git", "show", f"{ref}:{path}"],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              if proc.returncode != 0:
                  return ""
              return proc.stdout

          def load_head(path: str) -> str:
              with open(path, encoding="utf-8") as handle:
                  return handle.read()

          def normalize_scalar(value: str):
              trimmed = value.strip()
              if (trimmed.startswith('"') and trimmed.endswith('"')) or (
                  trimmed.startswith("'") and trimmed.endswith("'")
              ):
                  return trimmed[1:-1]
              if trimmed.startswith("[") and trimmed.endswith("]"):
                  try:
                      parsed = ast.literal_eval(trimmed)
                  except Exception:
                      return trimmed
                  if isinstance(parsed, (list, tuple)):
                      return sorted(str(item).strip() for item in parsed if str(item).strip())
              return trimmed

          def parse_frontmatter(text: str):
              normalized = text.replace("\r\n", "\n")
              match = frontmatter_pattern.match(normalized)
              if not match:
                  return {}

              lines = match.group(1).split("\n")
              data = {}
              idx = 0

              while idx < len(lines):
                  raw_line = lines[idx]
                  line = raw_line.strip()
                  idx += 1
                  if not line or line.startswith("#"):
                      continue

                  key_match = key_pattern.match(raw_line)
                  if not key_match:
                      continue

                  key = key_match.group(1)
                  inline_value = key_match.group(2)

                  if inline_value.strip() == "":
                      items = []
                      while idx < len(lines):
                          list_line = lines[idx]
                          if re.match(r"^\s*-\s+.+$", list_line):
                              item = re.sub(r"^\s*-\s+", "", list_line).strip()
                              if item:
                                  items.append(normalize_scalar(item))
                              idx += 1
                              continue
                          break
                      data[key] = sorted({str(item).strip() for item in items if str(item).strip()})
                      continue

                  data[key] = normalize_scalar(inline_value)

              return data

          def normalize_for_compare(value):
              if isinstance(value, list):
                  return tuple(sorted(str(item) for item in value))
              return str(value)

          def render_value(value):
              if isinstance(value, list):
                  return ", ".join(value) if value else "(empty list)"
              if value == "":
                  return "(empty)"
              return str(value)

          deltas = []
          for path in sorted(set(changed_files)):
              before = parse_frontmatter(git_show(range_expr.split("...")[0], path))
              after = parse_frontmatter(load_head(path))

              all_keys = sorted(set(before.keys()) | set(after.keys()))
              added = []
              removed = []
              changed = []

              for key in all_keys:
                  before_has = key in before
                  after_has = key in after

                  if not before_has and after_has:
                      added.append({"key": key, "new": after[key]})
                      continue
                  if before_has and not after_has:
                      removed.append({"key": key, "old": before[key]})
                      continue
                  if normalize_for_compare(before[key]) != normalize_for_compare(after[key]):
                      changed.append({"key": key, "old": before[key], "new": after[key]})

              if added or removed or changed:
                  deltas.append(
                      {
                          "file": path,
                          "added": added,
                          "removed": removed,
                          "changed": changed,
                          "tool_permission_changes": [
                              item for item in changed if item["key"] in {"tools", "allowed-tools", "allowed_skills"}
                          ]
                          + [item for item in added if item["key"] in {"tools", "allowed-tools", "allowed_skills"}]
                          + [item for item in removed if item["key"] in {"tools", "allowed-tools", "allowed_skills"}],
                      }
                  )

          with open("agent-merge-changelog.json", "w", encoding="utf-8") as handle:
              json.dump(deltas, handle, indent=2)
              handle.write("\n")

          with open("agent-merge-changelog.md", "w", encoding="utf-8") as changelog:
              changelog.write("# Agent Merge Changelog\n\n")
              changelog.write(f"Diff range: {range_expr}\n\n")
              changelog.write("## Structured frontmatter deltas\n\n")
              if not deltas:
                  changelog.write("No frontmatter field changes detected in agent/skill assets.\n")
              for entry in deltas:
                  changelog.write(f"### {entry['file']}\n\n")
                  if entry["added"]:
                      changelog.write("**Added keys**\n")
                      for item in entry["added"]:
                          changelog.write(f"- `{item['key']}` = `{render_value(item['new'])}`\n")
                      changelog.write("\n")
                  if entry["removed"]:
                      changelog.write("**Removed keys**\n")
                      for item in entry["removed"]:
                          changelog.write(f"- `{item['key']}` (was `{render_value(item['old'])}`)\n")
                      changelog.write("\n")
                  if entry["changed"]:
                      changelog.write("**Changed keys**\n")
                      for item in entry["changed"]:
                          changelog.write(
                              f"- `{item['key']}`: `{render_value(item['old'])}` -> `{render_value(item['new'])}`\n"
                          )
                      changelog.write("\n")

          file_count = len(deltas)
          key_change_count = sum(
              len(entry["added"]) + len(entry["removed"]) + len(entry["changed"])
              for entry in deltas
          )
          tool_field_count = sum(len(entry["tool_permission_changes"]) for entry in deltas)

          with open("agent-merge-changelog-summary.md", "w", encoding="utf-8") as summary:
              summary.write("<!-- agent-merge-frontmatter-changelog -->\n")
              summary.write("## Agent Merge Frontmatter Changelog\n\n")
              summary.write(f"- Files with frontmatter deltas: **{file_count}**\n")
              summary.write(f"- Field-level changes: **{key_change_count}**\n")
              summary.write(
                  f"- Tool-permission field changes (`tools`, `allowed-tools`, `allowed_skills`): **{tool_field_count}**\n\n"
              )
              if deltas:
                  summary.write("### Compact file summary\n")
                  for entry in deltas[:10]:
                      summary.write(
                          f"- `{entry['file']}` · +{len(entry['added'])} / -{len(entry['removed'])} / Δ{len(entry['changed'])}\n"
                      )
                  if len(deltas) > 10:
                      summary.write(f"- _{len(deltas) - 10} additional file(s) in artifact_\n")
                  summary.write("\n")
              summary.write(
                  f"Full structured changelog artifact: `agent-merge-changelog` (run {os.environ['GITHUB_RUN_ID']}).\n"
              )
          PY

      - name: Upload changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-merge-changelog
          path: |
            agent-merge-changelog.md
            agent-merge-changelog-summary.md
            agent-merge-changelog.json
          retention-days: 7

      - name: Publish changelog summary comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agent-merge-frontmatter-changelog -->';
            const summary = fs.readFileSync('agent-merge-changelog-summary.md', 'utf8');
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary
              });
              core.info(`Updated existing changelog summary comment (${existing.id}).`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: summary
              });
              core.info('Created changelog summary comment.');
            }

  rollback-plan:
    name: Agent merge rollback plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Generate rollback patch
        shell: bash
        env:
          ROLLBACK_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_ref || '' }}
        run: |
          git revert --no-commit "${ROLLBACK_REF}"
          git diff --cached > agent-merge-rollback.patch
          git reset --hard

      - name: Upload rollback patch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-merge-rollback-patch
          path: agent-merge-rollback.patch
          retention-days: 7
