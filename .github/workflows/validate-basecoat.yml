name: "BaseCoat - Validate BaseCoat"

on:
  workflow_call:
    inputs:
      target_sha:
        description: "Immutable commit SHA to validate"
        required: false
        type: string
      concurrency_group:
        description: 'Concurrency group override — callers can pass a distinct value to avoid collisions with push-to-main validate runs'
        required: false
        type: string
        default: ''
      fail_on_guidance_audit_errors:
        description: 'When false, guidance audit findings are advisory and do not fail the PowerShell test suite.'
        required: false
        type: boolean
        default: true
    outputs:
      validated_sha:
        description: "Commit SHA validated by this workflow"
        value: ${{ jobs.validate-workflow-syntax.outputs.target_sha }}
      validated_tree:
        description: "Git tree validated by this workflow"
        value: ${{ jobs.validate-workflow-syntax.outputs.target_tree }}
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  validate-workflow-syntax:
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      target_tree: ${{ steps.target.outputs.tree }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Record validated source identity
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Select workflow files to lint
        id: workflow-files
        shell: bash
        run: |
          set -euo pipefail

          base_ref=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1 || { echo "git fetch failed"; exit 1; }
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref_name }}" != "main" ]]; then
            base_ref="origin/main"
            timeout 30 git fetch origin main --depth=1 || { echo "git fetch failed"; exit 1; }
          fi

          if [[ -z "$base_ref" ]]; then
            mapfile -t workflow_files < <(
              find .github/workflows -maxdepth 1 -type f \
                \( -name '*.yml' -o -name '*.yaml' \) -printf '%p\n' |
                sed 's#^\./##' |
                sort
            )
          else
            mapfile -t workflow_files < <(git diff --name-only "${base_ref}...HEAD" -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          fi

          if [[ ${#workflow_files[@]} -eq 0 ]]; then
            echo "No workflow files changed in this PR."
            echo "hand_authored_args=" >> "$GITHUB_OUTPUT"
            echo "generated_lock_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hand_authored_files=()
          generated_lock_files=()
          for workflow_file in "${workflow_files[@]}"; do
            if [[ "$workflow_file" == *.lock.yml || "$workflow_file" == *.lock.yaml ]]; then
              generated_lock_files+=("$workflow_file")
            else
              hand_authored_files+=("$workflow_file")
            fi
          done

          printf 'Selected workflow files:\n'
          printf -- '- %s\n' "${workflow_files[@]}"
          echo "hand_authored_args=${hand_authored_files[*]}" >> "$GITHUB_OUTPUT"
          echo "generated_lock_args=${generated_lock_files[*]}" >> "$GITHUB_OUTPUT"

      - name: Lint hand-authored workflows
        if: steps.workflow-files.outputs.hand_authored_args != ''
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            ${{ steps.workflow-files.outputs.hand_authored_args }}

      - name: Lint generated gh-aw locks
        if: steps.workflow-files.outputs.generated_lock_args != ''
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            -ignore "unknown permission scope \"copilot-requests\""
            -ignore "unexpected key \"queue\" for \"concurrency\" section"
            ${{ steps.workflow-files.outputs.generated_lock_args }}

      - name: Probe hand-authored queue parser compatibility
        id: strict-queue-regression
        continue-on-error: true
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            tests/fixtures/actionlint/hand-authored-queue.yml

      - name: Record hand-authored queue parser behavior
        if: always()
        shell: bash
        run: |
          case "${{ steps.strict-queue-regression.outcome }}" in
            success)
              echo "Current actionlint accepts hand-authored concurrency.queue; strict workflow lint remains enabled."
              ;;
            failure)
              echo "Current actionlint rejects hand-authored concurrency.queue; unsupported queue usage remains detectable."
              ;;
            *)
              echo "Unexpected actionlint probe outcome: ${{ steps.strict-queue-regression.outcome }}"
              exit 1
              ;;
          esac

      - name: Generated gh-aw compatibility regression passes
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            -ignore "unknown permission scope \"copilot-requests\""
            -ignore "unexpected key \"queue\" for \"concurrency\" section"
            tests/fixtures/actionlint/generated-gh-aw.lock.yml

  validate-commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Scan commit messages for secrets and PII
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="origin/${{ github.base_ref }}..HEAD"
            timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1 || { echo "git fetch failed"; exit 1; }
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~20..HEAD"
          fi

          echo "Scanning commit messages in range: $range"
          bash scripts/scan-commit-messages.sh "$range"

  validate-unix:
    needs: validate-workflow-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate with bash
        run: bash scripts/validate-basecoat.sh

      - name: Run bash test suite
        run: bash tests/run-tests.sh

  validate-windows:
    needs: validate-workflow-syntax
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Run isolated Windows validation lanes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path test-results -Force | Out-Null

          $failOnGuidanceAuditErrors = $true
          if ('${{ github.event_name }}' -eq 'workflow_call') {
            $failOnGuidanceAuditErrors = [System.Convert]::ToBoolean('${{ inputs.fail_on_guidance_audit_errors }}')
          } elseif ('${{ github.event_name }}' -eq 'pull_request' -or ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref_name }}' -ne 'main')) {
            $failOnGuidanceAuditErrors = $false
          }
          $guidanceAuditArgument = if ($failOnGuidanceAuditErrors) { '$true' } else { '$false' }

          @"
          `$ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/run-windows-validation-lane.ps1 -LaneName core -GuidanceAuditFailOnError:$guidanceAuditArgument
          exit `$LASTEXITCODE
          "@ | Set-Content -Path test-results/windows-core.ps1 -Encoding UTF8

          @'
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/run-windows-validation-lane.ps1 -LaneName sync
          exit $LASTEXITCODE
          '@ | Set-Content -Path test-results/windows-sync.ps1 -Encoding UTF8

          $lanes = @(
            @{ Name = 'core'; Script = 'test-results/windows-core.ps1'; Output = 'test-results/windows-core.out.log'; Error = 'test-results/windows-core.err.log' },
            @{ Name = 'sync'; Script = 'test-results/windows-sync.ps1'; Output = 'test-results/windows-sync.out.log'; Error = 'test-results/windows-sync.err.log' }
          )
          $processes = foreach ($lane in $lanes) {
            $process = Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-File', $lane.Script) `
              -RedirectStandardOutput $lane.Output `
              -RedirectStandardError $lane.Error `
              -NoNewWindow `
              -PassThru
            [PSCustomObject]@{
              Name = $lane.Name
              Process = $process
              Output = $lane.Output
              Error = $lane.Error
            }
          }

          Wait-Process -Id ($processes.Process.Id)
          $failed = @()
          foreach ($lane in $processes) {
            Write-Host "::group::Windows $($lane.Name) lane output"
            if (Test-Path $lane.Output) { Get-Content $lane.Output }
            if (Test-Path $lane.Error) { Get-Content $lane.Error }
            Write-Host "::endgroup::"
            if ($lane.Process.ExitCode -ne 0) {
              $failed += "$($lane.Name)=$($lane.Process.ExitCode)"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::Windows validation failed: $($failed -join ', ')"
            exit 1
          }

      - name: Upload Windows failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-validation-failure
          path: test-results/*.log
          retention-days: 7
          if-no-files-found: warn
