name: "BaseCoat - Validate BaseCoat"

on:
  workflow_call:
    inputs:
      concurrency_group:
        description: 'Concurrency group override — callers can pass a distinct value to avoid collisions with push-to-main validate runs'
        required: false
        type: string
        default: ''
      fail_on_guidance_audit_errors:
        description: 'When false, guidance audit findings are advisory and do not fail the PowerShell test suite.'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  validate-workflow-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Select workflow files to lint
        id: workflow-files
        shell: bash
        run: |
          set -euo pipefail

          base_ref=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1 || { echo "git fetch failed"; exit 1; }
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref_name }}" != "main" ]]; then
            base_ref="origin/main"
            timeout 30 git fetch origin main --depth=1 || { echo "git fetch failed"; exit 1; }
          fi

          if [[ -z "$base_ref" ]]; then
            mapfile -t workflow_files < <(
              find .github/workflows -maxdepth 1 -type f \
                \( -name '*.yml' -o -name '*.yaml' \) -printf '%p\n' |
                sed 's#^\./##' |
                sort
            )
          else
            mapfile -t workflow_files < <(git diff --name-only "${base_ref}...HEAD" -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          fi

          if [[ ${#workflow_files[@]} -eq 0 ]]; then
            echo "No workflow files changed in this PR."
            echo "hand_authored_args=" >> "$GITHUB_OUTPUT"
            echo "generated_lock_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hand_authored_files=()
          generated_lock_files=()
          for workflow_file in "${workflow_files[@]}"; do
            if [[ "$workflow_file" == *.lock.yml || "$workflow_file" == *.lock.yaml ]]; then
              generated_lock_files+=("$workflow_file")
            else
              hand_authored_files+=("$workflow_file")
            fi
          done

          printf 'Selected workflow files:\n'
          printf -- '- %s\n' "${workflow_files[@]}"
          echo "hand_authored_args=${hand_authored_files[*]}" >> "$GITHUB_OUTPUT"
          echo "generated_lock_args=${generated_lock_files[*]}" >> "$GITHUB_OUTPUT"

      - name: Lint hand-authored workflows
        if: steps.workflow-files.outputs.hand_authored_args != ''
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            ${{ steps.workflow-files.outputs.hand_authored_args }}

      - name: Lint generated gh-aw locks
        if: steps.workflow-files.outputs.generated_lock_args != ''
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            -ignore "unknown permission scope \"copilot-requests\""
            -ignore "unexpected key \"queue\" for \"concurrency\" section"
            ${{ steps.workflow-files.outputs.generated_lock_args }}

      - name: Hand-authored queue regression is rejected
        id: strict-queue-regression
        continue-on-error: true
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            tests/fixtures/actionlint/hand-authored-queue.yml

      - name: Assert hand-authored queue regression failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.strict-queue-regression.outcome }}" != "failure" ]]; then
            echo "Strict actionlint unexpectedly accepted hand-authored concurrency.queue."
            exit 1
          fi

      - name: Generated gh-aw compatibility regression passes
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
        with:
          args: >-
            -ignore "shellcheck reported issue.*SC(2016|2086|2129):"
            -ignore "unknown permission scope \"copilot-requests\""
            -ignore "unexpected key \"queue\" for \"concurrency\" section"
            tests/fixtures/actionlint/generated-gh-aw.lock.yml

  validate-commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Scan commit messages for secrets and PII
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="origin/${{ github.base_ref }}..HEAD"
            timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1 || { echo "git fetch failed"; exit 1; }
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~20..HEAD"
          fi

          echo "Scanning commit messages in range: $range"
          bash scripts/scan-commit-messages.sh "$range"

  validate-unix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate with bash
        run: bash scripts/validate-basecoat.sh

      - name: Run bash test suite
        run: bash tests/run-tests.sh

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate with PowerShell
        shell: pwsh
        run: ./scripts/validate-basecoat.ps1

      - name: Run PowerShell test suite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $failOnGuidanceAuditErrors = $true
          if ('${{ github.event_name }}' -eq 'workflow_call') {
            $failOnGuidanceAuditErrors = [System.Convert]::ToBoolean('${{ inputs.fail_on_guidance_audit_errors }}')
          } elseif ('${{ github.event_name }}' -eq 'pull_request' -or ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref_name }}' -ne 'main')) {
            $failOnGuidanceAuditErrors = $false
          }
          ./tests/run-tests.ps1 -GuidanceAuditFailOnError:$failOnGuidanceAuditErrors

      - name: Registry metadata freshness check (blocking)
        shell: pwsh
        run: ./scripts/validate-basecoat.ps1 -Strict

      - name: Coherence check (blocking)
        shell: pwsh
        run: ./scripts/check-coherence.ps1 -Strict -Category conflicts
