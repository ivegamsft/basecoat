name: "Keep/Fix/Throttle Weekly Scorecard"

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository in owner/repo format"
        required: false
        default: "IBuySpy-Shared/basecoat"
        type: string
      lookback_days:
        description: "Lookback days for weekly metric collection"
        required: false
        default: "7"
        type: string
      trend_window_weeks:
        description: "Weeks of history to use for trend classification"
        required: false
        default: "4"
        type: string
      publish_issue_number:
        description: "Issue number to receive weekly readout comment (0 disables comment)"
        required: false
        default: "2050"
        type: string

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Generate weekly scorecard
        id: scorecard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $lookback = 7
          $window = 4
          $publishIssue = 2050

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if (-not [string]::IsNullOrWhiteSpace("${{ inputs.repository }}")) { $repo = "${{ inputs.repository }}" }
            if (-not [string]::IsNullOrWhiteSpace("${{ inputs.lookback_days }}")) { $lookback = [int]"${{ inputs.lookback_days }}" }
            if (-not [string]::IsNullOrWhiteSpace("${{ inputs.trend_window_weeks }}")) { $window = [int]"${{ inputs.trend_window_weeks }}" }
            if (-not [string]::IsNullOrWhiteSpace("${{ inputs.publish_issue_number }}")) { $publishIssue = [int]"${{ inputs.publish_issue_number }}" }
          }

          $outputDir = "artifacts/keep-fix-throttle-weekly-scorecard"
          ./scripts/keep-fix-throttle-weekly-scorecard.ps1 `
            -Repository $repo `
            -LookbackDays $lookback `
            -TrendWindowWeeks $window `
            -OutputDir $outputDir

          "repository=$repo" >> $env:GITHUB_OUTPUT
          "publish_issue_number=$publishIssue" >> $env:GITHUB_OUTPUT
          "markdown_path=$outputDir/keep-fix-throttle-weekly-scorecard.md" >> $env:GITHUB_OUTPUT

      - name: Upload weekly scorecard artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: keep-fix-throttle-weekly-scorecard
          path: artifacts/keep-fix-throttle-weekly-scorecard
          retention-days: 30

      - name: Post weekly readout comment
        if: steps.scorecard.outputs.publish_issue_number != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const issueNumber = Number("${{ steps.scorecard.outputs.publish_issue_number }}");
            const markdownPath = "${{ steps.scorecard.outputs.markdown_path }}";
            const body = fs.readFileSync(markdownPath, "utf8");
            const marker = "<!-- keep-fix-throttle-weekly-scorecard:v1 -->";
            const finalBody = `${marker}\n${body}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: finalBody
            });
