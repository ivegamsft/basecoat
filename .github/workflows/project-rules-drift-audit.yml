name: "BaseCoat - Project Rules Drift Audit"

on:
  schedule:
    # Run weekly on Monday at 7:00 AM UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Audit mode: advisory (report only) or enforce (open issues)'
        required: false
        default: 'advisory'
        type: choice
        options:
          - advisory
          - enforce
      severity_threshold:
        description: 'Minimum severity to include in the report'
        required: false
        default: 'low'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
      project_url:
        description: 'GitHub Project URL (leave blank to skip live rule fetch and report baseline only)'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'scripts/project-rules-baseline.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      drift_status: ${{ steps.audit.outputs.drift_status }}
      drift_outcome: ${{ steps.audit.outputs.drift_outcome }}
      findings_count: ${{ steps.audit.outputs.findings_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Determine audit parameters
        id: params
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'advisory' }}"
          THRESHOLD="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.severity_threshold || 'low' }}"
          # Dispatch: use the provided project_url. Schedule/push: fall back to vars.PROJECT_RULES_AUDIT_URL.
          # When neither is set, the script runs in baseline-only validation mode.
          PROJECT_URL="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.project_url || vars.PROJECT_RULES_AUDIT_URL }}"
          {
            echo "mode=$MODE"
            echo "threshold=$THRESHOLD"
            echo "project_url=$PROJECT_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Validate baseline manifest
        run: |
          if [ ! -f scripts/project-rules-baseline.json ]; then
            echo "ERROR: scripts/project-rules-baseline.json not found."
            exit 1
          fi
          if python3 -c "import json, sys; json.load(open('scripts/project-rules-baseline.json'))"; then
            echo "Baseline manifest is valid JSON."
          else
            echo "ERROR: Baseline manifest is not valid JSON."
            exit 1
          fi

      - name: Run project rules drift audit
        id: audit
        env:
          # GITHUB_TOKEN covers issues:write but does NOT include read:project (Projects v2).
          # For live project rule comparison, set a PAT with read:project in a repository secret
          # named PROJECT_AUDIT_TOKEN and reference it here instead of secrets.GITHUB_TOKEN.
          # Baseline-only validation works with the default token.
          GH_TOKEN: ${{ secrets.PROJECT_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $params = @{
            Repo              = '${{ github.repository }}'
            BaselinePath      = 'scripts/project-rules-baseline.json'
            Mode              = '${{ steps.params.outputs.mode }}'
            SeverityThreshold = '${{ steps.params.outputs.threshold }}'
            OutputPath        = 'drift-report.json'
            AssumeYes         = $true
          }

          $projectUrl = '${{ steps.params.outputs.project_url }}'
          if ($projectUrl) {
            $params.ProjectUrl = $projectUrl
          }

          $exitCode = 0
          try {
            pwsh scripts/project-rules-drift-audit.ps1 @params
            $exitCode = $LASTEXITCODE
          } catch {
            Write-Host "Audit script error: $_"
            $exitCode = 3
          }

          if (Test-Path 'drift-report.json') {
            $report = Get-Content 'drift-report.json' -Raw | ConvertFrom-Json
            $critical = $report.summary.by_severity.critical
            $high     = $report.summary.by_severity.high
            $medium   = $report.summary.by_severity.medium
            $low      = $report.summary.by_severity.low
            $total    = $report.summary.total_findings
            $outcome  = $report.summary.outcome

            $status = if ($critical -gt 0) { 'critical' } `
                      elseif ($high -gt 0) { 'high' } `
                      elseif ($medium -gt 0) { 'medium' } `
                      elseif ($low -gt 0) { 'low' } `
                      else { 'clean' }

            echo "drift_status=$status" >> $env:GITHUB_OUTPUT
            echo "drift_outcome=$outcome" >> $env:GITHUB_OUTPUT
            echo "findings_count=$total" >> $env:GITHUB_OUTPUT

            # Write step summary
            "### Project Rules Drift Audit" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "**Outcome:** $outcome" >> $env:GITHUB_STEP_SUMMARY
            "**Status:** $status" >> $env:GITHUB_STEP_SUMMARY
            "**Findings:** $total (critical: $critical, high: $high, medium: $medium, low: $low)" >> $env:GITHUB_STEP_SUMMARY
            "**Mode:** $($report.mode)" >> $env:GITHUB_STEP_SUMMARY
            "**Baseline:** v$($report.baseline_version)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "drift_status=unknown" >> $env:GITHUB_OUTPUT
            echo "drift_outcome=unknown" >> $env:GITHUB_OUTPUT
            echo "findings_count=0" >> $env:GITHUB_OUTPUT
          }

          # Exit code contract: 0=clean/advisory, 1=high drift, 2=critical drift, 3=execution error
          # Any non-zero exit code other than an expected drift signal should fail the workflow.
          if ($exitCode -eq 2) { exit 1 }   # critical drift → fail
          if ($exitCode -eq 1) { exit 0 }   # high drift → advisory (warn only)
          if ($exitCode -eq 0) { exit 0 }   # clean
          # Unexpected exit code (e.g., script crash) → fail the workflow so operators notice
          Write-Host "Unexpected audit exit code: $exitCode"
          exit 1

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: project-rules-drift-report
          path: drift-report.json
          retention-days: 90

      - name: Open issue on failing drift outcome
        # Runs even when the audit step exits non-zero on critical drift (implicit success()
        # would otherwise skip issue creation); the drift_outcome output is written before exit.
        if: ${{ !cancelled() && steps.audit.outputs.drift_outcome == 'fail' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('drift-report.json')) return;
            const report = JSON.parse(fs.readFileSync('drift-report.json', 'utf-8'));
            // Fail-level findings per the contract outcome mapping: critical or high.
            const failFindings = report.findings.filter(f => f.severity === 'critical' || f.severity === 'high');
            if (failFindings.length === 0) return;

            const rows = failFindings
              .map(f => `| \`${f.finding_id}\` | ${f.severity} | ${f.rule_name} | ${f.drift_type} | ${f.remediation} |`)
              .join('\n');

            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${attempt}`;
            const body = [
              '## Project Rules Drift Audit Failing',
              '',
              `**Outcome:** ${report.summary.outcome}`,
              `**Audit ID:** ${report.audit_id}`,
              `**Baseline version:** ${report.baseline_version}`,
              `**Run (immutable attempt):** ${runUrl}`,
              '',
              '| Finding ID | Severity | Rule | Drift Type | Remediation |',
              '|---|---|---|---|---|',
              rows,
              '',
              '_Resolve critical/high findings to restore AIDL guardrail compliance._',
            ].join('\n');

            const title = 'Project rules drift audit failing';
            const legacyTitle = 'Critical project rules drift detected';
            // A fail driven only by high findings should be priority:high, not priority:critical.
            const hasCritical = failFindings.some(f => f.severity === 'critical');
            const priorityLabel = hasCritical ? 'priority:critical' : 'priority:high';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'governance',
              state: 'open',
              per_page: 100,
            });

            const match = existing.find(i => i.title === title || i.title === legacyTitle);
            if (match) {
              // Migrate a legacy critical-drift issue to the current title so it is not duplicated.
              if (match.title === legacyTitle) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: match.number,
                  title,
                });
              }
              // Reconcile the priority label so an escalation/de-escalation is reflected.
              const current = (match.labels || []).map(l => (typeof l === 'string' ? l : l.name));
              for (const lbl of current) {
                if (lbl && lbl.startsWith('priority:') && lbl !== priorityLabel) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: match.number,
                      name: lbl,
                    });
                  } catch (e) {
                    core.info(`Could not remove stale label ${lbl}: ${e.message}`);
                  }
                }
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                labels: ['governance', priorityLabel],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['governance', priorityLabel],
              });
            }

      - name: Fail on failing drift outcome
        if: steps.audit.outputs.drift_outcome == 'fail'
        run: |
          echo "Project rules drift audit outcome is fail (critical/high drift). Review the drift report and resolve before the next sprint."
          exit 1
