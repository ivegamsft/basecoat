name: "BaseCoat - PR Validation"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-branch-protection-readiness:
    name: Main branch protection readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify main branch protection baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE=".github/governance/policy-packs.json"
          if [[ ! -f "${POLICY_FILE}" ]]; then
            echo "::error::Missing governance policy pack file: ${POLICY_FILE}"
            exit 1
          fi

          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if [[ -z "${SELECTED_PACK}" || "${SELECTED_PACK}" == "null" ]]; then
            echo "::error::Unable to resolve governance policy pack."
            exit 1
          fi

          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi

          echo "Using governance policy pack: ${SELECTED_PACK}"
          mapfile -t required_checks < <(
            jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].main.required_checks[]' "${POLICY_FILE}"
          )
          mapfile -t cloud_agent_checks < <(
            jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.required_status_checks[]' "${POLICY_FILE}"
          )

          if [[ ${#cloud_agent_checks[@]} -gt 0 ]]; then
            printf 'Cloud-agent guardrails for %s: %s\n' "${SELECTED_PACK}" "${cloud_agent_checks[*]}"
          fi

          if ! PROTECTION_JSON="$(gh api "repos/${REPOSITORY}/branches/main/protection" 2>/dev/null)"; then
            echo "::warning::Main branch classic protection is not configured (API returned 404)."
            echo "::warning::If using GitHub Rulesets, this check is advisory — verify protection is in place."
            echo "::warning::To configure: Settings → Branches → main and enable branch protection."
            exit 0
          fi

          STRICT="$(echo "$PROTECTION_JSON" | jq -r '.required_status_checks.strict // false')"
          REVIEW_COUNT="$(echo "$PROTECTION_JSON" | jq -r '.required_pull_request_reviews.required_approving_review_count // 0')"
          CONVERSATION_RESOLUTION="$(echo "$PROTECTION_JSON" | jq -r '.required_conversation_resolution.enabled // false')"
          ENFORCE_ADMINS="$(echo "$PROTECTION_JSON" | jq -r '.enforce_admins.enabled // false')"
          mapfile -t CONTEXTS < <(echo "$PROTECTION_JSON" | jq -r '.required_status_checks.contexts[]?')

          if [[ "$STRICT" != "true" ]]; then
            echo "::error::Main protection must require branches to be up to date before merging."
            exit 1
          fi

          if [[ "$ENFORCE_ADMINS" != "true" ]]; then
            echo "::warning::Include administrators is not enabled. Enabling it is recommended."
          fi

          if [[ "${REVIEW_COUNT}" -lt 1 ]]; then
            echo "::error::Main protection baseline requires at least 1 required approving review."
            exit 1
          fi

          if [[ "${CONVERSATION_RESOLUTION}" != "true" ]]; then
            echo "::error::Main protection baseline requires conversation resolution before merge."
            exit 1
          fi

          missing=0
          for check in "${required_checks[@]}"; do
            if ! printf '%s\n' "${CONTEXTS[@]}" | grep -Fxq "$check"; then
              echo "::error::Missing required status check on main branch protection: $check"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Add the missing checks in Settings → Branches (or Rulesets) for main."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "Main branch protection baseline is configured."
            exit 0
          fi

          risk_tier="low"
          mapfile -t changed_files < <(
            gh api "repos/${REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --paginate \
              --jq '.[].filename'
          )
          for file in "${changed_files[@]}"; do
            while IFS= read -r prefix; do
              [[ -z "${prefix}" ]] && continue
              if [[ "${file}" == "${prefix}"* ]]; then
                risk_tier="critical"
                break 2
              fi
            done < <(jq -r '.risk_tier_routing.critical[]' "${POLICY_FILE}")
          done

          if [[ "${risk_tier}" != "critical" ]]; then
            for file in "${changed_files[@]}"; do
              while IFS= read -r prefix; do
                [[ -z "${prefix}" ]] && continue
                if [[ "${file}" == "${prefix}"* ]]; then
                  risk_tier="high"
                  break 2
                fi
              done < <(jq -r '.risk_tier_routing.high[]' "${POLICY_FILE}")
            done
          fi

          if [[ "${risk_tier}" != "critical" && "${risk_tier}" != "high" ]]; then
            for file in "${changed_files[@]}"; do
              while IFS= read -r prefix; do
                [[ -z "${prefix}" ]] && continue
                if [[ "${file}" == "${prefix}"* ]]; then
                  risk_tier="medium"
                  break 2
                fi
              done < <(jq -r '.risk_tier_routing.medium[]' "${POLICY_FILE}")
            done
          fi

          required_approvals="$(
            jq -r --arg p "${SELECTED_PACK}" --arg t "${risk_tier}" \
              '.profiles[$p].main.required_approvals_by_risk_tier[$t] // 0' "${POLICY_FILE}"
          )"

          merge_queue_posture="$(
            jq -r --arg p "${SELECTED_PACK}" \
              '.profiles[$p].main.merge_queue_posture // "deferred"' "${POLICY_FILE}"
          )"
          if [[ "${merge_queue_posture}" != "required" && "${merge_queue_posture}" != "deferred" ]]; then
            echo "::error::Invalid merge_queue_posture '${merge_queue_posture}' for profile '${SELECTED_PACK}'."
            exit 1
          fi

          if [[ "${merge_queue_posture}" == "required" ]]; then
            if ! gh api "repos/${REPOSITORY}/rulesets" --jq '[.[] | select(.target=="branch" and .enforcement=="active" and (.conditions.ref_name.include // [] | index("refs/heads/main") != null) and (.rules // [] | any(.type=="merge_queue")))] | length > 0' >/dev/null; then
              echo "::error::Policy pack '${SELECTED_PACK}' requires merge queue, but no active merge_queue ruleset was found for main."
              exit 1
            fi
            echo "Merge queue posture for '${SELECTED_PACK}': required (validated via active ruleset)."
          else
            echo "::notice::Merge queue posture for '${SELECTED_PACK}': deferred by policy pack."
          fi

          if [[ "${required_approvals}" =~ ^[0-9]+$ ]] && [[ "${required_approvals}" -gt "${REVIEW_COUNT}" ]]; then
            echo "::warning::Configured policy pack '${SELECTED_PACK}' expects ${required_approvals} review(s) for risk tier '${risk_tier}', but branch protection baseline requires ${REVIEW_COUNT}."
          fi

          approved_reviewers="$(
            gh pr view "${{ github.event.pull_request.number }}" --repo "${REPOSITORY}" --json reviews \
              --jq '[.reviews[] | select(.state=="APPROVED") | .author.login] | unique | length'
          )"
          if [[ "${approved_reviewers}" -lt "${required_approvals}" ]]; then
            echo "::error::Policy pack '${SELECTED_PACK}' requires ${required_approvals} approval(s) for risk tier '${risk_tier}', but PR has ${approved_reviewers}."
            exit 1
          fi

          echo "Risk tier '${risk_tier}' satisfied for policy pack '${SELECTED_PACK}' with ${approved_reviewers} approval(s)."
          echo "Main branch protection baseline is configured."

  release-label-gate:
    name: release-label-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR has wave/sprint release label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          is_release_label() {
            local normalized
            normalized="$(tr '[:upper:]' '[:lower:]' <<<"$1")"
            [[ "$normalized" =~ ^(wave:|sprint:|wave-|sprint-).+ ]] || [[ "$normalized" == "wave/sprint" ]]
          }

          # Guardrail validation for allowed and disallowed release label patterns.
          for expected in "wave:1" "sprint:40" "wave-1" "sprint-2026-05" "wave/sprint"; do
            if ! is_release_label "$expected"; then
              echo "::error::Release label matcher rejected expected format: $expected"
              exit 1
            fi
          done
          for unexpected in "wave" "sprint" "size:S" "needs-triage"; do
            if is_release_label "$unexpected"; then
              echo "::error::Release label matcher accepted invalid format: $unexpected"
              exit 1
            fi
          done

          if [[ ! -f "${GITHUB_EVENT_PATH}" ]]; then
            echo "::error::Missing event payload at ${GITHUB_EVENT_PATH}."
            exit 1
          fi

          mapfile -t labels < <(jq -r '.pull_request.labels[]?.name // empty' "${GITHUB_EVENT_PATH}")
          pr_number="${{ github.event.pull_request.number }}"
          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            pr_number="$(
              gh pr list \
                --repo "${{ github.repository }}" \
                --head "${{ github.ref_name }}" \
                --state open \
                --json number \
                --jq '.[0].number // empty' 2>/dev/null || true
            )"
          fi
          mapfile -t api_labels < <(
            if [[ -n "$pr_number" ]]; then
              gh pr view "$pr_number" \
                --repo "${{ github.repository }}" \
                --json labels \
                --jq '.labels[].name' 2>/dev/null || true
            fi
          )

          if [[ ${#api_labels[@]} -gt 0 ]]; then
            labels=("${api_labels[@]}")
          fi

          if [[ ${#labels[@]} -gt 0 ]]; then
            printf 'Observed PR labels:\n'
            printf -- '- %s\n' "${labels[@]}"
          else
            echo "Observed PR labels: (none)"
          fi

          has_release_label=0
          has_skip_label=0
          for label in "${labels[@]}"; do
            if [[ "$(tr '[:upper:]' '[:lower:]' <<<"$label")" == "skip-release-label-gate" ]]; then
              has_skip_label=1
            fi

            if is_release_label "$label"; then
              has_release_label=1
            fi
          done

          if [[ "$has_release_label" -eq 1 ]]; then
            echo "Release label gate passed."
            exit 0
          fi

          if [[ "$has_skip_label" -eq 1 ]]; then
            echo "::warning::Release label gate bypassed by skip-release-label-gate."
            exit 0
          fi

          echo "::error::PR is missing release labels. Add one label matching wave:*, sprint:*, wave-*, sprint-* or wave/sprint."
          echo "::error::If this PR is exempt, apply label: skip-release-label-gate."
          exit 1

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Run markdown lint on changed markdown files
        shell: bash
        run: |
          set -euo pipefail
          # Fetch with timeout to prevent hanging
          timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1 || { echo "git fetch failed"; exit 1; }
          mapfile -t md_files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.md')

          if [[ ${#md_files[@]} -eq 0 ]]; then
            echo "No markdown files changed in this PR."
            exit 0
          fi

          printf '%s\n' "Markdown files to lint:" "${md_files[@]}"
          # npm install with retry logic using exponential backoff
          npm_installed=0
          for attempt in 1 2 3; do
            if npm install --global markdownlint-cli@0.39.0; then
              npm_installed=1
              break
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "npm install failed, retrying in $((attempt*5)) seconds..."
              sleep $((attempt*5))
            fi
          done
          if [[ $npm_installed -eq 0 ]]; then
            echo "Failed to install markdownlint-cli after 3 attempts"
            exit 1
          fi

          # Build ignore flags from .markdownlintignore (third-party / generated files)
          ignore_args=()
          if [[ -f .markdownlintignore ]]; then
            while IFS= read -r pattern; do
              [[ "$pattern" =~ ^#|^$ ]] && continue
              ignore_args+=(--ignore "$pattern")
            done < .markdownlintignore
          fi

          markdownlint "${ignore_args[@]}" "${md_files[@]}"

  gitleaks-scan:
    name: Gitleaks secret scan (warn only)
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          FILENAME="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Use curl with retry logic and timeout for reliability
          curl --retry 3 --retry-delay 2 --max-time 60 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${FILENAME}" \
            -o "${FILENAME}"
          curl --retry 3 --retry-delay 2 --max-time 60 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -o checksums.txt
          grep "$FILENAME" checksums.txt | sha256sum --check
          tar -xzf "${FILENAME}" -C /usr/local/bin gitleaks
          rm -f "${FILENAME}" checksums.txt
          gitleaks version

      - name: Run gitleaks scan
        shell: bash
        run: |
          set -euo pipefail
          timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1
          set +e
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --report-format sarif \
            --report-path gitleaks-pr-validation.sarif \
            --no-banner \
            --redact \
            --exit-code 1
          EXIT_CODE=$?
          set -e

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::warning::Gitleaks detected potential secrets. Review gitleaks-pr-validation.sarif."
          else
            echo "No secrets detected by gitleaks."
          fi

      - name: Upload gitleaks artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-pr-validation-report
          path: gitleaks-pr-validation.sarif
          if-no-files-found: warn
          retention-days: 7

  validate-agent-files:
    name: Validate agent file structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate required sections in agents/*.agent.md
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(agents/*.agent.md)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No agent files found under agents/. Nothing to validate."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"

            if [[ "$(sed -n '1p' "$file")" != "---" ]]; then
              echo "Missing frontmatter start ('---') in $file" >&2
              exit 1
            fi

            if ! sed -n '1,25p' "$file" | grep -qi '^description:'; then
              echo "Missing description in frontmatter for $file" >&2
              exit 1
            fi

            if ! grep -Eq '^## Inputs$' "$file"; then
              echo "Missing required section '## Inputs' in $file" >&2
              exit 1
            fi

            if ! grep -Eq '^## (Process|Workflow)$' "$file"; then
              echo "Missing required section '## Process' or '## Workflow' in $file" >&2
              exit 1
            fi

            if ! grep -Eq '^## .*(Output|Report)\b' "$file"; then
              echo "Missing required output/report section in $file." >&2
              exit 1
            fi
          done

          echo "Agent file structure validation passed."

  sync-dry-run:
    name: Sync script dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Execute sync.sh in an isolated temp repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BASECOAT_SOURCE_REPO: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
          BASECOAT_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT

          consumer_repo="$tmp_root/consumer"
          mkdir -p "$consumer_repo"
          git -C "$consumer_repo" init -q
          git -C "$consumer_repo" config user.name "pr-validation"
          git -C "$consumer_repo" config user.email "pr-validation@example.com"
          touch "$consumer_repo/README.md"
          git -C "$consumer_repo" add README.md
          git -C "$consumer_repo" commit -m "init" -q

          (
            cd "$consumer_repo"
            BASECOAT_REPO="$BASECOAT_SOURCE_REPO" \
            BASECOAT_REF="$BASECOAT_SOURCE_REF" \
            BASECOAT_TARGET_DIR=".github/base-coat" \
            timeout 120 bash "$GITHUB_WORKSPACE/sync.sh"
          )

          test -f "$consumer_repo/.github/base-coat/README.md"
          test -d "$consumer_repo/.github/base-coat/agents"
          test -d "$consumer_repo/.github/base-coat/instructions"
          test -f "$consumer_repo/.github/PULL_REQUEST_TEMPLATE.md"
          test -f "$consumer_repo/.github/ISSUE_TEMPLATE/issue.md"
          echo "sync.sh dry-run passed."
