name: "BaseCoat - PR Validation"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Metadata notifications must never cancel validation of the current code.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && 'metadata' || 'code' }}
  cancel-in-progress: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}

jobs:
  main-branch-protection-readiness:
    name: Main branch protection readiness gate
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify main branch protection baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          POLICY_PACK: ${{ vars.BASECOAT_POLICY_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE=".github/governance/policy-packs.json"
          if [[ ! -f "${POLICY_FILE}" ]]; then
            echo "::error::Missing governance policy pack file: ${POLICY_FILE}"
            exit 1
          fi

          SELECTED_PACK="${POLICY_PACK:-$(jq -r '.default_profile' "${POLICY_FILE}")}"
          if [[ -z "${SELECTED_PACK}" || "${SELECTED_PACK}" == "null" ]]; then
            echo "::error::Unable to resolve governance policy pack."
            exit 1
          fi

          if ! jq -e --arg p "${SELECTED_PACK}" '.profiles[$p]' "${POLICY_FILE}" >/dev/null; then
            echo "::error::Unknown BASECOAT_POLICY_PACK '${SELECTED_PACK}'."
            exit 1
          fi

          echo "Using governance policy pack: ${SELECTED_PACK}"
          mapfile -t required_checks < <(
            jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].main.required_checks[]' "${POLICY_FILE}"
          )
          mapfile -t cloud_agent_checks < <(
            jq -r --arg p "${SELECTED_PACK}" '.profiles[$p].cloud_agent.required_status_checks[]' "${POLICY_FILE}"
          )

          PROFILE_REVIEW_BASELINE="$(jq -r --arg p "${SELECTED_PACK}" \
            '[.profiles[$p].main.required_approvals_by_risk_tier | to_entries[].value] | max // 0' \
            "${POLICY_FILE}" 2>/dev/null || echo '')"
          if ! [[ "${PROFILE_REVIEW_BASELINE}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve numeric profile review baseline for '${SELECTED_PACK}'."
            exit 1
          fi

          if [[ ${#cloud_agent_checks[@]} -gt 0 ]]; then
            printf 'Cloud-agent guardrails for %s: %s\n' "${SELECTED_PACK}" "${cloud_agent_checks[*]}"
          fi

          if ! PROTECTION_JSON="$(gh api "repos/${REPOSITORY}/branches/main/protection" 2>/dev/null)"; then
            echo "::warning::Main branch classic protection is not configured (API returned 404)."
            echo "::warning::If using GitHub Rulesets, this check is advisory — verify protection is in place."
            echo "::warning::To configure: Settings → Branches → main and enable branch protection."
            exit 0
          fi

          STRICT="$(echo "$PROTECTION_JSON" | jq -r '.required_status_checks.strict // false')"
          REVIEW_COUNT="$(echo "$PROTECTION_JSON" | jq -r '.required_pull_request_reviews.required_approving_review_count // 0')"
          CONVERSATION_RESOLUTION="$(echo "$PROTECTION_JSON" | jq -r '.required_conversation_resolution.enabled // false')"
          ENFORCE_ADMINS="$(echo "$PROTECTION_JSON" | jq -r '.enforce_admins.enabled // false')"
          mapfile -t CONTEXTS < <(echo "$PROTECTION_JSON" | jq -r '.required_status_checks.contexts[]?')

          if [[ "$STRICT" != "true" ]]; then
            echo "::error::Main protection must require branches to be up to date before merging."
            exit 1
          fi

          if [[ "$ENFORCE_ADMINS" != "true" ]]; then
            echo "::warning::Include administrators is not enabled. Enabling it is recommended."
          fi

          if [[ "${REVIEW_COUNT}" -lt "${PROFILE_REVIEW_BASELINE}" ]]; then
            echo "::error::Profile '${SELECTED_PACK}' requires a baseline of ${PROFILE_REVIEW_BASELINE} approving review(s), but branch protection is set to ${REVIEW_COUNT}."
            exit 1
          fi

          if [[ "${CONVERSATION_RESOLUTION}" != "true" ]]; then
            echo "::error::Main protection baseline requires conversation resolution before merge."
            exit 1
          fi

          missing=0
          for check in "${required_checks[@]}"; do
            if ! printf '%s\n' "${CONTEXTS[@]}" | grep -Fxq "$check"; then
              echo "::error::Missing required status check on main branch protection: $check"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Add the missing checks in Settings → Branches (or Rulesets) for main."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "Main branch protection baseline is configured."
            exit 0
          fi

          risk_tier="low"
          mapfile -t changed_files < <(
            gh api "repos/${REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --paginate \
              --jq '.[].filename'
          )
          for file in "${changed_files[@]}"; do
            while IFS= read -r prefix; do
              [[ -z "${prefix}" ]] && continue
              if [[ "${file}" == "${prefix}"* ]]; then
                risk_tier="critical"
                break 2
              fi
            done < <(jq -r '.risk_tier_routing.critical[]' "${POLICY_FILE}")
          done

          if [[ "${risk_tier}" != "critical" ]]; then
            for file in "${changed_files[@]}"; do
              while IFS= read -r prefix; do
                [[ -z "${prefix}" ]] && continue
                if [[ "${file}" == "${prefix}"* ]]; then
                  risk_tier="high"
                  break 2
                fi
              done < <(jq -r '.risk_tier_routing.high[]' "${POLICY_FILE}")
            done
          fi

          if [[ "${risk_tier}" != "critical" && "${risk_tier}" != "high" ]]; then
            for file in "${changed_files[@]}"; do
              while IFS= read -r prefix; do
                [[ -z "${prefix}" ]] && continue
                if [[ "${file}" == "${prefix}"* ]]; then
                  risk_tier="medium"
                  break 2
                fi
              done < <(jq -r '.risk_tier_routing.medium[]' "${POLICY_FILE}")
            done
          fi

          required_approvals="$(
            jq -r --arg p "${SELECTED_PACK}" --arg t "${risk_tier}" \
              '.profiles[$p].main.required_approvals_by_risk_tier[$t] // 0' "${POLICY_FILE}"
          )"

          merge_queue_posture="$(
            jq -r --arg p "${SELECTED_PACK}" \
              '.profiles[$p].main.merge_queue_posture // "deferred"' "${POLICY_FILE}"
          )"
          if [[ "${merge_queue_posture}" != "required" && "${merge_queue_posture}" != "deferred" ]]; then
            echo "::error::Invalid merge_queue_posture '${merge_queue_posture}' for profile '${SELECTED_PACK}'."
            exit 1
          fi

          if [[ "${merge_queue_posture}" == "required" ]]; then
            if ! gh api "repos/${REPOSITORY}/rulesets" --jq '[.[] | select(.target=="branch" and .enforcement=="active" and (.conditions.ref_name.include // [] | index("refs/heads/main") != null) and (.rules // [] | any(.type=="merge_queue")))] | length > 0' >/dev/null; then
              echo "::error::Policy pack '${SELECTED_PACK}' requires merge queue, but no active merge_queue ruleset was found for main."
              exit 1
            fi
            echo "Merge queue posture for '${SELECTED_PACK}': required (validated via active ruleset)."
          else
            echo "::notice::Merge queue posture for '${SELECTED_PACK}': deferred by policy pack."
          fi

          if [[ "${required_approvals}" =~ ^[0-9]+$ ]] && [[ "${required_approvals}" -gt "${REVIEW_COUNT}" ]]; then
            echo "::warning::Configured policy pack '${SELECTED_PACK}' expects ${required_approvals} review(s) for risk tier '${risk_tier}', but branch protection baseline requires ${REVIEW_COUNT}."
          fi

          approved_reviewers="$(
            gh pr view "${{ github.event.pull_request.number }}" --repo "${REPOSITORY}" --json reviews \
              --jq '[.reviews[] | select(.state=="APPROVED") | .author.login] | unique | length'
          )"
          if [[ "${approved_reviewers}" -lt "${required_approvals}" ]]; then
            echo "::error::Policy pack '${SELECTED_PACK}' requires ${required_approvals} approval(s) for risk tier '${risk_tier}', but PR has ${approved_reviewers}."
            exit 1
          fi

          echo "Risk tier '${risk_tier}' satisfied for policy pack '${SELECTED_PACK}' with ${approved_reviewers} approval(s)."
          echo "Main branch protection baseline is configured."

  release-label-gate:
    name: release-label-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Coalesce release-label notifications
        if: contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
        shell: bash
        run: sleep 10

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Validate current PR or every merge-group constituent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const labelGate = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/merge-group-release-labels.cjs`
            );
            const { owner, repo } = context.repo;
            const validateLabels = (pullRequest, source) => {
              const result = labelGate.evaluatePullRequestLabels(pullRequest);
              if (!result.valid) {
                throw new Error(
                  `PR #${pullRequest.number} (${source}) is missing a release label; ` +
                  'each merge-group constituent must carry wave:*, sprint:*, wave-*, ' +
                  'sprint-*, wave/sprint, or an explicit supported exemption.'
                );
              }
              core.info(`PR #${pullRequest.number} passes release-label gate (${result.reason}).`);
            };

            if (context.eventName === 'pull_request') {
              const pullRequestNumber = Number(context.payload.pull_request?.number || 0);
              if (!pullRequestNumber) {
                throw new Error('Pull-request event is missing its PR number.');
              }
              let latestPullRequest;
              for (let attempt = 1; attempt <= 10; attempt += 1) {
                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullRequestNumber
                });
                latestPullRequest = response.data;
                const result = labelGate.evaluatePullRequestLabels(latestPullRequest);
                if (result.valid) {
                  validateLabels(latestPullRequest, `label poll ${attempt}/10`);
                  return;
                }
                if (attempt < 10) {
                  core.info(`Waiting for asynchronous PR labeling (${attempt}/10)...`);
                  await new Promise(resolve => setTimeout(resolve, 3000));
                }
              }
              validateLabels(latestPullRequest, 'current GitHub API state');
              return;
            }

            if (context.eventName === 'workflow_dispatch') {
              const headRef = String(context.ref || '').replace(/^refs\/heads\//, '');
              if (!headRef) {
                throw new Error('Manual release-label validation is missing a head branch.');
              }
              const pullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                base: 'main',
                head: `${owner}:${headRef}`,
                per_page: 100
              });
              if (pullRequests.length !== 1) {
                throw new Error(
                  `Manual validation expected one open main-targeting PR for ${headRef}; ` +
                  `found ${pullRequests.length}.`
                );
              }
              validateLabels(pullRequests[0], 'manual current PR');
              return;
            }

            if (context.eventName !== 'merge_group') {
              throw new Error(`Unsupported release-label event: ${context.eventName}`);
            }

            const mergeGroup = context.payload.merge_group;
            const rawBaseRef = String(mergeGroup?.base_ref || '');
            const baseRef = rawBaseRef.replace(/^refs\/heads\//, '');
            const baseSha = String(mergeGroup?.base_sha || '');
            const headSha = String(mergeGroup?.head_sha || '');
            if (!baseSha || !headSha || !baseRef) {
              throw new Error('Merge-group event is missing base/head SHA or target branch.');
            }
            if (baseRef !== 'main') {
              throw new Error(`Release-label merge-group validation does not support base ${baseRef}.`);
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${baseSha}...${headSha}`,
              per_page: 100
            });
            if (comparison.data.status !== 'ahead' && comparison.data.status !== 'identical') {
              throw new Error(
                `Merge-group comparison is not a valid forward range: ${comparison.data.status}.`
              );
            }
            const commitShas = comparison.data.commits.map(commit => commit.sha);
            if (comparison.data.total_commits > commitShas.length) {
              throw new Error(
                `Merge-group comparison returned ${commitShas.length} of ` +
                `${comparison.data.total_commits} commits; refusing partial membership validation.`
              );
            }

            if (commitShas.length !== 1 || commitShas[0] !== headSha) {
              throw new Error('Release-label gate supports only serialized single-commit squash groups.');
            }
            const queueResponse = await github.graphql(`
              query($owner: String!, $repo: String!, $branch: String!) {
                repository(owner: $owner, name: $repo) {
                  mergeQueue(branch: $branch) {
                    entries(first: 100) {
                      pageInfo { hasNextPage }
                      nodes {
                        state
                        headCommit { oid }
                        pullRequest { number state baseRefName headRefOid }
                      }
                    }
                  }
                }
              }`, { owner, repo, branch: baseRef });
            const queueEntries = queueResponse.repository?.mergeQueue?.entries;
            if (!queueEntries || queueEntries.pageInfo.hasNextPage) {
              throw new Error('Live queue membership is missing or truncated.');
            }
            const constituents = labelGate.selectCurrentMergeGroupPullRequests({
              baseRef,
              groupHeadSha: headSha,
              queueEntries: queueEntries.nodes
            });

            for (const candidate of constituents) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: candidate.number
              });
              const currentPullRequest = response.data;
              if (
                currentPullRequest.state !== 'open' ||
                currentPullRequest.base.ref !== baseRef ||
                currentPullRequest.head.sha !== candidate.head.sha
              ) {
                throw new Error(
                  `PR #${candidate.number} changed state, target, or head after merge-group ` +
                  'construction; refusing to validate stale membership.'
                );
              }
              labelGate.verifyCurrentSquashMergeTree({
                baseSha,
                groupHeadSha: headSha,
                pullRequestHeadSha: currentPullRequest.head.sha
              });
              validateLabels(currentPullRequest, `merge group ${headSha}`);
            }
            core.info(
              `Release-label gate validated ${constituents.length} current PR head(s) ` +
              `in merge group ${headSha}.`
            );

  forbidden-internal-identifier-gate:
    name: Public payload identifier gate
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Validate public payload stays free of internal identifiers
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          git archive HEAD | tar -x -C "$tmpdir"
          cd "$tmpdir"
          # The extracted payload must be a git repository; otherwise every git
          # command below fails, is swallowed by `|| true`, and the gate passes vacuously.
          git init -q
          git add -A
          git rev-parse --git-dir >/dev/null

          INTERNAL_PATTERNS=(
            'SPRINT-*-EXECUTION-SUMMARY.md'
            'tests/**'
            ':(glob)**/tests/**'
            ':(glob)**/*.test.*'
            'analysis/**'
            'reports/**'
            'checks.json'
            'docs/sprint-plans/**'
            'docs/prd/synthesized/**'
            'docs/spec/synthesized/**'
            'docs/audit/**'
            'docs/archive/**'
            '.github/agent-templates/**'
            '.github/dependabot.yml'
            '.github/downstream-reviewer-routing-targets.json'
            '.github/instructions/**'
            '.github/workflow-templates/**'
            'docs/design/copilot-extension-prd.md'
            'docs/guides/PRODUCTION_TOKEN_SETUP.md'
            'docs/operations/blocked-issues.md'
            'docs/operations/copilot-extension-*.md'
            'docs/operations/downstream-intake-pilot-rollout-checklist.md'
            'docs/operations/github-secrets.md'
            'docs/operations/intake-pilot-wawkr-results.md'
            'docs/operations/pr-gate-intake-rollout.md'
            'docs/operations/repo-story.md'
            'docs/reference/workflows/pr-flow-hygiene.md'
            'docs/research/**'
            'docs/templates/copilot-extension/**'
            'instructions/references/process/issue-and-pr-workflow.md'
            'scripts/deploy-merge-queue.ps1'
            'scripts/deploy-merge-queue.sh'
            'scripts/validate-production-token.ps1'
            'scripts/validate-production-token.sh'
          )
          PUBLIC_WORKFLOWS=(
            '.github/workflows/docs.yml'
          )

          REMOVED=0
          for pat in "${INTERNAL_PATTERNS[@]}"; do
            MATCHES=$(git ls-files -- "$pat" 2>/dev/null || true)
            if [[ -n "$MATCHES" ]]; then
              echo "$MATCHES" | xargs git rm -f --cached --ignore-unmatch 2>/dev/null || true
              echo "$MATCHES" | xargs rm -f 2>/dev/null || true
              REMOVED=$((REMOVED + $(echo "$MATCHES" | wc -l)))
            fi
          done

          is_public_workflow() {
            local candidate="$1"
            local allowed
            for allowed in "${PUBLIC_WORKFLOWS[@]}"; do
              if [[ "$candidate" == "$allowed" ]]; then
                return 0
              fi
            done
            return 1
          }

          while IFS= read -r workflow; do
            [[ -z "$workflow" ]] && continue
            if is_public_workflow "$workflow"; then
              continue
            fi
            git rm -f -- "$workflow" >/dev/null 2>&1 || true
            REMOVED=$((REMOVED + 1))
          done < <(git ls-files -- ':(glob).github/workflows/**')

          if [[ "$REMOVED" -gt 0 ]]; then
            echo "Removed ${REMOVED} candidate internal file(s) from the public payload simulation."
          fi

          TEXT_FILES=$(git ls-files -- '*.md' '*.yml' '*.yaml' '*.json' '*.ps1' '*.sh' '*.txt' '*.ts' '*.js' '*.py' '*.html' | grep -v '^$' || true)
          if git ls-files --error-unmatch .github/CODEOWNERS >/dev/null 2>&1; then
            printf '* @ivegamsft\n' > .github/CODEOWNERS
          fi
          if [[ -n "$TEXT_FILES" ]]; then
            TARGETS=$(echo "$TEXT_FILES" | xargs grep -lI -e 'IBuySpy-Shared/basecoat' -e 'ibuyspy-shared\.github\.io/basecoat' 2>/dev/null || true)
            if [[ -n "$TARGETS" ]]; then
              echo "$TARGETS" | while IFS= read -r f; do
                [[ -z "$f" ]] && continue
                perl -pi -e '
                  s{https://github\.com/IBuySpy-Shared/basecoat/issues/[0-9]+}{internal source issue}g;
                  s{https://github\.com/IBuySpy-Shared/basecoat/pull/[0-9]+}{internal source pull request}g;
                  s{https://github\.com/IBuySpy-Shared/basecoat/actions/runs/[0-9]+(?:/job/[0-9]+)?}{internal source workflow run}g;
                  s{\QIBuySpy-Shared/basecoat-sheen\E}{ivegamsft/sheen}g;
                  s{\QIBuySpy-Shared/basecoat.git\E}{ivegamsft/basecoat.git}g;
                  s{IBuySpy-Shared/basecoat\.(?![A-Za-z0-9_-])}{ivegamsft/basecoat.}g;
                  s{IBuySpy-Shared/basecoat(?![A-Za-z0-9_.-])}{ivegamsft/basecoat}g;
                  s{ibuyspy-shared\.github\.io/basecoat}{ivegamsft.github.io/basecoat}g;
                ' -- "$f"
              done
            fi
          fi

          NEUTRAL_ORG_FILES=(
            'CONTRIBUTING.md'
            'docs/architecture/multi-agent-orchestration-patterns.md'
            'instructions/basecoat-20-lang-ruby-on-rails.instructions.md'
            'mcp/basecoat-extension/README.md'
            'mcp/basecoat-extension/scripts/bootstrap-credentials.ps1'
            'scripts/adoption/detect-basecoat.ps1'
            'scripts/bootstrap-copilot-space.ps1'
            'scripts/sweep-enterprise-memory.ps1'
            'scripts/validate-intake-contract.ps1'
            'skills/environment-bootstrap/references/oidc-federation.md'
            'docs/guides/coverage-threshold-ratchet.md'
            'docs/guides/terraform-plan-destroy-guardrail.md'
            'templates/coverage-threshold-ratchet/README.md'
            'templates/terraform-plan-destroy-guardrail/README.md'
          )

          for f in "${NEUTRAL_ORG_FILES[@]}"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              sed -i \
                -e 's|IBuySpy-Shared|example-org|g' \
                -e 's|IBuySpy-Dev|example-org|g' \
                -- "$f"
            fi
          done

          NEUTRAL_MEMORY_FILES=(
            'CHANGELOG.md'
            'docs/architecture/multi-agent-orchestration-patterns.md'
            'docs/architecture/overview.md'
            'docs/memory/learning-model.md'
            'docs/memory/shared-memory-guide.md'
          )
          for f in "${NEUTRAL_MEMORY_FILES[@]}"; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              sed -i 's|IBuySpy-Shared/basecoat-memory|example-org/basecoat-memory|g' "$f"
            fi
          done

          if git ls-files --error-unmatch scripts/submit-learning.sh >/dev/null 2>&1; then
            sed -i \
              -e 's|default: IBuySpy-Shared/basecoat-memory|requires --memory-repo or BASECOAT_SHARED_MEMORY_REPO|g' \
              -e 's|MEMORY_REPO="\${BASECOAT_SHARED_MEMORY_REPO:-IBuySpy-Shared/basecoat-memory}"|MEMORY_REPO="\${BASECOAT_SHARED_MEMORY_REPO:-}"|' \
              -e '/^errors=()$/a [[ -z "$MEMORY_REPO" ]] && errors+=("--memory-repo or BASECOAT_SHARED_MEMORY_REPO is required")' \
              scripts/submit-learning.sh
          fi
          if git ls-files --error-unmatch scripts/submit-learning.ps1 >/dev/null 2>&1; then
            sed -i \
              -e 's|Target memory repository\. Default: env BASECOAT_SHARED_MEMORY_REPO or IBuySpy-Shared/basecoat-memory\.|Target memory repository. Provide explicitly or set env BASECOAT_SHARED_MEMORY_REPO.|' \
              -e 's|\[string\]\$MemoryRepo = (\$env:BASECOAT_SHARED_MEMORY_REPO ?? "IBuySpy-Shared/basecoat-memory"),|[string]$MemoryRepo = $env:BASECOAT_SHARED_MEMORY_REPO,|' \
              -e '/^\$errors = \[System.Collections.Generic.List\[string\]\]::new()$/a if ([string]::IsNullOrWhiteSpace($MemoryRepo)) { $errors.Add("MemoryRepo or BASECOAT_SHARED_MEMORY_REPO is required.") }' \
              scripts/submit-learning.ps1
          fi

          if git ls-files --error-unmatch CHANGELOG.md >/dev/null 2>&1; then
            sed -i 's|IBuySpy-Shared|source organization|g' CHANGELOG.md
          fi
          if git ls-files --error-unmatch docs/architecture/overview.md >/dev/null 2>&1; then
            sed -i 's|BaseCoat (IBuySpy-Shared)|BaseCoat (public mirror)|g' docs/architecture/overview.md
          fi
          if git ls-files --error-unmatch docs/index.md >/dev/null 2>&1; then
            sed -i \
              -e '\|operations/blocked-issues\.md|d' \
              -e '\|operations/copilot-extension-github-app-registration\.md|d' \
              -e '\|operations/github-secrets\.md|d' \
              -e '/^## Archive$/,$d' \
              docs/index.md
          fi
          if git ls-files --error-unmatch mkdocs.yml >/dev/null 2>&1; then
            sed -i \
              -e 's|IBuySpy-Shared contributors|BaseCoat contributors|g' \
              -e '\|PR Flow Hygiene: reference/workflows/pr-flow-hygiene\.md|d' \
              mkdocs.yml
          fi
          for f in skills/dotnet-modernization/SKILL.md skills/entity-framework-migration/SKILL.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              sed -i 's|author: IBuySpy-Shared|author: BaseCoat contributors|g' "$f"
            fi
          done

          FORBIDDEN_MATCHES=$(git grep -inI -E 'ibuyspy-shared|ibuyspy-dev|@ibuyspy' -- . || true)
          UNEXPECTED_MATCHES=$(printf '%s\n' "$FORBIDDEN_MATCHES" | grep -v -E '^LICENSE:3:Copyright \(c\) 2025 IBuySpy-Shared$' | grep -v '^$' || true)
          if [[ -n "$UNEXPECTED_MATCHES" ]]; then
            echo "::error::Public payload simulation still contains forbidden internal identifiers:"
            echo "$UNEXPECTED_MATCHES"
            exit 1
          fi

          echo "Public payload passes the forbidden-identifier gate."

  markdown-lint:
    name: Markdown lint
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Run markdown lint on changed markdown files
        shell: bash
        run: |
          set -euo pipefail
          # Fetch with timeout to prevent hanging
          timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1 || { echo "git fetch failed"; exit 1; }
          mapfile -t md_files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.md')

          if [[ ${#md_files[@]} -eq 0 ]]; then
            echo "No markdown files changed in this PR."
            exit 0
          fi

          printf '%s\n' "Markdown files to lint:" "${md_files[@]}"
          # npm install with retry logic using exponential backoff
          npm_installed=0
          for attempt in 1 2 3; do
            if npm install --global markdownlint-cli@0.39.0; then
              npm_installed=1
              break
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "npm install failed, retrying in $((attempt*5)) seconds..."
              sleep $((attempt*5))
            fi
          done
          if [[ $npm_installed -eq 0 ]]; then
            echo "Failed to install markdownlint-cli after 3 attempts"
            exit 1
          fi

          # Build ignore flags from .markdownlintignore (third-party / generated files)
          ignore_args=()
          if [[ -f .markdownlintignore ]]; then
            while IFS= read -r pattern; do
              [[ "$pattern" =~ ^#|^$ ]] && continue
              ignore_args+=(--ignore "$pattern")
            done < .markdownlintignore
          fi

          markdownlint "${ignore_args[@]}" "${md_files[@]}"

  gitleaks-scan:
    name: Gitleaks secret scan (warn only)
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          FILENAME="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Use curl with retry logic and timeout for reliability
          curl --retry 3 --retry-delay 2 --max-time 60 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${FILENAME}" \
            -o "${FILENAME}"
          curl --retry 3 --retry-delay 2 --max-time 60 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -o checksums.txt
          grep "$FILENAME" checksums.txt | sha256sum --check
          tar -xzf "${FILENAME}" -C /usr/local/bin gitleaks
          rm -f "${FILENAME}" checksums.txt
          gitleaks version

      - name: Run gitleaks scan
        shell: bash
        run: |
          set -euo pipefail
          timeout 30 git fetch origin "${{ github.base_ref }}" --depth=1
          set +e
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --report-format sarif \
            --report-path gitleaks-pr-validation.sarif \
            --no-banner \
            --redact \
            --exit-code 1
          EXIT_CODE=$?
          set -e

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::warning::Gitleaks detected potential secrets. Review gitleaks-pr-validation.sarif."
          else
            echo "No secrets detected by gitleaks."
          fi

      - name: Upload gitleaks artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-pr-validation-report
          path: gitleaks-pr-validation.sarif
          if-no-files-found: warn
          retention-days: 7

  validate-agent-files:
    name: Validate agent file structure
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate required sections in agents/*.agent.md
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(agents/*.agent.md)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No agent files found under agents/. Nothing to validate."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"

            if [[ "$(sed -n '1p' "$file")" != "---" ]]; then
              echo "Missing frontmatter start ('---') in $file" >&2
              exit 1
            fi

            if ! sed -n '1,25p' "$file" | grep -qi '^description:'; then
              echo "Missing description in frontmatter for $file" >&2
              exit 1
            fi

            if ! grep -Eq '^## Inputs$' "$file"; then
              echo "Missing required section '## Inputs' in $file" >&2
              exit 1
            fi

            if ! grep -Eq '^## (Process|Workflow)$' "$file"; then
              echo "Missing required section '## Process' or '## Workflow' in $file" >&2
              exit 1
            fi

            if ! grep -Eq '^## .*(Output|Report)\b' "$file"; then
              echo "Missing required output/report section in $file." >&2
              exit 1
            fi
          done

          echo "Agent file structure validation passed."

  sync-dry-run:
    name: Sync script dry-run
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate immutable consumer callable pin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $template = Get-Content -LiteralPath '.github/workflow-templates/check-basecoat-version.yml' -Raw
          $sha = [regex]::Match($template, 'check-basecoat-version-callable\.yml@([0-9a-f]{40})').Groups[1].Value
          if (-not $sha) { throw 'Consumer workflow template is missing an immutable callable pin.' }
          $encoded = gh api "repos/IBuySpy-Shared/basecoat/contents/.github/workflows/check-basecoat-version-callable.yml?ref=$sha" --jq '.content'
          if ($LASTEXITCODE -ne 0) { throw "Consumer callable pin '$sha' is not fetchable." }
          $callable = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -replace '\s', '')))
          if ($callable -notmatch 'Detect mixed agent naming state') {
            throw "Consumer callable pin '$sha' does not contain the finalized mixed-agent-state safeguard."
          }
          # The pinned callable is the workflow consumers actually run. A marker
          # match alone lets a stale pin that lacks a newly required input/secret
          # pass here and fail at consumer startup. Validate the contract of the
          # *pinned* callable against the template that ships to consumers.
          $pinnedDir = Join-Path $env:RUNNER_TEMP 'basecoat-pin'
          New-Item -ItemType Directory -Force -Path $pinnedDir | Out-Null
          $pinnedPath = Join-Path $pinnedDir 'check-basecoat-version-callable.yml'
          Set-Content -LiteralPath $pinnedPath -Value $callable -Encoding utf8NoBOM
          python3 scripts/validate-reusable-workflow-contracts.py $pinnedPath '.github/workflow-templates/check-basecoat-version.yml'
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned callable '$sha' fails the reusable-workflow contract for the consumer template; publish and pin a commit whose callable declares every input/secret the template passes."
          }
          # A called reusable workflow can only narrow the caller's permission
          # grant, never elevate it. The pinned callable must therefore inherit
          # caller permissions (no workflow-/job-level permissions block), or a
          # minimal caller is rejected at startup before the job runs.
          if ($callable -match '(?m)^\s*permissions\s*:') {
            throw "Pinned callable '$sha' declares a permissions block; it must inherit the caller's permissions instead of narrowing or elevating them."
          }

      - name: Execute sync.sh in an isolated temp repo
        shell: bash
        env:
          BASECOAT_FETCH_TOKEN: ${{ github.token }}
          BASECOAT_FETCH_HOST: github.com
          BASECOAT_SOURCE_REPO: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
          BASECOAT_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT

          consumer_repo="$tmp_root/consumer"
          mkdir -p "$consumer_repo"
          git -C "$consumer_repo" init -q
          git -C "$consumer_repo" config user.name "pr-validation"
          git -C "$consumer_repo" config user.email "pr-validation@example.com"
          touch "$consumer_repo/README.md"
          git -C "$consumer_repo" add README.md
          git -C "$consumer_repo" commit -m "init" -q

          (
            cd "$consumer_repo"
            BASECOAT_REPO="$BASECOAT_SOURCE_REPO" \
            BASECOAT_REF="$BASECOAT_SOURCE_REF" \
            BASECOAT_TARGET_DIR=".github/base-coat" \
            timeout 120 bash "$GITHUB_WORKSPACE/sync.sh"
          )

          test -f "$consumer_repo/.github/base-coat/README.md"
          test -d "$consumer_repo/.github/base-coat/agents"
          test -d "$consumer_repo/.github/base-coat/instructions"
          test -f "$consumer_repo/.github/base-coat/scripts/cleanup-branches.ps1"
          test -f "$consumer_repo/.github/base-coat/scripts/publish-orphaned-lane-ledger.ps1"
          test -f "$consumer_repo/.github/PULL_REQUEST_TEMPLATE.md"
          test -f "$consumer_repo/.github/ISSUE_TEMPLATE/issue.md"
          echo "sync.sh dry-run passed."
