name: "BaseCoat - Downstream Reviewer Routing Audit"

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      repositories:
        description: "Optional comma-separated owner/repo list. If empty, use .github/downstream-reviewer-routing-targets.json."
        type: string
        required: false
        default: ""
      max_ready_prs:
        description: "Maximum non-draft open PRs to evaluate per repository."
        type: number
        required: false
        default: 200
      ineffective_threshold:
        description: "Escalate when ready PRs with no requested reviewers meet/exceed this count."
        type: number
        required: false
        default: 5

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit downstream reviewer routing health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build downstream reviewer-routing scorecard
        id: scorecard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REPOSITORIES_INPUT: ${{ inputs.repositories || '' }}
          MAX_READY_PRS: ${{ inputs.max_ready_prs || 200 }}
          INEFFECTIVE_THRESHOLD: ${{ inputs.ineffective_threshold || 5 }}
        with:
          script: |
            const fs = require('fs');

            const toInt = (value, fallback) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
            };

            const dedupe = values => [...new Set(values.filter(Boolean).map(value => value.trim()).filter(Boolean))];
            const maxReadyPrs = toInt(process.env.MAX_READY_PRS, 200);
            const ineffectiveThreshold = toInt(process.env.INEFFECTIVE_THRESHOLD, 5);
            const repositoriesInput = process.env.REPOSITORIES_INPUT || '';
            const configPath = '.github/downstream-reviewer-routing-targets.json';

            const configuredRepos = [];
            if (fs.existsSync(configPath)) {
              const parsed = JSON.parse(fs.readFileSync(configPath, 'utf8'));
              if (Array.isArray(parsed.repositories)) {
                for (const entry of parsed.repositories) {
                  if (entry && entry.enabled !== false && typeof entry.repo === 'string') {
                    configuredRepos.push(entry.repo);
                  }
                }
              }
            }

            const manualRepos = repositoriesInput
              .split(',')
              .map(value => value.trim())
              .filter(Boolean);
            const repositories = dedupe([...configuredRepos, ...manualRepos]);

            if (repositories.length === 0) {
              core.setFailed(`No repositories were provided. Add entries to ${configPath} or pass workflow_dispatch input "repositories".`);
              return;
            }

            const reviewerWorkflowCandidates = [
              'reviewer-autoassign.yml',
              'basecoat-reviewer-autoassign.yml'
            ];
            const readinessWorkflowCandidates = [
              'pr-flow-hygiene.yml',
              'basecoat-pr-flow-hygiene.yml'
            ];

            const workflowExists = async (owner, repo, filename) => {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: `.github/workflows/${filename}`
                });
                return !Array.isArray(response.data) && response.data.type === 'file';
              } catch (error) {
                if (error.status === 404) {
                  return false;
                }
                throw error;
              }
            };

            const countRecentRuns = async (owner, repo, workflowFile) => {
              const sinceIso = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
              try {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowFile,
                  per_page: 100,
                  created: `>=${sinceIso}`
                });
                return response.data.total_count || 0;
              } catch (error) {
                if (error.status === 404) {
                  return 0;
                }
                throw error;
              }
            };

            const scoreRows = [];
            for (const repoFullName of repositories) {
              const [owner, repo] = repoFullName.split('/');
              if (!owner || !repo) {
                core.warning(`Skipping invalid repository entry: "${repoFullName}"`);
                continue;
              }

              const pullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
                sort: 'updated',
                direction: 'desc'
              });

              const readyPullRequests = pullRequests
                .filter(pr => !pr.draft)
                .slice(0, maxReadyPrs);

              let readyWithoutReview = 0;
              let behindOrDirtyNoReview = 0;
              for (const pr of readyPullRequests) {
                const reviewerCount = (pr.requested_reviewers?.length || 0) + (pr.requested_teams?.length || 0);
                if (reviewerCount > 0) {
                  continue;
                }

                readyWithoutReview += 1;
                const detail = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number
                });
                const mergeableState = String(detail.data.mergeable_state || '').toLowerCase();
                if (mergeableState === 'behind' || mergeableState === 'dirty') {
                  behindOrDirtyNoReview += 1;
                }
              }

              const reviewerWorkflows = [];
              for (const workflowFile of reviewerWorkflowCandidates) {
                if (await workflowExists(owner, repo, workflowFile)) {
                  reviewerWorkflows.push(workflowFile);
                }
              }
              const readinessWorkflows = [];
              for (const workflowFile of readinessWorkflowCandidates) {
                if (await workflowExists(owner, repo, workflowFile)) {
                  readinessWorkflows.push(workflowFile);
                }
              }

              const installedWorkflowFiles = dedupe([...reviewerWorkflows, ...readinessWorkflows]);
              const hasAutomation = installedWorkflowFiles.length > 0;

              let runsLast30Days = 0;
              if (hasAutomation) {
                for (const workflowFile of installedWorkflowFiles) {
                  runsLast30Days += await countRecentRuns(owner, repo, workflowFile);
                }
              }

              let state;
              if (!hasAutomation) {
                state = 'no reviewer-routing automation installed';
              } else if (runsLast30Days === 0) {
                state = 'automation installed but not configured';
              } else if (readyWithoutReview >= ineffectiveThreshold) {
                state = 'automation configured but ineffective in live PRs';
              } else {
                state = 'healthy';
              }

              scoreRows.push({
                repo: `${owner}/${repo}`,
                state,
                readyOpenPrs: readyPullRequests.length,
                readyWithoutReview,
                behindOrDirtyNoReview,
                runsLast30Days,
                workflowsDetected: installedWorkflowFiles
              });
            }

            scoreRows.sort((a, b) => {
              const severityOrder = {
                'automation configured but ineffective in live PRs': 0,
                'automation installed but not configured': 1,
                'no reviewer-routing automation installed': 2,
                'healthy': 3
              };
              const left = severityOrder[a.state] ?? 99;
              const right = severityOrder[b.state] ?? 99;
              if (left !== right) {
                return left - right;
              }
              return b.readyWithoutReview - a.readyWithoutReview || a.repo.localeCompare(b.repo);
            });

            const escalations = scoreRows.filter(row => row.state !== 'healthy');
            const markdown = [
              '# Downstream Reviewer Routing Audit',
              '',
              `- Generated: ${new Date().toISOString()}`,
              `- Repositories evaluated: ${scoreRows.length}`,
              `- Escalations: ${escalations.length}`,
              `- Ineffective threshold (ready PRs without review requests): ${ineffectiveThreshold}`,
              '',
              '| Repository | Routing state | Ready PRs | Ready PRs with no reviewers | BEHIND/DIRTY + no reviewers | Workflow runs (30d) | Workflows detected |',
              '|---|---|---:|---:|---:|---:|---|',
              ...scoreRows.map(row =>
                `| \`${row.repo}\` | ${row.state} | ${row.readyOpenPrs} | ${row.readyWithoutReview} | ${row.behindOrDirtyNoReview} | ${row.runsLast30Days} | ${row.workflowsDetected.length ? row.workflowsDetected.map(name => `\`${name}\``).join(', ') : '_none_'} |`
              ),
              '',
              '## Escalation policy',
              '',
              '1. `no reviewer-routing automation installed`',
              '2. `automation installed but not configured`',
              '3. `automation configured but ineffective in live PRs`',
              '',
              'Remediation guide: `docs/guides/downstream-reviewer-routing-audit.md`'
            ].join('\n');

            const reportJson = {
              generatedAt: new Date().toISOString(),
              maxReadyPrs,
              ineffectiveThreshold,
              repositories: scoreRows
            };

            fs.writeFileSync('downstream-reviewer-routing-audit.md', markdown);
            fs.writeFileSync('downstream-reviewer-routing-audit.json', JSON.stringify(reportJson, null, 2));

            core.setOutput('escalation_count', String(escalations.length));
            core.setOutput('report_path', 'downstream-reviewer-routing-audit.md');
            core.summary.addRaw(markdown).write();

      - name: Upload reviewer-routing audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: downstream-reviewer-routing-audit
          path: |
            downstream-reviewer-routing-audit.md
            downstream-reviewer-routing-audit.json
          retention-days: 14

      - name: Open or update downstream routing issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ESCALATION_COUNT: ${{ steps.scorecard.outputs.escalation_count || '0' }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Downstream reviewer-routing audit report';
            const escalationCount = Number(process.env.ESCALATION_COUNT || '0');
            const body = `${fs.readFileSync('downstream-reviewer-routing-audit.md', 'utf8')}\n\n---\nGenerated by \`.github/workflows/downstream-reviewer-routing-audit.yml\`.`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => issue.title === title);

            if (escalationCount > 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['governance', 'automated-report']
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Reviewer-routing audit is healthy across configured downstream repositories. Closing this tracking issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
