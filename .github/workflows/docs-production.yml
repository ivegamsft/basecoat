name: "BaseCoat - Deploy Production Docs"

# Triggers the docs.yml workflow in ivegamsft/basecoat after a successful publish.
# This ensures the production GitHub Pages site is always in sync with the latest release.
on:
  workflow_run:
    workflows:
      - "BaseCoat - Publish to Production"
    types:
      - completed
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch even if last publish did not succeed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  dispatch-production-docs:
    name: Trigger docs build on production repo
    # Pinned to ubuntu-latest: this job only calls the public GitHub REST API and
    # its steps are POSIX shell. Routing it to a Windows deploy runner via
    # RUNNER_DEPLOY made the bash steps fail under PowerShell (and leaked the token
    # through the parse error). shell: bash is set as defense-in-depth.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        shell: bash
    env:
      PROD_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
    # Only run after a successful publish (skip on failure/cancellation)
    # workflow_dispatch always runs (user explicitly triggered)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Validate token
        run: |
          if [ -z "$PROD_TOKEN" ]; then
            echo "::error::PRODUCTION_REPO_TOKEN is not set — cannot dispatch docs build"
            exit 1
          fi
          echo "Token present, proceeding"

      - name: Dispatch docs.yml on production repo
        id: dispatch
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PROD_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ivegamsft/basecoat/actions/workflows/docs.yml/dispatches" \
            -d '{"ref":"main"}')

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/dispatch_response.json || true

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "::notice::Docs workflow dispatched successfully on ivegamsft/basecoat"
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "::warning::docs.yml not found on ivegamsft/basecoat — production repo may not have been published yet"
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$HTTP_STATUS" = "422" ]; then
            echo "::error::Invalid dispatch request (422) — check that docs.yml has a workflow_dispatch trigger"
            cat /tmp/dispatch_response.json
            exit 1
          else
            echo "::error::Unexpected HTTP status $HTTP_STATUS"
            cat /tmp/dispatch_response.json
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          TRIGGER="${{ github.event_name }}"
          {
            echo "## Production Docs Dispatch Summary"
            echo ""
            if [ "$TRIGGER" = "workflow_run" ]; then
              echo "**Trigger**: Publish to Production completed (run: ${{ github.event.workflow_run.html_url }})"
            else
              echo "**Trigger**: Manual workflow_dispatch"
            fi
            echo ""
            if [ "${{ steps.dispatch.outputs.dispatched }}" = "true" ]; then
              echo "**Result**: Docs workflow dispatched on [ivegamsft/basecoat](https://github.com/ivegamsft/basecoat/actions)"
              echo ""
              echo "Pages will be available at: https://ivegamsft.github.io/basecoat"
            else
              echo "**Result**: Dispatch skipped — docs.yml not found on production repo yet"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
