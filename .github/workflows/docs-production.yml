name: "BaseCoat - Deploy Production Docs"

# Triggers the docs.yml workflow in ivegamsft/basecoat after a successful publish.
# This ensures the production GitHub Pages site is always in sync with the latest release.
on:
  workflow_run:
    workflows:
      - "BaseCoat - Publish to Production"
    types:
      - completed
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch even if last publish did not succeed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  dispatch-production-docs:
    name: Trigger docs build on production repo
    runs-on: ubuntu-latest
    # Only run after a successful publish (skip on failure/cancellation)
    # workflow_dispatch always runs (user explicitly triggered)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Validate token
        run: |
          if [ -z "${{ secrets.PRODUCTION_REPO_TOKEN }}" ]; then
            echo "::error::PRODUCTION_REPO_TOKEN is not set — cannot dispatch docs build"
            exit 1
          fi
          echo "Token present, proceeding"

      - name: Ensure Pages source is gh-pages branch
        run: |
          # docs.yml uses mkdocs gh-deploy which pushes to the gh-pages branch.
          # GitHub Pages must be configured to serve from that branch, not main.
          PAGES_BRANCH=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PRODUCTION_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ivegamsft/basecoat/pages" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('source',{}).get('branch','unknown'))" 2>/dev/null || echo "unknown")

          echo "Current Pages source branch: $PAGES_BRANCH"

          if [ "$PAGES_BRANCH" != "gh-pages" ]; then
            echo "Pages source is '$PAGES_BRANCH', updating to 'gh-pages'..."
            HTTP_STATUS=$(curl -s -o /tmp/pages_response.json -w "%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PRODUCTION_REPO_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/ivegamsft/basecoat/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "Pages update HTTP status: $HTTP_STATUS"
            cat /tmp/pages_response.json || true
            if [ "$HTTP_STATUS" = "204" ]; then
              echo "::notice::Pages source updated to gh-pages branch"
            else
              echo "::warning::Could not update Pages source (status $HTTP_STATUS) — site may serve from wrong branch"
            fi
          else
            echo "Pages source already set to gh-pages — no change needed"
          fi

      - name: Dispatch docs.yml on production repo
        id: dispatch
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PRODUCTION_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ivegamsft/basecoat/actions/workflows/docs.yml/dispatches" \
            -d '{"ref":"main"}')

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/dispatch_response.json || true

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "::notice::Docs workflow dispatched successfully on ivegamsft/basecoat"
            echo "dispatched=true" >> $GITHUB_OUTPUT
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "::warning::docs.yml not found on ivegamsft/basecoat — production repo may not have been published yet"
            echo "dispatched=false" >> $GITHUB_OUTPUT
            exit 0
          elif [ "$HTTP_STATUS" = "422" ]; then
            echo "::error::Invalid dispatch request (422) — check that docs.yml has a workflow_dispatch trigger"
            cat /tmp/dispatch_response.json
            exit 1
          else
            echo "::error::Unexpected HTTP status $HTTP_STATUS"
            cat /tmp/dispatch_response.json
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Production Docs Dispatch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_run" ]; then
            echo "**Trigger**: Publish to Production completed (run: ${{ github.event.workflow_run.html_url }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Trigger**: Manual workflow_dispatch" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.dispatch.outputs.dispatched }}" = "true" ]; then
            echo "**Result**: Docs workflow dispatched on [ivegamsft/basecoat](https://github.com/ivegamsft/basecoat/actions)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pages will be available at: https://ivegamsft.github.io/basecoat" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result**: Dispatch skipped — docs.yml not found on production repo yet" >> $GITHUB_STEP_SUMMARY
          fi
