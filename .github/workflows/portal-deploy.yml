name: "BaseCoat - Portal Deploy"

on:
  push:
    branches: [main]
    paths:
      - "portal/app/backend/**"
      - "portal/app/dashboard/**"
      - "portal/app/iac/**"
      - ".github/workflows/portal-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
      deployment_mode:
        description: "Deployment boundary mode"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - downstream
      downstream_backend_image:
        description: "Fully-qualified backend image reference for downstream mode"
        required: false
        default: ""
        type: string
      downstream_frontend_image:
        description: "Fully-qualified frontend image reference for downstream mode"
        required: false
        default: ""
        type: string
      resource_group:
        description: "Target Azure resource group override (required for downstream mode)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: ${{ vars.PORTAL_AZURE_LOCATION || 'eastus' }}
  AZURE_RESOURCE_GROUP: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.resource_group != '') && github.event.inputs.resource_group || vars.PORTAL_RESOURCE_GROUP || 'basecoat-portal-staging-rg' }}
  DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode || 'internal' }}
  DOWNSTREAM_BACKEND_IMAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.downstream_backend_image || '' }}
  DOWNSTREAM_FRONTEND_IMAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.downstream_frontend_image || '' }}

jobs:
  deploy:
    name: Build and deploy portal
    runs-on: ${{ vars.RUNNER_DEPLOY || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate self-hosted runner routing contract
        shell: bash
        env:
          RUNNER_DEPLOY: ${{ vars.RUNNER_DEPLOY }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_DEPLOY:-}" ]]; then
            echo "::error::vars.RUNNER_DEPLOY is not configured."
            echo "::error::Set RUNNER_DEPLOY to self-hosted labels/group for deploy-class jobs."
            exit 1
          fi
          NORMALIZED="$(echo "${RUNNER_DEPLOY}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${NORMALIZED}" == *"ubuntu-latest"* && "${NORMALIZED}" != *"self-hosted"* ]]; then
            echo "::error::vars.RUNNER_DEPLOY resolves to ubuntu-latest fallback."
            echo "::error::This workflow requires explicit self-hosted routing."
            exit 1
          fi
          echo "Runner contract satisfied: ${RUNNER_DEPLOY}"

      - name: Validate deployment mode boundary
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.deployment_mode || 'internal' }}
          TARGET_ENV: ${{ inputs.environment || 'staging' }}
          TARGET_RG: ${{ env.AZURE_RESOURCE_GROUP }}
          DOWNSTREAM_BACKEND_IMAGE: ${{ env.DOWNSTREAM_BACKEND_IMAGE }}
          DOWNSTREAM_FRONTEND_IMAGE: ${{ env.DOWNSTREAM_FRONTEND_IMAGE }}
        run: |
          set -euo pipefail
          MODE="$(echo "${INPUT_MODE}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${MODE}" != "internal" && "${MODE}" != "downstream" ]]; then
            echo "::error::Unsupported deployment_mode: ${MODE}"
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "push" && "${MODE}" != "internal" ]]; then
            echo "::error::Push-triggered deploys must run in internal mode."
            exit 1
          fi
          if [[ "${MODE}" == "downstream" && "${TARGET_RG}" == "basecoat-portal-staging-rg" ]]; then
            echo "::error::Downstream mode cannot target internal default resource group."
            exit 1
          fi
          if [[ "${MODE}" == "downstream" && "${TARGET_ENV}" == "staging" ]]; then
            echo "::warning::Downstream mode requested with staging environment input; ensure this run targets downstream resources only."
          fi
          if [[ "${MODE}" == "downstream" ]]; then
            if [[ -z "${DOWNSTREAM_BACKEND_IMAGE}" ]]; then
              echo "::error::downstream_backend_image is required for downstream mode."
              exit 1
            fi
            if [[ -z "${DOWNSTREAM_FRONTEND_IMAGE}" ]]; then
              echo "::error::downstream_frontend_image is required for downstream mode."
              exit 1
            fi
          fi
          echo "deployment_mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Deployment mode validated: ${MODE}"

      - name: Select Azure auth mode
        id: azure-auth
        shell: bash
        run: |
          if [[ -n "${AZURE_CREDENTIALS}" ]]; then
            echo "mode=creds" >> "$GITHUB_OUTPUT"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (credentials)
        if: ${{ steps.azure-auth.outputs.mode == 'creds' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        if: ${{ steps.azure-auth.outputs.mode == 'oidc' }}
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          if az group exists --name "${AZURE_RESOURCE_GROUP}" | grep -q true; then
            echo "Resource group ${AZURE_RESOURCE_GROUP} already exists"
          else
            echo "Creating resource group ${AZURE_RESOURCE_GROUP}..."
            az group create \
              --name "${AZURE_RESOURCE_GROUP}" \
              --location "${AZURE_LOCATION}" \
              --output none || {
              echo "Failed to create resource group. Assuming it exists or requires pre-provisioning."
              exit 0
            }
          fi

      - name: Provision ACR
        if: ${{ steps.mode.outputs.deployment_mode == 'internal' }}
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file portal/app/iac/modules/container-registry.bicep \
            --parameters registryName="${ACR_NAME}" \
            --name "acr-provision-${{ github.run_id }}" \
            --output none
          ACR_SERVER=$(az acr show -n "${ACR_NAME}" --query loginServer -o tsv)
          echo "login_server=${ACR_SERVER}" >> "$GITHUB_OUTPUT"
        env:
          ACR_NAME: ${{ vars.PORTAL_ACR_NAME || 'portalacrstaging' }}

      - name: Build images in ACR
        if: ${{ steps.mode.outputs.deployment_mode == 'internal' }}
        id: build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="staging-${GITHUB_SHA::7}"
          BACKEND_TAG="basecoat-portal-backend:${IMAGE_TAG}"
          FRONTEND_TAG="basecoat-portal-dashboard:${IMAGE_TAG}"

          az acr build \
            --registry "${ACR_NAME}" \
            --image "${BACKEND_TAG}" \
            --file portal/app/backend/Dockerfile \
            portal/app/backend

          az acr build \
            --registry "${ACR_NAME}" \
            --image "${FRONTEND_TAG}" \
            --file portal/app/dashboard/Dockerfile \
            portal/app/dashboard

          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"
        env:
          ACR_NAME: ${{ vars.PORTAL_ACR_NAME || 'portalacrstaging' }}

      - name: Deploy portal stack
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_JSON=$(az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file portal/app/iac/main.bicep \
            --parameters \
              acrName="${ACR_NAME}" \
              backendImageTag="${{ steps.build.outputs.backend_tag }}" \
              frontendImageTag="${{ steps.build.outputs.frontend_tag }}" \
              downstreamBackendImage="${DOWNSTREAM_BACKEND_IMAGE}" \
              downstreamFrontendImage="${DOWNSTREAM_FRONTEND_IMAGE}" \
              deploymentMode="${{ steps.mode.outputs.deployment_mode }}" \
            --name "portal-staging-${{ github.run_number }}" \
            --query properties.outputs \
            --output json)

          {
            echo "deployment_mode=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['deploymentMode']['value'])")"
            echo "resource_group_name=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['resourceGroupName']['value'])")"
            echo "backend_url=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['backendUrl']['value'])")"
            echo "frontend_url=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['frontendUrl']['value'])")"
            echo "database_fqdn=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['databaseFqdn']['value'])")"
            echo "acr_server=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['acrLoginServer']['value'])")"
            echo "app_insights_name=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['appInsightsName']['value'])")"
            echo "app_insights_resource_id=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['appInsightsResourceId']['value'])")"
            echo "log_analytics_id=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['logAnalyticsWorkspaceId']['value'])")"
            echo "backend_resource_id=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['backendContainerAppId']['value'])")"
            echo "frontend_resource_id=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['frontendContainerAppId']['value'])")"
            echo "postgres_resource_id=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['postgresServerResourceId']['value'])")"
          } >> "$GITHUB_OUTPUT"
        env:
          ACR_NAME: ${{ vars.PORTAL_ACR_NAME || 'portalacrstaging' }}

      - name: Smoke test backend
        if: ${{ steps.mode.outputs.deployment_mode == 'internal' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.backend_url }}/health"
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt $attempt of 5..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
            if [[ "${STATUS}" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend health check failed: ${URL}"
          exit 1

      - name: Smoke test frontend
        if: ${{ steps.mode.outputs.deployment_mode == 'internal' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.frontend_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Frontend smoke check failed: ${URL} returned ${STATUS}"
            exit 1
          fi

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "### Portal staging deployment"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Deployment mode | ${{ steps.deploy.outputs.deployment_mode }} |"
            echo "| Resource group | ${{ steps.deploy.outputs.resource_group_name }} |"
            echo "| Backend | ${{ steps.deploy.outputs.backend_url }} |"
            echo "| Frontend | ${{ steps.deploy.outputs.frontend_url }} |"
            echo "| PostgreSQL | ${{ steps.deploy.outputs.database_fqdn }} |"
            echo "| ACR | ${{ steps.deploy.outputs.acr_server }} |"
            echo "| App Insights | ${{ steps.deploy.outputs.app_insights_name }} |"
            echo "| App Insights resource ID | ${{ steps.deploy.outputs.app_insights_resource_id }} |"
            echo "| Log Analytics workspace ID | ${{ steps.deploy.outputs.log_analytics_id }} |"
            echo "| Backend resource ID | ${{ steps.deploy.outputs.backend_resource_id }} |"
            echo "| Frontend resource ID | ${{ steps.deploy.outputs.frontend_resource_id }} |"
            echo "| PostgreSQL resource ID | ${{ steps.deploy.outputs.postgres_resource_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
