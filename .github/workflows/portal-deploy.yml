name: Portal Deploy

on:
  push:
    branches: [main]
    paths:
      - "portal/app/backend/**"
      - "portal/app/dashboard/**"
      - "portal/app/iac/**"
      - ".github/workflows/portal-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: ${{ vars.PORTAL_AZURE_LOCATION || 'eastus' }}
  AZURE_RESOURCE_GROUP: ${{ vars.PORTAL_RESOURCE_GROUP || 'basecoat-portal-staging-rg' }}

jobs:
  provision-acr:
    name: Provision container registry
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      acr_login_server: ${{ steps.deploy.outputs.acr_login_server }}
      acr_name: ${{ steps.deploy.outputs.acr_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        shell: bash
        run: |
          set -euo pipefail
          az group create \
            --name "${AZURE_RESOURCE_GROUP}" \
            --location "${AZURE_LOCATION}" \
            --output none

      - name: Provision ACR
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          # Only deploy ACR — lightweight, no container apps yet
          ACR_NAME="portalacr$(echo -n $(az group show -n ${AZURE_RESOURCE_GROUP} --query id -o tsv) | sha256sum | head -c 6)"
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file portal/app/iac/modules/container-registry.bicep \
            --parameters registryName="${ACR_NAME}" \
            --name "acr-provision-${{ github.run_id }}" \
            --output none
          ACR_SERVER=$(az acr show -n "${ACR_NAME}" --query loginServer -o tsv)
          echo "acr_login_server=${ACR_SERVER}" >> "$GITHUB_OUTPUT"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push images to ACR
    runs-on: ubuntu-latest
    needs: provision-acr
    environment: staging
    outputs:
      backend_image_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_image_tag: ${{ steps.meta.outputs.frontend_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        shell: bash
        run: az acr login --name "${{ needs.provision-acr.outputs.acr_name }}"

      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="staging-${GITHUB_SHA::7}"
          echo "backend_tag=basecoat-portal-backend:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=basecoat-portal-dashboard:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3

      - name: Build and push backend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: portal/app/backend
          file: portal/app/backend/Dockerfile
          push: true
          tags: ${{ needs.provision-acr.outputs.acr_login_server }}/${{ steps.meta.outputs.backend_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: portal/app/dashboard
          file: portal/app/dashboard/Dockerfile
          push: true
          tags: ${{ needs.provision-acr.outputs.acr_login_server }}/${{ steps.meta.outputs.frontend_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging portal app
    runs-on: ubuntu-latest
    needs: [provision-acr, build-and-push]
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy portal stack with app images
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_JSON=$(az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file portal/app/iac/main.bicep \
            --parameters \
              acrName="${{ needs.provision-acr.outputs.acr_name }}" \
              backendImageTag="${{ needs.build-and-push.outputs.backend_image_tag }}" \
              frontendImageTag="${{ needs.build-and-push.outputs.frontend_image_tag }}" \
            --name "portal-staging-${{ github.run_number }}" \
            --query properties.outputs \
            --output json)

          echo "backend_url=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['backendUrl']['value'])")" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['frontendUrl']['value'])")" >> "$GITHUB_OUTPUT"
          echo "database_fqdn=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['databaseFqdn']['value'])")" >> "$GITHUB_OUTPUT"
          echo "acr_server=$(echo "${DEPLOYMENT_JSON}" | python3 -c "import json,sys; print(json.load(sys.stdin)['acrLoginServer']['value'])")" >> "$GITHUB_OUTPUT"

      - name: Smoke test backend
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.backend_url }}/health"
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
            if [[ "${STATUS}" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend health check failed: ${URL}"
          exit 1

      - name: Smoke test frontend
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.frontend_url }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || echo "000")
          if [[ "${STATUS}" != "200" ]]; then
            echo "::error::Frontend smoke check failed: ${URL} returned ${STATUS}"
            exit 1
          fi

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "### Portal staging deployment"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Backend | ${{ steps.deploy.outputs.backend_url }} |"
            echo "| Frontend | ${{ steps.deploy.outputs.frontend_url }} |"
            echo "| PostgreSQL | ${{ steps.deploy.outputs.database_fqdn }} |"
            echo "| ACR | ${{ steps.deploy.outputs.acr_server }} |"
          } >> "$GITHUB_STEP_SUMMARY"
