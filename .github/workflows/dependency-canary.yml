name: "BaseCoat - Dependency Canary"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/*.yml"
      - "**/package.json"
      - "**/package-lock.json"
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan dependency canary scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reason: ${{ steps.select.outputs.reason }}
      should_run: ${{ steps.select.outputs.should_run }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select canary targets
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const eventName = context.eventName;
            const targets = [
              { id: 'portal-frontend', path: 'portal/frontend', lockfile: 'portal/frontend/package-lock.json', node: '20', canary: 'npm test' },
              { id: 'portal-backend', path: 'portal/backend', lockfile: 'portal/backend/package-lock.json', node: '20', canary: 'npm test' },
              { id: 'portal-app-backend', path: 'portal/app/backend', lockfile: 'portal/app/backend/package-lock.json', node: '20', canary: 'npm run build' },
              { id: 'mcp-basecoat-metrics', path: 'mcp/basecoat-metrics', lockfile: 'mcp/basecoat-metrics/package-lock.json', node: '22', canary: 'npm run build' },
              { id: 'mcp-basecoat-extension', path: 'mcp/basecoat-extension', lockfile: 'mcp/basecoat-extension/package-lock.json', node: '22', canary: 'npm run typecheck' },
              { id: 'plugin-copilot-cli', path: 'plugins/copilot-cli-plugin', lockfile: 'plugins/copilot-cli-plugin/package-lock.json', node: '20', canary: 'npm run build' }
            ];

            const setOutputs = (reason, shouldRun, selectedTargets) => {
              core.setOutput('reason', reason);
              core.setOutput('should_run', shouldRun ? 'true' : 'false');
              core.setOutput('matrix', JSON.stringify(selectedTargets));
            };

            if (eventName !== 'pull_request') {
              setOutputs(`non-pr event (${eventName})`, true, targets);
              return;
            }

            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((label) => label.name.toLowerCase());
            const isDependencyPr =
              pr.user?.login === 'dependabot[bot]' ||
              labels.includes('dependencies');

            if (!isDependencyPr) {
              setOutputs('pull request is not dependency-scoped', false, []);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const changedFiles = new Set(files.map((file) => file.filename));
            const selected = targets.filter((target) =>
              changedFiles.has(target.lockfile) ||
              changedFiles.has(`${target.path}/package.json`)
            );

            if (selected.length === 0) {
              setOutputs('dependency PR with broad changes; running full canary lane', true, targets);
              return;
            }

            setOutputs('dependency PR with targeted lockfile changes', true, selected);

  canary:
    name: Dependency canary (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies with exponential backoff
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=4
          attempt=1

          while true; do
            echo "npm ci attempt $attempt/$max_attempts"
            if npm ci --no-audit --prefer-offline; then
              break
            fi

            if [[ $attempt -ge $max_attempts ]]; then
              echo "::error::npm ci failed after $max_attempts attempts"
              exit 1
            fi

            sleep_for=$((2 ** attempt))
            echo "npm ci failed, retrying in ${sleep_for}s..."
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

      - name: Run canary command with flaky containment
        id: canary
        shell: bash
        env:
          CANARY_COMMAND: ${{ matrix.canary }}
        run: |
          set -uo pipefail
          rm -f canary-attempt1.log canary-attempt2.log

          set +e
          bash -lc "$CANARY_COMMAND" 2>&1 | tee canary-attempt1.log
          first_status=${PIPESTATUS[0]}
          set -e

          if [[ $first_status -eq 0 ]]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Canary command failed once for ${{ matrix.id }}. Retrying once to contain flakes."
          sleep 5

          set +e
          bash -lc "$CANARY_COMMAND" 2>&1 | tee canary-attempt2.log
          second_status=${PIPESTATUS[0]}
          set -e

          if [[ $second_status -eq 0 ]]; then
            echo "result=flake-recovered" >> "$GITHUB_OUTPUT"
            echo "::warning::Recovered flaky canary in ${{ matrix.id }}. Track for quarantine policy if pattern repeats."
            exit 0
          fi

          echo "result=failed" >> "$GITHUB_OUTPUT"
          echo "::error::Canary command failed twice for ${{ matrix.id }}."
          exit "$second_status"

      - name: Upload canary logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-canary-${{ matrix.id }}-logs
          path: |
            ${{ matrix.path }}/canary-attempt1.log
            ${{ matrix.path }}/canary-attempt2.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          result="${{ steps.canary.outputs.result || 'failed-before-canary' }}"
          {
            echo "### Dependency Canary — ${{ matrix.id }}"
            echo ""
            echo "- Scope reason: ${{ needs.plan.outputs.reason }}"
            echo "- Workspace: \`${{ matrix.path }}\`"
            echo "- Command: \`${{ matrix.canary }}\`"
            echo "- Outcome: \`${result}\`"
            echo ""
            echo "Flaky containment policy: one retry allowed; repeated failures stay blocking and should be routed to quarantine workflow only after repeat evidence."
          } >> "$GITHUB_STEP_SUMMARY"

