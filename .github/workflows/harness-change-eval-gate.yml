name: Harness Change Eval Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-change-eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      harness_changed: ${{ steps.detect.outputs.harness_changed }}
      skip_gate: ${{ steps.detect.outputs.skip_gate }}
    steps:
      - name: Detect harness-critical changes and sync eval label
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map(label => label.name);
            const skipGate = labels.includes('skip-harness-eval-gate');
            const gateLabel = 'requires-harness-eval';

            if (skipGate) {
              core.notice('Skipping harness eval gate due to skip-harness-eval-gate label.');
              core.setOutput('harness_changed', 'false');
              core.setOutput('skip_gate', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const harnessPathPatterns = [
              /^scripts\/eval-assets\.ps1$/,
              /^tests\/behavioral-eval-tests\.ps1$/,
              /^tests\/run-tests\.ps1$/,
              /^tests\/evals\//,
              /^tests\/eval-rubrics\//,
              /^docs\/agents\/AGENT_TESTING_HARNESS\.md$/,
              /^docs\/agents\/BEHAVIORAL_EVAL\.md$/,
              /^\.github\/workflows\/behavioral-eval\.yml$/,
              /^\.github\/workflows\/harness-change-eval-gate\.yml$/,
            ];

            const changedHarnessFiles = files
              .map(file => file.filename)
              .filter(filename => harnessPathPatterns.some(pattern => pattern.test(filename)));
            const harnessChanged = changedHarnessFiles.length > 0;

            if (harnessChanged && !labels.includes(gateLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [gateLabel],
              });
              core.notice(`Added ${gateLabel} label.`);
            }

            if (!harnessChanged && labels.includes(gateLabel)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: gateLabel,
              });
              core.notice(`Removed ${gateLabel} label (no harness-critical files changed).`);
            }

            core.notice(
              harnessChanged
                ? `Harness-critical files changed: ${changedHarnessFiles.join(', ')}`
                : 'No harness-critical files changed; gate not required.'
            );

            core.setOutput('harness_changed', harnessChanged ? 'true' : 'false');
            core.setOutput('skip_gate', 'false');

  run-harness-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: harness-change-eval-gate
    if: needs.harness-change-eval-gate.outputs.harness_changed == 'true' && needs.harness-change-eval-gate.outputs.skip_gate != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run behavioral harness smoke eval
        id: eval
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $threshold = 7.0
          $outputDir = 'test-results'
          $summaryFile = Join-Path $outputDir 'eval-summary.md'

          pwsh scripts/eval-assets.ps1 `
            -CaseFile tests/evals/smoke.behavior.json `
            -OutputDir $outputDir `
            -SummaryFile $summaryFile | Out-Null

          $reportPath = Join-Path $outputDir 'eval-agents.json'
          if (-not (Test-Path $reportPath)) {
            throw 'Behavioral eval report not found at test-results/eval-agents.json'
          }

          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $avgScore = [double]$report.avg_score
          $caseCount = [int]$report.case_count

          "avg_score=$avgScore" >> $env:GITHUB_OUTPUT
          "case_count=$caseCount" >> $env:GITHUB_OUTPUT
          "threshold=$threshold" >> $env:GITHUB_OUTPUT

          if ($avgScore -lt $threshold) {
            throw "Harness eval gate failed: avg score $avgScore is below threshold $threshold"
          }

      - name: Upload harness eval artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-eval-results
          path: |
            test-results/eval-agents.json
            test-results/eval-summary.md
          retention-days: 7
          if-no-files-found: warn

      - name: Post eval evidence to PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AVG_SCORE: ${{ steps.eval.outputs.avg_score }}
          CASE_COUNT: ${{ steps.eval.outputs.case_count }}
          THRESHOLD: ${{ steps.eval.outputs.threshold }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- harness-eval-gate -->';
            const prNumber = context.payload.pull_request.number;
            const avgScore = process.env.AVG_SCORE || 'n/a';
            const caseCount = process.env.CASE_COUNT || 'n/a';
            const threshold = process.env.THRESHOLD || '7.0';
            const status = process.env.JOB_STATUS || 'unknown';
            const passed = status === 'success';

            const body = [
              marker,
              '## Harness Eval Gate',
              '',
              `- Result: **${passed ? 'PASS' : 'FAIL'}**`,
              `- Avg score: **${avgScore} / 10**`,
              `- Cases: **${caseCount}**`,
              `- Threshold: **${threshold}**`,
              '',
              'Artifacts: `harness-eval-results` (eval-agents.json, eval-summary.md).',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
