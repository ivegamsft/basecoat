name: BaseCoat - Governance Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Audit governance surfaces
        shell: bash
        run: |
          set -euo pipefail

          missing=()

          for file in \
            docs/reference/governance-contract.md \
            docs/reference/label-taxonomy.md \
            docs/reference/governance.md \
            docs/reference/governance-policy-packs.md \
            docs/reference/environment-protection.md \
            docs/operations/label-cleanup-plan.md \
            docs/operations/environment-protection-enforcement.md \
            .github/governance/policy-packs.json \
            .github/ISSUE_TEMPLATE/issue.md \
            .github/PULL_REQUEST_TEMPLATE.md \
            .github/workflows/environment-protection-enforce.yml
          do
            [[ -f "$file" ]] || missing+=("$file")
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            printf 'Missing governance files:\n%s\n' "${missing[@]}" >&2
            exit 1
          fi

          grep -q 'priority:critical' docs/reference/governance-contract.md
          grep -q '^## Labels$' docs/reference/governance-contract.md
          grep -q '^## Versioning$' docs/reference/governance-contract.md
          grep -q 'priority:critical' docs/reference/label-taxonomy.md
          grep -qi 'preserve delivery labels' docs/operations/label-cleanup-plan.md
          grep -q '^## Mandatory production protections$' docs/reference/environment-protection.md
          grep -q 'manual approvals are required' docs/reference/environment-protection.md
          grep -q '^## Policy pack matrix$' docs/reference/governance-policy-packs.md
          grep -q 'BASECOAT_POLICY_PACK' docs/reference/governance-policy-packs.md
          jq -e '.profiles["solo-dev"] and .profiles["team-dev"] and .profiles["regulated-team"]' .github/governance/policy-packs.json >/dev/null
          grep -q 'environment protection gates' docs/operations/environment-protection-enforcement.md
          grep -q "must have at least one required reviewer" .github/workflows/environment-protection-enforce.yml
          grep -q 'docs/reference/governance-contract.md' .github/ISSUE_TEMPLATE/issue.md
          grep -q 'docs/reference/governance-contract.md' .github/PULL_REQUEST_TEMPLATE.md

          echo "Governance audit passed."
