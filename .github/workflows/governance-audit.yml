name: BaseCoat - Governance Metadata Drift Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Audit governance metadata drift
        shell: pwsh
        run: |
          ./scripts/governance-metadata-drift.ps1 -Mode audit -SummaryPath governance-metadata-drift-report.md

      - name: Upload governance drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: governance-metadata-drift-report
          path: governance-metadata-drift-report.md
          if-no-files-found: error
          retention-days: 14
