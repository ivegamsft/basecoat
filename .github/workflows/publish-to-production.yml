name: "BaseCoat - Publish to Production"

# Syncs tagged releases from internal (IBuySpy-Shared/basecoat) to production (ivegamsft/basecoat)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v3.31.0); leave empty to publish the latest semver tag"
        required: false

permissions:
  contents: read

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  preflight-token-check:
    name: Preflight — PRODUCTION_REPO_TOKEN readiness
    uses: ./.github/workflows/token-preflight.yml
    secrets:
      PRODUCTION_REPO_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}

  publish:
    needs: preflight-token-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch repository for tag resolution
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve publish tag
        id: resolve_tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [[ -z "${TAG}" ]]; then
              echo "::error::No semver tags found; provide inputs.tag or push a version tag"
              exit 1
            fi
            echo "Resolved latest semver tag: ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out repository at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/tags/${{ steps.resolve_tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Remove internal-only content before publish
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Remove files that must not appear in the public mirror.
          # sprint-plans and sprint summaries contain internal operational detail.
          # docs/audit contains internal audit reports.
          INTERNAL_PATTERNS=(
            'SPRINT-*-EXECUTION-SUMMARY.md'
            'docs/sprint-plans/*.md'
            'docs/audit/*.md'
            'docs/archive/sprint-closeout/**'
          )

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          REMOVED=0
          for pat in "${INTERNAL_PATTERNS[@]}"; do
            # Use git ls-files with glob; suppress errors for missing patterns
            MATCHES=$(git ls-files -- "$pat" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "$MATCHES" | xargs git rm -f --cached --ignore-unmatch 2>/dev/null || true
              echo "$MATCHES" | xargs rm -f 2>/dev/null || true
              REMOVED=$((REMOVED + $(echo "$MATCHES" | wc -l)))
            fi
          done

          if [ "$REMOVED" -gt 0 ]; then
            git diff --cached --quiet || git commit -m "chore(publish): remove internal-only content for ${TAG}"
            echo "Removed ${REMOVED} internal file(s) from publish payload."
          else
            echo "No internal-only files found — nothing to remove."
          fi

      - name: Stamp published version
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Write a VERSION file from the canonical version.json so published consumers
          # can confirm the exact build version. Reuse version.json format (no v-prefix).
          VERSION=$(jq -r '.version' version.json 2>/dev/null || echo "${TAG#v}")
          echo "${VERSION}" > VERSION

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add VERSION
          git diff --cached --quiet || git commit -m "chore(publish): stamp build version ${TAG}"
          echo "Published version stamped: ${VERSION}"

      - name: Rewrite internal repo links for production
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Rewrite every github.com and raw.githubusercontent.com URL that references
          # the private source repo (IBuySpy-Shared/basecoat) to point at the public
          # production mirror (ivegamsft/basecoat). Applied across ALL tracked text
          # files so consumers never encounter links they cannot access.
          #
          # Patterns replaced:
          #   github.com/IBuySpy-Shared/basecoat         ->  github.com/ivegamsft/basecoat
          #   raw.githubusercontent.com/IBuySpy-Shared/basecoat  ->  raw.githubusercontent.com/ivegamsft/basecoat
          #   ibuyspy-shared.github.io/basecoat           ->  ivegamsft.github.io/basecoat
          #
          # Binary files are skipped automatically via grep -I (--binary-files=without-match).

          TEXT_FILES=$(git ls-files -- \
            '*.md' '*.yml' '*.yaml' '*.json' '*.ps1' '*.sh' '*.txt' \
            '*.ts' '*.js' '*.py' \
            | grep -v '^$' || true)

          if [ -z "$TEXT_FILES" ]; then
            echo "No text files to rewrite."
            exit 0
          fi

          # grep -lI: list only files that contain the pattern and are text (not binary)
          TARGETS=$(echo "$TEXT_FILES" | xargs grep -lI \
            -e 'github\.com/IBuySpy-Shared/basecoat' \
            -e 'raw\.githubusercontent\.com/IBuySpy-Shared/basecoat' \
            -e 'ibuyspy-shared\.github\.io/basecoat' \
            2>/dev/null || true)

          if [ -z "$TARGETS" ]; then
            echo "No internal repo links found — nothing to rewrite."
            exit 0
          fi

          echo "$TARGETS" | while IFS= read -r f; do
            sed -i \
              -e 's|github\.com/IBuySpy-Shared/basecoat|github.com/ivegamsft/basecoat|g' \
              -e 's|raw\.githubusercontent\.com/IBuySpy-Shared/basecoat|raw.githubusercontent.com/ivegamsft/basecoat|g' \
              -e 's|ibuyspy-shared\.github\.io/basecoat|ivegamsft.github.io/basecoat|g' \
              -- "$f"
          done

          CHANGED=$(echo "$TARGETS" | wc -l)
          echo "Internal links rewritten in $CHANGED file(s):"
          echo "$TARGETS"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -u
          git diff --cached --quiet || git commit -m "chore(publish): rewrite internal repo links for ${TAG}"

      - name: Push to production repository
        id: push-production
        env:
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail

          PRODUCTION_REMOTE="https://x-access-token:${PRODUCTION_TOKEN}@github.com/ivegamsft/basecoat.git"
          PROTECTION_API="https://api.github.com/repos/ivegamsft/basecoat/branches/main/protection"
          PROTECTION_BACKUP_FILE=".production-main-protection.json"

          echo "Capturing existing branch protection..."
          protection_status=$(curl -sS -o "$PROTECTION_BACKUP_FILE" -w "%{http_code}" \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$PROTECTION_API")

          if [ "$protection_status" = "200" ]; then
            echo "had_protection=true" >> "$GITHUB_OUTPUT"
            echo "Existing branch protection captured."
            echo "Temporarily disabling branch protection to allow force-push..."
            curl -sf -X DELETE \
              -H "Authorization: token ${PRODUCTION_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$PROTECTION_API" >/dev/null
          elif [ "$protection_status" = "404" ]; then
            echo "had_protection=false" >> "$GITHUB_OUTPUT"
            echo "Branch protection is currently disabled."
          else
            echo "Failed to capture branch protection (HTTP ${protection_status})."
            exit 1
          fi

          # Clear any persisted Actions bot credentials so PAT is used for push
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Push the main branch (force is required to mirror rewritten release content)
          git push "${PRODUCTION_REMOTE}" HEAD:refs/heads/main --force

          # Re-tag on the cleaned HEAD so the published tag/release archive does not
          # contain internal-only content (the checkout was at the original tagged commit
          # but cleanup/rewrite steps have since committed on top of it).
          git tag -f "${TAG}" HEAD
          git push "${PRODUCTION_REMOTE}" "refs/tags/${TAG}" --force

          echo "Pushed ${TAG} to ivegamsft/basecoat"

      - name: Restore branch protection
        if: always() && steps.push-production.outputs.had_protection == 'true'
        env:
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          PROTECTION_API="https://api.github.com/repos/ivegamsft/basecoat/branches/main/protection"
          PROTECTION_BACKUP_FILE=".production-main-protection.json"

          if [ ! -f "$PROTECTION_BACKUP_FILE" ]; then
            echo "::warning::No backup file found — branch protection must be restored manually."
            exit 0
          fi

          # Transform GET response to PUT-compatible payload.
          # GitHub's GET /branches/{branch}/protection returns read-only fields (url,
          # enforcement_level, context_url) that the PUT endpoint rejects with HTTP 422.
          # All known settable fields are explicitly mapped with safe defaults so the
          # round-trip faithfully preserves every protection setting (fixes #1682).
          PUT_PAYLOAD=$(jq '{
            required_status_checks: (
              if .required_status_checks then {
                strict: (.required_status_checks.strict // false),
                contexts: (.required_status_checks.contexts // [])
              } else null end
            ),
            enforce_admins: (.enforce_admins.enabled // false),
            required_pull_request_reviews: (
              if .required_pull_request_reviews then {
                dismissal_restrictions: (
                  if ((.required_pull_request_reviews.dismissal_restrictions.users // [] | length) > 0)
                    or ((.required_pull_request_reviews.dismissal_restrictions.teams // [] | length) > 0)
                  then {
                    users: [.required_pull_request_reviews.dismissal_restrictions.users[]?.login],
                    teams: [.required_pull_request_reviews.dismissal_restrictions.teams[]?.slug]
                  } else {} end
                ),
                dismiss_stale_reviews: (.required_pull_request_reviews.dismiss_stale_reviews // false),
                require_code_owner_reviews: (.required_pull_request_reviews.require_code_owner_reviews // false),
                required_approving_review_count: (.required_pull_request_reviews.required_approving_review_count // 1),
                require_last_push_approval: (.required_pull_request_reviews.require_last_push_approval // false)
              } else null end
            ),
            restrictions: null,
            lock_branch: (.lock_branch.enabled // false),
            allow_force_pushes: (.allow_force_pushes.enabled // false),
            allow_deletions: (.allow_deletions.enabled // false),
            block_creations: (.block_creations.enabled // false),
            required_linear_history: (.required_linear_history.enabled // false),
            required_conversation_resolution: (.required_conversation_resolution.enabled // false)
          }' "$PROTECTION_BACKUP_FILE")

          echo "Restoring branch protection..."
          restore_status=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$PROTECTION_API" \
            -d "${PUT_PAYLOAD}")

          if [ "$restore_status" = "200" ]; then
            echo "Branch protection restored successfully."
          else
            echo "::warning::Branch protection restore returned HTTP ${restore_status}. Manual restore may be needed for ivegamsft/basecoat main."
          fi

          rm -f "$PROTECTION_BACKUP_FILE"

      - name: Verify branch protection restore
        if: always() && steps.push-production.outputs.had_protection == 'true'
        env:
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          PROTECTION_API="https://api.github.com/repos/ivegamsft/basecoat/branches/main/protection"

          verify_status=$(curl -sS -o /tmp/restored-protection.json -w "%{http_code}" \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$PROTECTION_API")

          if [ "$verify_status" = "200" ]; then
            echo "Branch protection confirmed active after restore."
            jq '{enforce_admins: .enforce_admins.enabled, required_status_checks: (.required_status_checks != null), required_pull_request_reviews: (.required_pull_request_reviews != null)}' /tmp/restored-protection.json
          else
            echo "::warning::Post-restore verification returned HTTP ${verify_status} — branch protection state unknown for ivegamsft/basecoat main."
          fi

      - name: Update production repo metadata
        if: always() && steps.push-production.outcome == 'success'
        env:
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
        run: |
          # Set homepage, description, and topics on the production repo.
          # PRODUCTION_REPO_TOKEN (fine-grained PAT owned by ivegamsft) has the permissions
          # that GITHUB_TOKEN integration tokens lack for repo metadata updates.
          curl -sf -X PATCH \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ivegamsft/basecoat" \
            -d '{
              "description": "Enterprise shared library of GitHub Copilot customization assets — agents, skills, instructions, and prompts.",
              "homepage": "https://ivegamsft.github.io/basecoat/",
              "has_issues": true,
              "has_projects": false,
              "has_wiki": false
            }' \
            && echo "Production repo metadata updated" \
            || echo "Warning: could not update repo metadata (non-fatal)"

      - name: Create GitHub release on production repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_REPO_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Fetch the release notes from the source repo release (already published).
          SOURCE_RELEASE=$(curl -sf \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || echo "null")

          if [ "$SOURCE_RELEASE" = "null" ] || [ -z "$SOURCE_RELEASE" ]; then
            echo "No source release found for ${TAG} — skipping release creation."
            exit 0
          fi

          RELEASE_NAME=$(echo "$SOURCE_RELEASE" | jq -r '.name // empty')
          RELEASE_BODY=$(echo "$SOURCE_RELEASE" | jq -r '.body // empty')

          # Check if a release already exists on the production repo.
          EXISTING=$(curl -sf \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ivegamsft/basecoat/releases/tags/${TAG}" \
            -o /dev/null -w "%{http_code}" || true)

          if [ "$EXISTING" = "200" ]; then
            echo "Release ${TAG} already exists on ivegamsft/basecoat — skipping."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG" \
            --arg name "${RELEASE_NAME:-$TAG}" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag_name, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')

          create_status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${PRODUCTION_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/ivegamsft/basecoat/releases" \
            -d "$PAYLOAD")

          if [ "$create_status" = "201" ]; then
            echo "GitHub Release ${TAG} created on ivegamsft/basecoat."
          else
            echo "::warning::Release creation returned HTTP ${create_status} — may need manual creation."
          fi
