name: Ship-it Intent Dispatch

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      intent:
        description: Intent to execute
        required: true
        type: choice
        options:
          - ship-it
          - spec-2-prod
      goal:
        description: Delivery goal statement
        required: true
        type: string
      target_repo:
        description: Repository in owner/repo format
        required: true
        default: IBuySpy-Shared/basecoat
        type: string
      spec_ref:
        description: Optional spec or PRD reference
        required: false
        type: string
      risk_band:
        description: Risk classification
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
          - critical
      project_owner:
        description: Optional project owner for project sync
        required: false
        type: string
      project_number:
        description: Optional project number for project sync
        required: false
        type: string
      dry_run:
        description: Skip live side effects
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-intent:
    name: Resolve intent inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      intent: ${{ steps.resolve.outputs.intent }}
      goal: ${{ steps.resolve.outputs.goal }}
      target_repo: ${{ steps.resolve.outputs.target_repo }}
      spec_ref: ${{ steps.resolve.outputs.spec_ref }}
      risk_band: ${{ steps.resolve.outputs.risk_band }}
      project_owner: ${{ steps.resolve.outputs.project_owner }}
      project_number: ${{ steps.resolve.outputs.project_number }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      source_issue_number: ${{ steps.resolve.outputs.source_issue_number }}
      requester: ${{ steps.resolve.outputs.requester }}
    steps:
      - name: Resolve inputs from event
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const eventName = context.eventName;
            const result = {
              should_run: "false",
              intent: "ship-it",
              goal: "",
              target_repo: `${context.repo.owner}/${context.repo.repo}`,
              spec_ref: "",
              risk_band: "medium",
              project_owner: "",
              project_number: "",
              dry_run: "false",
              source_issue_number: "",
              requester: context.actor
            };

            if (eventName === "workflow_dispatch") {
              const inputs = context.payload.inputs || {};
              result.should_run = "true";
              result.intent = inputs.intent || "ship-it";
              result.goal = inputs.goal || "";
              result.target_repo = inputs.target_repo || result.target_repo;
              result.spec_ref = inputs.spec_ref || "";
              result.risk_band = inputs.risk_band || "medium";
              result.project_owner = inputs.project_owner || "";
              result.project_number = inputs.project_number || "";
              result.dry_run = `${inputs.dry_run === true || `${inputs.dry_run}`.toLowerCase() === "true"}`;
            } else {
              const issue = context.payload.issue;
              const comment = context.payload.comment?.body || "";
              const isPullRequestComment = !!issue.pull_request;
              const commandMatch = comment.match(/^\/ship-it(?:\s+(.+))?$/im);
              if (isPullRequestComment || !commandMatch) {
                core.setOutput("should_run", "false");
                return;
              }

              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              const allowed = ["admin", "maintain", "write"].includes(perm.data.permission);
              if (!allowed) {
                core.setFailed(`@${context.actor} does not have write permission for /ship-it.`);
                return;
              }

              result.should_run = "true";
              result.intent = "ship-it";
              result.goal = commandMatch[1]?.trim() || issue.title;
              result.source_issue_number = `${issue.number}`;
              const issueBody = issue.body || "";
              const firstUrl = issueBody.match(/https?:\/\/\S+/);
              result.spec_ref = firstUrl ? firstUrl[0] : "";
            }

            for (const [key, value] of Object.entries(result)) {
              core.setOutput(key, value);
            }

  dispatch-intent:
    name: Dispatch ship-it intent
    runs-on: ubuntu-latest
    needs: resolve-intent
    if: needs.resolve-intent.outputs.should_run == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Dispatch intent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT: ${{ needs.resolve-intent.outputs.intent }}
          GOAL: ${{ needs.resolve-intent.outputs.goal }}
          TARGET_REPO: ${{ needs.resolve-intent.outputs.target_repo }}
          SPEC_REF: ${{ needs.resolve-intent.outputs.spec_ref }}
          RISK_BAND: ${{ needs.resolve-intent.outputs.risk_band }}
          PROJECT_OWNER: ${{ needs.resolve-intent.outputs.project_owner }}
          PROJECT_NUMBER: ${{ needs.resolve-intent.outputs.project_number }}
          DRY_RUN: ${{ needs.resolve-intent.outputs.dry_run }}
        run: |
          $dryRun = $env:DRY_RUN -eq 'true'
          $projectNumberRaw = $env:PROJECT_NUMBER
          $projectNumber = 0
          if (-not [string]::IsNullOrWhiteSpace($projectNumberRaw)) {
            $projectNumber = [int]$projectNumberRaw
          }

          $params = @{
            Intent = $env:INTENT
            Goal = $env:GOAL
            TargetRepo = $env:TARGET_REPO
            SpecRef = $env:SPEC_REF
            RiskBand = $env:RISK_BAND
            ProjectNumber = $projectNumber
            ProjectOwner = $env:PROJECT_OWNER
            OutputPath = 'test-results\ship-it\summary.json'
          }
          if ($dryRun) {
            $params.DryRun = $true
          }

          .\scripts\ship-it\dispatch-intent.ps1 @params

      - name: Export parent issue URL
        id: summary
        shell: pwsh
        run: |
          $summaryPath = "test-results\ship-it\summary.json"
          $summary = Get-Content -Raw -Path $summaryPath | ConvertFrom-Json
          "parent_issue_url=$($summary.parent_issue_url)" >> $env:GITHUB_OUTPUT

      - name: Upload dispatch artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ship-it-dispatch
          path: test-results/ship-it
          retention-days: 7

      - name: Comment back on source issue
        if: needs.resolve-intent.outputs.source_issue_number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const issueNumber = Number("${{ needs.resolve-intent.outputs.source_issue_number }}");
            const parentUrl = "${{ steps.summary.outputs.parent_issue_url }}";
            const requester = "${{ needs.resolve-intent.outputs.requester }}";
            const message = [
              `@${requester} ship-it intent accepted.`,
              "",
              `Control-plane parent issue: ${parentUrl}`,
              "",
              "Execution sprint issues were generated with governance checklists."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });
