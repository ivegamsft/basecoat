name: Ship-it Intent Dispatch

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      intent:
        description: Intent to execute
        required: true
        type: choice
        options:
          - ship-it
          - spec-2-prod
          - onboarding-conductor
      goal:
        description: Delivery goal statement
        required: true
        type: string
      target_repo:
        description: Repository in owner/repo format
        required: true
        default: IBuySpy-Shared/basecoat
        type: string
      spec_ref:
        description: Optional spec or PRD reference
        required: false
        type: string
      risk_band:
        description: Risk classification
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
          - critical
      profile:
        description: Onboarding profile (used by onboarding-conductor)
        required: false
        default: team-dev
        type: choice
        options:
          - solo-dev
          - team-dev
          - regulated-team
          - pilot-luxesite
          - pilot-wawkr
          - pilot-work-tracker
      project_owner:
        description: Optional project owner for project sync
        required: false
        type: string
      project_number:
        description: Optional project number for project sync
        required: false
        type: string
      dry_run:
        description: Skip live side effects
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-intent:
    name: Resolve intent inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      intent: ${{ steps.resolve.outputs.intent }}
      goal: ${{ steps.resolve.outputs.goal }}
      target_repo: ${{ steps.resolve.outputs.target_repo }}
      spec_ref: ${{ steps.resolve.outputs.spec_ref }}
      risk_band: ${{ steps.resolve.outputs.risk_band }}
      project_owner: ${{ steps.resolve.outputs.project_owner }}
      project_number: ${{ steps.resolve.outputs.project_number }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      profile: ${{ steps.resolve.outputs.profile }}
      source_issue_number: ${{ steps.resolve.outputs.source_issue_number }}
      requester: ${{ steps.resolve.outputs.requester }}
    steps:
      - name: Resolve inputs from event
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const eventName = context.eventName;
            const result = {
              should_run: "false",
              intent: "ship-it",
              goal: "",
              target_repo: `${context.repo.owner}/${context.repo.repo}`,
              spec_ref: "",
              risk_band: "medium",
              project_owner: "",
              project_number: "",
              dry_run: "false",
              profile: "team-dev",
              source_issue_number: "",
              requester: context.actor
            };

            if (eventName === "workflow_dispatch") {
              const inputs = context.payload.inputs || {};
              result.should_run = "true";
              result.intent = inputs.intent || "ship-it";
              result.goal = inputs.goal || "";
              result.target_repo = inputs.target_repo || result.target_repo;
              result.spec_ref = inputs.spec_ref || "";
              result.risk_band = inputs.risk_band || "medium";
              result.project_owner = inputs.project_owner || "";
              result.project_number = inputs.project_number || "";
              result.dry_run = `${inputs.dry_run === true || `${inputs.dry_run}`.toLowerCase() === "true"}`;
              result.profile = inputs.profile || "team-dev";
            } else {
              const issue = context.payload.issue;
              const comment = context.payload.comment?.body || "";
              const isPullRequestComment = !!issue.pull_request;
              const shipItMatch = comment.match(/^\/ship-it(?:\s+(.+))?$/im);
              const onboardingMatch = comment.match(/^\/onboarding(?:\s+(.+))?$/im);
              const specToProdMatch = comment.match(/^\/spec-2-prod(?:\s+(.+))?$/im);
              const commandMatch = onboardingMatch || specToProdMatch || shipItMatch;
              if (isPullRequestComment || !commandMatch) {
                core.setOutput("should_run", "false");
                return;
              }

              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              const allowed = ["admin", "maintain", "write"].includes(perm.data.permission);
              if (!allowed) {
                core.setFailed(`@${context.actor} does not have write permission for intent commands (/ship-it, /onboarding, /spec-2-prod).`);
                return;
              }

              result.should_run = "true";
              result.intent = onboardingMatch ? "onboarding-conductor" : specToProdMatch ? "spec-2-prod" : "ship-it";
              result.goal = commandMatch[1]?.trim() || issue.title;
              result.source_issue_number = `${issue.number}`;
              const issueBody = issue.body || "";
              const firstUrl = issueBody.match(/https?:\/\/\S+/);
              result.spec_ref = firstUrl ? firstUrl[0] : "";
            }

            for (const [key, value] of Object.entries(result)) {
              core.setOutput(key, value);
            }

  dispatch-intent:
    name: Dispatch ship-it intent
    runs-on: ubuntu-latest
    needs: resolve-intent
    if: needs.resolve-intent.outputs.should_run == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Dispatch intent
        id: dispatch
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT: ${{ needs.resolve-intent.outputs.intent }}
          GOAL: ${{ needs.resolve-intent.outputs.goal }}
          TARGET_REPO: ${{ needs.resolve-intent.outputs.target_repo }}
          SPEC_REF: ${{ needs.resolve-intent.outputs.spec_ref }}
          RISK_BAND: ${{ needs.resolve-intent.outputs.risk_band }}
          PROJECT_OWNER: ${{ needs.resolve-intent.outputs.project_owner }}
          PROJECT_NUMBER: ${{ needs.resolve-intent.outputs.project_number }}
          DRY_RUN: ${{ needs.resolve-intent.outputs.dry_run }}
          PROFILE: ${{ needs.resolve-intent.outputs.profile }}
        run: |
          $dryRun = $env:DRY_RUN -eq 'true'
          $projectNumberRaw = $env:PROJECT_NUMBER
          $projectNumber = 0
          if (-not [string]::IsNullOrWhiteSpace($projectNumberRaw)) {
            $projectNumber = [int]$projectNumberRaw
          }

          $params = @{
            Intent = $env:INTENT
            Goal = $env:GOAL
            TargetRepo = $env:TARGET_REPO
            SpecRef = $env:SPEC_REF
            RiskBand = $env:RISK_BAND
            ProjectNumber = $projectNumber
            ProjectOwner = $env:PROJECT_OWNER
            Profile = $env:PROFILE
            OutputPath = 'test-results\ship-it\summary.json'
          }
          if ($dryRun) {
            $params.DryRun = $true
          }

          .\scripts\ship-it\dispatch-intent.ps1 @params

      - name: Create remediation issue when dispatch fails
        if: steps.dispatch.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const intent = "${{ needs.resolve-intent.outputs.intent }}";
            const goal = "${{ needs.resolve-intent.outputs.goal }}";
            const targetRepo = "${{ needs.resolve-intent.outputs.target_repo }}";
            const profile = "${{ needs.resolve-intent.outputs.profile }}";
            const crypto = require("crypto");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const remediationTitle = `[Intent][${intent}] Remediation required: ${goal}`;
            const markerKey = `${intent}|${targetRepo}|${goal}|${profile}`;
            const markerHash = crypto.createHash("sha256").update(markerKey.toLowerCase()).digest("hex");
            const marker = `<!-- basecoat-intent-remediation:${markerHash} -->`;
            const intentLabel = intent;
            const remediationBody = [
              "## Remediation Trigger",
              "",
              `- Intent: \`${intent}\``,
              `- Goal: ${goal}`,
              `- Target repo: ${targetRepo}`,
              `- Profile: \`${profile}\``,
              `- Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              "",
              "## Required follow-up tasks",
              "",
              "- [ ] Investigate dispatch failure root cause",
              "- [ ] Capture actionable fix plan",
              `- [ ] Re-run ${intent} intent after fix`,
              "",
              marker
            ].join("\n");
            const labels = ["intent-control-plane", "remediation", intentLabel];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: label === "remediation" ? "b60205" : "1d76db",
                  description: label === "remediation" ? "Follow-up issue created from intent-dispatch failure." : "Tracks intent-driven dispatch runs."
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }
            }

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open label:intent-control-plane label:remediation label:${intentLabel} "${marker}"`,
              per_page: 1
            });
            const match = search.data.items[0];
            if (match) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: match.number,
                title: remediationTitle,
                body: remediationBody
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: remediationTitle,
                body: remediationBody,
                labels
              });
            }

      - name: Fail after remediation issue creation
        if: steps.dispatch.outcome == 'failure'
        run: |
          echo "Dispatch failed. Remediation issue generated or updated."
          exit 1

      - name: Export parent issue URL
        id: summary
        if: steps.dispatch.outcome == 'success'
        shell: pwsh
        run: |
          $summaryPath = "test-results\ship-it\summary.json"
          $summary = Get-Content -Raw -Path $summaryPath | ConvertFrom-Json
          "parent_issue_url=$($summary.parent_issue_url)" >> $env:GITHUB_OUTPUT

      - name: Upload dispatch artifacts
        if: steps.dispatch.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ship-it-dispatch
          path: test-results/ship-it
          retention-days: 7

      - name: Comment back on source issue
        if: needs.resolve-intent.outputs.source_issue_number != '' && steps.dispatch.outcome == 'success'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const issueNumber = Number("${{ needs.resolve-intent.outputs.source_issue_number }}");
            const parentUrl = "${{ steps.summary.outputs.parent_issue_url }}";
            const requester = "${{ needs.resolve-intent.outputs.requester }}";
            const intent = "${{ needs.resolve-intent.outputs.intent }}";
            const message = [
              `@${requester} ${intent} intent accepted.`,
              "",
              `Control-plane parent issue: ${parentUrl}`,
              "",
              "Execution sprint issues were generated with governance checklists."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });
