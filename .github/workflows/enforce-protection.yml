name: "BaseCoat - Enforce Environment and Production Approvals"

on:
  schedule:
    # Run daily at 2 AM UTC to ensure environment protection rules are in place
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/enforce-protection.yml"

permissions:
  contents: read
  deployments: read

jobs:
  bootstrap-prod-environment:
    name: "Discover production environment"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bootstrap_mode: ${{ steps.bootstrap.outputs.bootstrap_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Discover production environment
        id: bootstrap
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          bootstrap_mode="existing"

          if gh api "/repos/${repo}/environments/production" --jq '.name' >/dev/null 2>/tmp/prod-direct-before.err; then
            echo "Found existing 'production' environment"
          else
            echo "::warning::'production' environment missing."
            echo "::warning::Settings action required: create a protected 'production' environment from .github/environment-protection-production.json."
            bootstrap_mode="missing"
          fi

          echo "bootstrap_mode=${bootstrap_mode}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify production environment is listed
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          max_attempts=8
          sleep_seconds=5
          listed=false
          direct=false

          for attempt in $(seq 1 "$max_attempts"); do
            if gh api "/repos/${repo}/environments/production" --jq '.name' >/dev/null 2>/tmp/prod-direct.err; then
              direct=true
            else
              direct=false
            fi

            # The /environments endpoint returns {"total_count":N,"environments":[...]}.
            # Use .environments[] (not .[]) to iterate; .[].name silently returns nothing.
            if gh api "/repos/${repo}/environments" > /tmp/prod-env-list.json 2>/tmp/prod-list.err; then
              if jq -e '.environments[] | select(.name == "production")' /tmp/prod-env-list.json >/dev/null; then
                listed=true
              else
                listed=false
              fi
            else
              listed=false
            fi

            if [[ "$direct" == "true" && "$listed" == "true" ]]; then
              echo "✓ 'production' environment is visible via direct lookup and list API (attempt ${attempt}/${max_attempts})"
              break
            fi

            if [[ "$attempt" -lt "$max_attempts" ]]; then
              echo "Waiting for environment propagation (attempt ${attempt}/${max_attempts}, direct=${direct}, listed=${listed})"
              sleep "$sleep_seconds"
            fi
          done

          if [[ "$direct" != "true" || "$listed" != "true" ]]; then
            if [[ "${{ steps.bootstrap.outputs.bootstrap_mode }}" == "missing" ]]; then
              echo "::warning::'production' environment is missing."
              echo "::warning::Settings action required: create it from .github/environment-protection-production.json."
              exit 0
            fi

            echo "::error::'production' environment not listed — propagation check failed"
            echo "repository=${repo}"
            echo "direct_lookup_success=${direct}"
            echo "list_lookup_success=${listed}"
            echo "bootstrap_mode=${{ steps.bootstrap.outputs.bootstrap_mode }}"

            echo "---- direct lookup stderr ----"
            cat /tmp/prod-direct.err || true
            echo "---- list lookup stderr ----"
            cat /tmp/prod-list.err || true

            echo "---- environments list payload ----"
            cat /tmp/prod-env-list.json || true

            echo "---- environment template (.github/environment-protection-production.json) ----"
            cat .github/environment-protection-production.json || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  verify-prod-environment-protection:
    name: "Verify production environment protection"
    needs: [bootstrap-prod-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify production environment is protected
        run: |
          set -euo pipefail
          
          # Resolve canonical production environment name.
          PROD_ENV=""
          for candidate in production prod; do
            if gh api /repos/${{ github.repository }}/environments/${candidate} --jq '.name' >/dev/null 2>&1; then
              PROD_ENV="$candidate"
              break
            fi
          done
          
          if [ -z "$PROD_ENV" ]; then
            echo "::warning::Neither canonical 'production' nor legacy alias 'prod' environment was found."
            echo "::warning::Settings action: create a protected 'production' environment in Settings → Environments."
            echo "Skipping hard-fail because this workflow is advisory for repository settings drift."
            exit 0
          fi
          
          echo "Production environment exists (name: $PROD_ENV)"
          
          ENV_JSON=$(gh api /repos/${{ github.repository }}/environments/$PROD_ENV)

          # Verify protection rules are configured
          PROTECTION_RULES=$(echo "$ENV_JSON" | jq '.protection_rules')
          if [ "$PROTECTION_RULES" = "[]" ] || [ -z "$PROTECTION_RULES" ]; then
            echo "::warning::No protection rules configured on '$PROD_ENV' environment"
            echo "   Configure via UI: Settings → Environments → $PROD_ENV → Deployment branches and environments"
          fi

          CUSTOM_POLICY=$(echo "$ENV_JSON" | jq -r '.deployment_branch_policy.custom_branch_policies // false')
          if [ "$CUSTOM_POLICY" != "true" ]; then
            echo "::warning::'$PROD_ENV' environment must use selected branch/tag policies, not protected branches only."
            echo "   Configure selected policies: branch 'main' and tag 'v*'."
          else
            PROD_POLICIES=$(gh api /repos/${{ github.repository }}/environments/$PROD_ENV/deployment-branch-policies --jq '.branch_policies[] | "\(.type):\(.name)"' 2>/dev/null || true)
            if ! echo "$PROD_POLICIES" | grep -Fqx 'branch:main'; then
              echo "::warning::'$PROD_ENV' selected policies do not include branch:main."
            fi
            if ! echo "$PROD_POLICIES" | grep -Fqx 'tag:v*'; then
              echo "::warning::'$PROD_ENV' selected policies do not include tag:v*."
            fi
            UNEXPECTED_POLICIES=$(printf '%s\n' "$PROD_POLICIES" \
              | grep -v -F -x 'branch:main' \
              | grep -v -F -x 'tag:v*' \
              | grep -v '^$' || true)
            if [ -n "$UNEXPECTED_POLICIES" ]; then
              echo "::warning::'$PROD_ENV' selected policies include entries outside the documented allowlist:"
              echo "$UNEXPECTED_POLICIES"
            fi
          fi
          
          echo "Prod environment protection check complete"
          
          # Display current environment details
          gh api /repos/${{ github.repository }}/environments/$PROD_ENV --jq '{name, can_admins_bypass, protection_rules, deployment_branch_policy}' || true
        env:
          GH_TOKEN: ${{ github.token }}

  verify-staging-environment-protection:
    name: "Verify staging environment protection"
    needs: [bootstrap-prod-environment]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify staging environment is protected
        run: |
          set -euo pipefail
          
          # Check if staging environment exists
          STAGING_ENV=$(gh api /repos/${{ github.repository }}/environments/staging --jq '.name' 2>/dev/null || echo "")
          
          if [ -z "$STAGING_ENV" ]; then
            echo "'staging' environment not configured (optional)"
            exit 0
          fi
          
          echo "Staging environment exists"
          
          # Display staging environment details
          gh api /repos/${{ github.repository }}/environments/staging --jq '{name, can_admins_bypass, protection_rules}' || true
        env:
          GH_TOKEN: ${{ github.token }}

  summary:
    name: "Environment protection enforcement summary"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - bootstrap-prod-environment
      - verify-prod-environment-protection
      - verify-staging-environment-protection
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Print summary
        run: |
          cat > /tmp/protection-summary.txt <<'EOF'
          # Environment and Production Approval Protection Summary
          
          ## Production Environment (production)
          - Template: .github/environment-protection-production.json
          - Discovery mode: ${{ needs.bootstrap-prod-environment.outputs.bootstrap_mode }}
          - Required protection settings:
            - Deployment branch restricted to main
            - Deployment tags restricted to v* release tags
            - Requires 1 approval for deployments
            - Allows the designated reviewer to approve their own dispatch in this single-operator repository
          
          ## Staging Environment (staging)
          Optional environment for pre-production testing
          
          ## Branch Protection
          See: docs/reference/branch-protection.md (maintained by #1556)
          
          ## Application Instructions
          
          1. Production environment protection:
             Via GitHub UI: Settings → Environments → production
             - Enable "Deployment branches and environments"
             - Select "Selected branches and tags"
             - Add branch policy: main
             - Add tag policy: v*
             - Set "Required number of reviewers: 1"
          
          2. Staging environment (optional):
             Via GitHub UI: Settings → Environments → staging
             - Same settings as production (for consistency)
          
          See: docs/operations/security/environment-protection.md
          EOF
          cat /tmp/protection-summary.txt
