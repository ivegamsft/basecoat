name: "BaseCoat - Post-Onboarding Drift Loop"

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_run:
    workflows: ["BaseCoat - Adoption Metrics"]
    types: [completed]
  workflow_dispatch:
    inputs:
      repositories:
        description: "Optional comma-separated owner/repo list. Defaults to .github/downstream-reviewer-routing-targets.json."
        type: string
        required: false
        default: ""
      reviewer_gap_threshold:
        description: "Escalate reviewer-routing drift when ready PRs with no reviewer requests meet/exceed this count."
        type: number
        required: false
        default: 3

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-loop:
    name: Detect post-onboarding drift and publish remediation scorecards
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run drift loop
        id: drift
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REPOSITORIES_INPUT: ${{ inputs.repositories || '' }}
          REVIEWER_GAP_THRESHOLD: ${{ inputs.reviewer_gap_threshold || 3 }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const toInt = (value, fallback) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
            };

            const dedupe = values => [...new Set(values.filter(Boolean).map(value => value.trim()).filter(Boolean))];

            const repositoriesInput = process.env.REPOSITORIES_INPUT || '';
            const reviewerGapThreshold = toInt(process.env.REVIEWER_GAP_THRESHOLD, 3);
            const configPath = '.github/downstream-reviewer-routing-targets.json';
            const nowIso = new Date().toISOString();
            const fleetIssueTitle = 'Post-onboarding drift fleet scorecard';

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }
            };

            const contentExists = async (owner, repo, path) => {
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path });
                return !Array.isArray(response.data) && response.data.type === 'file';
              } catch (error) {
                if (error.status === 404) {
                  return false;
                }
                throw error;
              }
            };

            const getMergeableState = async (owner, repo, pullNumber) => {
              try {
                const response = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
                return String(response.data.mergeable_state || '').toLowerCase();
              } catch (error) {
                core.warning(`Unable to resolve mergeable_state for ${owner}/${repo}#${pullNumber}: ${error.message}`);
                return '';
              }
            };

            const getOpenIssuesByLabel = async label => {
              const items = [];
              for await (const response of github.paginate.iterator(
                github.rest.issues.listForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: label,
                  per_page: 100
                }
              )) {
                items.push(...response.data.filter(issue => !issue.pull_request));
              }
              return items;
            };

            const upsertIssueByMarker = async ({ title, body, labels, marker, closeWhenResolved }) => {
              const openCandidates = await getOpenIssuesByLabel(labels[0]);
              const existing = openCandidates.find(issue => (issue.body || '').includes(marker) || issue.title === title);
              if (!existing) {
                if (closeWhenResolved) {
                  return null;
                }
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels
                });
                return created.data;
              }

              if (closeWhenResolved) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Drift resolved in the latest post-onboarding loop run. Closing this remediation issue.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                return null;
              }

              const updated = await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                labels
              });
              return updated.data;
            };

            const parsePreviousSnapshot = body => {
              if (!body) {
                return null;
              }
              const match = body.match(/<!-- basecoat-drift-snapshot-start -->\s*```json\s*([\s\S]*?)\s*```\s*<!-- basecoat-drift-snapshot-end -->/);
              if (!match) {
                return null;
              }
              try {
                return JSON.parse(match[1]);
              } catch {
                return null;
              }
            };

            const configuredRepos = [];
            if (fs.existsSync(configPath)) {
              const parsed = JSON.parse(fs.readFileSync(configPath, 'utf8'));
              if (Array.isArray(parsed.repositories)) {
                for (const entry of parsed.repositories) {
                  if (entry && entry.enabled !== false && typeof entry.repo === 'string') {
                    configuredRepos.push(entry.repo);
                  }
                }
              }
            }

            const manualRepos = repositoriesInput
              .split(',')
              .map(value => value.trim())
              .filter(Boolean);

            const repositories = dedupe([...configuredRepos, ...manualRepos]);
            if (repositories.length === 0) {
              core.setFailed(`No repositories were provided. Add entries to ${configPath} or pass workflow_dispatch input "repositories".`);
              return;
            }

            await ensureLabel('drift-loop', '5319e7', 'Fleet-level post-onboarding drift scorecard reports.');
            await ensureLabel('drift-remediation', 'b60205', 'Repo remediation issue opened by post-onboarding drift loop.');
            await ensureLabel('automated-report', '1d76db', 'Automated governance/adoption report issue.');
            await ensureLabel('governance', 'c2e0c6', 'Governance workflow tracking label.');

            const reviewerWorkflowCandidates = [
              'reviewer-autoassign.yml',
              'basecoat-reviewer-autoassign.yml'
            ];

            const requiredIntakeFiles = [
              '.github/ISSUE_TEMPLATE/issue.md',
              '.github/PULL_REQUEST_TEMPLATE.md'
            ];

            const requiredMetadataFiles = [
              'docs/reference/governance-contract.md',
              'docs/reference/label-taxonomy.md',
              '.github/workflows/issue-triage.md'
            ];

            const repositoriesResult = [];
            for (const repoFullName of repositories) {
              const [owner, repo] = repoFullName.split('/');
              if (!owner || !repo) {
                core.warning(`Skipping invalid repository entry: "${repoFullName}"`);
                continue;
              }

              let defaultBranch = 'main';
              let branchProtectionEnabled = false;
              let branchProtectionDetail = '';
              let rulesetsCount = 0;

              try {
                const repoResponse = await github.rest.repos.get({ owner, repo });
                defaultBranch = repoResponse.data.default_branch || defaultBranch;
              } catch (error) {
                core.warning(`Unable to read repository metadata for ${repoFullName}: ${error.message}`);
              }

              try {
                await github.rest.repos.getBranchProtection({
                  owner,
                  repo,
                  branch: defaultBranch
                });
                branchProtectionEnabled = true;
                branchProtectionDetail = `default branch (${defaultBranch}) has branch protection`;
              } catch (error) {
                if (error.status === 404) {
                  branchProtectionEnabled = false;
                  branchProtectionDetail = `default branch (${defaultBranch}) has no protection`;
                } else {
                  branchProtectionEnabled = false;
                  branchProtectionDetail = `branch protection check failed: ${error.message}`;
                }
              }

              try {
                const rulesetsResponse = await github.rest.repos.getRepoRulesets({ owner, repo, per_page: 100 });
                rulesetsCount = rulesetsResponse.data.length;
              } catch (error) {
                core.warning(`Unable to list rulesets for ${repoFullName}: ${error.message}`);
              }

              const branchRulesetSurface = {
                status: branchProtectionEnabled || rulesetsCount > 0 ? 'ok' : 'drift',
                detail: branchProtectionEnabled || rulesetsCount > 0
                  ? `${branchProtectionDetail}; rulesets=${rulesetsCount}`
                  : `${branchProtectionDetail}; rulesets=${rulesetsCount}`
              };

              const intakeMissing = [];
              for (const path of requiredIntakeFiles) {
                if (!(await contentExists(owner, repo, path))) {
                  intakeMissing.push(path);
                }
              }
              const intakeSurface = {
                status: intakeMissing.length === 0 ? 'ok' : 'drift',
                detail: intakeMissing.length === 0 ? 'intake issue + PR templates are present' : `missing: ${intakeMissing.join(', ')}`
              };

              const reviewerWorkflows = [];
              for (const workflowFile of reviewerWorkflowCandidates) {
                if (await contentExists(owner, repo, `.github/workflows/${workflowFile}`)) {
                  reviewerWorkflows.push(workflowFile);
                }
              }

              const pullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
                sort: 'updated',
                direction: 'desc'
              });

              const readyPullRequests = pullRequests.filter(pr => !pr.draft).slice(0, 100);
              let readyWithoutReview = 0;
              let behindOrDirtyNoReview = 0;
              for (const pr of readyPullRequests) {
                const reviewerCount = (pr.requested_reviewers?.length || 0) + (pr.requested_teams?.length || 0);
                if (reviewerCount > 0) {
                  continue;
                }
                readyWithoutReview += 1;
                const mergeableState = await getMergeableState(owner, repo, pr.number);
                if (mergeableState === 'behind' || mergeableState === 'dirty') {
                  behindOrDirtyNoReview += 1;
                }
              }

              const reviewerRoutingDrift =
                reviewerWorkflows.length === 0
                  ? readyPullRequests.length > 0
                  : readyWithoutReview >= reviewerGapThreshold;

              const reviewerRoutingSurface = {
                status: reviewerRoutingDrift ? 'drift' : 'ok',
                detail: reviewerWorkflows.length === 0
                  ? `no reviewer-routing workflow detected; ready_prs=${readyPullRequests.length}`
                  : `workflows=${reviewerWorkflows.join(', ')}; ready_no_review=${readyWithoutReview}; behind_or_dirty_no_review=${behindOrDirtyNoReview}; threshold=${reviewerGapThreshold}`
              };

              const metadataMissing = [];
              for (const path of requiredMetadataFiles) {
                if (!(await contentExists(owner, repo, path))) {
                  metadataMissing.push(path);
                }
              }
              const metadataHygieneSurface = {
                status: metadataMissing.length === 0 ? 'ok' : 'drift',
                detail: metadataMissing.length === 0 ? 'metadata hygiene surfaces are present' : `missing: ${metadataMissing.join(', ')}`
              };

              const surfaces = {
                branch_ruleset: branchRulesetSurface,
                intake_surface: intakeSurface,
                reviewer_routing: reviewerRoutingSurface,
                metadata_hygiene: metadataHygieneSurface
              };

              const driftCount = Object.values(surfaces).filter(surface => surface.status === 'drift').length;
              repositoriesResult.push({
                repo: repoFullName,
                defaultBranch,
                branchProtectionEnabled,
                rulesetsCount,
                readyOpenPrs: readyPullRequests.length,
                readyWithoutReview,
                behindOrDirtyNoReview,
                reviewerWorkflowFiles: reviewerWorkflows,
                driftCount,
                surfaces
              });
            }

            repositoriesResult.sort((a, b) => b.driftCount - a.driftCount || a.repo.localeCompare(b.repo));

            const existingFleetIssues = await getOpenIssuesByLabel('drift-loop');
            const existingFleetIssue = existingFleetIssues.find(issue => issue.title === fleetIssueTitle);
            const previousSnapshot = parsePreviousSnapshot(existingFleetIssue?.body || '');
            const previousByRepo = new Map((previousSnapshot?.repositories || []).map(item => [item.repo, item]));

            for (const row of repositoriesResult) {
              const previous = previousByRepo.get(row.repo);
              if (!previous) {
                row.trend = 'new';
              } else if (row.driftCount > Number(previous.driftCount || 0)) {
                row.trend = 'regression';
              } else if (row.driftCount < Number(previous.driftCount || 0)) {
                row.trend = 'improvement';
              } else {
                row.trend = 'stable';
              }
            }

            const aggregate = {
              repositoriesEvaluated: repositoriesResult.length,
              repositoriesWithDrift: repositoriesResult.filter(row => row.driftCount > 0).length,
              totalSurfaceDriftFindings: repositoriesResult.reduce((sum, row) => sum + row.driftCount, 0),
              trend: {
                regression: repositoriesResult.filter(row => row.trend === 'regression').length,
                improvement: repositoriesResult.filter(row => row.trend === 'improvement').length,
                stable: repositoriesResult.filter(row => row.trend === 'stable').length,
                new: repositoriesResult.filter(row => row.trend === 'new').length
              },
              driftBySurface: {
                branch_ruleset: repositoriesResult.filter(row => row.surfaces.branch_ruleset.status === 'drift').length,
                intake_surface: repositoriesResult.filter(row => row.surfaces.intake_surface.status === 'drift').length,
                reviewer_routing: repositoriesResult.filter(row => row.surfaces.reviewer_routing.status === 'drift').length,
                metadata_hygiene: repositoriesResult.filter(row => row.surfaces.metadata_hygiene.status === 'drift').length
              }
            };

            const remediationIssueUrls = [];
            for (const row of repositoriesResult) {
              const markerHash = crypto.createHash('sha256').update(row.repo.toLowerCase()).digest('hex');
              const marker = `<!-- basecoat-drift-repo:${markerHash} -->`;
              const title = `[Drift][${row.repo}] Post-onboarding remediation`;
              const body = [
                '## Post-onboarding drift remediation',
                '',
                `- Repository: \`${row.repo}\``,
                `- Generated: ${nowIso}`,
                `- Drift surfaces: **${row.driftCount} / 4**`,
                '',
                '| Surface | Status | Detail |',
                '|---|---|---|',
                `| Branch / ruleset | ${row.surfaces.branch_ruleset.status} | ${row.surfaces.branch_ruleset.detail} |`,
                `| Intake surface | ${row.surfaces.intake_surface.status} | ${row.surfaces.intake_surface.detail} |`,
                `| Reviewer routing | ${row.surfaces.reviewer_routing.status} | ${row.surfaces.reviewer_routing.detail} |`,
                `| Metadata hygiene | ${row.surfaces.metadata_hygiene.status} | ${row.surfaces.metadata_hygiene.detail} |`,
                '',
                '## Required actions',
                '',
                '- [ ] Resolve branch/ruleset drift',
                '- [ ] Restore intake surfaces',
                '- [ ] Restore reviewer-routing automation effectiveness',
                '- [ ] Restore metadata hygiene contract surfaces',
                '',
                marker
              ].join('\n');

              if (row.driftCount > 0) {
                const issue = await upsertIssueByMarker({
                  title,
                  body,
                  labels: ['drift-remediation', 'governance', 'automated-report'],
                  marker,
                  closeWhenResolved: false
                });
                remediationIssueUrls.push(issue.html_url);
              } else {
                await upsertIssueByMarker({
                  title,
                  body,
                  labels: ['drift-remediation', 'governance', 'automated-report'],
                  marker,
                  closeWhenResolved: true
                });
              }
            }

            const snapshot = {
              generatedAt: nowIso,
              repositories: repositoriesResult.map(row => ({
                repo: row.repo,
                driftCount: row.driftCount,
                trend: row.trend,
                surfaces: {
                  branch_ruleset: row.surfaces.branch_ruleset.status,
                  intake_surface: row.surfaces.intake_surface.status,
                  reviewer_routing: row.surfaces.reviewer_routing.status,
                  metadata_hygiene: row.surfaces.metadata_hygiene.status
                }
              })),
              aggregate
            };

            const markdown = [
              '# Post-Onboarding Drift Scorecard',
              '',
              `- Generated: ${nowIso}`,
              `- Repositories evaluated: ${aggregate.repositoriesEvaluated}`,
              `- Repositories with drift: ${aggregate.repositoriesWithDrift}`,
              `- Total drift findings: ${aggregate.totalSurfaceDriftFindings}`,
              '',
              '## Aggregate drift view',
              '',
              '| Metric | Value |',
              '|---|---:|',
              `| Regression repos | ${aggregate.trend.regression} |`,
              `| Improvement repos | ${aggregate.trend.improvement} |`,
              `| Stable repos | ${aggregate.trend.stable} |`,
              `| New repos | ${aggregate.trend.new} |`,
              `| Branch/ruleset drift repos | ${aggregate.driftBySurface.branch_ruleset} |`,
              `| Intake surface drift repos | ${aggregate.driftBySurface.intake_surface} |`,
              `| Reviewer-routing drift repos | ${aggregate.driftBySurface.reviewer_routing} |`,
              `| Metadata hygiene drift repos | ${aggregate.driftBySurface.metadata_hygiene} |`,
              '',
              '## Per-repository drift view',
              '',
              '| Repository | Drift surfaces | Trend | Branch/ruleset | Intake | Reviewer routing | Metadata hygiene |',
              '|---|---:|---|---|---|---|---|',
              ...repositoriesResult.map(row =>
                `| \`${row.repo}\` | ${row.driftCount}/4 | ${row.trend} | ${row.surfaces.branch_ruleset.status} | ${row.surfaces.intake_surface.status} | ${row.surfaces.reviewer_routing.status} | ${row.surfaces.metadata_hygiene.status} |`
              ),
              '',
              '## Workflow integration',
              '',
              '- Governance integration: uses the same metadata-hygiene and reviewer-routing surfaces enforced by `.github/workflows/issue-metadata-hygiene.yml` and `.github/workflows/downstream-reviewer-routing-audit.yml`.',
              '- Adoption integration: runs on a weekly schedule and can also run after `BaseCoat - Adoption Metrics` to keep drift scorecards aligned with adoption telemetry cadence.',
              '',
              remediationIssueUrls.length > 0 ? '## Open remediation issues' : '## Open remediation issues',
              remediationIssueUrls.length > 0 ? remediationIssueUrls.map(url => `- ${url}`).join('\n') : '- none',
              '',
              '<!-- basecoat-drift-snapshot-start -->',
              '```json',
              JSON.stringify(snapshot, null, 2),
              '```',
              '<!-- basecoat-drift-snapshot-end -->'
            ].join('\n');

            if (existingFleetIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingFleetIssue.number,
                title: fleetIssueTitle,
                body: markdown,
                labels: ['drift-loop', 'governance', 'automated-report']
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: fleetIssueTitle,
                body: markdown,
                labels: ['drift-loop', 'governance', 'automated-report']
              });
            }

            fs.writeFileSync('post-onboarding-drift-scorecard.md', markdown);
            fs.writeFileSync('post-onboarding-drift-latest.json', JSON.stringify(snapshot, null, 2));

            core.setOutput('repositories_evaluated', String(aggregate.repositoriesEvaluated));
            core.setOutput('repositories_with_drift', String(aggregate.repositoriesWithDrift));
            core.setOutput('total_surface_drift_findings', String(aggregate.totalSurfaceDriftFindings));
            core.summary.addRaw(markdown).write();

      - name: Upload drift scorecard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-onboarding-drift-loop
          path: |
            post-onboarding-drift-scorecard.md
            post-onboarding-drift-latest.json
          retention-days: 14
