name: "BaseCoat - Post-Onboarding Drift Loop"

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_run:
    workflows: ["BaseCoat - Adoption Metrics"]
    types: [completed]
  workflow_dispatch:
    inputs:
      repositories:
        description: "Optional comma-separated owner/repo list. Defaults to .github/downstream-reviewer-routing-targets.json."
        type: string
        required: false
        default: ""
      reviewer_gap_threshold:
        description: "Escalate reviewer-routing drift when ready PRs with no reviewer requests meet/exceed this count."
        type: number
        required: false
        default: 3

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-loop:
    name: Detect post-onboarding drift and publish remediation scorecards
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run drift loop
        id: drift
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REPOSITORIES_INPUT: ${{ inputs.repositories || '' }}
          REVIEWER_GAP_THRESHOLD: ${{ inputs.reviewer_gap_threshold || 3 }}
          DOWNSTREAM_READ_TOKEN: ${{ secrets.POST_ONBOARDING_DRIFT_READ_TOKEN || '' }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { canCloseRemediation, countSurfaces, surfaceFromProbes, trendFor } =
              require(require('path').resolve(process.cwd(), '.github/scripts/post-onboarding-drift-loop-contract.js'));

            const toInt = (value, fallback) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
            };

            const dedupe = values => [...new Set(values.filter(Boolean).map(value => value.trim()).filter(Boolean))];

            const repositoriesInput = process.env.REPOSITORIES_INPUT || '';
            const reviewerGapThreshold = toInt(process.env.REVIEWER_GAP_THRESHOLD, 3);
            // Keep source-repo issue writes on github.token; this optional token
            // is used only by downstream read calls.
            const downstreamGithub = process.env.DOWNSTREAM_READ_TOKEN
              ? getOctokit(process.env.DOWNSTREAM_READ_TOKEN)
              : github;
            const configPath = '.github/downstream-reviewer-routing-targets.json';
            const nowIso = new Date().toISOString();
            const fleetIssueTitle = 'Post-onboarding drift fleet scorecard';

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
              }
            };

            const isAuthError = error => error && (error.status === 401 || error.status === 403);
            const errorDetail = error => `HTTP ${error.status || 'unknown'}: ${error.message}`;

            const probeFile = async (owner, repo, path) => {
              try {
                const response = await downstreamGithub.rest.repos.getContent({ owner, repo, path });
                return {
                  exists: !Array.isArray(response.data) && response.data.type === 'file',
                  inaccessible: false,
                  unknown: false
                };
              } catch (error) {
                if (isAuthError(error)) {
                  core.warning(`Unable to check ${owner}/${repo}:${path}: ${error.message}`);
                  return { exists: false, inaccessible: true, unknown: false, detail: errorDetail(error) };
                }
                if (error.status === 404) {
                  return { exists: false, inaccessible: false, unknown: false };
                }
                core.warning(`Unable to check ${owner}/${repo}:${path}: ${error.message}`);
                return { exists: false, inaccessible: false, unknown: true, detail: errorDetail(error) };
              }
            };

            const getMergeableState = async (owner, repo, pullNumber) => {
              try {
                const response = await downstreamGithub.rest.pulls.get({ owner, repo, pull_number: pullNumber });
                return { state: String(response.data.mergeable_state || '').toLowerCase(), unknown: false };
              } catch (error) {
                core.warning(`Unable to resolve mergeable_state for ${owner}/${repo}#${pullNumber}: ${error.message}`);
                return { state: '', unknown: true, detail: errorDetail(error) };
              }
            };

            const getOpenIssuesByLabel = async label => {
              const items = [];
              for await (const response of github.paginate.iterator(
                github.rest.issues.listForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: label,
                  per_page: 100
                }
              )) {
                items.push(...response.data.filter(issue => !issue.pull_request));
              }
              return items;
            };

            const upsertIssueByMarker = async ({ title, body, labels, marker, closeWhenResolved }) => {
              const openCandidates = await getOpenIssuesByLabel(labels[0]);
              const existing = openCandidates.find(issue => (issue.body || '').includes(marker) || issue.title === title);
              if (!existing) {
                if (closeWhenResolved) {
                  return null;
                }
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels
                });
                return created.data;
              }

              if (closeWhenResolved) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Drift resolved in the latest post-onboarding loop run. Closing this remediation issue.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                return null;
              }

              const updated = await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                labels
              });
              return updated.data;
            };

            const parsePreviousSnapshot = body => {
              if (!body) {
                return null;
              }
              const match = body.match(/<!-- basecoat-drift-snapshot-start -->\s*```json\s*([\s\S]*?)\s*```\s*<!-- basecoat-drift-snapshot-end -->/);
              if (!match) {
                return null;
              }
              try {
                return JSON.parse(match[1]);
              } catch {
                return null;
              }
            };

            const configuredRepos = [];
            if (fs.existsSync(configPath)) {
              const parsed = JSON.parse(fs.readFileSync(configPath, 'utf8'));
              if (Array.isArray(parsed.repositories)) {
                for (const entry of parsed.repositories) {
                  if (entry && entry.enabled !== false && typeof entry.repo === 'string') {
                    configuredRepos.push(entry.repo);
                  }
                }
              }
            }

            const manualRepos = repositoriesInput
              .split(',')
              .map(value => value.trim())
              .filter(Boolean);

            const repositories = dedupe([...configuredRepos, ...manualRepos]);
            if (repositories.length === 0) {
              core.setFailed(`No repositories were provided. Add entries to ${configPath} or pass workflow_dispatch input "repositories".`);
              return;
            }

            await ensureLabel('drift-loop', '5319e7', 'Fleet-level post-onboarding drift scorecard reports.');
            await ensureLabel('drift-remediation', 'b60205', 'Repo remediation issue opened by post-onboarding drift loop.');
            await ensureLabel('automated-report', '1d76db', 'Automated governance/adoption report issue.');
            await ensureLabel('governance', 'c2e0c6', 'Governance workflow tracking label.');

            const reviewerWorkflowCandidates = [
              'reviewer-autoassign.yml',
              'basecoat-reviewer-autoassign.yml'
            ];

            const requiredIntakeFiles = [
              '.github/ISSUE_TEMPLATE/issue.md',
              '.github/PULL_REQUEST_TEMPLATE.md'
            ];

            const requiredMetadataFiles = [
              'docs/reference/governance-contract.md',
              'docs/reference/label-taxonomy.md',
              '.github/workflows/issue-triage.md'
            ];

            const repositoriesResult = [];
            for (const repoFullName of repositories) {
              const [owner, repo] = repoFullName.split('/');
              if (!owner || !repo) {
                core.warning(`Skipping invalid repository entry: "${repoFullName}"`);
                continue;
              }

              let defaultBranch = 'main';
              let branchProtectionEnabled = false;
              let branchProtectionDetail = '';
              let rulesetsCount = 0;

              try {
                const repoResponse = await downstreamGithub.rest.repos.get({ owner, repo });
                defaultBranch = repoResponse.data.default_branch || defaultBranch;
              } catch (error) {
                core.warning(`Unable to read repository metadata for ${repoFullName}: ${error.message}`);
                // Private sibling/cross-org targets return 404 (not 403) when
                // GITHUB_TOKEN cannot see the repo. Continuing would treat
                // later 404s as "no protection" / "missing files".
                const inaccessible = isAuthError(error) || error.status === 404;
                const status = inaccessible ? 'inaccessible' : 'unknown';
                const detail = inaccessible
                  ? `repository metadata unavailable (${errorDetail(error)}); token cannot read ${repoFullName}`
                  : `repository metadata request failed (${errorDetail(error)}); downstream surfaces not evaluated`;
                const unavailableSurface = { status, detail };
                const surfaces = {
                  branch_ruleset: unavailableSurface,
                  intake_surface: unavailableSurface,
                  reviewer_routing: unavailableSurface,
                  metadata_hygiene: unavailableSurface
                };
                const counts = countSurfaces(surfaces);
                repositoriesResult.push({
                  repo: repoFullName,
                  defaultBranch,
                  branchProtectionEnabled: false,
                  rulesetsCount: 0,
                  readyOpenPrs: 0,
                  readyWithoutReview: 0,
                  behindOrDirtyNoReview: 0,
                  reviewerWorkflowFiles: [],
                  driftCount: counts.driftCount,
                  unknownCount: counts.unknownCount,
                  surfaces
                });
                continue;
              }

              let branchProtectionInaccessible = false;
              let branchProtectionUnknown = false;
              try {
                await downstreamGithub.rest.repos.getBranchProtection({
                  owner,
                  repo,
                  branch: defaultBranch
                });
                branchProtectionEnabled = true;
                branchProtectionDetail = `default branch (${defaultBranch}) has branch protection`;
              } catch (error) {
                if (error.status === 404) {
                  branchProtectionEnabled = false;
                  branchProtectionDetail = `default branch (${defaultBranch}) has no protection`;
                } else if (isAuthError(error)) {
                  branchProtectionInaccessible = true;
                  branchProtectionDetail = `branch protection check inaccessible (${errorDetail(error)})`;
                } else {
                  branchProtectionUnknown = true;
                  branchProtectionDetail = `branch protection check failed (${errorDetail(error)})`;
                }
              }

              let rulesetsInaccessible = false;
              let rulesetsUnknown = false;
              let rulesetsDetail = `rulesets=${rulesetsCount}`;
              try {
                const rulesetsResponse = await downstreamGithub.rest.repos.getRepoRulesets({ owner, repo, per_page: 100 });
                rulesetsCount = rulesetsResponse.data.length;
                rulesetsDetail = `rulesets=${rulesetsCount}`;
              } catch (error) {
                if (isAuthError(error) || error.status === 404) {
                  rulesetsInaccessible = true;
                  rulesetsDetail = `rulesets inaccessible (${errorDetail(error)})`;
                } else {
                  rulesetsUnknown = true;
                  rulesetsDetail = `rulesets unavailable (${errorDetail(error)})`;
                }
                core.warning(`Unable to list rulesets for ${repoFullName}: ${error.message}`);
              }

              const branchRulesetUnavailable =
                branchProtectionInaccessible ||
                rulesetsInaccessible ||
                branchProtectionUnknown ||
                rulesetsUnknown;
              const branchRulesetSurface = branchRulesetUnavailable
                ? {
                    status: branchProtectionUnknown || rulesetsUnknown ? 'unknown' : 'inaccessible',
                    detail: `${branchProtectionDetail}; ${rulesetsDetail}`
                  }
                : (branchProtectionEnabled || rulesetsCount > 0)
                  ? {
                      status: 'ok',
                      detail: `${branchProtectionDetail}; ${rulesetsDetail}`
                    }
                  : {
                      status: 'drift',
                      detail: `${branchProtectionDetail}; ${rulesetsDetail}`
                    };

              const intakeProbes = [];
              for (const path of requiredIntakeFiles) {
                const probe = await probeFile(owner, repo, path);
                intakeProbes.push({ path, ...probe });
              }
              const intakeSurface = surfaceFromProbes(
                intakeProbes,
                'intake issue + PR templates are present',
                'missing: '
              );

              const reviewerWorkflows = [];
              let reviewerWorkflowInaccessible = false;
              let reviewerWorkflowUnknown = false;
              for (const workflowFile of reviewerWorkflowCandidates) {
                const probe = await probeFile(owner, repo, `.github/workflows/${workflowFile}`);
                if (probe.exists) {
                  reviewerWorkflows.push(workflowFile);
                } else if (probe.inaccessible) {
                  reviewerWorkflowInaccessible = true;
                } else if (probe.unknown) {
                  reviewerWorkflowUnknown = true;
                }
              }

              let pullRequests = [];
              let pullDataUnavailable = false;
              let pullDataUnavailableStatus = '';
              let pullDataUnavailableDetail = '';
              try {
                pullRequests = await downstreamGithub.paginate(downstreamGithub.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                  sort: 'updated',
                  direction: 'desc'
                });
              } catch (error) {
                pullDataUnavailable = true;
                pullDataUnavailableStatus = isAuthError(error) || error.status === 404 ? 'inaccessible' : 'unknown';
                pullDataUnavailableDetail = `pull request list unavailable (${errorDetail(error)})`;
                core.warning(`Unable to list pull requests for ${repoFullName}: ${error.message}`);
              }

              const readyPullRequests = pullRequests.filter(pr => !pr.draft).slice(0, 100);
              let readyWithoutReview = 0;
              let behindOrDirtyNoReview = 0;
              const mergeableStateErrors = [];
              for (const pr of readyPullRequests) {
                const reviewerCount = (pr.requested_reviewers?.length || 0) + (pr.requested_teams?.length || 0);
                if (reviewerCount > 0) {
                  continue;
                }
                readyWithoutReview += 1;
                const mergeableResult = await getMergeableState(owner, repo, pr.number);
                if (mergeableResult.unknown) {
                  mergeableStateErrors.push(`PR #${pr.number} mergeable state unavailable (${mergeableResult.detail})`);
                }
                const mergeableState = mergeableResult.state;
                if (mergeableState === 'behind' || mergeableState === 'dirty') {
                  behindOrDirtyNoReview += 1;
                }
              }

              const reviewerRoutingMeasured =
                !pullDataUnavailable &&
                !reviewerWorkflowInaccessible &&
                !reviewerWorkflowUnknown &&
                mergeableStateErrors.length === 0;
              const reviewerRoutingDrift = reviewerRoutingMeasured && (
                reviewerWorkflows.length === 0
                  ? readyPullRequests.length > 0
                  : readyWithoutReview >= reviewerGapThreshold
              );

              // Downstream read failures make this surface unknown, not clean or drift.
              const reviewerRoutingUnavailable =
                pullDataUnavailable || reviewerWorkflowInaccessible || reviewerWorkflowUnknown || mergeableStateErrors.length > 0;
              const reviewerRoutingSurface = reviewerRoutingUnavailable
                ? {
                    status: pullDataUnavailableStatus === 'unknown' ||
                      reviewerWorkflowUnknown ||
                      mergeableStateErrors.length > 0
                      ? 'unknown'
                      : 'inaccessible',
                    detail: [
                      pullDataUnavailableDetail,
                      reviewerWorkflowInaccessible ? 'reviewer workflow files inaccessible' : '',
                      reviewerWorkflowUnknown ? 'reviewer workflow files could not be verified' : '',
                      mergeableStateErrors.join('; ')
                    ].filter(Boolean).join('; '),
                    hasDrift: reviewerRoutingDrift
                  }
                : {
                    status: reviewerRoutingDrift ? 'drift' : 'ok',
                    detail: reviewerWorkflows.length === 0
                      ? `no reviewer-routing workflow detected; ready_prs=${readyPullRequests.length}`
                      : `workflows=${reviewerWorkflows.join(', ')}; ready_no_review=${readyWithoutReview}; behind_or_dirty_no_review=${behindOrDirtyNoReview}; threshold=${reviewerGapThreshold}`
                  };

              const metadataProbes = [];
              for (const path of requiredMetadataFiles) {
                const probe = await probeFile(owner, repo, path);
                metadataProbes.push({ path, ...probe });
              }
              const metadataHygieneSurface = surfaceFromProbes(
                metadataProbes,
                'metadata hygiene surfaces are present',
                'missing: '
              );

              const surfaces = {
                branch_ruleset: branchRulesetSurface,
                intake_surface: intakeSurface,
                reviewer_routing: reviewerRoutingSurface,
                metadata_hygiene: metadataHygieneSurface
              };

              const { driftCount, unknownCount } = countSurfaces(surfaces);
              repositoriesResult.push({
                repo: repoFullName,
                defaultBranch,
                branchProtectionEnabled,
                rulesetsCount,
                readyOpenPrs: readyPullRequests.length,
                readyWithoutReview,
                behindOrDirtyNoReview,
                reviewerWorkflowFiles: reviewerWorkflows,
                driftCount,
                unknownCount,
                surfaces
              });
            }

            repositoriesResult.sort((a, b) =>
              b.driftCount - a.driftCount ||
              b.unknownCount - a.unknownCount ||
              a.repo.localeCompare(b.repo)
            );

            const existingFleetIssues = await getOpenIssuesByLabel('drift-loop');
            const existingFleetIssue = existingFleetIssues.find(issue => issue.title === fleetIssueTitle);
            const previousSnapshot = parsePreviousSnapshot(existingFleetIssue?.body || '');
            const previousByRepo = new Map((previousSnapshot?.repositories || []).map(item => [item.repo, item]));

            for (const row of repositoriesResult) {
              const previous = previousByRepo.get(row.repo);
              row.trend = trendFor(row, previous);
            }

            const aggregate = {
              repositoriesEvaluated: repositoriesResult.length,
              repositoriesWithDrift: repositoriesResult.filter(row => row.driftCount > 0).length,
              totalSurfaceDriftFindings: repositoriesResult.reduce((sum, row) => sum + row.driftCount, 0),
              repositoriesWithUnknowns: repositoriesResult.filter(row => row.unknownCount > 0).length,
              totalSurfaceUnknownFindings: repositoriesResult.reduce((sum, row) => sum + row.unknownCount, 0),
              trend: {
                regression: repositoriesResult.filter(row => row.trend === 'regression').length,
                improvement: repositoriesResult.filter(row => row.trend === 'improvement').length,
                stable: repositoriesResult.filter(row => row.trend === 'stable').length,
                new: repositoriesResult.filter(row => row.trend === 'new').length,
                unknown: repositoriesResult.filter(row => row.trend === 'unknown').length
              },
              driftBySurface: {
                branch_ruleset: repositoriesResult.filter(row => row.surfaces.branch_ruleset.status === 'drift' || row.surfaces.branch_ruleset.hasDrift === true).length,
                intake_surface: repositoriesResult.filter(row => row.surfaces.intake_surface.status === 'drift' || row.surfaces.intake_surface.hasDrift === true).length,
                reviewer_routing: repositoriesResult.filter(row => row.surfaces.reviewer_routing.status === 'drift' || row.surfaces.reviewer_routing.hasDrift === true).length,
                metadata_hygiene: repositoriesResult.filter(row => row.surfaces.metadata_hygiene.status === 'drift' || row.surfaces.metadata_hygiene.hasDrift === true).length
              },
              unknownBySurface: {
                branch_ruleset: repositoriesResult.filter(row => ['inaccessible', 'unknown'].includes(row.surfaces.branch_ruleset.status)).length,
                intake_surface: repositoriesResult.filter(row => ['inaccessible', 'unknown'].includes(row.surfaces.intake_surface.status)).length,
                reviewer_routing: repositoriesResult.filter(row => ['inaccessible', 'unknown'].includes(row.surfaces.reviewer_routing.status)).length,
                metadata_hygiene: repositoriesResult.filter(row => ['inaccessible', 'unknown'].includes(row.surfaces.metadata_hygiene.status)).length
              }
            };

            const remediationIssueUrls = [];
            for (const row of repositoriesResult) {
              const markerHash = crypto.createHash('sha256').update(row.repo.toLowerCase()).digest('hex');
              const marker = `<!-- basecoat-drift-repo:${markerHash} -->`;
              const title = `[Drift][${row.repo}] Post-onboarding remediation`;
              const body = [
                '## Post-onboarding drift remediation',
                '',
                `- Repository: \`${row.repo}\``,
                `- Generated: ${nowIso}`,
                `- Drift surfaces: **${row.driftCount} / 4**`,
                `- Unknown surfaces: **${row.unknownCount} / 4**`,
                '',
                '| Surface | Status | Detail |',
                '|---|---|---|',
                `| Branch / ruleset | ${row.surfaces.branch_ruleset.status} | ${row.surfaces.branch_ruleset.detail} |`,
                `| Intake surface | ${row.surfaces.intake_surface.status} | ${row.surfaces.intake_surface.detail} |`,
                `| Reviewer routing | ${row.surfaces.reviewer_routing.status} | ${row.surfaces.reviewer_routing.detail} |`,
                `| Metadata hygiene | ${row.surfaces.metadata_hygiene.status} | ${row.surfaces.metadata_hygiene.detail} |`,
                '',
                '## Required actions',
                '',
                '- [ ] Resolve branch/ruleset drift',
                '- [ ] Restore intake surfaces',
                '- [ ] Restore reviewer-routing automation effectiveness',
                '- [ ] Restore metadata hygiene contract surfaces',
                '- [ ] Restore read access for unknown surfaces',
                '',
                marker
              ].join('\n');

              if (!canCloseRemediation(row)) {
                const issue = await upsertIssueByMarker({
                  title,
                  body,
                  labels: ['drift-remediation', 'governance', 'automated-report'],
                  marker,
                  closeWhenResolved: false
                });
                remediationIssueUrls.push(issue.html_url);
              } else {
                await upsertIssueByMarker({
                  title,
                  body,
                  labels: ['drift-remediation', 'governance', 'automated-report'],
                  marker,
                  closeWhenResolved: true
                });
              }
            }

            const snapshot = {
              generatedAt: nowIso,
              repositories: repositoriesResult.map(row => ({
                repo: row.repo,
                driftCount: row.driftCount,
                unknownCount: row.unknownCount,
                trend: row.trend,
                surfaces: {
                  branch_ruleset: row.surfaces.branch_ruleset.status,
                  intake_surface: row.surfaces.intake_surface.status,
                  reviewer_routing: row.surfaces.reviewer_routing.status,
                  metadata_hygiene: row.surfaces.metadata_hygiene.status
                }
              })),
              aggregate
            };

            const markdown = [
              '# Post-Onboarding Drift Scorecard',
              '',
              `- Generated: ${nowIso}`,
              `- Repositories evaluated: ${aggregate.repositoriesEvaluated}`,
              `- Repositories with drift: ${aggregate.repositoriesWithDrift}`,
              `- Total drift findings: ${aggregate.totalSurfaceDriftFindings}`,
              `- Repositories with unknown surfaces: ${aggregate.repositoriesWithUnknowns}`,
              `- Total unknown surfaces: ${aggregate.totalSurfaceUnknownFindings}`,
              '',
              '## Aggregate drift view',
              '',
              '| Metric | Value |',
              '|---|---:|',
              `| Regression repos | ${aggregate.trend.regression} |`,
              `| Improvement repos | ${aggregate.trend.improvement} |`,
              `| Stable repos | ${aggregate.trend.stable} |`,
              `| New repos | ${aggregate.trend.new} |`,
              `| Unknown-trend repos | ${aggregate.trend.unknown} |`,
              `| Branch/ruleset drift repos | ${aggregate.driftBySurface.branch_ruleset} |`,
              `| Intake surface drift repos | ${aggregate.driftBySurface.intake_surface} |`,
              `| Reviewer-routing drift repos | ${aggregate.driftBySurface.reviewer_routing} |`,
              `| Metadata hygiene drift repos | ${aggregate.driftBySurface.metadata_hygiene} |`,
              `| Branch/ruleset unknown repos | ${aggregate.unknownBySurface.branch_ruleset} |`,
              `| Intake surface unknown repos | ${aggregate.unknownBySurface.intake_surface} |`,
              `| Reviewer-routing unknown repos | ${aggregate.unknownBySurface.reviewer_routing} |`,
              `| Metadata hygiene unknown repos | ${aggregate.unknownBySurface.metadata_hygiene} |`,
              '',
              '## Per-repository drift view',
              '',
              '| Repository | Drift / unknown surfaces | Trend | Branch/ruleset | Intake | Reviewer routing | Metadata hygiene |',
              '|---|---:|---|---|---|---|---|',
              ...repositoriesResult.map(row =>
                `| \`${row.repo}\` | ${row.driftCount} / ${row.unknownCount} of 4 | ${row.trend} | ${row.surfaces.branch_ruleset.status} | ${row.surfaces.intake_surface.status} | ${row.surfaces.reviewer_routing.status} | ${row.surfaces.metadata_hygiene.status} |`
              ),
              '',
              '## Workflow integration',
              '',
              '- Governance integration: uses the same metadata-hygiene and reviewer-routing surfaces enforced by `.github/workflows/issue-metadata-hygiene.yml` and `.github/workflows/downstream-reviewer-routing-audit.yml`.',
              '- Adoption integration: runs on a weekly schedule and can also run after `BaseCoat - Adoption Metrics` to keep drift scorecards aligned with adoption telemetry cadence.',
              '',
              remediationIssueUrls.length > 0 ? '## Open remediation issues' : '## Open remediation issues',
              remediationIssueUrls.length > 0 ? remediationIssueUrls.map(url => `- ${url}`).join('\n') : '- none',
              '',
              '<!-- basecoat-drift-snapshot-start -->',
              '```json',
              JSON.stringify(snapshot, null, 2),
              '```',
              '<!-- basecoat-drift-snapshot-end -->'
            ].join('\n');

            if (existingFleetIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingFleetIssue.number,
                title: fleetIssueTitle,
                body: markdown,
                labels: ['drift-loop', 'governance', 'automated-report']
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: fleetIssueTitle,
                body: markdown,
                labels: ['drift-loop', 'governance', 'automated-report']
              });
            }

            fs.writeFileSync('post-onboarding-drift-scorecard.md', markdown);
            fs.writeFileSync('post-onboarding-drift-latest.json', JSON.stringify(snapshot, null, 2));

            core.setOutput('repositories_evaluated', String(aggregate.repositoriesEvaluated));
            core.setOutput('repositories_with_drift', String(aggregate.repositoriesWithDrift));
            core.setOutput('total_surface_drift_findings', String(aggregate.totalSurfaceDriftFindings));
            core.summary.addRaw(markdown).write();

      - name: Upload drift scorecard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-onboarding-drift-loop
          path: |
            post-onboarding-drift-scorecard.md
            post-onboarding-drift-latest.json
          retention-days: 14
