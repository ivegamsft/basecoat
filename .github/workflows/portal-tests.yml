name: "BaseCoat - Portal Tests"

on:
  pull_request:
    paths:
      - 'portal/frontend/**'
      - 'portal/backend/**'
      - 'portal/app/backend/**'
      - 'portal/app/dashboard/**'
      - '.github/workflows/portal-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Portal frontend Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

  backend-tests:
    name: Portal backend Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: portal/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest suite
        run: npm test

  app-backend-build:
    name: Portal app backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal/app/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portal/app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  app-dashboard-build:
    name: Portal app dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate dashboard structure
        shell: bash
        run: |
          if [[ ! -f "portal/app/dashboard/Dockerfile" ]]; then
            echo "::error::portal/app/dashboard/Dockerfile not found"
            exit 1
          fi
          echo "Dashboard structure validated"
