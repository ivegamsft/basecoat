name: Private managed identity deploy fixture

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on:
      group: private-linux
      labels: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Authenticate with runner-managed identity
        uses: 'azure/login@example'
        with:
          auth-type: "IDENTITY" # Quoted YAML value with inline comment.
          client-id: example
          tenant-id: example
          subscription-id: example
