name: Multiline runner identity fixture

on:
  workflow_dispatch:

jobs:
  azure-cli:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: |
          az login \
            --identity
  azure-powershell:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - shell: pwsh
        run: |
          Connect-AzAccount `
            -Identity
  shell-if:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: |
          if az login --identity; then
            echo authenticated
          fi
  shell-substitution:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: result=$(az login --identity)
  powershell-assignment:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - shell: pwsh
        run: $result = Connect-AzAccount -Identity
  powershell-call-operator:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - shell: pwsh
        run: '& Connect-AzAccount -Identity'
  quoted-heredoc-example:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: |
          echo 'cat <<NOT_A_HEREDOC'
          az login --identity
  command-before-heredoc:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: |
          az login --identity; cat <<REAL_HEREDOC
          Connect-AzAccount -Identity
          REAL_HEREDOC
  quoted-argument:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: az login "--identity"
  quoted-command-substitution:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: result="$(az login --identity)"
  yaml-single-quoted-command:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: 'az login --identity'
  yaml-double-quoted-command:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: "az login --identity"
  folded-command:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: >
          az login
          --identity
