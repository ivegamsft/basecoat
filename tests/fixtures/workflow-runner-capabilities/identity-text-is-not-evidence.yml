name: Identity text is not executable evidence

on:
  workflow_dispatch:

jobs:
  public-job:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - run: |
          # az login --identity
          echo "Connect-AzAccount -Identity"
          cat <<'EXAMPLE'
          az login --identity
          Connect-AzAccount -Identity
          EXAMPLE
      - shell: pwsh
        run: |
          $example = @'
          Connect-AzAccount -Identity
          '@
          Write-Output $example
      - shell: bash
        run: |
          echo done # then az login --identity
          echo 'example; az login --identity'
          echo '$(az login --identity)'
      - shell: pwsh
        run: Write-Output done # ; Connect-AzAccount -Identity
