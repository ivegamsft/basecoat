name: Public credential deploy fixture

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate with credentials
        uses: "azure/login@example"
        with:
          creds: example
          client-id: ignored-client
          tenant-id: ignored-tenant
          subscription-id: ignored-subscription
