name: 'basecoat-10-core-ha-architect-routing'
description: 'Routing evaluation - validates trigger activation for the ha-architect agent.'
skill: 'agents/basecoat-10-core-ha-architect.agent.md'
scenarios:
  - id: 'pos-1'
    input: 'Use the ha-architect agent to handle its documented responsibilities.'
    expect_activation: true
  - id: 'pos-2'
