name: 'basecoat-10-core-observability-engineer-routing'
description: 'Routing evaluation - validates trigger activation for the Observability Engineer agent.'
skill: 'agents/basecoat-10-core-observability-engineer.agent.md'
scenarios:
  - id: 'pos-1'
    input: 'Use the Observability Engineer agent to handle its documented responsibilities.'
    expect_activation: true
  - id: 'pos-2'
