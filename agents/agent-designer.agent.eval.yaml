name: "agent-designer-routing"
description: "Routing evaluation — validates trigger activation for the agent-designer agent."
skill: "agents/basecoat-10-core-agent-designer.agent.md"
scenarios:
  - id: "pos-1"
    input: "Create a new agent spec and include capability-based routing rationale."
    expect_activation: true
  - id: "pos-2"
    input: "Audit this existing agent spec and score it across clarity, safety, and eval readiness."
    expect_activation: true
  - id: "pos-3"
    input: "Run create_and_audit mode with task-shaping classification and estimated turns."
    expect_activation: true
  - id: "pos-4"
    input: "Recommend Fast vs Balanced vs Deep routing class for this agent definition."
    expect_activation: true
  - id: "neg-1"
    input: "Write a haiku about programming."
    expect_activation: false
  - id: "neg-2"
    input: "Give me a recipe for chocolate chip cookies."
    expect_activation: false
