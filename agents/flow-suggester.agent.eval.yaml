name: "flow-suggester-routing"
description: "Routing evaluation — validates trigger activation for the flow-suggester agent."
skill: "agents/flow-suggester.agent.md"
scenarios:
  - id: "pos-1"
    input: "Turn this flow audit into a prioritized set of GitHub issues."
    expect_activation: true
  - id: "pos-2"
    input: "Suggest the next fixes for merge queue and CI bottlenecks based on findings."
    expect_activation: true
  - id: "pos-3"
    input: "Create issue-ready recommendations, auto-create high-confidence issues, and include acceptance criteria from this audit."
    expect_activation: true
  - id: "neg-1"
    input: "Fix this unit test compilation error."
    expect_activation: false
  - id: "neg-2"
    input: "Write release notes for version 2.4."
    expect_activation: false
