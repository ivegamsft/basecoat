name: "ci-audit-routing"
description: "Routing evaluation — validates trigger activation for the ci-audit agent."
skill: "agents/basecoat-50-security-ci-audit.agent.md"
scenarios:
  - id: "pos-1"
    input: "Audit this repository and export branch protection and required status checks."
    expect_activation: true
  - id: "pos-2"
    input: "Produce a governance evidence pack: merge queue state, environment protections, production reviewers, and workflow-dispatch actors."
    expect_activation: true
  - id: "pos-3"
    input: "Export runner groups, runner labels, required security scanning gates, and whether CODEOWNERS is enforced."
    expect_activation: true
  - id: "pos-4"
    input: "Compare repository policy files to live GitHub settings and report gaps in markdown."
    expect_activation: true
  - id: "neg-1"
    input: "help me write a new workflow"
    expect_activation: false
  - id: "neg-2"
    input: "I need to review a pull request"
    expect_activation: false
  - id: "neg-3"
    input: "how do I configure GitHub Actions?"
    expect_activation: false
