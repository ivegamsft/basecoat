name: "build-master-routing"
description: "Routing evaluation — validates trigger activation for the build-master agent."
skill: "agents/basecoat-60-workflow-build-master.agent.md"
scenarios:
  - id: "pos-1"
    input: "Act as build master: keep merging healthy lanes and pause only the lane that broke after merge."
    expect_activation: true
  - id: "pos-2"
    input: "Run a background merge queue controller that dispatches cloud agents to open fix PRs for CI breaks."
    expect_activation: true
  - id: "pos-3"
    input: "We need lane-aware merge orchestration with retries, auto-revert thresholds, and escalation."
    expect_activation: true
  - id: "neg-1"
    input: "Implement OAuth login in our web app."
    expect_activation: false
  - id: "neg-2"
    input: "Write release notes from these commits."
    expect_activation: false

