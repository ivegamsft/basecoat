name: "governance-auditor-routing"
description: "Routing evaluation — validates trigger activation for the governance-auditor agent."
skill: "agents/governance-auditor.agent.md"
scenarios:
  - id: "pos-1"
    input: "Audit this repo for label drift, missing governance docs, and workflow gaps."
    expect_activation: true
  - id: "pos-2"
    input: "Review issue and PR metadata against the canonical governance contract."
    expect_activation: true
  - id: "pos-3"
    input: "Find gaps in the issue templates, export branch/check/environment/merge queue/runner/production-dispatch controls, and tell me what follow-up issues to file."
    expect_activation: true
  - id: "neg-1"
    input: "Write a feature spec for a new login flow."
    expect_activation: false
  - id: "neg-2"
    input: "Fix the Next.js build error in the web app."
    expect_activation: false
