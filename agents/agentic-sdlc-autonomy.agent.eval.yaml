name: 'agentic-sdlc-autonomy-routing'
description: 'Routing evaluation - validates trigger activation for the agentic-sdlc-autonomy agent.'
skill: 'agents/agentic-sdlc-autonomy.agent.md'
scenarios:
  - id: 'pos-1'
    input: 'Use the agentic-sdlc-autonomy agent to handle its documented responsibilities.'
    expect_activation: true
  - id: 'pos-2'
    input: 'Please route this task to the agentic-sdlc-autonomy agent.'
    expect_activation: true
  - id: 'neg-1'
    input: 'Write a haiku about programming.'
    expect_activation: false
  - id: 'neg-2'
    input: 'Give me a recipe for chocolate chip cookies.'
    expect_activation: false

