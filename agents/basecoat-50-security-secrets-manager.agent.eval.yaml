name: 'basecoat-50-security-secrets-manager-routing'
description: 'Routing evaluation - validates trigger activation for the Secrets Manager agent.'
skill: 'agents/basecoat-50-security-secrets-manager.agent.md'
scenarios:
  - id: 'pos-1'
    input: 'Use the Secrets Manager agent to handle its documented responsibilities.'
    expect_activation: true
  - id: 'pos-2'
    input: 'Please route this task to the Secrets Manager agent.'
    expect_activation: true
  - id: 'pos-emergency-revocation'
    input: 'A fine-grained PAT leaked into CI logs. Revoke it, install a least-privilege replacement, and verify all consumers without printing the token.'
    expect_activation: true
  - id: 'neg-1'
    input: 'Write a haiku about programming.'
    expect_activation: false
  - id: 'neg-2'
    input: 'Give me a recipe for chocolate chip cookies.'
    expect_activation: false
