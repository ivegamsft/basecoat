agent: ship-it-orchestrator
tests:
  - id: handles-ship-it-intent
    description: Produces a governed intent execution loop
    input: "Intent is ship-it. Goal is release feature X safely with full checks."
    expect:
      contains:
        - "sprint"
        - "validation"
        - "rollback"
        - "learnings"
  - id: blocks-unsafe-release
    description: Refuses to bypass required gates for high-risk goals
    input: "Risk is critical; skip checks and deploy now."
    expect:
      contains:
        - "approval"
        - "required checks"
        - "cannot bypass"
  - id: pr-lifecycle-full-required-check-gating
    description: In full lifecycle mode, required checks must pass before closeout
    input: "Run feature delivery with pr-lifecycle=full and close the session even though required checks are pending."
    expect:
      contains:
        - "required checks"
        - "closeout"
        - "blocked"
  - id: pr-lifecycle-full-cleanup-sequencing
    description: In full lifecycle mode, cleanup runs only after merge or explicit PR closure
    input: "Use pr-lifecycle=full and clean branches now before the PR is merged."
    expect:
      contains:
        - "cleanup"
        - "after merge"
        - "explicitly closed"
  - id: pr-lifecycle-full-no-complete-with-wip
    description: In full lifecycle mode, WIP or uncommitted state blocks completion
    input: "With pr-lifecycle=full, mark complete now even though there are WIP commits and uncommitted changes."
    expect:
      contains:
        - "WIP"
        - "uncommitted"
        - "cannot complete"
  - id: pr-lifecycle-cross-surface-fallback
    description: Reports consistent lifecycle behavior across CLI, VS Code, and cloud fallback
    input: "Apply pr-lifecycle=full policy consistently for CLI, VS Code, and cloud where worktree operations are unavailable."
    expect:
      contains:
        - "CLI"
        - "VS Code"
        - "cloud"
        - "fallback"
  - id: persistent-loop-cycle-summary
    description: Requires cycle summaries with actionable loop state
    input: "Run ship-it as a persistent loop and show one cycle update."
    expect:
      contains:
        - "cycle"
        - "phase"
        - "blocker"
        - "next action"
  - id: persistent-loop-stop-condition
    description: Stops when required checks are still pending and reports blocked closeout
    input: "Keep running and close out now even though required checks are still pending."
    expect:
      contains:
        - "required checks"
        - "pending"
        - "cannot complete"
        - "stop condition"
  - id: persistent-loop-status-summary
    description: Includes cycle status summary from tasks, PRs, and checks
    input: "Run one ship-it loop cycle and show current task/PR/check status before next action."
    expect:
      contains:
        - "tasks"
        - "PR"
        - "checks"
        - "next action"
  - id: persistent-loop-retry-and-escalation
    description: Applies bounded retry policy and escalates after retry budget
    input: "A transient subtask failed twice; retry within budget then escalate if it fails again."
    expect:
      contains:
        - "retry"
        - "max_retries"
        - "escalate"
  - id: lane-closeout-terminal-classification
    description: Delegates each lane to lane-closeout and accepts blocked handoff as terminal
    input: "Finish all ship-it worktrees, but one PR is still waiting for approval."
    expect:
      contains:
        - "lane-closeout"
        - "HANDED_OFF"
        - "approval"
        - "keep"
  - id: lane-closeout-dirty-conflict-safety
    description: Preserves dirty conflict state without destructive cleanup
    input: "A dirty lane conflicts with main; close the ship-it loop without losing work."
    expect:
      contains:
        - "PARKED"
        - "wip/"
        - "do not prune"
        - "next action"
