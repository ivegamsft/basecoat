name: "governance-author-routing"
description: "Routing evaluation — validates trigger activation for the governance-author agent."
skill: "agents/governance-author.agent.md"
scenarios:
  - id: "pos-1"
    input: "Help me draft common-vs-specific governance guidance for labels, templates, and workflows."
    expect_activation: true
  - id: "pos-2"
    input: "I need a canonical label contract and migration map for legacy issue labels."
    expect_activation: true
  - id: "pos-3"
    input: "Please revise docs/reference/governance-contract.md so shared rules are separated from repo-specific rules."
    expect_activation: true
  - id: "neg-1"
    input: "Build a new React form for the dashboard."
    expect_activation: false
  - id: "neg-2"
    input: "Optimize the database index for the user table."
    expect_activation: false
